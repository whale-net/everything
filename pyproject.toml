[project]
name = "everything"
version = "0.0.0"
description = "Everything monorepo"
requires-python = ">=3.13"
dependencies = [
    # Testing framework
    "pytest",
    "pytest-asyncio",
    "pytest-git",
    
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    
    # Database and ORM
    "sqlmodel",
    "sqlalchemy",  # Required explicitly for tests
    "asyncpg",
    "psycopg2-binary",  # PostgreSQL adapter for SQLAlchemy
    "alembic",
    
    # Message queue
    "amqpstorm",
    
    # Slack platform
    "slack-bolt",
    "slack-sdk",

    # Temporal workflows
    "temporalio[opentelemetry]",

    # CLI framework
    "typer",
    
    # YAML parsing
    "pyyaml",
    
    # OpenTelemetry for observability
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp",
    
    # Generative AI
    "google-genai",

    # HTTP client
    "httpx",
    "requests",

    # gRPC. grpcio-tools' protobuf requirement is what actually pins the
    # resolved protobuf major version; keep it inside the 6.x range that
    # matches whagent_net/protos' Bazel-pinned protobuf module (33.4).
    # grpcio-tools>=1.82 requires protobuf 7.x, which would drift out of
    # that range again.
    "grpcio>=1.72.1",
    "grpcio-tools>=1.72.1,<1.82",

    # JWT handling
    "python-jose",
    "python-dateutil",
    "urllib3",
    
    # Utility libraries
    "pydantic",
    "python-dotenv",

    # MCP server framework
    "fastmcp",

    # Embedded firmware flashing and serial monitoring (ESP32)
    "esptool",
    "pyserial",

    # Build backend needed by pycross to build esptool (sdist-only package)
    "setuptools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
