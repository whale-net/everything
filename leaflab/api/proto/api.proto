syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // --- Admin (FR10, FR12 activation) -----------------------------------
  //
  // leaflab-admin (auth.go's RoleAdmin) is eligibility only -- these RPCs
  // are what actually grant reach, and they grant it narrowly. There is no
  // in-application mechanism to grant or revoke the realm role itself.

  // ResolveToHousehold is the standing (non-elevated) admin lane (FR10.2):
  // across all households, without elevation, resolve a person, a support
  // reference (FR80, stubbed until it lands), or a partial device
  // identifier to the owning household and FR79's health fields for the
  // boards it returns -- device id, board display name, household
  // identity, last-seen age, active version, outstanding push, sensor
  // count. That is the whole lane: no readings, regions, plants, config or
  // audit rows. Audited at query granularity (FR10.4) -- one audit row per
  // call, not one per returned board.
  rpc ResolveToHousehold(ResolveToHouseholdRequest) returns (ResolveToHouseholdResponse);

  // ListFleetHealth is FR79's admin fleet health listing: per board,
  // last-seen age evaluated against A23's staleness threshold, active
  // accepted config version, whether a push is outstanding and for how
  // long, and sensor count -- filterable by device-id prefix, household,
  // region and reporting state (including unhealthy-only), and paginated
  // per FR61. Reachable from the standing admin lane (FR10.2) across all
  // households, and from an elevated lane narrowed to one household
  // (FR10.1/FR10.3) -- the same computation FR62's household-member
  // landing view will consume, not a second one. No health score or
  // severity ranking (FR79) -- see ReportingState and FleetBoardHealth's
  // doc comments.
  rpc ListFleetHealth(ListFleetHealthRequest) returns (ListFleetHealthResponse);

  // Elevate opens a time-boxed, reasoned elevation against one target
  // household (FR10.1). Requires a non-empty reason. Lasts 60 minutes
  // (configurable, documented) from acceptance.
  rpc Elevate(ElevateRequest) returns (ElevateResponse);

  // RenewElevation extends an already-open elevation against the same
  // target household. Requires a **restated** reason -- an empty reason,
  // or renewing with no elevation currently open for that household, is
  // refused.
  rpc RenewElevation(RenewElevationRequest) returns (RenewElevationResponse);

  // EndElevation ends an open elevation against a target household before
  // its natural expiry.
  rpc EndElevation(EndElevationRequest) returns (EndElevationResponse);

  // GetElevationStatus reports whether the caller currently holds an
  // unexpired elevation against a target household, and its remaining time
  // (A22) -- readable throughout the elevation, not only at grant time.
  rpc GetElevationStatus(GetElevationStatusRequest) returns (GetElevationStatusResponse);
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Admin (FR10, FR12 activation) --------------------------------------
//
// leaflab-admin is eligibility only (auth.go's RoleAdmin) -- these messages
// back the two admin lanes: ResolveToHousehold (FR10.2's standing,
// resolution-only lane) and Elevate/RenewElevation/EndElevation/
// GetElevationStatus (FR10.1's time-boxed, reasoned, per-household
// elevation). No RPC outside this section, and no field on any message
// above, is reachable by an admin acting under either lane -- every other
// admin read and every admin write resolves its scope through
// ElevatedScope (leaflab/api/authz), which refuses without an unexpired
// elevation against the specific target household named in the request.

// ResolveToHouseholdRequest names exactly one query term. A caller
// supplies exactly one oneof field -- never a combination -- per FR10.2's
// "a person, a support reference, or a partial device identifier".
message ResolveToHouseholdRequest {
  oneof query {
    // A person identifier (e.g. an email or a principal subject) to
    // resolve to their current household.
    string person_identifier = 1;
    // An FR80 support reference. Resolution is stubbed until FR80 lands.
    string support_reference = 2;
    // A partial device identifier to resolve to the household owning the
    // matching board(s).
    string partial_device_id = 3;
  }
}

// AdminBoardHealth is FR79's health-field projection for the standing
// lane: device id, board display name, household identity, last-seen age,
// active version, outstanding push, sensor count -- and **nothing else**.
// Readings, region/plant structure, config payloads and audit rows are
// never reachable through this message; a wider message with those fields
// left unset is deliberately not reused here (FR10.2).
message AdminBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name field
  // exists elsewhere in the schema.
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ResolveToHouseholdResponse.server_now (FR64), same convention
  // as BoardInfo.last_seen_at.
  Instant last_seen_at = 5;
  // Highest config version currently accepted by this board.
  uint64 active_version = 6;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 7;
  int32 sensor_count = 8;
}

// ResolveToHouseholdResponse is its own message type, not a narrowed reuse
// of a wider board/household response -- see AdminBoardHealth's doc
// comment. A query that resolves to no household returns zero boards, not
// an error (mirrors ListBoards's empty-list-not-error convention) --
// distinguishing "no match" from "match, no reach" is exactly the
// existence oracle NFR2 forbids elsewhere, and the standing lane must not
// reintroduce it.
message ResolveToHouseholdResponse {
  repeated AdminBoardHealth boards = 1;
  // Server's current time, so a caller renders last_seen_at as elapsed
  // time without trusting its own clock (FR64).
  Instant server_now = 2;
}

// --- Fleet health listing (FR79, A23) ------------------------------------
//
// ListFleetHealth's request/response pair. FleetBoardHealth is a distinct
// message from AdminBoardHealth (ResolveToHousehold's projection) even
// though the two overlap heavily -- it carries the additional fields FR79
// asks for beyond FR10.2's set (reporting_state, outstanding_push_since,
// retired) and is filterable/paginated in a way a resolve-by-term lane is
// not. Neither message is a narrowed reuse of the other, same rationale as
// AdminBoardHealth's own doc comment: a wider message with fields left
// unset here would let a future field addition leak into a lane that
// hasn't asked for it.

// ReportingState is A23's "not reporting" classification, evaluated
// per-board against that board's own staleness threshold
// (leaflab/api/health.Threshold) -- REPORTING_STATE_NOT_REPORTING is
// FR79's "unhealthy". This is deliberately two-valued, never a score or a
// ranking (FR79 explicitly excludes both) -- a caller branches on this
// enum, never on a numeric severity.
enum ReportingState {
  REPORTING_STATE_UNSPECIFIED = 0;
  REPORTING_STATE_REPORTING = 1;
  REPORTING_STATE_NOT_REPORTING = 2;
}

// ListFleetHealthRequest's filters narrow, never widen, the caller's
// underlying reach (standing admin lane across all households, or an
// elevated lane narrowed to one household -- see ListFleetHealth's doc
// comment). Every filter is optional; an unset/zero-value filter applies
// no narrowing on that dimension.
message ListFleetHealthRequest {
  // Narrows to boards whose device_id starts with this prefix. Empty =
  // no filter.
  string device_id_prefix = 1;
  // Narrows to one household. 0 = no filter.
  int64 household_id = 2;
  // Narrows to boards with at least one sensor currently placed in this
  // region. 0 = no filter.
  int64 region_id = 3;
  // Narrows by A23 reporting state. REPORTING_STATE_UNSPECIFIED = no
  // filter; REPORTING_STATE_NOT_REPORTING is FR79's "unhealthy only".
  ReportingState reporting_state = 4;
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 5;
}

// FleetBoardHealth is FR79's fleet-listing health projection. No field on
// this message is a computed health score or severity ranking (FR79) --
// reporting_state is the closest thing to a summary judgement here, and it
// is a two-valued classification, not a score.
message FleetBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name
  // field exists elsewhere in the schema (see AdminBoardHealth's doc
  // comment).
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ListFleetHealthResponse.server_now (FR64).
  Instant last_seen_at = 5;
  // A23 classification of last_seen_at against this board's own
  // staleness threshold (leaflab/api/health.Threshold) -- global, not
  // per-household.
  ReportingState reporting_state = 6;
  // Highest config version currently accepted by this board.
  uint64 active_version = 7;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 8;
  // Absolute instant the outstanding version was pushed. Meaningful only
  // when outstanding_push is true -- render "how long outstanding" as
  // server_now - outstanding_push_since (FR64), the same convention as
  // last_seen_at.
  Instant outstanding_push_since = 9;
  int32 sensor_count = 10;
  // True when this board is retired (board.retired_at IS NOT NULL,
  // FR22.4). A retired board may still be listed here, marked retired,
  // but is excluded from any offline/reporting-state count computed over
  // this listing (FR79).
  bool retired = 11;
}

message ListFleetHealthResponse {
  repeated FleetBoardHealth boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// ElevateRequest opens an elevation against target_household_id.
// reason is required and non-empty (FR10.1).
message ElevateRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message ElevateResponse {
  // Absolute expiry instant (60 minutes out, configurable) -- render
  // remaining time against the caller's own clock, or prefer
  // GetElevationStatus's server_now-paired pair while elevated (A22).
  Instant expires_at = 1;
}

// RenewElevationRequest extends an already-open elevation.
// reason must be **restated** -- an empty reason, or no elevation
// currently open for target_household_id, is refused.
message RenewElevationRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message RenewElevationResponse {
  Instant expires_at = 1;
}

message EndElevationRequest {
  int64 target_household_id = 1;
}

message EndElevationResponse {}

message GetElevationStatusRequest {
  int64 target_household_id = 1;
}

// GetElevationStatusResponse reports whether an unexpired elevation is
// currently open against target_household_id (A22 -- "its remaining time
// is readable while elevated"). expires_at is meaningful only when
// elevated is true; a caller computes remaining time as
// expires_at - server_now, never against its own clock alone (FR64).
message GetElevationStatusResponse {
  bool elevated = 1;
  Instant expires_at = 2;
  Instant server_now = 3;
}
