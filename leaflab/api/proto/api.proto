syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // --- Regions (FR50, FR22.2, FR22.5, NFR6.2) -----------------------------
  //
  // A region is a node in a household's Room/Shelf/Pot hierarchy (migration
  // 001). This task (#1376) is this RPC set's scaffolded wire surface plus
  // migration 020's retired_at/successor_region_id columns and the
  // parentage-immutability trigger; the business rules named on each RPC
  // below (structural limits, the create-time parentage grace window,
  // member-or-grantee authorization, FR8 audit recording) are
  // Implementation-phase work, not yet wired into leaflab/api/server.go --
  // see leaflab/api/regions.go's doc comment for the current state.

  // CreateRegion creates a region, optionally under a parent (FR50.1).
  // Refused, naming the offending region and field (FR59), if the parent
  // already has 12 children or if depth would exceed Room/Shelf/Pot.
  // Parentage is set here and is immutable from this point on, once any
  // reading is attributed to this region or a descendant (FR50.3) -- a
  // member-or-grantee capability (FR7), not admin.
  rpc CreateRegion(CreateRegionRequest) returns (CreateRegionResponse);

  // RenameRegion changes a region's name. Never changes parentage (FR50.3)
  // -- there is no parent field on this request. Member-or-grantee (FR7).
  rpc RenameRegion(RenameRegionRequest) returns (RenameRegionResponse);

  // RetireRegion soft-retires a region (FR22.2, FR22.5): excluded from
  // default listings from this point on, accepts no new writes, remains
  // readable by explicit id and through the history/readings paths, and
  // remains resolvable for attribution of readings recorded while it was
  // active. Retirement does not unfreeze parentage (FR22.2) -- a
  // subsequent re-parent attempt is refused exactly as it would be for an
  // active region. Member-or-grantee (FR7).
  rpc RetireRegion(RetireRegionRequest) returns (RetireRegionResponse);

  // ListRegions lists a household's regions, keyset paginated (FR61).
  // Retired regions are excluded by default (FR22.5) -- GetRegionPath and a
  // direct-id lookup are the explicit-id escape hatches for a retired
  // region, mirroring GetBoardByID's role for a retired board.
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // GetRegionPath returns a region's root-to-leaf path (FR50.2), backed by
  // v_region_path (migration 012) rather than a second recursive CTE, so a
  // nested picker and a breadcrumb have a source. Works for a retired
  // region too (FR22.5's "remains readable by explicit id").
  rpc GetRegionPath(GetRegionPathRequest) returns (GetRegionPathResponse);

  // RewireSensor is the explicit API rewire path (FR16): it declares that
  // the sensor currently known by `name` on this device has moved to a new
  // hardware location (I2C address / mux path), and updates that sensor in
  // place -- closing/opening a sensor_hw_history interval -- rather than
  // minting a new sensor identity. `name` is the stable anchor (FR16 case
  // 2: match on name, update hardware key), mirroring
  // leaflab/processor/repository.go's UpsertSensor resolution order on the
  // device manifest path. Refused (FR17) if no sensor named `name`
  // currently exists for this device: applying it would create a new
  // identity, not continue an existing one, and its reading history would
  // not follow.
  rpc RewireSensor(RewireSensorRequest) returns (RewireSensorResponse);

  // --- Sensor region assignment and rename (FR51, FR52) -------------------
  //
  // #1379's two RPCs. Scaffolded here (request/response shapes and the
  // service wire surface); the write-path business logic named on each RPC
  // below -- immediate commit, FR73 invalidation, FR20 boundary capture,
  // FR1.2 same-household enforcement, FR8 audit recording -- is
  // Implementation-phase work. See leaflab/api/sensor_region.go's doc
  // comment for the current state, matching CreateRegion/RenameRegion's own
  // scaffold/feat split (#1376).

  // AssignSensorRegion is FR51's server-side-fact region write: it commits
  // immediately -- closing/opening a sensor_region_history interval and
  // updating sensor.region_id, all in one transaction -- with no device
  // round trip, no config version bump and no board availability
  // requirement. The target region must belong to the sensor's board's
  // household (FR1.2); a foreign-household region_id is refused, naming
  // the offending field, not silently ignored. Member-or-grantee (FR7);
  // NFR2's not-found collapse applies to both sensor_id and region_id.
  rpc AssignSensorRegion(AssignSensorRegionRequest) returns (AssignSensorRegionResponse);

  // RenameSensor is FR52's rename-without-a-round-trip path: it writes
  // only sensor_name_history (and the sensor.name cache) -- no config
  // version bump, no publish to the device. The response states whether a
  // config push is still needed: never true for the rename itself, only
  // when the caller also has pending device-behaviour changes queued
  // separately. Member-or-grantee (FR7).
  rpc RenameSensor(RenameSensorRequest) returns (RenameSensorResponse);
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message RewireSensorRequest {
  string device_id = 1;
  // The sensor's current logical name on this device -- the stable anchor
  // identifying which existing sensor this rewire applies to. Not the new
  // name: RewireSensor changes hardware location, not identity or label
  // (see FR16.3 for the case where a manifest changes both at once).
  string name = 2;
  // The sensor's new hardware location. Empty mux_path means directly on
  // the root I2C bus.
  repeated firmware.MuxHop mux_path = 3;
  uint32 i2c_address = 4;
}

message RewireSensorResponse {
  // sensor_id of the rewired sensor -- unchanged from before the rewire,
  // proving identity survived (FR16).
  int64 sensor_id = 1;
}

// --- Sensor region assignment and rename (FR51, FR52) -----------------

message AssignSensorRegionRequest {
  int64 sensor_id = 1;
  int64 region_id = 2;
}

message AssignSensorRegionResponse {
  int64 sensor_id = 1;
  // The region just assigned -- unchanged from the request, echoed back so
  // a caller can confirm the commit without a second read.
  int64 region_id = 2;
  // When the new sensor_region_history interval opened (FR64) -- push-time
  // for FR1.3's staleness comparison, not ack-time; there is no ack on
  // this path. Alongside server_now.
  Instant assigned_at = 3;
  Instant server_now = 4;
}

message RenameSensorRequest {
  int64 sensor_id = 1;
  string name = 2;
}

message RenameSensorResponse {
  int64 sensor_id = 1;
  string name = 2;
  // FR52: true only if the caller also has pending device-behaviour
  // changes (poll interval, sensor set, addressing) queued separately --
  // never true for the rename alone, which never touches config version or
  // publishes to the device.
  bool config_push_needed = 3;
  Instant server_now = 4;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Regions (FR50, FR22.2, FR22.5, NFR6.2) -------------------------------

// RegionInfo is one region as returned by every region RPC below.
message RegionInfo {
  int64 region_id = 1;
  // Unset (has_parent_region_id() == false) for a root region.
  optional int64 parent_region_id = 2;
  string name = 3;
  string description = 4;
  // Set only when this region has been retired (FR22.5), alongside the
  // response envelope's server_now (FR64).
  Instant retired_at = 5;
  // Set only when this region was retired *by a relocation* (FR74) --
  // names the region that replaced it, so region-keyed series can follow a
  // reorganisation instead of discontinuing (FR22.2). Unset for every other
  // retirement reason, and always unset on a still-active region.
  optional int64 successor_region_id = 6;
}

message CreateRegionRequest {
  // Unset requests a root region. See RegionInfo.parent_region_id.
  optional int64 parent_region_id = 1;
  string name = 2;
  string description = 3;
}

message CreateRegionResponse {
  RegionInfo region = 1;
}

message RenameRegionRequest {
  int64 region_id = 1;
  string name = 2;
}

message RenameRegionResponse {
  RegionInfo region = 1;
}

message RetireRegionRequest {
  int64 region_id = 1;
}

message RetireRegionResponse {
  RegionInfo region = 1;
}

message ListRegionsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListRegionsResponse {
  repeated RegionInfo regions = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

message GetRegionPathRequest {
  int64 region_id = 1;
}

message GetRegionPathResponse {
  // True if region_id names a real region. A false response carries no
  // other populated field -- callers must check this before reading
  // path_ids/path_names/path_name, same shape as GetDeviceConfigResponse.found.
  bool found = 1;
  // Root-to-leaf, mirroring v_region_path.path_ids (migration 012).
  repeated int64 path_ids = 2;
  // Root-to-leaf, mirroring v_region_path.path_names.
  repeated string path_names = 3;
  // Human-readable ' / '-delimited string, mirroring v_region_path.path_name.
  string path_name = 4;
}
