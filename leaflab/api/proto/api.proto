syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // --- Households and membership (FR75, FR7) -----------------------------
  //
  // A household is an explicit entity with one or more member principals
  // (FR75). These six RPCs are this task's (#1341) scaffolded wire surface;
  // the business rules named on each RPC below (never-zero-members,
  // member-only authorization, SCD2 membership writes, audit recording) are
  // Implementation-phase work, not yet wired into leaflab/api/server.go --
  // see leaflab/api/households.go's doc comment for the current state and
  // the invitation-model decision record (FR75's (a)-vs-(b) choice).

  // CreateHousehold gives a principal holding no current household one of
  // their own, with the caller as its sole member (FR75, FR76). Reachable
  // only for a principal with no current household -- the real trigger for
  // this is FR76's claim path (a sibling task, #1342); this RPC itself
  // refuses a principal who already has one rather than creating a second.
  // FR75 permits multi-household membership, but V1 specifies no switching
  // experience, so there is deliberately no second creation entrance.
  rpc CreateHousehold(CreateHouseholdRequest) returns (CreateHouseholdResponse);

  // GetHousehold returns a household's id and display name.
  rpc GetHousehold(GetHouseholdRequest) returns (GetHouseholdResponse);

  // ListHouseholdMembers lists a household's current members, keyset
  // paginated (FR61).
  rpc ListHouseholdMembers(ListHouseholdMembersRequest) returns (ListHouseholdMembersResponse);

  // InviteMember adds another principal to a household (FR75). Member-only
  // (FR7): membership change is one of FR7's three "member capability"
  // exclusions, so a grantee or an elevated admin must be refused here even
  // though they may otherwise read/write within the household. V1's
  // invitation model is direct-add by principal_subject, not an
  // invitation-row-the-invitee-accepts flow -- see households.go.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);

  // RemoveMember removes a member from a household (FR75). A household
  // never reaches zero members: removing the last remaining member is
  // refused with FR59.3's refuse-and-name-the-alternative shape instead of
  // succeeding. Member-only (FR7), same exclusion as InviteMember.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // RenameHousehold changes a household's display name. Member-only (FR7).
  rpc RenameHousehold(RenameHouseholdRequest) returns (RenameHouseholdResponse);

  // --- Board claim (FR76) -------------------------------------------------
  //
  // Self-service possession challenge: a board is claimable by an
  // authenticated principal who discharges a possession challenge (r >= 2
  // challenger-marked device restarts, A28) when the board is never-claimed
  // or resolves to the member-less Unadopted household (FR70.1, migration
  // 015). These four RPCs are this task's (#1342) scaffolded wire surface;
  // see leaflab/api/claim/config.go for the A28 constants and
  // leaflab/migrate/migrations/021_claim_challenge.up.sql for the schema.
  // No RPC handler wires these into server.go yet -- Implementation-phase
  // work, matching the households RPCs' scaffold/feat split.

  // OpenClaimChallenge opens a possession challenge against device_id.
  // Requirement 1 (uniform initiation, "no oracle at open"): the response's
  // status, body shape, field set and timing must be identical whether
  // device_id is never-claimed, resolves to Unadopted, is owned by a real
  // household, or does not exist at all -- only its *syntactic* shape is
  // checked before this responds; board is never queried first. Whether the
  // resulting challenge can ever be discharged is decided at CompleteClaim,
  // never observable here.
  rpc OpenClaimChallenge(OpenClaimChallengeRequest) returns (OpenClaimChallengeResponse);

  // MarkClaimRound marks the start of one discharge round (requirement 3):
  // the server records t0 = now and returns a uniform acknowledgement
  // carrying no result -- the response never discloses whether a prior
  // round was satisfied, or how many remain. The claimant power-cycles the
  // board immediately after calling this; the round is satisfied server-side
  // by an out-of-band restart signal (requirement 4), not by this RPC.
  rpc MarkClaimRound(MarkClaimRoundRequest) returns (MarkClaimRoundResponse);

  // GetClaimChallengeStatus reports whether a challenge is still waiting or
  // has ended (requirement 8's waiting/failed/expired presentation states,
  // rendered by the BFF). The "ended" state is deliberately coarse: it
  // never distinguishes not-discharged from discharged-but-against-a-real-
  // household's-board (requirement 6), and never exposes which round(s)
  // were satisfied (requirement 3's "no per-round outcome is disclosed") --
  // only CompleteClaim's own response can ever confer an actual claim
  // outcome.
  rpc GetClaimChallengeStatus(GetClaimChallengeStatusRequest) returns (GetClaimChallengeStatusResponse);

  // CompleteClaim finalizes a challenge (requirement 6). Succeeds --
  // transferring the board's ownership closure (FR70) and auditing the
  // claim (FR8), creating a household for the caller first if they hold
  // none (FR75) -- only when the challenge discharged AND the board is
  // never-claimed or resolves to Unadopted. Every other case (not
  // discharged, exhausted, expired, or discharged against a board owned by
  // a real household) returns the identical not-discharged failure: same
  // status, body shape and wording, so a discharge against a real
  // household's board is indistinguishable to the challenger from a
  // challenge nobody satisfied. The discharge fact itself is still recorded
  // server-side either way, readable by an elevated admin as FR77's
  // evidence, but never disclosed to the challenger.
  rpc CompleteClaim(CompleteClaimRequest) returns (CompleteClaimResponse);

  // --- Ownership closure, release, and transfer (FR70.2-.4, FR77) ---------
  //
  // FR70's ownership closure of a board is a fixed six-step enumeration
  // over current placement (see leaflab/api/closure.go's doc comment for
  // the exact steps) -- not a transitive closure. These three RPCs are
  // this task's (#1343) scaffolded wire surface; PreviewClosure's handler
  // is read-only business logic (ComputeClosure, closure.go) but is not
  // yet wired into leaflab/api/server.go, matching the households/claim
  // RPCs' scaffold/feat split precedent. ReleaseBoard and TransferClosure
  // are signature-only skeletons in closure.go until the Implementation
  // phase.

  // PreviewClosure returns a board's ownership closure without moving
  // anything -- the read-only preview a caller uses before deciding
  // whether to adopt or transfer.
  rpc PreviewClosure(PreviewClosureRequest) returns (PreviewClosureResponse);

  // ReleaseBoard is FR77(a)'s evidence path: a member of the losing
  // household releases a board's closure, producing a release token
  // TransferClosure can later present as evidence that the losing
  // household consented.
  rpc ReleaseBoard(ReleaseBoardRequest) returns (ReleaseBoardResponse);

  // TransferClosure moves a board's ownership closure to
  // destination_household_id, gated on evidence (exactly one of the
  // TransferClosureRequest.evidence oneof branches): either a release
  // token from ReleaseBoard by a member of the losing household, or an
  // elevated admin action carrying a discharged FR76 possession-challenge
  // handle. An admin assertion alone -- neither branch set -- is never
  // sufficient and is refused. Adoption out of the member-less Unadopted
  // household is reached through FR76's CompleteClaim instead, never
  // through this RPC (Unadopted has no losing member and needs no
  // evidence beyond FR76's own challenge).
  rpc TransferClosure(TransferClosureRequest) returns (TransferClosureResponse);
  // --- Admin (FR10, FR12 activation) -----------------------------------
  //
  // leaflab-admin (auth.go's RoleAdmin) is eligibility only -- these RPCs
  // are what actually grant reach, and they grant it narrowly. There is no
  // in-application mechanism to grant or revoke the realm role itself.

  // ResolveToHousehold is the standing (non-elevated) admin lane (FR10.2):
  // across all households, without elevation, resolve a person, a support
  // reference (FR80, stubbed until it lands), or a partial device
  // identifier to the owning household and FR79's health fields for the
  // boards it returns -- device id, board display name, household
  // identity, last-seen age, active version, outstanding push, sensor
  // count. That is the whole lane: no readings, regions, plants, config or
  // audit rows. Audited at query granularity (FR10.4) -- one audit row per
  // call, not one per returned board.
  rpc ResolveToHousehold(ResolveToHouseholdRequest) returns (ResolveToHouseholdResponse);

  // Elevate opens a time-boxed, reasoned elevation against one target
  // household (FR10.1). Requires a non-empty reason. Lasts 60 minutes
  // (configurable, documented) from acceptance.
  rpc Elevate(ElevateRequest) returns (ElevateResponse);

  // RenewElevation extends an already-open elevation against the same
  // target household. Requires a **restated** reason -- an empty reason,
  // or renewing with no elevation currently open for that household, is
  // refused.
  rpc RenewElevation(RenewElevationRequest) returns (RenewElevationResponse);

  // EndElevation ends an open elevation against a target household before
  // its natural expiry.
  rpc EndElevation(EndElevationRequest) returns (EndElevationResponse);

  // GetElevationStatus reports whether the caller currently holds an
  // unexpired elevation against a target household, and its remaining time
  // (A22) -- readable throughout the elevation, not only at grant time.
  rpc GetElevationStatus(GetElevationStatusRequest) returns (GetElevationStatusResponse);
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Households and membership (FR75, FR7) -------------------------------

message Household {
  int64 household_id = 1;
  string name = 2;
}

// HouseholdMember is one row of ListHouseholdMembersResponse -- a
// principal's current membership in the household being listed. There is
// no "invitation, not yet accepted" state to represent here: V1's
// invitation model is direct-add (see households.go), so every row is
// already a current member.
message HouseholdMember {
  string principal_subject = 1;
  // Absolute instant this membership began -- the current
  // household_membership row's valid_from -- alongside the response
  // envelope's server_now (FR64).
  Instant joined_at = 2;
}

message CreateHouseholdRequest {
  // Optional display name. Empty falls back to a server-chosen default
  // (Implementation-phase choice).
  string name = 1;
}

message CreateHouseholdResponse {
  Household household = 1;
}

message GetHouseholdRequest {
  int64 household_id = 1;
}

message GetHouseholdResponse {
  Household household = 1;
}

message ListHouseholdMembersRequest {
  int64 household_id = 1;
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 2;
}

message ListHouseholdMembersResponse {
  repeated HouseholdMember members = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

message InviteMemberRequest {
  int64 household_id = 1;
  // Identifies the invitee directly -- V1's invitation model is direct-add
  // by principal subject, not an invitation row the invitee accepts later
  // (see households.go's decision record). The audit row for this action
  // names both the acting member and this principal (FR8).
  string principal_subject = 2;
}

message InviteMemberResponse {
  HouseholdMember member = 1;
}

message RemoveMemberRequest {
  int64 household_id = 1;
  string principal_subject = 2;
}

message RemoveMemberResponse {}

message RenameHouseholdRequest {
  int64 household_id = 1;
  string name = 2;
}

message RenameHouseholdResponse {
  Household household = 1;
}

// --- Board claim (FR76) ---------------------------------------------------

message OpenClaimChallengeRequest {
  // Syntactically validated only (requirement 1) -- never looked up
  // against board before this RPC responds.
  string device_id = 1;
}

message OpenClaimChallengeResponse {
  // Opaque handle for this challenge -- never the underlying numeric row
  // id, which would leak challenge volume/ordering across principals.
  string challenge_handle = 1;
  // Round instructions, persona-appropriate (requirement 8): presented
  // using the identifier as printed on the board and where to find it --
  // never as "device id".
  string instructions = 2;
  // Rounds required to discharge (A28's r, leaflab/api/claim.Config).
  // Disclosed so a client can show progress framing without the server
  // ever disclosing which round(s) were actually satisfied.
  int32 rounds_required = 3;
  // Challenge's bounded lifetime (requirement 8: "long enough to walk to
  // the greenhouse and back"; A28 default 15 minutes).
  Instant expires_at = 4;
  // Server's current time (FR64), alongside every other response.
  Instant server_now = 5;
}

message MarkClaimRoundRequest {
  string challenge_handle = 1;
}

// Deliberately carries nothing but the response envelope's server_now --
// requirement 3's "uniform acknowledgement carrying no result".
message MarkClaimRoundResponse {
  Instant server_now = 1;
}

message GetClaimChallengeStatusRequest {
  string challenge_handle = 1;
}

// ClaimChallengeState is deliberately two-valued -- see
// GetClaimChallengeStatus's doc comment (api.proto's service block) for why
// a third "discharged" value would itself be a disclosure the requirement
// text forbids.
enum ClaimChallengeState {
  CLAIM_CHALLENGE_STATE_UNSPECIFIED = 0;
  CLAIM_CHALLENGE_STATE_WAITING = 1;
  CLAIM_CHALLENGE_STATE_ENDED = 2;
}

message GetClaimChallengeStatusResponse {
  ClaimChallengeState state = 1;
  // Server's current time (FR64).
  Instant server_now = 2;
}

message CompleteClaimRequest {
  string challenge_handle = 1;
}

message CompleteClaimResponse {
  // Present only on success (requirement 6): the household -- existing, or
  // newly created as the caller's first (FR75's create-on-first-claim) --
  // the board now belongs to. A not-discharged outcome (including a
  // discharged challenge against a real household's board) is reported as
  // a gRPC failure (contract.Refuse, FR59.3) instead, never as an empty or
  // zero-value success response -- see CompleteClaim's doc comment (api.proto's
  // service block).
  Household household = 1;
  // Server's current time (FR64).
  Instant server_now = 2;
}

// --- Ownership closure, release, and transfer (FR70.2-.4, FR77) -----------

// OwnershipClosure mirrors leaflab/api.Closure on the wire -- see that
// type's doc comment for what each field means and the fixed six-step
// enumeration that produces it. Every id list here is the population as of
// the instant this response was computed; a caller acting on it (e.g.
// deciding whether to adopt) should treat it as a preview, not a lock.
message OwnershipClosure {
  int64 board_id = 1;
  repeated int64 sensor_ids = 2;
  repeated int64 region_ids = 3;
  repeated int64 subtree_root_ids = 4;
  // Every OTHER board (never board_id itself) with a sensor currently in
  // the shared subtree -- FR70's fixed enumeration stops here; an
  // entangled board's own other sensors are never followed into a second
  // subtree.
  repeated int64 entangled_board_ids = 5;
  repeated int64 plant_ids = 6;
}

message PreviewClosureRequest {
  int64 board_id = 1;
}

message PreviewClosureResponse {
  OwnershipClosure closure = 1;
  // Server's current time (FR64).
  Instant server_now = 2;
}

message ReleaseBoardRequest {
  int64 board_id = 1;
  // Optional context for the release -- persona-appropriate, not required.
  string reason = 2;
}

message ReleaseBoardResponse {
  // Opaque evidence token, presented as TransferClosureRequest.release_token
  // by the gaining side to prove a losing-household member consented
  // (FR77(a)). Never the underlying numeric row id -- same rationale as
  // OpenClaimChallengeResponse.challenge_handle.
  string release_token = 1;
  // Server's current time (FR64).
  Instant server_now = 2;
}

// AdminTransferEvidence is FR77(b)'s elevated-admin evidence path: an
// elevated, reasoned admin action carrying a discharged FR76 possession
// challenge. "An admin assertion alone is never sufficient" -- this message
// is meaningless without discharged_challenge_handle actually naming a
// challenge FR76 recorded as discharged.
message AdminTransferEvidence {
  // The FR76 claim_challenge.handle (leaflab/api/claim.go,
  // OpenClaimChallengeResponse.challenge_handle) that discharged against
  // this board, cited as this transfer's possession evidence.
  string discharged_challenge_handle = 1;
}

message TransferClosureRequest {
  int64 board_id = 1;
  int64 destination_household_id = 2;
  // Evidence (FR77): exactly one branch must be set. Neither set is a
  // bare admin assertion and is refused ("never sufficient").
  oneof evidence {
    // FR77(a): a release token produced by ReleaseBoard, by a member of
    // the losing household.
    string release_token = 3;
    // FR77(b): elevated admin action (FR10 task) evidence.
    AdminTransferEvidence admin_evidence = 4;
  }
  // Required for the admin_evidence branch ("elevated, reasoned admin
  // action") -- optional for the release_token branch, which carries its
  // own implicit reason (a losing-household member released their own
  // board).
  string reason = 5;
}

message TransferClosureResponse {
  // The destination household the closure now belongs to.
  Household household = 1;
  // Server's current time (FR64).
  Instant server_now = 2;
}

// --- Admin (FR10, FR12 activation) --------------------------------------
//
// leaflab-admin is eligibility only (auth.go's RoleAdmin) -- these messages
// back the two admin lanes: ResolveToHousehold (FR10.2's standing,
// resolution-only lane) and Elevate/RenewElevation/EndElevation/
// GetElevationStatus (FR10.1's time-boxed, reasoned, per-household
// elevation). No RPC outside this section, and no field on any message
// above, is reachable by an admin acting under either lane -- every other
// admin read and every admin write resolves its scope through
// ElevatedScope (leaflab/api/authz), which refuses without an unexpired
// elevation against the specific target household named in the request.

// ResolveToHouseholdRequest names exactly one query term. A caller
// supplies exactly one oneof field -- never a combination -- per FR10.2's
// "a person, a support reference, or a partial device identifier".
message ResolveToHouseholdRequest {
  oneof query {
    // A person identifier (e.g. an email or a principal subject) to
    // resolve to their current household.
    string person_identifier = 1;
    // An FR80 support reference. Resolution is stubbed until FR80 lands.
    string support_reference = 2;
    // A partial device identifier to resolve to the household owning the
    // matching board(s).
    string partial_device_id = 3;
  }
}

// AdminBoardHealth is FR79's health-field projection for the standing
// lane: device id, board display name, household identity, last-seen age,
// active version, outstanding push, sensor count -- and **nothing else**.
// Readings, region/plant structure, config payloads and audit rows are
// never reachable through this message; a wider message with those fields
// left unset is deliberately not reused here (FR10.2).
message AdminBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name field
  // exists elsewhere in the schema.
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ResolveToHouseholdResponse.server_now (FR64), same convention
  // as BoardInfo.last_seen_at.
  Instant last_seen_at = 5;
  // Highest config version currently accepted by this board.
  uint64 active_version = 6;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 7;
  int32 sensor_count = 8;
}

// ResolveToHouseholdResponse is its own message type, not a narrowed reuse
// of a wider board/household response -- see AdminBoardHealth's doc
// comment. A query that resolves to no household returns zero boards, not
// an error (mirrors ListBoards's empty-list-not-error convention) --
// distinguishing "no match" from "match, no reach" is exactly the
// existence oracle NFR2 forbids elsewhere, and the standing lane must not
// reintroduce it.
message ResolveToHouseholdResponse {
  repeated AdminBoardHealth boards = 1;
  // Server's current time, so a caller renders last_seen_at as elapsed
  // time without trusting its own clock (FR64).
  Instant server_now = 2;
}

// ElevateRequest opens an elevation against target_household_id.
// reason is required and non-empty (FR10.1).
message ElevateRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message ElevateResponse {
  // Absolute expiry instant (60 minutes out, configurable) -- render
  // remaining time against the caller's own clock, or prefer
  // GetElevationStatus's server_now-paired pair while elevated (A22).
  Instant expires_at = 1;
}

// RenewElevationRequest extends an already-open elevation.
// reason must be **restated** -- an empty reason, or no elevation
// currently open for target_household_id, is refused.
message RenewElevationRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message RenewElevationResponse {
  Instant expires_at = 1;
}

message EndElevationRequest {
  int64 target_household_id = 1;
}

message EndElevationResponse {}

message GetElevationStatusRequest {
  int64 target_household_id = 1;
}

// GetElevationStatusResponse reports whether an unexpired elevation is
// currently open against target_household_id (A22 -- "its remaining time
// is readable while elevated"). expires_at is meaningful only when
// elevated is true; a caller computes remaining time as
// expires_at - server_now, never against its own clock alone (FR64).
message GetElevationStatusResponse {
  bool elevated = 1;
  Instant expires_at = 2;
  Instant server_now = 3;
}
