syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // --- Regions (FR50, FR22.2, FR22.5, NFR6.2) -----------------------------
  //
  // A region is a node in a household's Room/Shelf/Pot hierarchy (migration
  // 001). This task (#1376) is this RPC set's scaffolded wire surface plus
  // migration 020's retired_at/successor_region_id columns and the
  // parentage-immutability trigger; the business rules named on each RPC
  // below (structural limits, the create-time parentage grace window,
  // member-or-grantee authorization, FR8 audit recording) are
  // Implementation-phase work, not yet wired into leaflab/api/server.go --
  // see leaflab/api/regions.go's doc comment for the current state.

  // CreateRegion creates a region, optionally under a parent (FR50.1).
  // Refused, naming the offending region and field (FR59), if the parent
  // already has 12 children or if depth would exceed Room/Shelf/Pot.
  // Parentage is set here and is immutable from this point on, once any
  // reading is attributed to this region or a descendant (FR50.3) -- a
  // member-or-grantee capability (FR7), not admin.
  rpc CreateRegion(CreateRegionRequest) returns (CreateRegionResponse);

  // RenameRegion changes a region's name. Never changes parentage (FR50.3)
  // -- there is no parent field on this request. Member-or-grantee (FR7).
  rpc RenameRegion(RenameRegionRequest) returns (RenameRegionResponse);

  // RetireRegion soft-retires a region (FR22.2, FR22.5): excluded from
  // default listings from this point on, accepts no new writes, remains
  // readable by explicit id and through the history/readings paths, and
  // remains resolvable for attribution of readings recorded while it was
  // active. Retirement does not unfreeze parentage (FR22.2) -- a
  // subsequent re-parent attempt is refused exactly as it would be for an
  // active region. Member-or-grantee (FR7).
  rpc RetireRegion(RetireRegionRequest) returns (RetireRegionResponse);

  // ListRegions lists a household's regions, keyset paginated (FR61).
  // Retired regions are excluded by default (FR22.5) -- GetRegionPath and a
  // direct-id lookup are the explicit-id escape hatches for a retired
  // region, mirroring GetBoardByID's role for a retired board.
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // GetRegionPath returns a region's root-to-leaf path (FR50.2), backed by
  // v_region_path (migration 012) rather than a second recursive CTE, so a
  // nested picker and a breadcrumb have a source. Works for a retired
  // region too (FR22.5's "remains readable by explicit id").
  rpc GetRegionPath(GetRegionPathRequest) returns (GetRegionPathResponse);

  // RelocateSubtree relocates a region subtree under a new parent in one
  // atomic operation (FR74): mirrors the subtree beneath
  // new_parent_region_id, moves every current sensor placement (FR51) and
  // every current plant placement (FR54) into the mirrored regions, then
  // retires the original regions in place (FR22.2) with successor_region_id
  // naming their replacements. Commits or nothing does -- no intermediate
  // state is ever observable (FR1.2 never violated, FR56 never reports a
  // plant unmonitored mid-relocation). Mirroring is refused whole, before
  // anything is written (FR59.3), if it would violate FR50's structural
  // rules (a 13th child, a Shelf under a Pot) -- this is SetRegionParent's
  // named alternative (FR50.5) for a refused re-parent. Every moved
  // placement interval is marked relocation_induced = TRUE (FR24), FR20
  // captures are recorded for every moved boundary, FR73 invalidations are
  // published for every affected sensor, and one audit record covers the
  // whole operation, carrying reason (FR8). Member-or-grantee (FR7).
  rpc RelocateSubtree(RelocateSubtreeRequest) returns (RelocateSubtreeResponse);

  // --- Plants (FR54, FR24, FR22.3, FR22.1) --------------------------------
  //
  // A plant occupies exactly one region at a time; its placement history is
  // recorded in plant_region_history (migration 017, FR19) rather than
  // mutated in place. This task (#1377) is this RPC set's scaffolded wire
  // surface; the business rules named on each RPC below (the Phase 3 SCD2
  // placement writer, FR20's boundary capture, FR1.2's cross-household
  // guard, FR7 authorization, FR8 audit recording) are Implementation-phase
  // work -- see leaflab/api/plants.go's doc comment for the current state.

  // CreatePlant creates a plant and places it into a region in one
  // operation (FR54). The placement write goes through the same SCD2
  // writer MovePlant uses (leaflab/api/placement.Writer), opening the
  // plant's first plant_region_history interval.
  rpc CreatePlant(CreatePlantRequest) returns (CreatePlantResponse);

  // CorrectPlant fixes a plant's name and/or plant type (FR24): a
  // correction, distinguishable from MovePlant, which changes placement.
  // CorrectPlant never writes a plant_region_history interval; there is no
  // region field on this request.
  rpc CorrectPlant(CorrectPlantRequest) returns (CorrectPlantResponse);

  // MovePlant relocates a plant to a new region (FR54, FR19): closes the
  // plant's current open plant_region_history interval and opens a new one
  // at NOW() -- never back-dated (FR19), refused with the reason stated if
  // the caller asks for a past boundary (FR59.3). Never renames the plant
  // or changes its plant_type -- that is CorrectPlant's job (FR24).
  rpc MovePlant(MovePlantRequest) returns (MovePlantResponse);

  // RetirePlant soft-retires a plant (FR22.1, FR22.3): excluded from
  // default listings from this point on, accepts no new writes. Its
  // readings and placement timeline remain reachable through GetPlant,
  // GetPlantPlacementTimeline and the existing read paths (FR22.3's
  // postmortem use case) -- nothing is hard-deleted.
  rpc RetirePlant(RetirePlantRequest) returns (RetirePlantResponse);

  // GetPlant returns a plant by id, regardless of retired state (FR22.3's
  // "remains readable by explicit id").
  rpc GetPlant(GetPlantRequest) returns (GetPlantResponse);

  // ListPlants lists a household's plants, keyset paginated (FR61).
  // Retired plants are excluded by default (FR22.1) -- GetPlant is the
  // explicit-id escape hatch for a retired plant.
  rpc ListPlants(ListPlantsRequest) returns (ListPlantsResponse);

  // GetPlantPlacementTimeline returns a plant's plant_region_history
  // intervals (FR19), each carrying the relocation_induced flag (FR24 --
  // populated by FR74's sibling task, always false until then). Works for
  // a retired plant too (FR22.3).
  rpc GetPlantPlacementTimeline(GetPlantPlacementTimelineRequest) returns (GetPlantPlacementTimelineResponse);

  // --- Plant types (FR55, A24) ---------------------------------------------
  //
  // The plant-type catalog has global rows (household_id unset, migration
  // 034) and household-owned rows. This task (#1378) is this RPC set's
  // scaffolded wire surface plus migration 034's household_id/retired_at
  // columns and CreatePlantRequest's new_plant_type oneof branch; the
  // business rules named on each RPC below (elevation-gated global writes,
  // FR7 member-or-grantee owned writes, SB-1.10's one-transaction
  // acquire-and-place, FR59.3's referenced-type retirement refusal, FR77's
  // copyOwnedPlantTypes hook) are Implementation-phase work -- see
  // leaflab/api/plant_types.go's doc comment for the current state.

  // ListPlantTypes returns global rows plus the caller's own household-owned
  // rows, each marked distinguishably (FR55) -- never another household's
  // owned rows.
  rpc ListPlantTypes(ListPlantTypesRequest) returns (ListPlantTypesResponse);

  // CreatePlantType creates a plant type. Requesting a global row
  // (CreatePlantTypeRequest.global) requires FR10 elevation, audited with a
  // null target household (a global row has no household to target);
  // requesting a household-owned row is a member-or-grantee (FR7)
  // capability against the caller's own household -- no elevation.
  rpc CreatePlantType(CreatePlantTypeRequest) returns (CreatePlantTypeResponse);

  // RenamePlantType renames a plant type -- same elevation-for-global /
  // member-or-grantee-for-owned split as CreatePlantType.
  rpc RenamePlantType(RenamePlantTypeRequest) returns (RenamePlantTypeResponse);

  // RetirePlantType soft-retires a plant type (FR22.1). Refused, naming the
  // referencing plants, while any plant still references it -- in either
  // class (global or household-owned); nothing is hard-deleted.
  rpc RetirePlantType(RetirePlantTypeRequest) returns (RetirePlantTypeResponse);

  // --- Plant-type bands (FR58, FR27's band criterion) -------------------
  //
  // A plant type's expected-range bands (migration 035's plant_type_band
  // table) are stored and rendered, never evaluated (this task's issue
  // text: "V1 stores and renders bands only -- no evaluation, no
  // notification"). Bands hang off the plant type (FR55), so a
  // household-owned type and a global type carry bands identically, and
  // work the same authorization split as CreatePlantType/RenamePlantType/
  // RetirePlantType above: member-or-grantee (FR7) for the caller's own
  // household-owned type, FR10 elevation for a global type.

  // SetPlantTypeBands replaces the full band set for one (plant_type_id,
  // sensor_type_id) pair. Refused with FR59's refused_with_alternative
  // shape if the given bands overlap (Implementation phase states and
  // enforces the exact overlap rule) -- naming the offending bands.
  rpc SetPlantTypeBands(SetPlantTypeBandsRequest) returns (SetPlantTypeBandsResponse);

  // GetPlantTypeBands reads back a plant type's configured bands. Narrowed
  // to one measurement type when sensor_type_id is set; unfiltered (every
  // measurement type this plant type has bands for) when it is zero. A
  // plant type with no bands configured returns an empty list, not an
  // error.
  rpc GetPlantTypeBands(GetPlantTypeBandsRequest) returns (GetPlantTypeBandsResponse);

  // --- Admin (FR10, FR12 activation) -----------------------------------
  //
  // leaflab-admin (auth.go's RoleAdmin) is eligibility only -- these RPCs
  // are what actually grant reach, and they grant it narrowly. There is no
  // in-application mechanism to grant or revoke the realm role itself.

  // ResolveToHousehold is the standing (non-elevated) admin lane (FR10.2):
  // across all households, without elevation, resolve a person, a support
  // reference (FR80, stubbed until it lands), or a partial device
  // identifier to the owning household and FR79's health fields for the
  // boards it returns -- device id, board display name, household
  // identity, last-seen age, active version, outstanding push, sensor
  // count. That is the whole lane: no readings, regions, plants, config or
  // audit rows. Audited at query granularity (FR10.4) -- one audit row per
  // call, not one per returned board.
  rpc ResolveToHousehold(ResolveToHouseholdRequest) returns (ResolveToHouseholdResponse);

  // Elevate opens a time-boxed, reasoned elevation against one target
  // household (FR10.1). Requires a non-empty reason. Lasts 60 minutes
  // (configurable, documented) from acceptance.
  rpc Elevate(ElevateRequest) returns (ElevateResponse);

  // RenewElevation extends an already-open elevation against the same
  // target household. Requires a **restated** reason -- an empty reason,
  // or renewing with no elevation currently open for that household, is
  // refused.
  rpc RenewElevation(RenewElevationRequest) returns (RenewElevationResponse);

  // EndElevation ends an open elevation against a target household before
  // its natural expiry.
  rpc EndElevation(EndElevationRequest) returns (EndElevationResponse);

  // GetElevationStatus reports whether the caller currently holds an
  // unexpired elevation against a target household, and its remaining time
  // (A22) -- readable throughout the elevation, not only at grant time.
  rpc GetElevationStatus(GetElevationStatusRequest) returns (GetElevationStatusResponse);
  // --- Bounded read path (FR25, FR27, FR28, NFR3.2) ---------------------
  //
  // See leaflab/api/readings -- the one place the join, enrichment and
  // attribution logic behind these four RPCs lives (FR25.1). Handlers
  // (server.go) delegate to it (#1362's Implementation phase).

  // A bounded-window reading series for one entity -- sensor, board,
  // region or plant (FR25.1). Every response states which granularity
  // tier answered (FR71), never silently. Raw-row responses are capped at
  // a 48-hour window (NFR3.2); a longer window coarsens automatically
  // rather than erroring.
  rpc GetReadingSeries(GetReadingSeriesRequest) returns (GetReadingSeriesResponse);

  // The current value per sensor and per plant, in one call, from the
  // latest raw readings -- never from a pre-aggregated tier (FR27). The
  // response's band field is left unpopulated until Phase 5 (FR58).
  rpc GetCurrentValues(GetCurrentValuesRequest) returns (GetCurrentValuesResponse);

  // Server-side min/max/average summary for one region over a period,
  // including the overnight-low/daytime-high framing (FR28). Exact at the
  // hourly tier for min and max (FR71).
  rpc GetPeriodSummary(GetPeriodSummaryRequest) returns (GetPeriodSummaryResponse);

  // Two or more entities compared over one shared window and one
  // measurement (FR25.3).
  rpc CompareSeries(CompareSeriesRequest) returns (CompareSeriesResponse);
  // RewireSensor is the explicit API rewire path (FR16): it declares that
  // the sensor currently known by `name` on this device has moved to a new
  // hardware location (I2C address / mux path), and updates that sensor in
  // place -- closing/opening a sensor_hw_history interval -- rather than
  // minting a new sensor identity. `name` is the stable anchor (FR16 case
  // 2: match on name, update hardware key), mirroring
  // leaflab/processor/repository.go's UpsertSensor resolution order on the
  // device manifest path. Refused (FR17) if no sensor named `name`
  // currently exists for this device: applying it would create a new
  // identity, not continue an existing one, and its reading history would
  // not follow.
  rpc RewireSensor(RewireSensorRequest) returns (RewireSensorResponse);

  // --- Sensor region assignment and rename (FR51, FR52) -------------------
  //
  // #1379's two RPCs. Scaffolded here (request/response shapes and the
  // service wire surface); the write-path business logic named on each RPC
  // below -- immediate commit, FR73 invalidation, FR20 boundary capture,
  // FR1.2 same-household enforcement, FR8 audit recording -- is
  // Implementation-phase work. See leaflab/api/sensor_region.go's doc
  // comment for the current state, matching CreateRegion/RenameRegion's own
  // scaffold/feat split (#1376).

  // AssignSensorRegion is FR51's server-side-fact region write: it commits
  // immediately -- closing/opening a sensor_region_history interval and
  // updating sensor.region_id, all in one transaction -- with no device
  // round trip, no config version bump and no board availability
  // requirement. The target region must belong to the sensor's board's
  // household (FR1.2); a foreign-household region_id is refused, naming
  // the offending field, not silently ignored. Member-or-grantee (FR7);
  // NFR2's not-found collapse applies to both sensor_id and region_id.
  rpc AssignSensorRegion(AssignSensorRegionRequest) returns (AssignSensorRegionResponse);

  // RenameSensor is FR52's rename-without-a-round-trip path: it writes
  // only sensor_name_history (and the sensor.name cache) -- no config
  // version bump, no publish to the device. The response states whether a
  // config push is still needed: never true for the rename itself, only
  // when the caller also has pending device-behaviour changes queued
  // separately. Member-or-grantee (FR7).
  rpc RenameSensor(RenameSensorRequest) returns (RenameSensorResponse);
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message RewireSensorRequest {
  string device_id = 1;
  // The sensor's current logical name on this device -- the stable anchor
  // identifying which existing sensor this rewire applies to. Not the new
  // name: RewireSensor changes hardware location, not identity or label
  // (see FR16.3 for the case where a manifest changes both at once).
  string name = 2;
  // The sensor's new hardware location. Empty mux_path means directly on
  // the root I2C bus.
  repeated firmware.MuxHop mux_path = 3;
  uint32 i2c_address = 4;
}

message RewireSensorResponse {
  // sensor_id of the rewired sensor -- unchanged from before the rewire,
  // proving identity survived (FR16).
  int64 sensor_id = 1;
}

// --- Sensor region assignment and rename (FR51, FR52) -----------------

message AssignSensorRegionRequest {
  int64 sensor_id = 1;
  int64 region_id = 2;
}

message AssignSensorRegionResponse {
  int64 sensor_id = 1;
  // The region just assigned -- unchanged from the request, echoed back so
  // a caller can confirm the commit without a second read.
  int64 region_id = 2;
  // When the new sensor_region_history interval opened (FR64) -- push-time
  // for FR1.3's staleness comparison, not ack-time; there is no ack on
  // this path. Alongside server_now.
  Instant assigned_at = 3;
  Instant server_now = 4;
}

message RenameSensorRequest {
  int64 sensor_id = 1;
  string name = 2;
}

message RenameSensorResponse {
  int64 sensor_id = 1;
  string name = 2;
  // FR52: true only if the caller also has pending device-behaviour
  // changes (poll interval, sensor set, addressing) queued separately --
  // never true for the rename alone, which never touches config version or
  // publishes to the device.
  bool config_push_needed = 3;
  Instant server_now = 4;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Regions (FR50, FR22.2, FR22.5, NFR6.2) -------------------------------

// RegionInfo is one region as returned by every region RPC below.
message RegionInfo {
  int64 region_id = 1;
  // Unset (has_parent_region_id() == false) for a root region.
  optional int64 parent_region_id = 2;
  string name = 3;
  string description = 4;
  // Set only when this region has been retired (FR22.5), alongside the
  // response envelope's server_now (FR64).
  Instant retired_at = 5;
  // Set only when this region was retired *by a relocation* (FR74) --
  // names the region that replaced it, so region-keyed series can follow a
  // reorganisation instead of discontinuing (FR22.2). Unset for every other
  // retirement reason, and always unset on a still-active region.
  optional int64 successor_region_id = 6;
}

message CreateRegionRequest {
  // Unset requests a root region. See RegionInfo.parent_region_id.
  optional int64 parent_region_id = 1;
  string name = 2;
  string description = 3;
}

message CreateRegionResponse {
  RegionInfo region = 1;
}

message RenameRegionRequest {
  int64 region_id = 1;
  string name = 2;
}

message RenameRegionResponse {
  RegionInfo region = 1;
}

message RetireRegionRequest {
  int64 region_id = 1;
}

message RetireRegionResponse {
  RegionInfo region = 1;
}

message ListRegionsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListRegionsResponse {
  repeated RegionInfo regions = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

message GetRegionPathRequest {
  int64 region_id = 1;
}

message GetRegionPathResponse {
  // True if region_id names a real region. A false response carries no
  // other populated field -- callers must check this before reading
  // path_ids/path_names/path_name, same shape as GetDeviceConfigResponse.found.
  bool found = 1;
  // Root-to-leaf, mirroring v_region_path.path_ids (migration 012).
  repeated int64 path_ids = 2;
  // Root-to-leaf, mirroring v_region_path.path_names.
  repeated string path_names = 3;
  // Human-readable ' / '-delimited string, mirroring v_region_path.path_name.
  string path_name = 4;
}

// RelocateSubtreeRequest names the subtree to relocate (root_region_id),
// its destination (new_parent_region_id) and a reason -- FR74's atomic
// composition carries one audit record for the whole operation (FR8),
// and that record requires a reason (see audit.NewRelocationEntry, mirroring
// NewTransferEntry/NewElevationEntry/NewMultiBoardPushEntry).
message RelocateSubtreeRequest {
  int64 root_region_id = 1;
  int64 new_parent_region_id = 2;
  string reason = 3;
}

message RelocateSubtreeResponse {
  // The mirrored subtree's root region -- root_region_id's replacement
  // beneath new_parent_region_id. root_region_id itself is retired in
  // place (FR22.2) with successor_region_id set to new_root.region_id, so
  // a region-keyed series follows the relocation instead of discontinuing.
  RegionInfo new_root = 1;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 2;
}

// --- Plants (FR54, FR24, FR22.3, FR22.1) -----------------------------------

// PlantInfo is one plant as returned by every plant RPC below.
message PlantInfo {
  int64 plant_id = 1;
  // Current region (the open plant_region_history interval's region_id).
  int64 region_id = 2;
  int64 plant_type_id = 3;
  string name = 4;
  Instant created_at = 5;
  // Set only when this plant has been retired (FR22.1, FR22.3), alongside
  // the response envelope's server_now (FR64).
  Instant retired_at = 6;
}

// NewPlantType is CreatePlantRequest's acquire-and-place payload (FR55,
// SB-1.10): always creates a household-owned type -- scoped to the same
// household the plant's region resolves to -- never a global type; there is
// no elevation path through this message.
message NewPlantType {
  string common_name = 1;
  optional string species = 2;
}

message CreatePlantRequest {
  int64 region_id = 1;
  // Exactly one of plant_type_id (an existing type -- global or the
  // caller's own household-owned) or new_plant_type must be set.
  // new_plant_type is SB-1.10's acquire-and-place: creates the
  // household-owned type and the plant in one transaction, with no elevated
  // principal anywhere in the call. Implementation phase wires the
  // CreatePlant handler to branch on which is set -- see
  // leaflab/api/plant_types.go's doc comment.
  oneof plant_type {
    int64 plant_type_id = 2;
    NewPlantType new_plant_type = 4;
  }
  string name = 3;
}

message CreatePlantResponse {
  PlantInfo plant = 1;
}

// CorrectPlantRequest fixes a plant's name and/or plant type (FR24) --
// deliberately has no region field: correcting a typo is not moving a
// plant. Unset optional fields are left unchanged.
message CorrectPlantRequest {
  int64 plant_id = 1;
  optional string name = 2;
  optional int64 plant_type_id = 3;
}

message CorrectPlantResponse {
  PlantInfo plant = 1;
}

// MovePlantRequest relocates a plant to a new region (FR54, FR19) --
// deliberately has no name/plant_type field: moving a plant does not
// rename it. See MovePlant's RPC comment for the SCD2 write shape.
message MovePlantRequest {
  int64 plant_id = 1;
  int64 region_id = 2;
}

message MovePlantResponse {
  PlantInfo plant = 1;
}

message RetirePlantRequest {
  int64 plant_id = 1;
}

message RetirePlantResponse {
  PlantInfo plant = 1;
}

message GetPlantRequest {
  int64 plant_id = 1;
}

message GetPlantResponse {
  // True if plant_id names a real plant. A false response carries no other
  // populated field, same shape as GetRegionPathResponse.found.
  bool found = 1;
  PlantInfo plant = 2;
}

message ListPlantsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListPlantsResponse {
  repeated PlantInfo plants = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

// PlacementInterval is one plant_region_history row (FR19).
message PlacementInterval {
  int64 region_id = 1;
  Instant valid_from = 2;
  // Unset (has_valid_to() == false) means this interval is still open --
  // the plant's current placement.
  Instant valid_to = 3;
  // FR24: true only when this interval was opened by a region-lifecycle
  // relocation (FR74), never by a plain MovePlant. Always false until
  // FR74's sibling task starts writing it.
  bool relocation_induced = 4;
}

message GetPlantPlacementTimelineRequest {
  int64 plant_id = 1;
}

message GetPlantPlacementTimelineResponse {
  // True if plant_id names a real plant. A false response carries no other
  // populated field, same shape as GetRegionPathResponse.found.
  bool found = 1;
  // Ordered oldest-to-newest (ORDER BY valid_from).
  repeated PlacementInterval intervals = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

// --- Plant types (FR55, A24) -----------------------------------------------

// PlantTypeInfo is one plant_type row as returned by every plant-type RPC
// below.
message PlantTypeInfo {
  int64 plant_type_id = 1;
  string common_name = 2;
  optional string species = 3;
  // Unset (has_household_id() == false) means this is a global row --
  // readable by any authenticated principal. Set names the owning
  // household -- FR55's "distinguishably" requirement: a caller with a
  // "Boston fern" of their own and a global "Boston fern" sees both,
  // distinguished by this field.
  optional int64 household_id = 4;
  // Set only when this type has been retired (FR22.1), alongside the
  // response envelope's server_now (FR64).
  Instant retired_at = 5;
}

message ListPlantTypesRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListPlantTypesResponse {
  // Global rows plus the caller's own household-owned rows (FR55) --
  // never another household's owned rows.
  repeated PlantTypeInfo plant_types = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time (FR64) -- see ListBoardsResponse.server_now.
  Instant server_now = 3;
}

message CreatePlantTypeRequest {
  string common_name = 1;
  optional string species = 2;
  // False (the default) requests a household-owned type, scoped to the
  // caller's own household (FR7 member-or-grantee, no elevation) -- same
  // "exactly one current membership, or refused" rule CreateRegion's
  // root-region case uses, since this message carries no household field
  // of its own. True requests a global type (household_id unset on the
  // response) -- requires FR10 elevation, audited with a null target
  // household.
  bool global = 3;
}

message CreatePlantTypeResponse {
  PlantTypeInfo plant_type = 1;
}

message RenamePlantTypeRequest {
  int64 plant_type_id = 1;
  string common_name = 2;
}

message RenamePlantTypeResponse {
  PlantTypeInfo plant_type = 1;
}

message RetirePlantTypeRequest {
  int64 plant_type_id = 1;
}

message RetirePlantTypeResponse {
  PlantTypeInfo plant_type = 1;
}

// --- Plant-type bands (FR58, FR27's band criterion) ------------------------
//
// V1 stores and renders bands only -- no evaluation, no notification (this
// task's issue text). Nothing in this section, or in any handler backing
// it, is permitted to write an alert/notification row or fire anything;
// see leaflab/api/plant_type_bands.go's Implementation-phase doc comment
// for the enforcement of that boundary.

// PlantTypeBandSpec is one band -- e.g. "low", "ideal", "high" -- within one
// (plant_type_id, sensor_type_id) pair's band set. min_value/max_value unset
// means unbounded on that side (migration 035's NULL columns); sort_order is
// the band-walk order Implementation-phase resolution uses, not necessarily
// numeric range order (though V1's only defined rule -- bands must not
// overlap -- means the two coincide in practice).
message PlantTypeBandSpec {
  string band_label = 1;
  optional double min_value = 2;
  optional double max_value = 3;
  int32 sort_order = 4;
}

// SetPlantTypeBandsRequest replaces the full band set for
// (plant_type_id, sensor_type_id) -- not a delta/patch. sensor_type_id
// names the measurement type these bands apply to (the same column
// GetReadingSeriesRequest/CurrentValue call measurement_type_id on the
// wire elsewhere on this surface; this RPC set names it after the
// plant_type_band.sensor_type_id column it writes directly, per this
// task's issue text).
message SetPlantTypeBandsRequest {
  int64 plant_type_id = 1;
  int64 sensor_type_id = 2;
  repeated PlantTypeBandSpec bands = 3;
}

message SetPlantTypeBandsResponse {
  // The band set as stored, ordered by sort_order -- echoes back what
  // SetPlantTypeBandsRequest.bands just replaced.
  repeated PlantTypeBandSpec bands = 1;
}

message GetPlantTypeBandsRequest {
  int64 plant_type_id = 1;
  // Zero means unfiltered -- every measurement type this plant type has
  // bands configured for.
  int64 sensor_type_id = 2;
}

// PlantTypeMeasurementBands is one measurement type's band set within a
// GetPlantTypeBandsResponse -- one entry per sensor_type_id the plant type
// has any bands configured for.
message PlantTypeMeasurementBands {
  int64 sensor_type_id = 1;
  // Ordered by sort_order.
  repeated PlantTypeBandSpec bands = 2;
}

message GetPlantTypeBandsResponse {
  // Empty when the plant type has no bands configured for the requested
  // scope -- not an error (this task's Testing criterion: "A plant type
  // with no bands returns values with no band field, not an error").
  repeated PlantTypeMeasurementBands measurement_bands = 1;
}

// --- Admin (FR10, FR12 activation) --------------------------------------
//
// leaflab-admin is eligibility only (auth.go's RoleAdmin) -- these messages
// back the two admin lanes: ResolveToHousehold (FR10.2's standing,
// resolution-only lane) and Elevate/RenewElevation/EndElevation/
// GetElevationStatus (FR10.1's time-boxed, reasoned, per-household
// elevation). No RPC outside this section, and no field on any message
// above, is reachable by an admin acting under either lane -- every other
// admin read and every admin write resolves its scope through
// ElevatedScope (leaflab/api/authz), which refuses without an unexpired
// elevation against the specific target household named in the request.

// ResolveToHouseholdRequest names exactly one query term. A caller
// supplies exactly one oneof field -- never a combination -- per FR10.2's
// "a person, a support reference, or a partial device identifier".
message ResolveToHouseholdRequest {
  oneof query {
    // A person identifier (e.g. an email or a principal subject) to
    // resolve to their current household.
    string person_identifier = 1;
    // An FR80 support reference. Resolution is stubbed until FR80 lands.
    string support_reference = 2;
    // A partial device identifier to resolve to the household owning the
    // matching board(s).
    string partial_device_id = 3;
  }
}

// AdminBoardHealth is FR79's health-field projection for the standing
// lane: device id, board display name, household identity, last-seen age,
// active version, outstanding push, sensor count -- and **nothing else**.
// Readings, region/plant structure, config payloads and audit rows are
// never reachable through this message; a wider message with those fields
// left unset is deliberately not reused here (FR10.2).
message AdminBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name field
  // exists elsewhere in the schema.
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ResolveToHouseholdResponse.server_now (FR64), same convention
  // as BoardInfo.last_seen_at.
  Instant last_seen_at = 5;
  // Highest config version currently accepted by this board.
  uint64 active_version = 6;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 7;
  int32 sensor_count = 8;
}

// ResolveToHouseholdResponse is its own message type, not a narrowed reuse
// of a wider board/household response -- see AdminBoardHealth's doc
// comment. A query that resolves to no household returns zero boards, not
// an error (mirrors ListBoards's empty-list-not-error convention) --
// distinguishing "no match" from "match, no reach" is exactly the
// existence oracle NFR2 forbids elsewhere, and the standing lane must not
// reintroduce it.
message ResolveToHouseholdResponse {
  repeated AdminBoardHealth boards = 1;
  // Server's current time, so a caller renders last_seen_at as elapsed
  // time without trusting its own clock (FR64).
  Instant server_now = 2;
}

// ElevateRequest opens an elevation against target_household_id.
// reason is required and non-empty (FR10.1).
message ElevateRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message ElevateResponse {
  // Absolute expiry instant (60 minutes out, configurable) -- render
  // remaining time against the caller's own clock, or prefer
  // GetElevationStatus's server_now-paired pair while elevated (A22).
  Instant expires_at = 1;
}

// RenewElevationRequest extends an already-open elevation.
// reason must be **restated** -- an empty reason, or no elevation
// currently open for target_household_id, is refused.
message RenewElevationRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message RenewElevationResponse {
  Instant expires_at = 1;
}

message EndElevationRequest {
  int64 target_household_id = 1;
}

message EndElevationResponse {}

message GetElevationStatusRequest {
  int64 target_household_id = 1;
}

// GetElevationStatusResponse reports whether an unexpired elevation is
// currently open against target_household_id (A22 -- "its remaining time
// is readable while elevated"). expires_at is meaningful only when
// elevated is true; a caller computes remaining time as
// expires_at - server_now, never against its own clock alone (FR64).
message GetElevationStatusResponse {
  bool elevated = 1;
  Instant expires_at = 2;
  Instant server_now = 3;
}
// --- Bounded read path (FR25, FR27, FR28, NFR3.2) -----------------------

// EntityRef names one entity a readings RPC answers about -- a sensor,
// board, region or plant (FR25.1). Exactly one field is set; a request
// with none or more than one set is rejected (Implementation phase).
// Mirrors leaflab/api/authz.EntityRef's kind set minus EntityReading
// (a reading is never itself the subject of a readings query).
message EntityRef {
  oneof entity {
    int64 sensor_id = 1;
    int64 board_id = 2;
    int64 region_id = 3;
    int64 plant_id = 4;
  }
}

// TimeWindow is the explicitly bounded [start, end) range every readings
// request carries (FR25.1). NFR3.2's server-enforced maximum range and
// result cap are applied against this window server-side -- an unbounded
// window (start or end unset) is rejected, never served as a scan.
message TimeWindow {
  Instant start = 1;
  Instant end = 2;
}

// Granularity is the wire form of leaflab/api/tiers.Tier -- a
// caller-requested hint, not a contract (FR71): the server may coarsen,
// and every response names which value of this enum actually answered.
enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  GRANULARITY_RAW = 1;
  GRANULARITY_FIVE_MINUTE = 2;
  GRANULARITY_HOURLY = 3;
}

// ReadingPoint is one bucket in a series: a single raw reading (TierRaw)
// or one pre-aggregated bucket (TierFiveMinute/TierHourly). value_min/
// value_max/value_avg/reading_count are meaningful only for an aggregated
// tier; a raw point carries value_min == value_max == value_avg == value
// and reading_count == 1 (Implementation phase fills in this shape).
message ReadingPoint {
  Instant recorded_at = 1;
  double value = 2;
  double value_min = 3;
  double value_max = 4;
  double value_avg = 5;
  int64 reading_count = 6;
  // True when this point is an FR20 boundary_partial substitution for a
  // bucket straddled by a plant-attribution boundary, rather than an
  // ordinary tier bucket.
  bool boundary_partial = 7;
}

message GetReadingSeriesRequest {
  EntityRef entity = 1;
  TimeWindow window = 2;
  // Filters the series by measurement type -- sensor.sensor_type_id
  // (FR25.2). Zero means unfiltered.
  int64 measurement_type_id = 3;
  // A hint, not a contract (FR71) -- see Granularity.
  Granularity requested_granularity = 4;
  // Keyset page request (FR61), ordered on (recorded_at DESC, reading_id)
  // at the raw tier.
  PageRequest page = 5;
}

message GetReadingSeriesResponse {
  repeated ReadingPoint points = 1;
  // Which tier actually answered (FR71) -- always set, regardless of
  // requested_granularity.
  Granularity tier = 2;
  // True when tier is coarser than requested_granularity (FR71's
  // disclosure requirement).
  bool coarsened = 3;
  PageResponse page = 4;
  Instant server_now = 5;
}

message GetCurrentValuesRequest {
  EntityRef entity = 1;
}

// Band is FR58's band descriptor, carried alongside a current value.
// Scaffolded here as an empty field -- Phase 5 populates it. Leaving the
// field on the response now means FR27's "carries the FR58 band alongside
// the value" does not require a wire-breaking change later.
message Band {
  string label = 1;
}

message CurrentValue {
  int64 sensor_id = 1;
  int64 measurement_type_id = 2;
  double value = 3;
  Instant recorded_at = 4;
  // Populated starting Phase 5 (FR58). Unset until then.
  Band band = 5;
}

// CurrentPlantValue is one plant's current value set -- every sensor
// value from the plant's attributing region (FR23), read from raw
// (FR27), never a pre-aggregated tier.
message CurrentPlantValue {
  int64 plant_id = 1;
  repeated CurrentValue values = 2;
}

message GetCurrentValuesResponse {
  // Populated when the request named a sensor, board or region.
  repeated CurrentValue values = 1;
  // Populated when the request named a plant (FR23 attribution).
  repeated CurrentPlantValue plant_values = 2;
  Instant server_now = 3;
}

// PeriodSummary is one measurement type's min/max/average over a period,
// computed server-side (FR28), exact at the hourly tier for min and max
// (FR71).
message PeriodSummary {
  int64 measurement_type_id = 1;
  double min = 2;
  double max = 3;
  double avg = 4;
  Instant min_at = 5;
  Instant max_at = 6;
}

message GetPeriodSummaryRequest {
  int64 region_id = 1;
  TimeWindow period = 2;
  // Zero means unfiltered -- one PeriodSummary per measurement type
  // present in the period.
  int64 measurement_type_id = 3;
}

message GetPeriodSummaryResponse {
  repeated PeriodSummary summaries = 1;
  // The same measurement's overnight-low/daytime-high framing, computed
  // server-side from the household's (or the server's -- Implementation
  // phase states which) configured day boundary, never a client
  // convention.
  PeriodSummary overnight_low = 2;
  PeriodSummary daytime_high = 3;
  // IANA timezone name the day boundary was computed against.
  string timezone = 4;
  // Which tier answered (FR71) -- the hourly tier where the period
  // allows; coarsening beyond that is disclosed the same as any other
  // read-path RPC.
  Granularity tier = 5;
  Instant server_now = 6;
}

message CompareSeriesRequest {
  // Two or more entities compared over one shared window and one
  // measurement (FR25.3).
  repeated EntityRef entities = 1;
  TimeWindow window = 2;
  int64 measurement_type_id = 3;
  Granularity requested_granularity = 4;
  PageRequest page = 5;
}

message EntitySeries {
  EntityRef entity = 1;
  repeated ReadingPoint points = 2;
}

message CompareSeriesResponse {
  repeated EntitySeries series = 1;
  Granularity tier = 2;
  bool coarsened = 3;
  PageResponse page = 4;
  Instant server_now = 5;
}
