syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// ============================================================================
// Error handling
// ============================================================================

// FailureClass is a machine-readable classification of API failures, allowing
// callers to branch on error type without parsing prose. Intended to be used
// in an ErrorDetail attached to gRPC status details.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  
  // A required input field is missing or invalid.
  FAILURE_CLASS_INVALID_ARGUMENT = 1;
  
  // The operation cannot be performed because it would violate an
  // invariant (e.g., renaming an entity to a name that is already taken,
  // or operating on a board that doesn't exist). Includes "refuse before
  // writing" failures.
  FAILURE_CLASS_PRECONDITION = 2;
  
  // An internal system error (database, MQTT, etc.).
  FAILURE_CLASS_INTERNAL = 3;
}

// ErrorDetail carries structured machine-readable failure information
// alongside a gRPC status, so a caller can classify failures without
// parsing the human-readable message string.
message ErrorDetail {
  FailureClass failure_class = 1;
  
  // The entity that the failure relates to (e.g., "board", "device_config").
  // Machine-readable; used to construct or context in UI/logs.
  string entity = 2;
  
  // The field within the entity that caused or is affected by the failure.
  // Empty if the failure is about the entity as a whole.
  string field = 3;
  
  // A key to look up the human-readable failure description from a message
  // catalog. Allows non-technical surfaces to render personalized prose
  // without receiving status codes, proto field names, or stack traces.
  // Format: "MESSAGE_KEY_LIKE_THIS" or similar, resolved by the UI layer.
  string message_key = 4;
}

// ============================================================================
// Sensor identity changes (FR17)
// ============================================================================

// SensorIdentityChange announces a new sensor identity creation with its
// consequence and the rewire path as an alternative (FR17).
// This detail is attached to a gRPC status response before any write occurs,
// allowing callers to understand the impact and choose the rewire path if needed.
message SensorIdentityChange {
  // sensor_name is the name that will identify the new sensor.
  string sensor_name = 1;
  
  // hardware_key_description is a human-readable description of the new sensor's
  // hardware key (i2c_address, mux_path, sensor_type).
  string hardware_key_description = 2;
  
  // history_will_not_follow is a structured message indicating that this
  // new identity has no predecessor: name_history, hw_history, and region_history
  // will all start fresh at this change point. Existing readings under an old
  // identity will not be carried forward.
  bool history_will_not_follow = 3;
  
  // suggested_rewire_path is the canonical hardware key of an existing sensor
  // with the same hardware signature but different name, if one exists.
  // If set, the caller can use this as the target of a rewire operation
  // (changing the sensor's name without changing its identity).
  string suggested_rewire_path = 4;
}

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  // 
  // If the push would create a new sensor identity (FR17), an ErrorDetail with
  // FailureClass PRECONDITION is returned as a status detail before any write,
  // containing SensorIdentityChange to announce the consequence and suggest
  // the rewire path as an alternative.
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Get the three aligned timelines (name, hardware, region) for a sensor.
  // All three timelines use the same valid_from/valid_to interval structure;
  // their intervals align on change points, allowing efficient point-in-time queries.
  // A sensor dropped from desired state keeps all three timelines.
  rpc GetSensorTimelines(GetSensorTimelinesRequest) returns (GetSensorTimelinesResponse);

  // Health returns the service health status without requiring authentication.
  // It returns up or degraded and no other details.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListActivity returns the activity log for the caller's household (FR9).
  // Household scope is implicit, derived from caller's identity per FR5.
  // Each record is rendered as plain-language sentences with no proto/table/column names.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);

  // ── Plant lifecycle (FR54, FR24, FR22.3, FR22.5) ────────────────────────

  // CreatePlant creates a plant and places it in a region in one operation
  // (acquire-and-place). Placement is written through FR19's SCD2 path
  // (plant_region_history) as the plant's first, never-closed interval. The
  // target region must belong to the caller's household (FR1.2); a region in
  // another household is refused.
  rpc CreatePlant(CreatePlantRequest) returns (CreatePlantResponse);

  // CorrectPlant fixes a typo in the plant's name or corrects a
  // misidentified plant type (FR24). This is distinct from a move: it does
  // not touch plant_region_history and does not open a new placement
  // interval. The response states that a correction, not a move, was
  // performed.
  rpc CorrectPlant(CorrectPlantRequest) returns (CorrectPlantResponse);

  // MovePlant moves a plant to a new region (FR54, FR24). Per FR19's SCD2
  // path, this closes the plant's current plant_region_history interval and
  // opens a new one; nothing is updated in place. Back-dating is refused
  // (FR19/FR21). The target region must belong to the caller's household
  // (FR1.2). The response states that a move, not a correction, was
  // performed.
  rpc MovePlant(MovePlantRequest) returns (MovePlantResponse);

  // RetirePlant soft-retires a plant (FR22.5). A retired plant is excluded
  // from default listings and accepts no new writes, but remains readable by
  // explicit id and through its placement timeline and readings (FR22.3).
  // Nothing is hard-deleted (FR22.1). The response names the acting
  // principal (FR8) and the operation that retired the plant.
  rpc RetirePlant(RetirePlantRequest) returns (RetirePlantResponse);

  // GetPlantPlacementTimeline returns a plant's full placement history
  // (FR19 SCD2 intervals). Each entry states whether it was a
  // relocation-induced placement change (caused by a subtree relocation,
  // FR74/#1223) or a plant-initiated move, so the timeline distinguishes
  // "this plant moved" from "the region this plant was in moved" (FR24).
  // Readable for a retired plant (FR22.3, FR22.5).
  rpc GetPlantPlacementTimeline(GetPlantPlacementTimelineRequest) returns (GetPlantPlacementTimelineResponse);
}

// ============================================================================
// Pagination
// ============================================================================

// PageRequest carries opaque keyset pagination state for list operations.
// The page_token is never an offset encoding and does not round-trip
// caller-controlled SQL. The server clamped page_size; a request for more
// than the cap is silently reduced, not errored.
message PageRequest {
  int32 page_size = 1;   // 0 means server default; server clamps to max
  string page_token = 2; // opaque, never an offset; "" for first page
}

// PageResponse carries the next page token and total item count.
message PageResponse {
  string next_page_token = 1; // opaque; "" means no more pages
  int32 total_size = 2;       // total count of items (for progress display)
}

// ============================================================================
// Messages
// ============================================================================

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // recorded_at is an absolute instant (Unix timestamp in seconds) when
  // this board last sent a manifest. Callers rendering elapsed time should
  // compute this plus their own local time to show "last seen N minutes ago",
  // not present a raw UTC string to end users.
  int64 recorded_at = 3;
}

message ListBoardsRequest {
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  PageResponse page = 2;
}

// ============================================================================
// Sensor timelines (FR53)
// ============================================================================

// SensorNameEntry represents one interval in a sensor's name history.
message SensorNameEntry {
  string name = 1;
  // valid_from is the Unix timestamp (seconds) when this name became active.
  int64 valid_from = 2;
  // valid_to is the Unix timestamp (seconds) when this name was superseded.
  // Null (0) means this is the current name.
  int64 valid_to = 3;
}

// SensorHardwareEntry represents one interval in a sensor's hardware history.
// It carries the full canonical hardware key: (i2c_address, mux_path, sensor_type).
message SensorHardwareEntry {
  // i2c_address is the I2C address of this sensor during this interval.
  // 0 means not recorded (pre-migration 013).
  uint32 i2c_address = 1;
  // mux_path is the JSONB-encoded cascaded mux chain [{"muxAddress":..,"muxChannel":..}, ...].
  // Empty string means sensor is directly on the root I2C bus.
  string mux_path = 2;
  // sensor_type is the firmware.SensorType enum value (e.g., SENSOR_TYPE_SHT3X).
  int32 sensor_type = 3;
  // valid_from is the Unix timestamp (seconds) when this hardware configuration became active.
  int64 valid_from = 4;
  // valid_to is the Unix timestamp (seconds) when this configuration was superseded.
  // Null (0) means this is the current configuration.
  int64 valid_to = 5;
}

// SensorRegionEntry represents one interval in a sensor's region history.
message SensorRegionEntry {
  // region_id is the ID of the region this sensor was assigned to.
  // 0 means no region (not yet assigned).
  int64 region_id = 1;
  // region_name is the human-readable name of the region during this interval.
  // Empty if region_id is 0.
  string region_name = 2;
  // valid_from is the Unix timestamp (seconds) when this region assignment became active.
  int64 valid_from = 3;
  // valid_to is the Unix timestamp (seconds) when this region assignment was superseded.
  // Null (0) means this is the current region assignment.
  int64 valid_to = 4;
}

// SensorTimelines holds the three aligned timelines for a sensor (FR53).
message SensorTimelines {
  int64 sensor_id = 1;
  repeated SensorNameEntry name_timeline = 2;
  repeated SensorHardwareEntry hardware_timeline = 3;
  repeated SensorRegionEntry region_timeline = 4;
}

message GetSensorTimelinesRequest {
  int64 sensor_id = 1;
}

message GetSensorTimelinesResponse {
  SensorTimelines timelines = 1;
}

message HealthRequest {}

message HealthResponse {
  // Status is the health status.
  enum Status {
    UNKNOWN = 0;
    UP = 1;
    DEGRADED = 2;
  }
  Status status = 1;
}

// PlantInfo represents a plant and its metadata for attribution disclosure.
message PlantInfo {
  int64  plant_id     = 1;
  string plant_name   = 2;
  int64  plant_type_id = 3;
}

// ReadingAttribution resolves a reading to the nearest ancestor region holding
// active plants at the reading's timestamp, and the set of all active plants in
// that region (sibling disclosure). Used by FR23.
message ReadingAttribution {
  // The nearest ancestor region (including the reading's own region) holding
  // at least one active plant at the reading time.
  int64  attributed_region_id = 1;
  // All active plants in the attributed region at reading time.
  // Empty if no plants active in the attributed region.
  repeated PlantInfo active_plants = 2;
}
// ── FR9: Owner-readable activity listing ──────────────────────────────────

// ListActivityRequest asks for the activity log for a household.
// Household scope is implicit (derived from caller's identity per FR5).
// Pagination follows FR61.
message ListActivityRequest {
  // page_token: an opaque string identifying the position in the result set.
  // Empty or omitted for the first page.
  string page_token = 1;
  // page_size: the maximum number of activity items to return.
  // Default and maximum bounds TBD per FR61.
  int32 page_size = 2;
}

// ActivityItem represents one action in the household's audit log.
// Every field is rendered as plain language by the service; no proto or DB schema leaks.
message ActivityItem {
  // description: a complete plain-language sentence describing the action.
  // Examples:
  //   "Your board 'Grow Light' was claimed on Aug 25 at 2:30 PM"
  //   "Helper Alice was granted access to 'Grow Light' on Aug 25 at 2:45 PM"
  //   "Admin (elevated) reconfigured 'Humidity Sensor' on Aug 25 at 3:00 PM"
  // No technical field, proto, table or column names appear in this string.
  string description = 1;
  // timestamp: when this action occurred (for sorting, display).
  // Format TBD by UX (RFC3339, Unix timestamp, or similar).
  int64 timestamp = 2;
}

// ListActivityResponse returns a page of activity items.
message ListActivityResponse {
  repeated ActivityItem items = 1;
  // next_page_token: opaque pagination token for fetching the next page.
  // Empty if this is the last page.
  string next_page_token = 2;
}

// OpaqueEntityReference represents a foreign entity (owned by a different household)
// in a history response. It renders as an opaque placeholder — that an entity existed,
// and nothing about what it was, who owns it, or whether it still exists.
// This is symmetrical for both households: a household cannot resolve entities
// owned by another household, even in historical views.
message OpaqueEntityReference {
  // Entity type name (e.g., "region", "plant", "board") — visible to indicate
  // what kind of entity crossed a household boundary, but not resolvable.
  string entity_type = 1;
  // The foreign entity_id — not resolvable within the current household context.
  int64 entity_id = 2;
}

// ============================================================================
// Plant lifecycle (FR54, FR24, FR22.3, FR22.5)
// ============================================================================

// CreatePlantRequest creates a plant and places it in a region in one
// operation (acquire-and-place, FR54). plant_type_id must reference an
// existing plant_type row. region_id must belong to the caller's household
// (FR1.2); a region in another household is refused.
message CreatePlantRequest {
  string name = 1;
  int64  plant_type_id = 2;
  int64  region_id = 3;
}

message CreatePlantResponse {
  int64 plant_id = 1;
}

// CorrectPlantRequest fixes a typo in the plant's name or corrects a
// misidentified plant type (FR24). At least one of corrected_name /
// corrected_plant_type_id must be set. This does not open a placement
// interval in plant_region_history — it is a correction, not a move.
message CorrectPlantRequest {
  int64 plant_id = 1;
  // If non-empty, corrects the plant's name.
  string corrected_name = 2;
  // If non-zero, corrects the plant's plant_type_id.
  int64 corrected_plant_type_id = 3;
}

// CorrectPlantResponse confirms a correction was performed (not a move),
// per FR24's "the API states which is being performed".
message CorrectPlantResponse {
  int64 plant_id = 1;
}

// MovePlantRequest moves a plant to a new region (FR54). new_region_id must
// belong to the caller's household (FR1.2); a region in another household is
// refused. Back-dating is refused (FR19/FR21) — the new interval always
// opens at the instant the move is recorded.
message MovePlantRequest {
  int64 plant_id = 1;
  int64 new_region_id = 2;
}

// MovePlantResponse confirms a move was performed (not a correction), per
// FR24's "the API states which is being performed".
message MovePlantResponse {
  int64 plant_id = 1;
  int64 new_region_id = 2;
}

// RetirePlantRequest soft-retires a plant (FR22.5, FR22.1: nothing is
// hard-deleted).
message RetirePlantRequest {
  int64 plant_id = 1;
}

// RetirePlantResponse names the operation and the acting principal (FR8)
// that retired the plant, per FR22.5.
message RetirePlantResponse {
  int64  plant_id = 1;
  string retired_operation = 2;
  string retired_principal = 3;
  // retired_at is the Unix timestamp (seconds) the plant was retired.
  int64  retired_at = 4;
}

// PlantPlacementEntry represents one interval in a plant's placement history
// (plant_region_history, FR19 SCD2).
message PlantPlacementEntry {
  int64  region_id = 1;
  string region_name = 2;
  // valid_from is the Unix timestamp (seconds) this placement began.
  int64  valid_from = 3;
  // valid_to is the Unix timestamp (seconds) this placement was superseded.
  // Null (0) means this is the current placement.
  int64  valid_to = 4;
  // relocation_induced is true when this placement change was caused by a
  // subtree relocation (FR74, #1223) rather than a plant-initiated move.
  // Distinguishes "this plant moved" from "the region this plant was in
  // moved" (FR24).
  bool   relocation_induced = 5;
}

message GetPlantPlacementTimelineRequest {
  int64 plant_id = 1;
}

// GetPlantPlacementTimelineResponse returns the plant's full placement
// history, readable even for a retired plant (FR22.3, FR22.5).
message GetPlantPlacementTimelineResponse {
  int64 plant_id = 1;
  repeated PlantPlacementEntry placements = 2;
  // retired_at is the Unix timestamp (seconds) the plant was retired;
  // 0 means the plant is active.
  int64  retired_at = 3;
  string retired_operation = 4;
  string retired_principal = 5;
}

