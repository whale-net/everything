syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// ============================================================================
// Error handling
// ============================================================================

// FailureClass is a machine-readable classification of API failures, allowing
// callers to branch on error type without parsing prose. Intended to be used
// in an ErrorDetail attached to gRPC status details.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  
  // A required input field is missing or invalid.
  FAILURE_CLASS_INVALID_ARGUMENT = 1;
  
  // The operation cannot be performed because it would violate an
  // invariant (e.g., renaming an entity to a name that is already taken,
  // or operating on a board that doesn't exist). Includes "refuse before
  // writing" failures.
  FAILURE_CLASS_PRECONDITION = 2;
  
  // An internal system error (database, MQTT, etc.).
  FAILURE_CLASS_INTERNAL = 3;
}

// ErrorDetail carries structured machine-readable failure information
// alongside a gRPC status, so a caller can classify failures without
// parsing the human-readable message string.
message ErrorDetail {
  FailureClass failure_class = 1;
  
  // The entity that the failure relates to (e.g., "board", "device_config").
  // Machine-readable; used to construct or context in UI/logs.
  string entity = 2;
  
  // The field within the entity that caused or is affected by the failure.
  // Empty if the failure is about the entity as a whole.
  string field = 3;
  
  // A key to look up the human-readable failure description from a message
  // catalog. Allows non-technical surfaces to render personalized prose
  // without receiving status codes, proto field names, or stack traces.
  // Format: "MESSAGE_KEY_LIKE_THIS" or similar, resolved by the UI layer.
  string message_key = 4;
}

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Health returns the service health status without requiring authentication.
  // It returns up or degraded and no other details.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListActivity returns the activity log for the caller's household (FR9).
  // Household scope is implicit, derived from caller's identity per FR5.
  // Each record is rendered as plain-language sentences with no proto/table/column names.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);

  // CreateHousehold creates a new household with the caller as the initial member (FR75).
  rpc CreateHousehold(CreateHouseholdRequest) returns (CreateHouseholdResponse);

  // InviteMember invites a principal to join the household (FR75).
  // Only callable by members; the invited principal is added to membership.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);

  // RemoveMember removes a member from the household (FR75).
  // Only callable by members; fails if removing the last member.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // ListMembers lists all current members of the household (FR75).
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // CreateGrant creates a time-boxed grant for a principal (FR7).
  // Only callable by members; creates a revocable, expiring grant.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);

  // RevokeGrant revokes an active grant immediately (FR7).
  // Only callable by members.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);

  // ListActiveGrants lists all active (non-expired, non-revoked) grants (FR7).
  rpc ListActiveGrants(ListActiveGrantsRequest) returns (ListActiveGrantsResponse);

  // EnterElevation starts a 60-minute, time-boxed elevation against a named
  // target household with a stated reason (FR10). Required before any
  // non-standing admin read or any admin write against that household.
  rpc EnterElevation(EnterElevationRequest) returns (ElevationState);

  // RenewElevation extends the caller's active elevation against the same
  // target household by re-stating a reason (FR10). Fails if there is no
  // active elevation to renew.
  rpc RenewElevation(RenewElevationRequest) returns (ElevationState);

  // GetElevationState reads the caller's current elevation state against a
  // target household, including remaining time (FR10, A22).
  rpc GetElevationState(GetElevationStateRequest) returns (ElevationState);

  // Resolve is the admin standing lane (FR10): without elevation, resolve a
  // person, a support reference (FR80), or a partial device identifier to
  // the owning household, and return the FR79 health fields for its boards
  // and nothing else.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);

  // ListFleetHealth returns the FR79 fleet health listing: per board,
  // last-seen age against the A23 staleness threshold, active accepted
  // config version, outstanding push duration, and sensor count. Standing
  // lane; no computed health score or severity ranking.
  rpc ListFleetHealth(ListFleetHealthRequest) returns (ListFleetHealthResponse);

  // CreateSupportReference produces a short-lived, opaque, revocable support
  // reference for the caller's household (FR80). Requires no description of
  // the problem and discloses no household data.
  rpc CreateSupportReference(CreateSupportReferenceRequest) returns (CreateSupportReferenceResponse);

  // RevokeSupportReference revokes a support reference before it expires (FR80).
  rpc RevokeSupportReference(RevokeSupportReferenceRequest) returns (RevokeSupportReferenceResponse);
}

// ============================================================================
// Pagination
// ============================================================================

// PageRequest carries opaque keyset pagination state for list operations.
// The page_token is never an offset encoding and does not round-trip
// caller-controlled SQL. The server clamped page_size; a request for more
// than the cap is silently reduced, not errored.
message PageRequest {
  int32 page_size = 1;   // 0 means server default; server clamps to max
  string page_token = 2; // opaque, never an offset; "" for first page
}

// PageResponse carries the next page token and total item count.
message PageResponse {
  string next_page_token = 1; // opaque; "" means no more pages
  int32 total_size = 2;       // total count of items (for progress display)
}

// ============================================================================
// Messages
// ============================================================================

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // recorded_at is an absolute instant (Unix timestamp in seconds) when
  // this board last sent a manifest. Callers rendering elapsed time should
  // compute this plus their own local time to show "last seen N minutes ago",
  // not present a raw UTC string to end users.
  int64 recorded_at = 3;
}

message ListBoardsRequest {
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  PageResponse page = 2;
}

message HealthRequest {}

message HealthResponse {
  // Status is the health status.
  enum Status {
    UNKNOWN = 0;
    UP = 1;
    DEGRADED = 2;
  }
  Status status = 1;
}

// ── FR9: Owner-readable activity listing ──────────────────────────────────

// ListActivityRequest asks for the activity log for a household.
// Household scope is implicit (derived from caller's identity per FR5).
// Pagination follows FR61.
message ListActivityRequest {
  // page_token: an opaque string identifying the position in the result set.
  // Empty or omitted for the first page.
  string page_token = 1;
  // page_size: the maximum number of activity items to return.
  // Default and maximum bounds TBD per FR61.
  int32 page_size = 2;
}

// ActivityItem represents one action in the household's audit log.
// Every field is rendered as plain language by the service; no proto or DB schema leaks.
message ActivityItem {
  // description: a complete plain-language sentence describing the action.
  // Examples:
  //   "Your board 'Grow Light' was claimed on Aug 25 at 2:30 PM"
  //   "Helper Alice was granted access to 'Grow Light' on Aug 25 at 2:45 PM"
  //   "Admin (elevated) reconfigured 'Humidity Sensor' on Aug 25 at 3:00 PM"
  // No technical field, proto, table or column names appear in this string.
  string description = 1;
  // timestamp: when this action occurred (for sorting, display).
  // Format TBD by UX (RFC3339, Unix timestamp, or similar).
  int64 timestamp = 2;
}

// ListActivityResponse returns a page of activity items.
message ListActivityResponse {
  repeated ActivityItem items = 1;
  // next_page_token: opaque pagination token for fetching the next page.
  // Empty if this is the last page.
  string next_page_token = 2;
}

// OpaqueEntityReference represents a foreign entity (owned by a different household)
// in a history response. It renders as an opaque placeholder — that an entity existed,
// and nothing about what it was, who owns it, or whether it still exists.
// This is symmetrical for both households: a household cannot resolve entities
// owned by another household, even in historical views.
message OpaqueEntityReference {
  // Entity type name (e.g., "region", "plant", "board") — visible to indicate
  // what kind of entity crossed a household boundary, but not resolvable.
  string entity_type = 1;
  // The foreign entity_id — not resolvable within the current household context.
  int64 entity_id = 2;
}

// ── FR75: Household membership ───────────────────────────────────────────────

message CreateHouseholdRequest {
  // Name of the household (required).
  string name = 1;
}

message CreateHouseholdResponse {
  int64 household_id = 1;
}

message InviteMemberRequest {
  // Principal to invite (email or ID).
  string principal = 1;
  // Role for the invited member (e.g., "Member", "Owner", "Grower").
  string role = 2;
}

message InviteMemberResponse {}

message RemoveMemberRequest {
  // Principal to remove.
  string principal = 1;
}

message RemoveMemberResponse {}

message HouseholdMember {
  string principal = 1;
  string role = 2;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated HouseholdMember members = 1;
}

// ── FR7: Household grants ────────────────────────────────────────────────────

message CreateGrantRequest {
  // Principal to grant access to (email or ID).
  string grantee = 1;
  // Seconds from now when the grant expires.
  int64 duration_seconds = 2;
}

message CreateGrantResponse {
  int64 grant_id = 1;
}

message RevokeGrantRequest {
  int64 grant_id = 1;
}

message RevokeGrantResponse {}

message Grant {
  int64 grant_id = 1;
  string grantee = 2;
  int64 expires_at = 3;  // Unix timestamp when the grant expires
}

message ListActiveGrantsRequest {}

message ListActiveGrantsResponse {
  repeated Grant grants = 1;
}

// ── FR10: Admin elevation ─────────────────────────────────────────────────────
// Cross-household reach is not standing. Elevation is entered deliberately
// with a stated reason, is time-boxed (60 minutes), expires automatically,
// and stamps both admin subject and target household on every resulting
// write. Remaining time is readable while elevated (A22).

message EnterElevationRequest {
  int64 target_household_id = 1;
  // reason is required and non-empty.
  string reason = 2;
}

message RenewElevationRequest {
  int64 target_household_id = 1;
  // reason is required and non-empty; renewal is only permitted with a
  // freshly-stated reason, not a reuse of the original.
  string reason = 2;
}

message GetElevationStateRequest {
  int64 target_household_id = 1;
}

// ElevationState describes an admin's elevation against a target household,
// or the absence of one when active is false.
message ElevationState {
  bool active = 1;
  int64 target_household_id = 2;
  string reason = 3;
  // remaining_seconds is the time left before this elevation expires.
  // 0 when active is false.
  int64 remaining_seconds = 4;
  // expires_at is an absolute instant (Unix timestamp in seconds).
  int64 expires_at = 5;
}

// ── FR10: Admin standing lane — resolution only ───────────────────────────────
// Across all households, without elevation, an admin may resolve a person, a
// support reference (FR80), or a partial device identifier to the owning
// household, and read the FR79 health fields for the boards it returns.
// That is the whole lane.

message ResolveRequest {
  oneof target {
    // person: a household principal identifier (email or ID).
    string person = 1;
    // support_reference: an FR80 opaque support code.
    string support_reference = 2;
    // device_id_prefix: a partial device identifier.
    string device_id_prefix = 3;
  }
}

// ResolveResponse returns the resolved household and the FR79 health fields
// for the boards it owns — exactly those fields, nothing else.
message ResolveResponse {
  int64 household_id = 1;
  repeated BoardHealth boards = 2;
}

// ── FR79: Fleet health listing ─────────────────────────────────────────────────
// Per board: last-seen age evaluated against the A23 staleness threshold,
// active accepted config version, whether a push is outstanding and for how
// long, and sensor count. No computed health score or severity ranking.
// Retired boards (FR22.4) are excluded from offline counts.

message BoardHealth {
  string device_id = 1;
  int64 board_id = 2;
  // last_seen_age_seconds is how long since this board's last reading.
  int64 last_seen_age_seconds = 3;
  // reporting is false when last_seen_age_seconds exceeds the A23 threshold
  // for this board's longest configured poll interval.
  bool reporting = 4;
  int64 active_config_version = 5;
  // push_outstanding is true when a pushed config has not yet been accepted.
  bool push_outstanding = 6;
  // push_outstanding_seconds is how long the outstanding push has been
  // pending; 0 when push_outstanding is false.
  int64 push_outstanding_seconds = 7;
  int32 sensor_count = 8;
}

// ListFleetHealthRequest lists board health across the fleet (standing lane).
// Narrowable by device-id prefix, household, region and reporting state.
message ListFleetHealthRequest {
  string device_id_prefix = 1;
  // household_id: 0 means unfiltered.
  int64 household_id = 2;
  // region_id: 0 means unfiltered.
  int64 region_id = 3;
  // unhealthy_only restricts results to boards that are not reporting.
  bool unhealthy_only = 4;
  PageRequest page = 5;
}

message ListFleetHealthResponse {
  repeated BoardHealth boards = 1;
  PageResponse page = 2;
}

// ── FR80: Owner-initiated support request ─────────────────────────────────────
// A household member can produce a support reference: a short-lived, opaque,
// revocable code that resolves — for an admin, in the standing lane — to
// that household. Producing one requires no description of the problem and
// discloses no household data in itself. It is a short-lived token with
// expiry, not SCD2 (NFR6.3).

message CreateSupportReferenceRequest {}

message CreateSupportReferenceResponse {
  // reference is the opaque short code, disclosed to the household member.
  string reference = 1;
  // expires_at is an absolute instant (Unix timestamp in seconds).
  int64 expires_at = 2;
}

message RevokeSupportReferenceRequest {
  string reference = 1;
}

message RevokeSupportReferenceResponse {}
