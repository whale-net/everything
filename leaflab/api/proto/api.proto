syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Health returns the service health status without requiring authentication.
  // It returns up or degraded and no other details.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ListActivity returns the activity log for the caller's household (FR9).
  // Household scope is implicit, derived from caller's identity per FR5.
  // Each record is rendered as plain-language sentences with no proto/table/column names.
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);

  // CreateHousehold creates a new household with the caller as the initial member (FR75).
  rpc CreateHousehold(CreateHouseholdRequest) returns (CreateHouseholdResponse);

  // InviteMember invites a principal to join the household (FR75).
  // Only callable by members; the invited principal is added to membership.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);

  // RemoveMember removes a member from the household (FR75).
  // Only callable by members; fails if removing the last member.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // ListMembers lists all current members of the household (FR75).
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // CreateGrant creates a time-boxed grant for a principal (FR7).
  // Only callable by members; creates a revocable, expiring grant.
  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);

  // RevokeGrant revokes an active grant immediately (FR7).
  // Only callable by members.
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);

  // ListActiveGrants lists all active (non-expired, non-revoked) grants (FR7).
  rpc ListActiveGrants(ListActiveGrantsRequest) returns (ListActiveGrantsResponse);

  // ── FR50 / FR22.2 / NFR6.2: Region CRUD ────────────────────────────────

  // CreateRegion creates a new region (FR50). Member-or-grantee, not admin-only.
  // Parentage is set here and is immutable once any reading has been
  // attributed to the region or any descendant — see UpdateRegionParent.
  rpc CreateRegion(CreateRegionRequest) returns (CreateRegionResponse);

  // RenameRegion changes a region's display name (FR50). Member-or-grantee.
  // Never touches parentage, so it is never refused by the parentage-freeze
  // trigger (NFR6.2).
  rpc RenameRegion(RenameRegionRequest) returns (RenameRegionResponse);

  // ListRegions lists regions in the caller's household (FR50). Retired
  // regions are excluded by default (FR22.5); IncludeRetired opts back in.
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // GetRegion reads a single region by id, including a retired one (FR22.5:
  // \"still readable by explicit id\"). Returns the root-to-leaf path (FR50.2).
  rpc GetRegion(GetRegionRequest) returns (GetRegionResponse);

  // UpdateRegionParent re-parents a region while no reading exists anywhere in
  // its subtree — in practice a create-time grace window for a mis-typed
  // parent, not a re-parenting capability (FR50.3). Once any reading has been
  // attributed to the region or a descendant, the database trigger refuses
  // the change (NFR6.2) and the refusal names subtree relocation, FR74
  // (#1223), as the alternative (FR59.3).
  rpc UpdateRegionParent(UpdateRegionParentRequest) returns (UpdateRegionParentResponse);

  // RetireRegion soft-retires a region (FR22.2, FR22.5). A retired region
  // remains resolvable for attribution of readings recorded while it was
  // active; its parentage remains immutable; it is excluded from default
  // listings and accepts no new writes. Retirement does not unfreeze
  // parentage. An optional successor_region_id names the region that replaced
  // it when retirement is the result of a relocation (FR74), so
  // region-keyed series join across the reorganisation.
  rpc RetireRegion(RetireRegionRequest) returns (RetireRegionResponse);
}


message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
}

message ListBoardsRequest {}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
}

message HealthRequest {}

message HealthResponse {
  // Status is the health status.
  enum Status {
    UNKNOWN = 0;
    UP = 1;
    DEGRADED = 2;
  }
  Status status = 1;
}

// ── FR9: Owner-readable activity listing ──────────────────────────────────

// ListActivityRequest asks for the activity log for a household.
// Household scope is implicit (derived from caller's identity per FR5).
// Pagination follows FR61.
message ListActivityRequest {
  // page_token: an opaque string identifying the position in the result set.
  // Empty or omitted for the first page.
  string page_token = 1;
  // page_size: the maximum number of activity items to return.
  // Default and maximum bounds TBD per FR61.
  int32 page_size = 2;
}

// ActivityItem represents one action in the household's audit log.
// Every field is rendered as plain language by the service; no proto or DB schema leaks.
message ActivityItem {
  // description: a complete plain-language sentence describing the action.
  // Examples:
  //   "Your board 'Grow Light' was claimed on Aug 25 at 2:30 PM"
  //   "Helper Alice was granted access to 'Grow Light' on Aug 25 at 2:45 PM"
  //   "Admin (elevated) reconfigured 'Humidity Sensor' on Aug 25 at 3:00 PM"
  // No technical field, proto, table or column names appear in this string.
  string description = 1;
  // timestamp: when this action occurred (for sorting, display).
  // Format TBD by UX (RFC3339, Unix timestamp, or similar).
  int64 timestamp = 2;
}

// ListActivityResponse returns a page of activity items.
message ListActivityResponse {
  repeated ActivityItem items = 1;
  // next_page_token: opaque pagination token for fetching the next page.
  // Empty if this is the last page.
  string next_page_token = 2;
}

// OpaqueEntityReference represents a foreign entity (owned by a different household)
// in a history response. It renders as an opaque placeholder — that an entity existed,
// and nothing about what it was, who owns it, or whether it still exists.
// This is symmetrical for both households: a household cannot resolve entities
// owned by another household, even in historical views.
message OpaqueEntityReference {
  // Entity type name (e.g., "region", "plant", "board") — visible to indicate
  // what kind of entity crossed a household boundary, but not resolvable.
  string entity_type = 1;
  // The foreign entity_id — not resolvable within the current household context.
  int64 entity_id = 2;
}

// ── FR75: Household membership ───────────────────────────────────────────────

message CreateHouseholdRequest {
  // Name of the household (required).
  string name = 1;
}

message CreateHouseholdResponse {
  int64 household_id = 1;
}

message InviteMemberRequest {
  // Principal to invite (email or ID).
  string principal = 1;
  // Role for the invited member (e.g., "Member", "Owner", "Grower").
  string role = 2;
}

message InviteMemberResponse {}

message RemoveMemberRequest {
  // Principal to remove.
  string principal = 1;
}

message RemoveMemberResponse {}

message HouseholdMember {
  string principal = 1;
  string role = 2;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated HouseholdMember members = 1;
}

// ── FR7: Household grants ────────────────────────────────────────────────────

message CreateGrantRequest {
  // Principal to grant access to (email or ID).
  string grantee = 1;
  // Seconds from now when the grant expires.
  int64 duration_seconds = 2;
}

message CreateGrantResponse {
  int64 grant_id = 1;
}

message RevokeGrantRequest {
  int64 grant_id = 1;
}

message RevokeGrantResponse {}

message Grant {
  int64 grant_id = 1;
  string grantee = 2;
  int64 expires_at = 3;  // Unix timestamp when the grant expires
}

message ListActiveGrantsRequest {}

message ListActiveGrantsResponse {
  repeated Grant grants = 1;
}

// ── FR50 / FR22.2 / NFR6.2: Region CRUD ──────────────────────────────────────

message CreateRegionRequest {
  // Display name (required).
  string name = 1;
  // Parent region id. 0 (unset) means this is a root region.
  // Set at create time only; immutable once any reading is attributed to
  // the region or a descendant (FR50.3, NFR6.2).
  int64 parent_region_id = 2;
  string description = 3;
}

message CreateRegionResponse {
  int64 region_id = 1;
}

message RenameRegionRequest {
  int64 region_id = 1;
  string name = 2;
}

message RenameRegionResponse {}

message ListRegionsRequest {
  // include_retired: when false (default), retired regions are excluded
  // (FR22.5). When true, retired regions are included, each carrying its
  // retirement state.
  bool include_retired = 1;
}

// RegionInfo carries a region's root-to-leaf path so a nested picker and a
// breadcrumb have a source (FR50.2), plus its retirement state (FR22.5).
message RegionInfo {
  int64 region_id = 1;
  string name = 2;
  int64 parent_region_id = 3;  // 0 means root
  // path_names: root-to-leaf display names, e.g. ["Grow Tent", "Shelf 2", "Pot 4"].
  repeated string path_names = 4;
  // retired_at: Unix timestamp the region was retired, or 0 if active (FR22.5).
  int64 retired_at = 5;
  // retired_operation: the operation that set the retired state (FR22.5), e.g. "retire_region".
  string retired_operation = 6;
  // retired_principal: the acting principal that retired this region (FR8, FR22.5).
  string retired_principal = 7;
  // successor_region_id: set only when this region was retired by a relocation
  // (FR74) — names the region that replaced it, so region-keyed series join
  // across the reorganisation. 0 means no successor.
  int64 successor_region_id = 8;
}

message ListRegionsResponse {
  repeated RegionInfo regions = 1;
}

message GetRegionRequest {
  int64 region_id = 1;
}

message GetRegionResponse {
  RegionInfo region = 1;
}

// UpdateRegionParentRequest re-parents a region. This is only ever accepted
// while no reading exists anywhere in the region's subtree (the create-time
// grace window, FR50.3) — the database trigger refuses it otherwise (NFR6.2).
message UpdateRegionParentRequest {
  int64 region_id = 1;
  // new_parent_region_id: 0 means "make this a root region".
  int64 new_parent_region_id = 2;
}

message UpdateRegionParentResponse {}

message RetireRegionRequest {
  int64 region_id = 1;
  // successor_region_id: optional — set when retirement is the result of a
  // relocation (FR74), so region-keyed series join across the reorganisation.
  // 0 means no successor.
  int64 successor_region_id = 2;
}

message RetireRegionResponse {}
