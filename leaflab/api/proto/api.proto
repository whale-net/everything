syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// ============================================================================
// Error handling
// ============================================================================

// FailureClass is a machine-readable classification of API failures, allowing
// callers to branch on error type without parsing prose. Intended to be used
// in an ErrorDetail attached to gRPC status details.
enum FailureClass {
  FAILURE_CLASS_UNSPECIFIED = 0;
  
  // A required input field is missing or invalid.
  FAILURE_CLASS_INVALID_ARGUMENT = 1;
  
  // The operation cannot be performed because it would violate an
  // invariant (e.g., renaming an entity to a name that is already taken,
  // or operating on a board that doesn't exist). Includes "refuse before
  // writing" failures.
  FAILURE_CLASS_PRECONDITION = 2;
  
  // An internal system error (database, MQTT, etc.).
  FAILURE_CLASS_INTERNAL = 3;
}

// ErrorDetail carries structured machine-readable failure information
// alongside a gRPC status, so a caller can classify failures without
// parsing the human-readable message string.
message ErrorDetail {
  FailureClass failure_class = 1;
  
  // The entity that the failure relates to (e.g., "board", "device_config").
  // Machine-readable; used to construct or context in UI/logs.
  string entity = 2;
  
  // The field within the entity that caused or is affected by the failure.
  // Empty if the failure is about the entity as a whole.
  string field = 3;
  
  // A key to look up the human-readable failure description from a message
  // catalog. Allows non-technical surfaces to render personalized prose
  // without receiving status codes, proto field names, or stack traces.
  // Format: "MESSAGE_KEY_LIKE_THIS" or similar, resolved by the UI layer.
  string message_key = 4;
}

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Health returns the service health status without requiring authentication.
  // It returns up or degraded and no other details.
  rpc Health(HealthRequest) returns (HealthResponse);
}

// ============================================================================
// Pagination
// ============================================================================

// PageRequest carries opaque keyset pagination state for list operations.
// The page_token is never an offset encoding and does not round-trip
// caller-controlled SQL. The server clamped page_size; a request for more
// than the cap is silently reduced, not errored.
message PageRequest {
  int32 page_size = 1;   // 0 means server default; server clamps to max
  string page_token = 2; // opaque, never an offset; "" for first page
}

// PageResponse carries the next page token and total item count.
message PageResponse {
  string next_page_token = 1; // opaque; "" means no more pages
  int32 total_size = 2;       // total count of items (for progress display)
}

// ============================================================================
// Messages
// ============================================================================

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // recorded_at is an absolute instant (Unix timestamp in seconds) when
  // this board last sent a manifest. Callers rendering elapsed time should
  // compute this plus their own local time to show "last seen N minutes ago",
  // not present a raw UTC string to end users.
  int64 recorded_at = 3;
}

message ListBoardsRequest {
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  PageResponse page = 2;
}

message HealthRequest {}

message HealthResponse {
  // Status is the health status.
  enum Status {
    UNKNOWN = 0;
    UP = 1;
    DEGRADED = 2;
  }
  Status status = 1;
}
