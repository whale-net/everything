syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";
import "firmware/proto/firmware.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version. FR82: this is
  // replace semantics, not an overlay of overrides -- what the payload
  // (plus, under scope=EDIT, the board's current accepted config) means as
  // a whole is the board's new entire desired sensor set. See `scope` and
  // `removes` on PushDeviceConfigRequest for the two ways a caller states
  // that desired set.
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // RewireSensor is the explicit API rewire path (FR16): it declares that
  // the sensor currently known by `name` on this device has moved to a new
  // hardware location (I2C address / mux path), and updates that sensor in
  // place -- closing/opening a sensor_hw_history interval -- rather than
  // minting a new sensor identity. `name` is the stable anchor (FR16 case
  // 2: match on name, update hardware key), mirroring
  // leaflab/processor/repository.go's UpsertSensor resolution order on the
  // device manifest path. Refused (FR17) if no sensor named `name`
  // currently exists for this device: applying it would create a new
  // identity, not continue an existing one, and its reading history would
  // not follow.
  rpc RewireSensor(RewireSensorRequest) returns (RewireSensorResponse);

  // DiffConfigVersions computes FR37's server-side, per-entry diff between
  // any two sides of a board's config history -- two stored accepted
  // versions, or a stored version against an unpushed draft (see
  // ConfigSide). Never mutates anything: a draft named on either side is
  // materialised in memory (FR82's scope semantics) purely to diff it, the
  // same way PushDeviceConfig would materialise it if it were actually
  // pushed, but is never stored or published.
  rpc DiffConfigVersions(DiffConfigVersionsRequest) returns (DiffConfigVersionsResponse);

  // GetPushGroupStatus reads back FR48.1's "the resulting group's ack
  // state is readable as a group afterwards": per board named in the
  // push_group PushDeviceConfig created, whether that board's push has
  // been acked, rejected, or is still silent (no ack has arrived), as of
  // the moment this is called -- not a value fixed at push time. Also
  // echoes the group's own FR48.2 bookkeeping (reason, push timestamp,
  // acting principal). Read-only; never mutates anything.
  rpc GetPushGroupStatus(GetPushGroupStatusRequest) returns (GetPushGroupStatusResponse);
}

// PushScope states what a PushDeviceConfigRequest's payload means as a
// whole (FR82.1). There is no default: PUSH_SCOPE_UNSPECIFIED exists only
// so an omitted scope is detectable and rejected -- it is never treated as
// either real value, and scope is never inferred from payload shape, entry
// count, request size, caller identity, or which endpoint was called
// (A27).
enum PushScope {
  PUSH_SCOPE_UNSPECIFIED = 0;
  // The payload is the board's entire desired sensor set (FR82.2). An
  // entry absent from it is removed from the desired state. This is what
  // a leaflab/scripts/scenarios/*.json file has always meant.
  PUSH_SCOPE_COMPLETE = 1;
  // The payload names only the entries being added or changed, plus
  // `removes` (FR82.3/FR82.4). An entry named in neither is unchanged and
  // is materialised server-side from the board's current accepted config
  // version alone -- never from the reported manifest.
  PUSH_SCOPE_EDIT = 2;
}

// RemoveKey names one FR82.4 removal. Two forms, distinguished by whether
// sensor_type is set:
//   - full canonical key (sensor_type set): drops exactly the one config
//     entry at (i2c_address, mux_path, sensor_type) -- the same three-part
//     key FR18 canonicalises and idx_sensor_hw_address enforces uniqueness
//     on.
//   - chip key (sensor_type unset): drops every entry at (i2c_address,
//     mux_path), regardless of sensor_type -- the form that matches the
//     physical action of unsoldering a part (e.g. one CCS811 is eCO2 and
//     TVOC at a single address; a chip-key remove drops both).
// An i2c_address of 0 (the legacy manifests' "unknown address" sentinel,
// FR18.2) never resolves to a removable entry: such an entry has no
// removal path via EDIT at all (FR82.4's stated limitation) -- only via a
// COMPLETE push that omits it.
message RemoveKey {
  repeated firmware.MuxHop mux_path = 1;  // empty = directly on root bus
  uint32 i2c_address = 2;
  optional firmware.SensorType sensor_type = 3;
}

// RemoveForm states which of FR82.4's two removal forms named a given
// RemovedEntry -- full canonical key (sensor_type was set on the wire) or
// chip key (sensor_type was absent), mirroring RemoveKey's own two forms.
enum RemoveForm {
  REMOVE_FORM_UNSPECIFIED = 0;
  // sensor_type was set on the matching RemoveKey -- this was the one
  // entry it named.
  REMOVE_FORM_FULL_KEY = 1;
  // sensor_type was absent on the matching RemoveKey -- this entry was
  // one of possibly several dropped alongside it at the same
  // (i2c_address, mux_path).
  REMOVE_FORM_CHIP_KEY = 2;
}

// RemovedEntry states one config entry an EDIT-scope push dropped and
// which RemoveForm named it (FR82.4: "which form was used is stated back
// to the caller"). Always empty under scope=COMPLETE, where there is no
// remove list.
message RemovedEntry {
  repeated firmware.MuxHop mux_path = 1;  // empty = directly on root bus
  uint32 i2c_address = 2;
  firmware.SensorType sensor_type = 3;
  RemoveForm form = 4;
}

message PushDeviceConfigRequest {
  // Legacy single-board target, kept for a caller that names exactly one
  // board: when `device_ids` is empty, this alone is the (singleton)
  // target set. Superseded by `device_ids` for FR48's multi-board push --
  // when `device_ids` is non-empty, it is the target board set and this
  // field is ignored.
  string device_id = 1;
  // The desired-state payload (FR82, NFR17) -- replace semantics, not a
  // set of overrides layered onto whatever the board already has.
  // Required; meaning depends on `scope`. Applied identically to every
  // board in the target set (FR48): each board is carried through the
  // full validation and materialisation against its own accepted base
  // independently (a board's own current accepted config under
  // scope=EDIT), never against another named board's.
  //   - scope=COMPLETE: this is the board's entire desired sensor set
  //     (FR82.2). An entry absent from it is removed.
  //   - scope=EDIT: this lists only entries being added or changed
  //     (FR82.3). Everything else carries forward from the board's
  //     current accepted config version, and `removes` (not omission)
  //     is how an EDIT push drops an entry.
  repeated firmware.SensorConfig sensors = 2;
  // Required; no default (FR82.1). A request that omits this (leaves it
  // PUSH_SCOPE_UNSPECIFIED) is rejected before anything is stored or
  // published, naming this field.
  PushScope scope = 3;
  // EDIT-scope removal list (FR82.4). Unused (must be empty) under
  // scope=COMPLETE, where an entry is removed by omitting it from
  // `sensors` instead.
  repeated RemoveKey removes = 4;
  // FR48: the explicit board set this push targets. A board set spanning
  // more than one household is refused unless the caller reaches all of
  // them (FR5, FR1.2). If empty, `device_id` (above) is the sole target.
  repeated string device_ids = 5;
  // FR38: validate, materialise and diff this push against every named
  // board without writing a device_config row or publishing anything to
  // any of them -- asserted, not just achieved by omission (see
  // BoardPushResult and PushDeviceConfigResponse). Composes with a
  // multi-board `device_ids` set: the preview covers the same blast
  // radius the real push would.
  bool dry_run = 6;
  // FR48.2: required (refused with none of the named boards pushed) when
  // `device_ids` names more than one board -- a multi-board push must
  // state why. Returned back on the response alongside the push
  // timestamp and acting principal (FR8.2), and written to the audit
  // log. May be empty for a single-board push.
  string reason = 7;
}

// BoardPushResult is FR48.1's per-board push outcome: exactly one board's
// result, independent of every other board named in the same
// PushDeviceConfigRequest -- one board's failure or refusal never
// prevents another named board in the same request from succeeding, and
// PushDeviceConfigResponse never collapses this list to one aggregate
// success.
message BoardPushResult {
  string device_id = 1;
  // True if this board's push succeeded, or -- under dry_run -- validated
  // cleanly and would have succeeded. False for a per-board failure or a
  // per-board refusal; see `failure`.
  bool success = 2;
  // The version this push assigned to this board, or -- under dry_run --
  // the version it would assign (FR38). Meaningless when success is
  // false.
  uint64 version = 3;
  // FR82.4's per-entry removals this push dropped for this board, with a
  // chip key already expanded into the individual entries it drops
  // (FR82.4, FR38). Under dry_run this is FR38's named removal set --
  // "these N entries would stop being polled" -- computed against
  // `effective_config`, not written anywhere.
  repeated RemovedEntry removed = 4;
  // Set (with success false) when this board's push failed or was
  // refused.
  Failure failure = 5;
  // FR38: the effective resulting config this push produces for this
  // board -- the board's complete new desired sensor set, not the
  // partial payload the request submitted (meaningful under
  // scope=EDIT). Populated whenever success is true, whether or not
  // dry_run was set.
  firmware.DeviceConfig effective_config = 6;
  // FR37/FR38: the diff between this board's prior accepted config and
  // effective_config, computed the same way DiffConfigVersions computes
  // one. Populated whenever success is true.
  repeated EntryDiff diff = 7;
}

message PushDeviceConfigResponse {
  // FR48.1: one result per board in the request's target set (device_ids,
  // or the singleton device_id if device_ids was empty) -- never one
  // aggregate success, and never collapsed even when every board in the
  // set succeeded or every board in the set failed. See BoardPushResult.
  repeated BoardPushResult results = 1;
  // FR48.2: this push's stated reason (required, non-empty, for a
  // multi-board push; may be empty for a single-board push), the instant
  // it was pushed, and the acting principal (FR8.2) -- returned back to
  // the caller and written to the audit log.
  string reason = 2;
  Instant pushed_at = 3;
  string actor_subject = 4;
  // FR48.1: identifies the push_group this push recorded -- the handle a
  // caller passes to GetPushGroupStatus to read this group's per-board
  // ack state after the fact.
  int64 push_group_id = 5;
}

message RewireSensorRequest {
  string device_id = 1;
  // The sensor's current logical name on this device -- the stable anchor
  // identifying which existing sensor this rewire applies to. Not the new
  // name: RewireSensor changes hardware location, not identity or label
  // (see FR16.3 for the case where a manifest changes both at once).
  string name = 2;
  // The sensor's new hardware location. Empty mux_path means directly on
  // the root I2C bus.
  repeated firmware.MuxHop mux_path = 3;
  uint32 i2c_address = 4;
}

message RewireSensorResponse {
  // sensor_id of the rewired sensor -- unchanged from before the rewire,
  // proving identity survived (FR16).
  int64 sensor_id = 1;
}

// --- Diff (FR37) ---------------------------------------------------------

// ConfigDraft is an unpushed, hypothetical push payload -- the same shape
// and FR82 scope semantics as PushDeviceConfigRequest, but never stored or
// published: DiffConfigVersions materialises it in memory (COMPLETE: as
// submitted; EDIT: against the board's current accepted config, exactly
// as PushDeviceConfig would) purely to diff it.
message ConfigDraft {
  repeated firmware.SensorConfig sensors = 1;
  PushScope scope = 2;
  repeated RemoveKey removes = 3;
}

// ConfigSide names one side of a DiffConfigVersions comparison (FR37):
// either a specific stored accepted config version, or an unpushed draft.
// There is no default -- an unset oneof is rejected before anything is
// diffed, the same "no default, never inferred" posture PushScope takes
// (FR82.1).
message ConfigSide {
  oneof side {
    uint64 version = 1;
    ConfigDraft draft = 2;
  }
}

message DiffConfigVersionsRequest {
  string device_id = 1;
  ConfigSide from = 2;
  ConfigSide to = 3;
}

// DiffKind classifies one sensor entry's change between the `from` and
// `to` sides of a DiffConfigVersionsRequest (FR37).
enum DiffKind {
  DIFF_KIND_UNSPECIFIED = 0;
  DIFF_KIND_ADDED = 1;
  DIFF_KIND_REMOVED = 2;
  DIFF_KIND_CHANGED = 3;
  DIFF_KIND_UNCHANGED = 4;
}

// EntryDiff is one sensor entry's classification, identified by its
// canonical hardware key (FR18: mux_path, i2c_address, sensor_type) --
// the full entry on each side is available in
// DiffConfigVersionsResponse's `from`/`to` raw payloads, cross-referenced
// by this same key.
message EntryDiff {
  DiffKind kind = 1;
  repeated firmware.MuxHop mux_path = 2;
  uint32 i2c_address = 3;
  firmware.SensorType sensor_type = 4;
}

message DiffConfigVersionsResponse {
  repeated EntryDiff entries = 1;
  // Both raw complete payloads the diff was computed from (FR37) -- a
  // draft side is included here already materialised, exactly as it was
  // diffed, not as originally submitted.
  firmware.DeviceConfig from = 2;
  firmware.DeviceConfig to = 3;
}

// --- Push group status (FR48) --------------------------------------------

message GetPushGroupStatusRequest {
  int64 push_group_id = 1;
}

// AckState classifies one board's push outcome within a push_group, as of
// the moment GetPushGroupStatus is called -- not a value fixed at push
// time: a board silent at push time can still ack or be rejected later,
// and a later call reflects that.
enum AckState {
  ACK_STATE_UNSPECIFIED = 0;
  // The device accepted this push (device_config.accepted = TRUE).
  ACK_STATE_ACKED = 1;
  // The device rejected this push (device_config.accepted = FALSE,
  // rejection_reason set).
  ACK_STATE_REJECTED = 2;
  // No ack has arrived yet for this board's push in this group
  // (device_config.acked_at IS NULL).
  ACK_STATE_SILENT = 3;
}

// BoardAckStatus is one board's AckState within a push_group.
message BoardAckStatus {
  string device_id = 1;
  AckState state = 2;
}

message GetPushGroupStatusResponse {
  // FR48.1: one entry per board this push_group targeted, readable as a
  // group -- never one aggregate ack state for the whole group.
  repeated BoardAckStatus boards = 1;
  // The group's own FR48.2 bookkeeping, echoed back for convenience.
  string reason = 2;
  Instant pushed_at = 3;
  string actor_subject = 4;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}
