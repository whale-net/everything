syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version; the caller supplies
  // only the sensor overrides (names, enabled state, poll interval).
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // --- Bounded read path (FR25, FR27, FR28, NFR3.2) ---------------------
  //
  // See leaflab/api/readings -- the one place the join, enrichment and
  // attribution logic behind these four RPCs lives (FR25.1). Handlers
  // (server.go) delegate to it (#1362's Implementation phase).

  // A bounded-window reading series for one entity -- sensor, board,
  // region or plant (FR25.1). Every response states which granularity
  // tier answered (FR71), never silently. Raw-row responses are capped at
  // a 48-hour window (NFR3.2); a longer window coarsens automatically
  // rather than erroring.
  rpc GetReadingSeries(GetReadingSeriesRequest) returns (GetReadingSeriesResponse);

  // The current value per sensor and per plant, in one call, from the
  // latest raw readings -- never from a pre-aggregated tier (FR27). The
  // response's band field is left unpopulated until Phase 5 (FR58).
  rpc GetCurrentValues(GetCurrentValuesRequest) returns (GetCurrentValuesResponse);

  // Server-side min/max/average summary for one region over a period,
  // including the overnight-low/daytime-high framing (FR28). Exact at the
  // hourly tier for min and max (FR71).
  rpc GetPeriodSummary(GetPeriodSummaryRequest) returns (GetPeriodSummaryResponse);

  // Two or more entities compared over one shared window and one
  // measurement (FR25.3).
  rpc CompareSeries(CompareSeriesRequest) returns (CompareSeriesResponse);
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // Sensor overrides — each entry is matched to a hardware sensor by
  // (mux_path, i2c_address). Sensors with no matching entry are unchanged.
  repeated firmware.SensorConfig sensors = 2;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Bounded read path (FR25, FR27, FR28, NFR3.2) -----------------------

// EntityRef names one entity a readings RPC answers about -- a sensor,
// board, region or plant (FR25.1). Exactly one field is set; a request
// with none or more than one set is rejected (Implementation phase).
// Mirrors leaflab/api/authz.EntityRef's kind set minus EntityReading
// (a reading is never itself the subject of a readings query).
message EntityRef {
  oneof entity {
    int64 sensor_id = 1;
    int64 board_id = 2;
    int64 region_id = 3;
    int64 plant_id = 4;
  }
}

// TimeWindow is the explicitly bounded [start, end) range every readings
// request carries (FR25.1). NFR3.2's server-enforced maximum range and
// result cap are applied against this window server-side -- an unbounded
// window (start or end unset) is rejected, never served as a scan.
message TimeWindow {
  Instant start = 1;
  Instant end = 2;
}

// Granularity is the wire form of leaflab/api/tiers.Tier -- a
// caller-requested hint, not a contract (FR71): the server may coarsen,
// and every response names which value of this enum actually answered.
enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  GRANULARITY_RAW = 1;
  GRANULARITY_FIVE_MINUTE = 2;
  GRANULARITY_HOURLY = 3;
}

// ReadingPoint is one bucket in a series: a single raw reading (TierRaw)
// or one pre-aggregated bucket (TierFiveMinute/TierHourly). value_min/
// value_max/value_avg/reading_count are meaningful only for an aggregated
// tier; a raw point carries value_min == value_max == value_avg == value
// and reading_count == 1 (Implementation phase fills in this shape).
message ReadingPoint {
  Instant recorded_at = 1;
  double value = 2;
  double value_min = 3;
  double value_max = 4;
  double value_avg = 5;
  int64 reading_count = 6;
  // True when this point is an FR20 boundary_partial substitution for a
  // bucket straddled by a plant-attribution boundary, rather than an
  // ordinary tier bucket.
  bool boundary_partial = 7;
}

message GetReadingSeriesRequest {
  EntityRef entity = 1;
  TimeWindow window = 2;
  // Filters the series by measurement type -- sensor.sensor_type_id
  // (FR25.2). Zero means unfiltered.
  int64 measurement_type_id = 3;
  // A hint, not a contract (FR71) -- see Granularity.
  Granularity requested_granularity = 4;
  // Keyset page request (FR61), ordered on (recorded_at DESC, reading_id)
  // at the raw tier.
  PageRequest page = 5;
}

message GetReadingSeriesResponse {
  repeated ReadingPoint points = 1;
  // Which tier actually answered (FR71) -- always set, regardless of
  // requested_granularity.
  Granularity tier = 2;
  // True when tier is coarser than requested_granularity (FR71's
  // disclosure requirement).
  bool coarsened = 3;
  PageResponse page = 4;
  Instant server_now = 5;
}

message GetCurrentValuesRequest {
  EntityRef entity = 1;
}

// Band is FR58's band descriptor, carried alongside a current value.
// Scaffolded here as an empty field -- Phase 5 populates it. Leaving the
// field on the response now means FR27's "carries the FR58 band alongside
// the value" does not require a wire-breaking change later.
message Band {
  string label = 1;
}

message CurrentValue {
  int64 sensor_id = 1;
  int64 measurement_type_id = 2;
  double value = 3;
  Instant recorded_at = 4;
  // Populated starting Phase 5 (FR58). Unset until then.
  Band band = 5;
}

// CurrentPlantValue is one plant's current value set -- every sensor
// value from the plant's attributing region (FR23), read from raw
// (FR27), never a pre-aggregated tier.
message CurrentPlantValue {
  int64 plant_id = 1;
  repeated CurrentValue values = 2;
}

message GetCurrentValuesResponse {
  // Populated when the request named a sensor, board or region.
  repeated CurrentValue values = 1;
  // Populated when the request named a plant (FR23 attribution).
  repeated CurrentPlantValue plant_values = 2;
  Instant server_now = 3;
}

// PeriodSummary is one measurement type's min/max/average over a period,
// computed server-side (FR28), exact at the hourly tier for min and max
// (FR71).
message PeriodSummary {
  int64 measurement_type_id = 1;
  double min = 2;
  double max = 3;
  double avg = 4;
  Instant min_at = 5;
  Instant max_at = 6;
}

message GetPeriodSummaryRequest {
  int64 region_id = 1;
  TimeWindow period = 2;
  // Zero means unfiltered -- one PeriodSummary per measurement type
  // present in the period.
  int64 measurement_type_id = 3;
}

message GetPeriodSummaryResponse {
  repeated PeriodSummary summaries = 1;
  // The same measurement's overnight-low/daytime-high framing, computed
  // server-side from the household's (or the server's -- Implementation
  // phase states which) configured day boundary, never a client
  // convention.
  PeriodSummary overnight_low = 2;
  PeriodSummary daytime_high = 3;
  // IANA timezone name the day boundary was computed against.
  string timezone = 4;
  // Which tier answered (FR71) -- the hourly tier where the period
  // allows; coarsening beyond that is disclosed the same as any other
  // read-path RPC.
  Granularity tier = 5;
  Instant server_now = 6;
}

message CompareSeriesRequest {
  // Two or more entities compared over one shared window and one
  // measurement (FR25.3).
  repeated EntityRef entities = 1;
  TimeWindow window = 2;
  int64 measurement_type_id = 3;
  Granularity requested_granularity = 4;
  PageRequest page = 5;
}

message EntitySeries {
  EntityRef entity = 1;
  repeated ReadingPoint points = 2;
}

message CompareSeriesResponse {
  repeated EntitySeries series = 1;
  Granularity tier = 2;
  bool coarsened = 3;
  PageResponse page = 4;
  Instant server_now = 5;
}
