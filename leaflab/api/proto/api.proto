syntax = "proto3";

package leaflab.api.v1;

option go_package = "github.com/whale-net/everything/leaflab/api/proto;leaflabapipb";

import "firmware/proto/config.proto";
import "firmware/proto/firmware.proto";

// LeafLabAPI is the control-plane API for managing leaflab sensor boards.
service LeafLabAPI {
  // Push a new DeviceConfig to a board over MQTT.
  // The server assigns a monotonically increasing version. FR82: this is
  // replace semantics, not an overlay of overrides -- what the payload
  // (plus, under scope=EDIT, the board's current accepted config) means as
  // a whole is the board's new entire desired sensor set. See `scope` and
  // `removes` on PushDeviceConfigRequest for the two ways a caller states
  // that desired set.
  rpc PushDeviceConfig(PushDeviceConfigRequest) returns (PushDeviceConfigResponse);

  // Get the latest config that was accepted by a board.
  rpc GetDeviceConfig(GetDeviceConfigRequest) returns (GetDeviceConfigResponse);

  // List all known boards (boards that have sent at least one manifest).
  rpc ListBoards(ListBoardsRequest) returns (ListBoardsResponse);

  // Service health signal. The only anonymous RPC in this service (FR63) --
  // callable without a household session and without an authenticated
  // principal, so "this is our problem, not yours" is answerable even when
  // the rest of the API is unreachable. Returns no household data.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  // RewireSensor is the explicit API rewire path (FR16): it declares that
  // the sensor currently known by `name` on this device has moved to a new
  // hardware location (I2C address / mux path), and updates that sensor in
  // place -- closing/opening a sensor_hw_history interval -- rather than
  // minting a new sensor identity. `name` is the stable anchor (FR16 case
  // 2: match on name, update hardware key), mirroring
  // leaflab/processor/repository.go's UpsertSensor resolution order on the
  // device manifest path. Refused (FR17) if no sensor named `name`
  // currently exists for this device: applying it would create a new
  // identity, not continue an existing one, and its reading history would
  // not follow.
  rpc RewireSensor(RewireSensorRequest) returns (RewireSensorResponse);

  // GetConfigStatus reports one pushed config version's FR34.1 derived
  // state (accepted/pending/rejected) plus pushed-at, acked-at and the
  // firmware's verbatim rejection reason. See ConfigState's doc comment.
  rpc GetConfigStatus(GetConfigStatusRequest) returns (GetConfigStatusResponse);

  // ListConfigHistory lists a board's full config push history, newest
  // first, keyset paginated (FR61) -- including pending and rejected
  // versions, each visibly marked with its ConfigState (FR35.1).
  rpc ListConfigHistory(ListConfigHistoryRequest) returns (ListConfigHistoryResponse);

  // GetConfigVersion fetches any single stored config version by
  // (device_id, version), regardless of whether it was ever accepted
  // (FR35.2), returning its stored payload plus each entry's FR82.4
  // provenance.
  rpc GetConfigVersion(GetConfigVersionRequest) returns (GetConfigVersionResponse);

  // GetResendAvailability answers FR42.2's "stated up front" question for
  // ResendDeviceConfig below: whether a re-send can be attempted right now,
  // and if not, why -- so a caller renders the button disabled with the
  // reason inline rather than enabling it and letting the press fail
  // (FR59.3). Unavailable is never discovered only by pressing.
  rpc GetResendAvailability(GetResendAvailabilityRequest) returns (GetResendAvailabilityResponse);

  // ResendDeviceConfig re-publishes the board's currently accepted config,
  // byte-identical, to the retained MQTT topic (FR42.1) -- it cannot alter
  // what the device runs, never opens an editor, and pressing it twice is
  // harmless: no new device_config row is inserted and no new version is
  // assigned. Refused (FR59.3, via GetResendAvailability's same reasons)
  // when there is nothing accepted to re-send or the board is not
  // reporting.
  rpc ResendDeviceConfig(ResendDeviceConfigRequest) returns (ResendDeviceConfigResponse);

  // --- Admin (FR10, FR12 activation) -----------------------------------
  //
  // leaflab-admin (auth.go's RoleAdmin) is eligibility only -- these RPCs
  // are what actually grant reach, and they grant it narrowly. There is no
  // in-application mechanism to grant or revoke the realm role itself.

  // ResolveToHousehold is the standing (non-elevated) admin lane (FR10.2):
  // across all households, without elevation, resolve a person, a support
  // reference (FR80, stubbed until it lands), or a partial device
  // identifier to the owning household and FR79's health fields for the
  // boards it returns -- device id, board display name, household
  // identity, last-seen age, active version, outstanding push, sensor
  // count. That is the whole lane: no readings, regions, plants, config or
  // audit rows. Audited at query granularity (FR10.4) -- one audit row per
  // call, not one per returned board.
  rpc ResolveToHousehold(ResolveToHouseholdRequest) returns (ResolveToHouseholdResponse);

  // ListFleetHealth is FR79's admin fleet health listing: per board,
  // last-seen age evaluated against A23's staleness threshold, active
  // accepted config version, whether a push is outstanding and for how
  // long, and sensor count -- filterable by device-id prefix, household,
  // region and reporting state (including unhealthy-only), and paginated
  // per FR61. Reachable from the standing admin lane (FR10.2) across all
  // households, and from an elevated lane narrowed to one household
  // (FR10.1/FR10.3) -- the same computation FR62's household-member
  // landing view will consume, not a second one. No health score or
  // severity ranking (FR79) -- see ReportingState and FleetBoardHealth's
  // doc comments.
  rpc ListFleetHealth(ListFleetHealthRequest) returns (ListFleetHealthResponse);

  // Elevate opens a time-boxed, reasoned elevation against one target
  // household (FR10.1). Requires a non-empty reason. Lasts 60 minutes
  // (configurable, documented) from acceptance.
  rpc Elevate(ElevateRequest) returns (ElevateResponse);

  // RenewElevation extends an already-open elevation against the same
  // target household. Requires a **restated** reason -- an empty reason,
  // or renewing with no elevation currently open for that household, is
  // refused.
  rpc RenewElevation(RenewElevationRequest) returns (RenewElevationResponse);

  // EndElevation ends an open elevation against a target household before
  // its natural expiry.
  rpc EndElevation(EndElevationRequest) returns (EndElevationResponse);

  // GetElevationStatus reports whether the caller currently holds an
  // unexpired elevation against a target household, and its remaining time
  // (A22) -- readable throughout the elevation, not only at grant time.
  rpc GetElevationStatus(GetElevationStatusRequest) returns (GetElevationStatusResponse);
}

// ConfigState is FR34.1's three distinct states a pushed config version can
// be in -- derived from device_config's existing accepted/acked_at/
// rejection_reason columns (leaflab/api/config.DeriveState is the one place
// that computes it); there is no separate stored status column. Pending is
// never rendered as rejected, and a rejected push is never indistinguishable
// from "no push at all" -- CONFIG_STATE_UNSPECIFIED exists only as proto3's
// required zero value and is never a state this API reports for a config
// version that actually exists.
enum ConfigState {
  CONFIG_STATE_UNSPECIFIED = 0;
  // acked_at is set and device_config.accepted is true.
  CONFIG_STATE_ACCEPTED = 1;
  // acked_at IS NULL -- the board has not answered yet.
  CONFIG_STATE_PENDING = 2;
  // acked_at is set and device_config.accepted is false. rejection_reason
  // on the enclosing response carries the firmware's verbatim reason.
  CONFIG_STATE_REJECTED = 3;
}

// EntryProvenance is FR82.4's per-entry provenance value, on the wire --
// mirrors leaflab/api/config.Provenance exactly (see that type's doc
// comment). Returned per entry by GetConfigVersion.
enum EntryProvenance {
  ENTRY_PROVENANCE_UNSPECIFIED = 0;
  // Named by the caller in the request that stored this entry (an
  // add/change, or -- for a RemovedEntry -- a removal).
  ENTRY_PROVENANCE_AUTHORED = 1;
  // Carried forward unchanged from an EDIT push's materialisation base,
  // without the caller naming it in that push at all.
  ENTRY_PROVENANCE_MATERIALISED = 2;
}

message GetConfigStatusRequest {
  string device_id = 1;
  uint64 version = 2;
}

message GetConfigStatusResponse {
  ConfigState state = 1;
  Instant pushed_at = 2;
  // Unset while state is CONFIG_STATE_PENDING.
  Instant acked_at = 3;
  // The firmware's verbatim rejection reason (FR34.1) -- set only when
  // state is CONFIG_STATE_REJECTED; never paraphrased or normalised.
  string rejection_reason = 4;
  // FR34.2/FR59.2: one of three persona-appropriate, complete sentences --
  // "it worked / it hasn't answered yet / it didn't work" -- with no
  // version number and no status code, rendered server-side (NFR18.1) so a
  // BFF picks by `state` rather than composing its own text.
  string sentence = 5;
  Instant server_now = 6;
}

message ListConfigHistoryRequest {
  string device_id = 1;
  // Keyset page request (FR61). Unset/empty requests the first (newest)
  // page.
  PageRequest page = 2;
}

// ConfigHistoryEntry is one version in a board's config push history
// (FR35.1) -- always visibly marked with its ConfigState, including
// pending and rejected versions, which are never omitted from this list.
message ConfigHistoryEntry {
  uint64 version = 1;
  ConfigState state = 2;
  Instant pushed_at = 3;
  Instant acked_at = 4;
  string rejection_reason = 5;
  string sentence = 6;
}

message ListConfigHistoryResponse {
  // Newest first (FR35.1).
  repeated ConfigHistoryEntry entries = 1;
  PageResponse page = 2;
  Instant server_now = 3;
}

message GetConfigVersionRequest {
  string device_id = 1;
  uint64 version = 2;
}

// ConfigVersionEntry names one entry in a fetched config version's stored
// payload and its FR82.4 provenance -- the canonical hardware key shape
// (mirroring RemovedEntry, above) rather than an index into `sensors`, so
// a caller can match an entry to its provenance without assuming array
// order.
message ConfigVersionEntry {
  repeated firmware.MuxHop mux_path = 1;
  uint32 i2c_address = 2;
  firmware.SensorType sensor_type = 3;
  EntryProvenance provenance = 4;
}

message GetConfigVersionResponse {
  // The stored complete payload for this version, regardless of whether it
  // was ever accepted (FR35.2).
  firmware.DeviceConfig config = 1;
  ConfigState state = 2;
  Instant pushed_at = 3;
  Instant acked_at = 4;
  string rejection_reason = 5;
  // FR82.4: this version's per-entry provenance.
  repeated ConfigVersionEntry entries = 6;
  Instant server_now = 7;
}

// --- Re-send availability and re-send (FR42, A23) -----------------------
//
// GetResendAvailability/ResendDeviceConfig back FR42's "one safe button":
// a re-send re-publishes the board's currently accepted config unchanged,
// never opens an editor, and is harmless to press twice (FR42.1) -- no new
// device_config row is inserted and no new version is assigned by a
// re-send. Availability is computed up front (FR42.2, FR59.3) so a caller
// renders the button disabled with the reason inline rather than enabling
// it and letting the press fail.

// ResendAvailabilityReason states why GetResendAvailability answered as it
// did. AVAILABLE is the only value that means the button may be pressed;
// every other value pairs with `sentence` (FR59.2) and `alternative`
// (FR59.3) on GetResendAvailabilityResponse, naming what the caller can do
// instead. RESEND_AVAILABILITY_REASON_UNSPECIFIED exists only as proto3's
// required zero value and is never returned for a request that resolves to
// a real board.
enum ResendAvailabilityReason {
  RESEND_AVAILABILITY_REASON_UNSPECIFIED = 0;
  // Nothing blocks a re-send right now.
  RESEND_AVAILABILITY_REASON_AVAILABLE = 1;
  // The board is stale per A23's threshold (leaflab/api/health.Threshold) --
  // not currently reporting. Named alternative: check that the board is
  // online.
  RESEND_AVAILABILITY_REASON_NOT_REPORTING = 2;
  // No configuration has ever been accepted for this board, or the most
  // recent push was rejected -- there is nothing accepted to re-send.
  // Named alternative: push a configuration.
  RESEND_AVAILABILITY_REASON_NOTHING_TO_RESEND = 3;
}

message GetResendAvailabilityRequest {
  string device_id = 1;
}

message GetResendAvailabilityResponse {
  // True only when reason is RESEND_AVAILABILITY_REASON_AVAILABLE.
  bool available = 1;
  ResendAvailabilityReason reason = 2;
  // FR59.2 persona-appropriate sentence for `reason`. Empty when available
  // is true.
  string sentence = 3;
  // FR59.3: what the caller can do instead of a re-send right now. Empty
  // when available is true.
  string alternative = 4;
  Instant server_now = 5;
}

message ResendDeviceConfigRequest {
  string device_id = 1;
}

message ResendDeviceConfigResponse {
  // The version re-sent (FR42.1) -- the board's already-current accepted
  // version, echoed back unchanged. A re-send never assigns a new version.
  uint64 version = 1;
}

// PushScope states what a PushDeviceConfigRequest's payload means as a
// whole (FR82.1). There is no default: PUSH_SCOPE_UNSPECIFIED exists only
// so an omitted scope is detectable and rejected -- it is never treated as
// either real value, and scope is never inferred from payload shape, entry
// count, request size, caller identity, or which endpoint was called
// (A27).
enum PushScope {
  PUSH_SCOPE_UNSPECIFIED = 0;
  // The payload is the board's entire desired sensor set (FR82.2). An
  // entry absent from it is removed from the desired state. This is what
  // a leaflab/scripts/scenarios/*.json file has always meant.
  PUSH_SCOPE_COMPLETE = 1;
  // The payload names only the entries being added or changed, plus
  // `removes` (FR82.3/FR82.4). An entry named in neither is unchanged and
  // is materialised server-side from the board's current accepted config
  // version alone -- never from the reported manifest.
  PUSH_SCOPE_EDIT = 2;
}

// RemoveKey names one FR82.4 removal. Two forms, distinguished by whether
// sensor_type is set:
//   - full canonical key (sensor_type set): drops exactly the one config
//     entry at (i2c_address, mux_path, sensor_type) -- the same three-part
//     key FR18 canonicalises and idx_sensor_hw_address enforces uniqueness
//     on.
//   - chip key (sensor_type unset): drops every entry at (i2c_address,
//     mux_path), regardless of sensor_type -- the form that matches the
//     physical action of unsoldering a part (e.g. one CCS811 is eCO2 and
//     TVOC at a single address; a chip-key remove drops both).
// An i2c_address of 0 (the legacy manifests' "unknown address" sentinel,
// FR18.2) never resolves to a removable entry: such an entry has no
// removal path via EDIT at all (FR82.4's stated limitation) -- only via a
// COMPLETE push that omits it.
message RemoveKey {
  repeated firmware.MuxHop mux_path = 1;  // empty = directly on root bus
  uint32 i2c_address = 2;
  optional firmware.SensorType sensor_type = 3;
}

// RemoveForm states which of FR82.4's two removal forms named a given
// RemovedEntry -- full canonical key (sensor_type was set on the wire) or
// chip key (sensor_type was absent), mirroring RemoveKey's own two forms.
enum RemoveForm {
  REMOVE_FORM_UNSPECIFIED = 0;
  // sensor_type was set on the matching RemoveKey -- this was the one
  // entry it named.
  REMOVE_FORM_FULL_KEY = 1;
  // sensor_type was absent on the matching RemoveKey -- this entry was
  // one of possibly several dropped alongside it at the same
  // (i2c_address, mux_path).
  REMOVE_FORM_CHIP_KEY = 2;
}

// RemovedEntry states one config entry an EDIT-scope push dropped and
// which RemoveForm named it (FR82.4: "which form was used is stated back
// to the caller"). Always empty under scope=COMPLETE, where there is no
// remove list.
message RemovedEntry {
  repeated firmware.MuxHop mux_path = 1;  // empty = directly on root bus
  uint32 i2c_address = 2;
  firmware.SensorType sensor_type = 3;
  RemoveForm form = 4;
}

message PushDeviceConfigRequest {
  string device_id = 1;
  // The desired-state payload (FR82, NFR17) -- replace semantics, not a
  // set of overrides layered onto whatever the board already has.
  // Required; meaning depends on `scope`:
  //   - scope=COMPLETE: this is the board's entire desired sensor set
  //     (FR82.2). An entry absent from it is removed.
  //   - scope=EDIT: this lists only entries being added or changed
  //     (FR82.3). Everything else carries forward from the board's
  //     current accepted config version, and `removes` (not omission)
  //     is how an EDIT push drops an entry.
  repeated firmware.SensorConfig sensors = 2;
  // Required; no default (FR82.1). A request that omits this (leaves it
  // PUSH_SCOPE_UNSPECIFIED) is rejected before anything is stored or
  // published, naming this field.
  PushScope scope = 3;
  // EDIT-scope removal list (FR82.4). Unused (must be empty) under
  // scope=COMPLETE, where an entry is removed by omitting it from
  // `sensors` instead.
  repeated RemoveKey removes = 4;
}

message PushDeviceConfigResponse {
  // Version assigned to this push.
  uint64 version = 1;
  // FR82.4: entries this push's EDIT-scope removal dropped, each stating
  // which removal form named it. Always empty under scope=COMPLETE.
  repeated RemovedEntry removed = 2;
}

message RewireSensorRequest {
  string device_id = 1;
  // The sensor's current logical name on this device -- the stable anchor
  // identifying which existing sensor this rewire applies to. Not the new
  // name: RewireSensor changes hardware location, not identity or label
  // (see FR16.3 for the case where a manifest changes both at once).
  string name = 2;
  // The sensor's new hardware location. Empty mux_path means directly on
  // the root I2C bus.
  repeated firmware.MuxHop mux_path = 3;
  uint32 i2c_address = 4;
}

message RewireSensorResponse {
  // sensor_id of the rewired sensor -- unchanged from before the rewire,
  // proving identity survived (FR16).
  int64 sensor_id = 1;
}

message GetDeviceConfigRequest {
  string device_id = 1;
}

message GetDeviceConfigResponse {
  firmware.DeviceConfig config = 1;
  // True if a config has been accepted by the board.
  bool found = 2;
  // FR1.3's caller-visible skip surface: config entries the processor's
  // ApplyConfigRegions (leaflab/processor/repository.go) re-validated
  // immediately before writing and skipped rather than applied --
  // household drift or a stale push, never a partial write. Provenance
  // (FR82.4) is Phase 4; until it lands this lists every skip recorded
  // for this board, not only ones the calling principal authored (see
  // AssertSameHousehold's callers and ApplyConfigRegions' doc comment).
  repeated RegionApplySkip skips = 3;
}

// RegionApplySkip mirrors leaflab/processor.RegionApplySkip on the wire:
// one config entry that ApplyConfigRegions skipped instead of applying,
// with the persona-appropriate reason it recorded (FR59.2) and when. It
// never names the region or household involved (FR1.2 never discloses
// which household a foreign reference actually belongs to).
message RegionApplySkip {
  int64 sensor_id = 1;
  string reason = 2;
  Instant occurred_at = 3;
}

message BoardInfo {
  string device_id = 1;
  int64  board_id  = 2;
  // Absolute instant the board was last seen (FR64). Render this as
  // elapsed time against the response envelope's server_now.
  Instant last_seen_at = 3;
}

message ListBoardsRequest {
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 1;
}

message ListBoardsResponse {
  repeated BoardInfo boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// --- Response contract (FR59, FR61, FR64) -----------------------------
//
// Shapes shared by every RPC in this service. Established here, on the
// first three RPCs, because every later response inherits them -- cheaper
// to define once than to retrofit across every requirement that adds an
// RPC later. See leaflab/api/contract for the Go-side constructors and
// helpers that produce/consume these.

// Instant is an unambiguous absolute point in time (milliseconds since the
// Unix epoch, UTC). Every response that carries a time returns it here
// alongside the response envelope's server_now field, so a browser or CLI
// renders elapsed time ("3 minutes ago") in the viewer's own timezone
// without trusting its own clock (FR64). A raw UTC timestamp is never the
// primary text on a non-technical surface -- this is the value that gets
// converted, not displayed as-is.
message Instant {
  int64 unix_millis = 1;
}

// Failure is the gRPC status detail every LeafLab API error carries
// (FR59.1) instead of an interpolated message string, so a script branches
// on class/entity/field without parsing prose.
message Failure {
  // Machine-readable failure class. Mirrors
  // leaflab/api/contract.FailureClass (e.g. "unauthenticated",
  // "permission_denied", "not_found", "invalid_argument", "rate_limited",
  // "refused_with_alternative"). A caller switches on this string, never
  // on reason.
  string class = 1;
  // The entity type/name the failure concerns (e.g. "board",
  // "device_config").
  string entity = 2;
  // The field within the entity/request the failure concerns. Empty when
  // not field-specific.
  string field = 3;
  // A persona-appropriate sentence, safe to render as-is on a
  // non-technical surface (FR59.2): no status code, proto field name,
  // table name or stack trace.
  string reason = 4;
  // Set only when class is "refused_with_alternative" (FR59.3): the
  // alternative path the caller should take instead of the refused
  // operation.
  string alternative = 5;
}

// PageRequest is embedded in every listing RPC's request (FR61).
message PageRequest {
  // Opaque keyset token from a prior PageResponse.next_page_token. Never
  // an offset. Empty requests the first page.
  string page_token = 1;
  // Requested page size. The server enforces a page cap
  // (leaflab/api/contract.PageCap): a request above the cap is clamped,
  // not rejected.
  int32 page_size = 2;
}

// PageResponse is embedded in every listing RPC's response (FR61).
message PageResponse {
  // Opaque keyset token for the next page. Empty when this is the last
  // page.
  string next_page_token = 1;
}

// --- Health (FR63) ------------------------------------------------------

message GetHealthRequest {}

// HealthStatus is intentionally coarse (FR63.2): a caller learns "this is
// our problem, not yours" and nothing else. No version string, no
// dependency names, no per-dependency status detail belong here or in
// GetHealthResponse.
enum HealthStatus {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_UP = 1;
  HEALTH_DEGRADED = 2;
}

message GetHealthResponse {
  // The only populated field in this response (FR63.2).
  HealthStatus status = 1;
}

// --- Admin (FR10, FR12 activation) --------------------------------------
//
// leaflab-admin is eligibility only (auth.go's RoleAdmin) -- these messages
// back the two admin lanes: ResolveToHousehold (FR10.2's standing,
// resolution-only lane) and Elevate/RenewElevation/EndElevation/
// GetElevationStatus (FR10.1's time-boxed, reasoned, per-household
// elevation). No RPC outside this section, and no field on any message
// above, is reachable by an admin acting under either lane -- every other
// admin read and every admin write resolves its scope through
// ElevatedScope (leaflab/api/authz), which refuses without an unexpired
// elevation against the specific target household named in the request.

// ResolveToHouseholdRequest names exactly one query term. A caller
// supplies exactly one oneof field -- never a combination -- per FR10.2's
// "a person, a support reference, or a partial device identifier".
message ResolveToHouseholdRequest {
  oneof query {
    // A person identifier (e.g. an email or a principal subject) to
    // resolve to their current household.
    string person_identifier = 1;
    // An FR80 support reference. Resolution is stubbed until FR80 lands.
    string support_reference = 2;
    // A partial device identifier to resolve to the household owning the
    // matching board(s).
    string partial_device_id = 3;
  }
}

// AdminBoardHealth is FR79's health-field projection for the standing
// lane: device id, board display name, household identity, last-seen age,
// active version, outstanding push, sensor count -- and **nothing else**.
// Readings, region/plant structure, config payloads and audit rows are
// never reachable through this message; a wider message with those fields
// left unset is deliberately not reused here (FR10.2).
message AdminBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name field
  // exists elsewhere in the schema.
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ResolveToHouseholdResponse.server_now (FR64), same convention
  // as BoardInfo.last_seen_at.
  Instant last_seen_at = 5;
  // Highest config version currently accepted by this board.
  uint64 active_version = 6;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 7;
  int32 sensor_count = 8;
}

// ResolveToHouseholdResponse is its own message type, not a narrowed reuse
// of a wider board/household response -- see AdminBoardHealth's doc
// comment. A query that resolves to no household returns zero boards, not
// an error (mirrors ListBoards's empty-list-not-error convention) --
// distinguishing "no match" from "match, no reach" is exactly the
// existence oracle NFR2 forbids elsewhere, and the standing lane must not
// reintroduce it.
message ResolveToHouseholdResponse {
  repeated AdminBoardHealth boards = 1;
  // Server's current time, so a caller renders last_seen_at as elapsed
  // time without trusting its own clock (FR64).
  Instant server_now = 2;
}

// --- Fleet health listing (FR79, A23) ------------------------------------
//
// ListFleetHealth's request/response pair. FleetBoardHealth is a distinct
// message from AdminBoardHealth (ResolveToHousehold's projection) even
// though the two overlap heavily -- it carries the additional fields FR79
// asks for beyond FR10.2's set (reporting_state, outstanding_push_since,
// retired) and is filterable/paginated in a way a resolve-by-term lane is
// not. Neither message is a narrowed reuse of the other, same rationale as
// AdminBoardHealth's own doc comment: a wider message with fields left
// unset here would let a future field addition leak into a lane that
// hasn't asked for it.

// ReportingState is A23's "not reporting" classification, evaluated
// per-board against that board's own staleness threshold
// (leaflab/api/health.Threshold) -- REPORTING_STATE_NOT_REPORTING is
// FR79's "unhealthy". This is deliberately two-valued, never a score or a
// ranking (FR79 explicitly excludes both) -- a caller branches on this
// enum, never on a numeric severity.
enum ReportingState {
  REPORTING_STATE_UNSPECIFIED = 0;
  REPORTING_STATE_REPORTING = 1;
  REPORTING_STATE_NOT_REPORTING = 2;
}

// ListFleetHealthRequest's filters narrow, never widen, the caller's
// underlying reach (standing admin lane across all households, or an
// elevated lane narrowed to one household -- see ListFleetHealth's doc
// comment). Every filter is optional; an unset/zero-value filter applies
// no narrowing on that dimension.
message ListFleetHealthRequest {
  // Narrows to boards whose device_id starts with this prefix. Empty =
  // no filter.
  string device_id_prefix = 1;
  // Narrows to one household. 0 = no filter.
  int64 household_id = 2;
  // Narrows to boards with at least one sensor currently placed in this
  // region. 0 = no filter.
  int64 region_id = 3;
  // Narrows by A23 reporting state. REPORTING_STATE_UNSPECIFIED = no
  // filter; REPORTING_STATE_NOT_REPORTING is FR79's "unhealthy only".
  ReportingState reporting_state = 4;
  // Keyset page request (FR61). Unset/empty requests the first page.
  PageRequest page = 5;
}

// FleetBoardHealth is FR79's fleet-listing health projection. No field on
// this message is a computed health score or severity ranking (FR79) --
// reporting_state is the closest thing to a summary judgement here, and it
// is a two-valued classification, not a score.
message FleetBoardHealth {
  string device_id = 1;
  // Board display name. Falls back to device_id until a display-name
  // field exists elsewhere in the schema (see AdminBoardHealth's doc
  // comment).
  string board_display_name = 2;
  int64 household_id = 3;
  string household_name = 4;
  // Absolute instant the board was last seen -- render as elapsed age
  // against ListFleetHealthResponse.server_now (FR64).
  Instant last_seen_at = 5;
  // A23 classification of last_seen_at against this board's own
  // staleness threshold (leaflab/api/health.Threshold) -- global, not
  // per-household.
  ReportingState reporting_state = 6;
  // Highest config version currently accepted by this board.
  uint64 active_version = 7;
  // True when a pushed config version has not yet been accepted.
  bool outstanding_push = 8;
  // Absolute instant the outstanding version was pushed. Meaningful only
  // when outstanding_push is true -- render "how long outstanding" as
  // server_now - outstanding_push_since (FR64), the same convention as
  // last_seen_at.
  Instant outstanding_push_since = 9;
  int32 sensor_count = 10;
  // True when this board is retired (board.retired_at IS NOT NULL,
  // FR22.4). A retired board may still be listed here, marked retired,
  // but is excluded from any offline/reporting-state count computed over
  // this listing (FR79).
  bool retired = 11;
}

message ListFleetHealthResponse {
  repeated FleetBoardHealth boards = 1;
  // Keyset page response (FR61).
  PageResponse page = 2;
  // Server's current time, so a caller renders every Instant in this
  // response as elapsed time without trusting its own clock (FR64).
  Instant server_now = 3;
}

// ElevateRequest opens an elevation against target_household_id.
// reason is required and non-empty (FR10.1).
message ElevateRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message ElevateResponse {
  // Absolute expiry instant (60 minutes out, configurable) -- render
  // remaining time against the caller's own clock, or prefer
  // GetElevationStatus's server_now-paired pair while elevated (A22).
  Instant expires_at = 1;
}

// RenewElevationRequest extends an already-open elevation.
// reason must be **restated** -- an empty reason, or no elevation
// currently open for target_household_id, is refused.
message RenewElevationRequest {
  int64 target_household_id = 1;
  string reason = 2;
}

message RenewElevationResponse {
  Instant expires_at = 1;
}

message EndElevationRequest {
  int64 target_household_id = 1;
}

message EndElevationResponse {}

message GetElevationStatusRequest {
  int64 target_household_id = 1;
}

// GetElevationStatusResponse reports whether an unexpired elevation is
// currently open against target_household_id (A22 -- "its remaining time
// is readable while elevated"). expires_at is meaningful only when
// elevated is true; a caller computes remaining time as
// expires_at - server_now, never against its own clock alone (FR64).
message GetElevationStatusResponse {
  bool elevated = 1;
  Instant expires_at = 2;
  Instant server_now = 3;
}
