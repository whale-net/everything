name: 'App Registry: Record Image Artifact'
description: >-
  Resolves a pushed image tag's digest via `docker buildx imagetools
  inspect` and records it as an Artifact via `app-registry artifacts
  record`. Skips (does not fail) if the digest can't be resolved yet,
  matching release.yml's existing best-effort recording behavior.

  Requires APP_REGISTRY_CLI env var already set (see
  .github/actions/download-release-tools), and registry auth already
  configured (e.g. docker/login-action) for repository.

  Best-effort: recording still fails this step's own exit status on a CLI
  error (matching release.yml's `continue-on-error: true` on the calling
  step), but the annotation now distinguishes "app isn't registered yet"
  (owner ran ahead of ReconcileApps -- issue #547, see
  tools/app_registry/ARCHITECTURE.md "Rejected alternatives") and "version
  skew" (the deployed server is missing this RPC -- issue #570, an `::error::`
  since it will not clear on retry) from a plain outage, instead of
  swallowing all three identically.

inputs:
  address:
    required: true
  token-url:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  build-id:
    required: true
  owner-full-name:
    description: '<domain>-<name>, e.g. manmanv2-host-manager'
    required: true
  repository:
    description: 'Full image repository, e.g. ghcr.io/whale-net/manmanv2-host-manager'
    required: true
  version:
    required: true
  idempotency-key:
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ inputs.address }}
        token-url: ${{ inputs.token-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Resolve digest and record artifact
      shell: bash
      env:
        BUILD_ID: ${{ inputs.build-id }}
        OWNER: ${{ inputs.owner-full-name }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
      run: |
        echo "Resolving digest for ${REPOSITORY}:${VERSION}..."
        DIGEST=$(docker buildx imagetools inspect "${REPOSITORY}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')
        if [[ -z "$DIGEST" ]]; then
          echo "::warning::Could not resolve digest for ${REPOSITORY}:${VERSION}; skipping App Registry recording"
          exit 0
        fi

        # issue #547 -- decision: recording stays best-effort/non-blocking
        # (this step is still continue-on-error in release.yml), but "owner
        # not registered yet" must not be swallowed identically to a real
        # registry outage. The CLI exits 3 (exitOwnerNotReconciled, see
        # cli/cmd/root.go) specifically for that case -- it reads a
        # structured gRPC status detail set server-side
        # (apierrors.ReasonOwnerNotReconciled), not a parsed message, so
        # this exit-code check is robust rather than a string match. See
        # tools/app_registry/ARCHITECTURE.md "Rejected alternatives" for why
        # this gap (release running ahead of ReconcileApps) is an accepted
        # tradeoff rather than something patched here.
        set +e
        RECORD_OUTPUT=$("$APP_REGISTRY_CLI" artifacts record \
          --build-id "$BUILD_ID" \
          --kind image \
          --owner "$OWNER" \
          --repository "$REPOSITORY" \
          --version "$VERSION" \
          --digest "$DIGEST" \
          --idempotency-key "$IDEMPOTENCY_KEY" 2>&1)
        RECORD_EXIT=$?
        set -e

        if [[ $RECORD_EXIT -eq 0 ]]; then
          echo "✅ Recorded ${OWNER} ${VERSION} (${DIGEST}) in App Registry"
        elif [[ $RECORD_EXIT -eq 3 ]]; then
          echo "$RECORD_OUTPUT"
          echo "::warning title=App Registry: ${OWNER} not registered yet::${OWNER} is not registered in the App Registry, so ${VERSION} was NOT recorded. This release ran ahead of ReconcileApps, which runs on push to main via ci.yml -- wait for main's CI to finish, then re-run this release job to record it (or accept the miss; the app itself self-heals on the next reconcile, but this specific artifact record will not be backfilled). See tools/app_registry/OPERATIONS.md."
          {
            echo "### ⚠️ App Registry: \`${OWNER}\` not registered yet"
            echo ""
            echo "\`${OWNER}\` \`${VERSION}\` was **not recorded** in the App Registry."
            echo ""
            echo "This release ran ahead of \`ReconcileApps\`, which runs on push to \`main\` via \`ci.yml\`. This is an accepted, documented tradeoff -- see \`tools/app_registry/ARCHITECTURE.md\` (\"Release-vs-reconcile gap\") and \`tools/app_registry/OPERATIONS.md\` (\"Release ran ahead of reconcile\")."
            echo ""
            echo "**What to do:** wait for \`main\`'s CI to finish reconciling, then re-run this release job -- or accept the miss (the app self-heals on the next reconcile; this specific artifact record does not get backfilled)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        elif [[ $RECORD_EXIT -eq 4 ]]; then
          echo "$RECORD_OUTPUT"
          echo "::error title=App Registry: version skew (artifacts record not implemented)::The deployed app-registry-api does not implement recording an image artifact. This is a CI/server version skew (issue #570), not an outage -- ${OWNER} ${VERSION} was NOT recorded, and it will NOT clear on retry. Roll app-registry-api forward, or set APP_REGISTRY_CICD_OPT_IN to false until it is deployed."
          {
            echo "### ❌ App Registry: version skew"
            echo ""
            echo "\`${OWNER}\` \`${VERSION}\` was **not recorded** -- the deployed server does not implement this RPC. This will not clear on retry. See tools/app_registry/ARCHITECTURE.md#availability-and-bootstrap and OPERATIONS.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        else
          echo "$RECORD_OUTPUT"
          echo "::warning title=App Registry: recording skipped (registry error)::Could not record ${OWNER} ${VERSION} in the App Registry -- a registry outage, auth failure, or other transient error (NOT a missing-owner case). Recording is best-effort; the release still succeeded."
          exit 1
        fi
