name: 'Download Release Tools'
description: >-
  Acquires the release_helper_go and app-registry CLI binaries for CI/release workflows.
  In 'published' mode (default), resolves versions in precedence order: explicit
  version overrides, then the version currently promoted to target_env via the App Registry
  gRPC API, then resolves each binary's public S3 download URL via the App Registry's
  ArtifactRegistry/ResolveBinaryURL RPC and downloads it directly (unauthenticated) in <3s
  with automatic SHA256 checksum verification against the published checksums.txt manifest.
  If prebuilt acquisition fails, fails and prompts the user to re-run with build tools per
  pipeline (or builds from source if fallback_to_source is true).
  In 'source' mode, builds tools directly from source via Bazel.
  Exports RELEASE_HELPER and APP_REGISTRY_CLI env vars and outputs.

branding:
  icon: 'download'
  color: 'green'

inputs:
  source:
    description: 'Tool acquisition mode: "published" (App Registry S3 with fallback), "source" (build from source), or "artifact" (workflow artifact)'
    required: false
    default: 'published'
  target_os:
    description: 'Target OS for prebuilt binaries (e.g. linux, darwin). Auto-detected from runner if empty.'
    required: false
    default: ''
  target_arch:
    description: 'Target architecture for prebuilt binaries (e.g. amd64, arm64). Auto-detected from runner if empty.'
    required: false
    default: ''
  release_helper_version:
    description: 'Explicit version override for release_helper_go (if not resolving from App Registry)'
    required: false
    default: ''
  app_registry_version:
    description: 'Explicit version override for app_registry_cli (if not resolving from App Registry)'
    required: false
    default: ''
  target_env:
    description: 'Target environment name for App Registry resolution (e.g. dev, builder, prod)'
    required: false
    default: 'dev'
  github_token:
    description: 'GitHub token for the workflow-artifact fallback (defaults to github.token)'
    required: false
    default: ''
  fallback_to_source:
    description: 'Whether to fall back to Bazel source compilation if prebuilt binary download fails (default false; pipelines should fail and request source build)'
    required: false
    default: 'false'
  name:
    description: 'Artifact name to download when source="artifact"'
    required: false
    default: 'release-tools'

outputs:
  release_helper:
    description: 'Absolute path to release_helper_go binary'
    value: ${{ steps.acquire-release-tools.outputs.release_helper }}
  app_registry_cli:
    description: 'Absolute path to app-registry CLI binary'
    value: ${{ steps.acquire-release-tools.outputs.app_registry_cli }}
  source_used:
    description: 'Actual acquisition source used ("published", "source", or "artifact")'
    value: ${{ steps.acquire-release-tools.outputs.source_used }}

runs:
  using: composite
  steps:
    - name: Download release tools artifact
      if: ${{ inputs.source == 'artifact' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/release-tools

    - name: Acquire release tools
      id: acquire-release-tools
      shell: bash
      env:
        SOURCE_MODE: ${{ inputs.source }}
        TARGET_OS_INPUT: ${{ inputs.target_os }}
        TARGET_ARCH_INPUT: ${{ inputs.target_arch }}
        TARGET_ENV_INPUT: ${{ inputs.target_env }}
        RH_VERSION_OVERRIDE: ${{ inputs.release_helper_version }}
        AR_VERSION_OVERRIDE: ${{ inputs.app_registry_version }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        FALLBACK_TO_SOURCE: ${{ inputs.fallback_to_source }}
        DEST_DIR: ${{ runner.temp }}/release-tools
      run: |
        set -euo pipefail

        compute_sha256() {
          local target="$1"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$target" | awk '{print $1}'
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$target" | awk '{print $1}'
          elif command -v openssl >/dev/null 2>&1; then
            openssl dgst -sha256 "$target" | awk '{print $NF}'
          else
            echo "ERROR: No sha256 calculation utility found" >&2
            return 1
          fi
        }

        verify_checksum() {
          local binary_file="$1"
          local sum_dir="$2"
          local bin_name
          bin_name="$(basename "$binary_file")"
          local actual_hash
          actual_hash="$(compute_sha256 "$binary_file")" || return 1

          local checksum_files=()
          for name in "checksums.txt" "SHA256SUMS" "checksums.sha256" "${bin_name}.sha256"; do
            if [[ -f "$sum_dir/$name" ]]; then
              checksum_files+=("$sum_dir/$name")
            fi
          done

          if [[ ${#checksum_files[@]} -eq 0 ]]; then
            echo "Notice: No checksum file found in $sum_dir for $bin_name"
            return 0
          fi

          for sum_file in "${checksum_files[@]}"; do
            local expected_hash
            expected_hash=$(grep -E "(^|[ /])${bin_name}\$" "$sum_file" 2>/dev/null | awk '{print $1}' | head -n1 || true)
            if [[ -z "$expected_hash" && "$sum_file" == *".sha256" ]]; then
              expected_hash=$(awk '{print $1}' "$sum_file" | head -n1 || true)
            fi
            if [[ -n "$expected_hash" ]]; then
              if [[ "$actual_hash" != "$expected_hash" ]]; then
                echo "ERROR: SHA256 checksum mismatch for $binary_file!" >&2
                echo "  Expected: $expected_hash" >&2
                echo "  Actual:   $actual_hash" >&2
                return 1
              fi
              echo "✓ Verified SHA256 checksum for $bin_name: $actual_hash"
              return 0
            fi
          done

          echo "Notice: $bin_name not explicitly listed in checksum file(s)"
          return 0
        }

        detect_os() {
          local os="${1:-}"
          if [[ -z "$os" ]]; then
            os="$(uname -s 2>/dev/null || echo "linux")"
          fi
          case "$(echo "$os" | tr '[:upper:]' '[:lower:]')" in
            linux*) echo "linux" ;;
            darwin*|macos*) echo "darwin" ;;
            windows*|msys*|mingw*|cygwin*) echo "windows" ;;
            *) echo "linux" ;;
          esac
        }

        detect_arch() {
          local arch="${1:-}"
          if [[ -z "$arch" ]]; then
            arch="$(uname -m 2>/dev/null || echo "amd64")"
          fi
          case "$(echo "$arch" | tr '[:upper:]' '[:lower:]')" in
            x86_64|amd64|x64) echo "amd64" ;;
            aarch64|arm64) echo "arm64" ;;
            armv7*|armhf) echo "armv7" ;;
            *) echo "amd64" ;;
          esac
        }

        TARGET_OS="$(detect_os "$TARGET_OS_INPUT")"
        TARGET_ARCH="$(detect_arch "$TARGET_ARCH_INPUT")"
        mkdir -p "$DEST_DIR"

        RH_PATH="$DEST_DIR/release_helper_go"
        AR_PATH="$DEST_DIR/app-registry"
        SOURCE_USED=""

        if [[ "$SOURCE_MODE" == "artifact" ]]; then
          echo "Using artifact mode in $DEST_DIR..."
          if [[ -f "$RH_PATH" ]]; then
            chmod +x "$RH_PATH"
          fi
          if [[ -f "$AR_PATH" ]]; then
            chmod +x "$AR_PATH"
          fi
          SOURCE_USED="artifact"
        elif [[ "$SOURCE_MODE" == "published" ]]; then
          echo "Mode 'published': Attempting fast download of prebuilt binaries from the App Registry (S3)..."
          echo "Target OS: $TARGET_OS, Target Arch: $TARGET_ARCH"

          RH_VER="$RH_VERSION_OVERRIDE"
          AR_VER="$AR_VERSION_OVERRIDE"

          # --- App Registry gRPC client setup (#780, #859, #983/#985) ---
          # grpcurl + an optional OAuth bearer token back BOTH version
          # resolution (resolve_registry_version, via
          # PromotionRegistry/GetEnvironmentState) and prebuilt-binary URL
          # resolution (resolve_binary_url, via
          # ArtifactRegistry/ResolveBinaryURL) below -- one client mechanism
          # for both (#985's scope: no second HTTP/grpc client). Unlike the
          # pre-#985 code, this setup is needed even when RH_VER/AR_VER are
          # both already known via explicit overrides, since ResolveBinaryURL
          # -- not a GitHub Releases tag guess -- is now what finds the
          # actual download URL.
          GRPCURL_VERSION="1.9.3"
          GRPCURL_BIN=""
          REGISTRY_TOKEN=""

          grpcurl_checksum() {
            case "$1" in
              linux_x86_64) echo "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5" ;;
              linux_arm64)  echo "b20a00c1cb82ab81ec32696766d4076e99b4cb5ca0823a71767ba64dbea0f263" ;;
              osx_x86_64)   echo "246a6669e58c282dcaf0e9dcb06dd1c8681833d59df24eb83d3123ec64c2d2e5" ;;
              osx_arm64)    echo "d8391485e99a728a3a4e82af3fd621f9fdea0c417a74e5122803ad20b207b623" ;;
              *) return 1 ;;
            esac
          }

          install_grpcurl() {
            if command -v grpcurl >/dev/null 2>&1; then
              GRPCURL_BIN="$(command -v grpcurl)"
              return 0
            fi

            local cache_root="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/grpcurl/${GRPCURL_VERSION}"
            local cached_bin="$cache_root/grpcurl"
            if [[ -x "$cached_bin" ]]; then
              GRPCURL_BIN="$cached_bin"
              return 0
            fi

            local host_os host_arch key expected_sha
            host_os="$(uname -s)"
            host_arch="$(uname -m)"
            case "$host_os" in
              Linux) host_os="linux" ;;
              Darwin) host_os="osx" ;;
              *) echo "Notice: unsupported OS for grpcurl install: $host_os" >&2; return 1 ;;
            esac
            case "$host_arch" in
              x86_64|amd64) host_arch="x86_64" ;;
              aarch64|arm64) host_arch="arm64" ;;
              *) echo "Notice: unsupported architecture for grpcurl install: $host_arch" >&2; return 1 ;;
            esac
            key="${host_os}_${host_arch}"
            if ! expected_sha="$(grpcurl_checksum "$key")"; then
              echo "Notice: no known sha256 checksum for grpcurl $GRPCURL_VERSION on $key" >&2
              return 1
            fi

            local tmp_dl url actual_sha
            tmp_dl="$(mktemp -d)"
            url="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_${key}.tar.gz"
            echo "Downloading grpcurl v${GRPCURL_VERSION} from $url..."
            if ! curl -sSL -m 30 -o "$tmp_dl/grpcurl.tar.gz" "$url"; then
              echo "Notice: failed to download grpcurl archive" >&2
              rm -rf "$tmp_dl"
              return 1
            fi

            actual_sha="$(compute_sha256 "$tmp_dl/grpcurl.tar.gz")" || { rm -rf "$tmp_dl"; return 1; }
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Notice: grpcurl checksum mismatch (expected $expected_sha, got $actual_sha)" >&2
              rm -rf "$tmp_dl"
              return 1
            fi

            if ! tar -xzf "$tmp_dl/grpcurl.tar.gz" -C "$tmp_dl" grpcurl; then
              echo "Notice: failed to extract grpcurl binary" >&2
              rm -rf "$tmp_dl"
              return 1
            fi

            mkdir -p "$cache_root"
            cp "$tmp_dl/grpcurl" "$cached_bin"
            chmod +x "$cached_bin"
            rm -rf "$tmp_dl"
            GRPCURL_BIN="$cached_bin"
            return 0
          }

          resolve_registry_version() {
            local app_full_name="$1"
            local grpc_target="$APP_REGISTRY_ADDRESS"
            grpc_target="${grpc_target#https://}"
            grpc_target="${grpc_target#http://}"

            local use_tls=false
            if [[ "$APP_REGISTRY_ADDRESS" == https://* || "$APP_REGISTRY_ADDRESS" == *:443* ]]; then
              use_tls=true
            fi
            if [[ -n "${GRPC_USE_TLS:-}" ]]; then
              [[ "$GRPC_USE_TLS" == "true" ]] && use_tls=true || use_tls=false
            fi
            local -a tls_opt=()
            [[ "$use_tls" == "false" ]] && tls_opt=(-plaintext)

            local -a auth_opt=()
            if [[ -n "$REGISTRY_TOKEN" ]]; then
              auth_opt=(-H "authorization: Bearer $REGISTRY_TOKEN")
            fi

            local get_app_json app_id
            get_app_json="$("$GRPCURL_BIN" "${tls_opt[@]}" "${auth_opt[@]}" -max-time 15 \
              -d "{\"full_name\":\"${app_full_name}\"}" \
              "$grpc_target" appregistry.v1.AppRegistry/GetApp 2>/dev/null)" || true
            app_id="$(echo "$get_app_json" | jq -r '.app.appId // .app.app_id // empty' 2>/dev/null)" || true
            if [[ -z "$app_id" ]]; then
              echo "Notice: could not resolve app_id for $app_full_name from App Registry" >&2
              return 1
            fi

            local env_state_json version
            env_state_json="$("$GRPCURL_BIN" "${tls_opt[@]}" "${auth_opt[@]}" -max-time 15 \
              -d "{\"environment_key\":\"${TARGET_ENV_INPUT}\"}" \
              "$grpc_target" appregistry.v1.PromotionRegistry/GetEnvironmentState 2>/dev/null)" || true
            if [[ -z "$env_state_json" ]]; then
              echo "Notice: empty GetEnvironmentState response for environment '$TARGET_ENV_INPUT'" >&2
              return 1
            fi

            version="$(echo "$env_state_json" | jq -r --arg app_id "$app_id" '
              [.entries[]?
                | select((.artifact.appId // .artifact.app_id) == $app_id)
                | select((.artifact.kind // "") == "ARTIFACT_KIND_BINARY")
              ][0].artifact.version // empty
            ' 2>/dev/null)" || true
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "Notice: no promoted binary version found for $app_full_name in environment '$TARGET_ENV_INPUT'" >&2
              return 1
            fi

            echo "$version"
            return 0
          }

          # resolve_binary_url calls ArtifactRegistry/ResolveBinaryURL (#983)
          # for tool+ver+$TARGET_OS/$TARGET_ARCH and prints
          # "<download_url> <checksum_manifest_url>" (space-separated, one
          # line) on success. An unresolvable (unpublished/unknown)
          # binary+version returns non-zero -- see the RPC's NotFound
          # contract (FR13): never a fabricated URL.
          resolve_binary_url() {
            local tool="$1"
            local ver="$2"
            local grpc_target="$APP_REGISTRY_ADDRESS"
            grpc_target="${grpc_target#https://}"
            grpc_target="${grpc_target#http://}"

            local use_tls=false
            if [[ "$APP_REGISTRY_ADDRESS" == https://* || "$APP_REGISTRY_ADDRESS" == *:443* ]]; then
              use_tls=true
            fi
            if [[ -n "${GRPC_USE_TLS:-}" ]]; then
              [[ "$GRPC_USE_TLS" == "true" ]] && use_tls=true || use_tls=false
            fi
            local -a tls_opt=()
            [[ "$use_tls" == "false" ]] && tls_opt=(-plaintext)

            local -a auth_opt=()
            if [[ -n "$REGISTRY_TOKEN" ]]; then
              auth_opt=(-H "authorization: Bearer $REGISTRY_TOKEN")
            fi

            local resp_json
            resp_json="$("$GRPCURL_BIN" "${tls_opt[@]}" "${auth_opt[@]}" -max-time 15 \
              -d "{\"binary\":\"${tool}\",\"version\":\"${ver}\",\"os\":\"${TARGET_OS}\",\"arch\":\"${TARGET_ARCH}\"}" \
              "$grpc_target" appregistry.v1.ArtifactRegistry/ResolveBinaryURL 2>/dev/null)" || true
            if [[ -z "$resp_json" ]]; then
              echo "Notice: empty ResolveBinaryURL response for $tool $ver ($TARGET_OS/$TARGET_ARCH)" >&2
              return 1
            fi

            local download_url checksum_url
            download_url="$(echo "$resp_json" | jq -r '.downloadUrl // .download_url // empty' 2>/dev/null)" || true
            checksum_url="$(echo "$resp_json" | jq -r '.checksumManifestUrl // .checksum_manifest_url // empty' 2>/dev/null)" || true
            if [[ -z "$download_url" ]]; then
              echo "Notice: ResolveBinaryURL did not return a download_url for $tool $ver ($TARGET_OS/$TARGET_ARCH)" >&2
              return 1
            fi

            echo "$download_url $checksum_url"
            return 0
          }

          # ensure_app_registry_client installs grpcurl and obtains an OAuth
          # bearer token (once -- idempotent, safe to call before every
          # resolve_registry_version/resolve_binary_url call).
          ensure_app_registry_client() {
            if [[ -n "$GRPCURL_BIN" ]]; then
              return 0
            fi
            if [[ -z "${APP_REGISTRY_ADDRESS:-}" ]]; then
              echo "Notice: APP_REGISTRY_ADDRESS env var not present." >&2
              return 1
            fi
            if ! install_grpcurl; then
              echo "Notice: Could not install grpcurl." >&2
              return 1
            fi
            if [[ -n "${GRPC_AUTH_TOKEN_URL:-}" && -n "${GRPC_AUTH_CLIENT_ID:-}" && -n "${GRPC_AUTH_CLIENT_SECRET:-}" ]]; then
              if token_json=$(curl -sS -m 15 -X POST "$GRPC_AUTH_TOKEN_URL" \
                    -d grant_type=client_credentials \
                    -d client_id="$GRPC_AUTH_CLIENT_ID" \
                    -d client_secret="$GRPC_AUTH_CLIENT_SECRET" 2>/dev/null); then
                REGISTRY_TOKEN="$(echo "$token_json" | jq -r '.access_token // empty' 2>/dev/null)" || REGISTRY_TOKEN=""
              fi
            fi
            return 0
          }

          # --- App Registry resolution (#780, #859) ---
          # When versions are not explicitly provided, resolve tool versions directly
          # from the version currently promoted to target_env in App Registry.
          if [[ -z "$RH_VER" || -z "$AR_VER" ]]; then
            if [[ -z "$TARGET_ENV_INPUT" ]]; then
              if [[ "$FALLBACK_TO_SOURCE" == "true" ]]; then
                echo "Notice: No target_env or version override specified. Falling back to source build."
                SOURCE_MODE="source"
              else
                echo "::error title=target_env missing::No target_env or version overrides provided. Please specify target_env or re-run with build tools (e.g. 'use_source_tools: true' or 'source: source')."
                exit 1
              fi
            else
              echo "Attempting App Registry resolution for target_env='$TARGET_ENV_INPUT'..."

              if ! ensure_app_registry_client; then
                if [[ "$FALLBACK_TO_SOURCE" == "true" ]]; then
                  echo "Notice: Could not set up the App Registry gRPC client. Falling back to source build."
                  SOURCE_MODE="source"
                else
                  echo "::error title=App Registry client setup failed::Could not set up the App Registry gRPC client (grpcurl install or APP_REGISTRY_ADDRESS) to resolve release tool versions. Please re-run the pipeline with build tools (e.g. 'use_source_tools: true' or 'source: source')."
                  exit 1
                fi
              else
                if [[ -z "$RH_VER" ]]; then
                  if v="$(resolve_registry_version "tools-release_helper_go")"; then
                    RH_VER="$v"
                    echo "Resolved release_helper_go version from App Registry (env=$TARGET_ENV_INPUT): $RH_VER"
                  elif [[ "$FALLBACK_TO_SOURCE" == "true" ]]; then
                    echo "Notice: Could not resolve promoted version for release_helper_go. Falling back to source build."
                    SOURCE_MODE="source"
                  else
                    echo "::error title=App Registry resolution failed::Could not resolve promoted version for 'release_helper_go' in environment '$TARGET_ENV_INPUT'. Please re-run the pipeline with build tools (e.g. 'use_source_tools: true' or 'source: source') or ensure the tool is promoted in App Registry."
                    exit 1
                  fi
                fi
                if [[ -z "$AR_VER" && "$SOURCE_MODE" == "published" ]]; then
                  if v="$(resolve_registry_version "tools-app-registry")" || v="$(resolve_registry_version "tools-app_registry_cli")"; then
                    AR_VER="$v"
                    echo "Resolved app_registry_cli version from App Registry (env=$TARGET_ENV_INPUT): $AR_VER"
                  elif [[ "$FALLBACK_TO_SOURCE" == "true" ]]; then
                    echo "Notice: Could not resolve promoted version for app_registry_cli. Falling back to source build."
                    SOURCE_MODE="source"
                  else
                    echo "::error title=App Registry resolution failed::Could not resolve promoted version for 'app_registry_cli' in environment '$TARGET_ENV_INPUT'. Please re-run the pipeline with build tools (e.g. 'use_source_tools: true' or 'source: source') or ensure the tool is promoted in App Registry."
                    exit 1
                  fi
                fi
              fi
            fi
          fi

          if [[ "$SOURCE_MODE" == "published" ]]; then
            echo "Release tooling versions: release_helper_go=${RH_VER:-<not set>}, app_registry_cli=${AR_VER:-<not set>}"
            [[ -n "$TARGET_ENV_INPUT" ]] && echo "Target environment for version resolution: $TARGET_ENV_INPUT"

            # download_single_tool_s3 resolves tool's public S3 download/
            # checksum-manifest URLs via ResolveBinaryURL (#983) and fetches
            # both directly (public, unauthenticated -- FR14/NFR2; only the
            # ResolveBinaryURL call itself is authenticated). The binary is
            # saved locally under its exact S3 basename
            # ("<tool>-<os>-<arch>") so this file's existing verify_checksum
            # (unchanged) matches it against its checksums.txt line -- see
            # tools/app_registry/worker/release/finalize.go's
            # cliBinaryS3Key/generateChecksumFiles for why that naming
            # convention is what checksums.txt actually contains.
            download_single_tool_s3() {
              local tool="$1"
              local ver="$2"
              local out_bin="$3"

              if [[ -z "$ver" ]]; then
                echo "Error: No version resolved for $tool" >&2
                return 1
              fi

              if ! ensure_app_registry_client; then
                echo "Notice: Could not set up the App Registry gRPC client to resolve $tool binary URL" >&2
                return 1
              fi

              local urls download_url checksum_url
              if ! urls="$(resolve_binary_url "$tool" "$ver")"; then
                return 1
              fi
              download_url="${urls%% *}"
              checksum_url="${urls#* }"
              [[ "$checksum_url" == "$urls" ]] && checksum_url=""

              local tmp_dl bin_basename bin_dest
              tmp_dl="$(mktemp -d)"
              bin_basename="${tool}-${TARGET_OS}-${TARGET_ARCH}"
              bin_dest="$tmp_dl/$bin_basename"

              echo "Downloading $tool ($ver) from S3: $download_url"
              if ! curl -fsSL -m 60 -o "$bin_dest" "$download_url"; then
                echo "Notice: failed to download $tool binary from $download_url" >&2
                rm -rf "$tmp_dl"
                return 1
              fi

              if [[ -n "$checksum_url" ]]; then
                echo "Downloading checksum manifest for $tool ($ver) from S3: $checksum_url"
                if ! curl -fsSL -m 30 -o "$tmp_dl/checksums.txt" "$checksum_url"; then
                  echo "Notice: failed to download checksum manifest from $checksum_url; proceeding without checksum verification for $tool" >&2
                  rm -f "$tmp_dl/checksums.txt"
                fi
              fi

              if ! verify_checksum "$bin_dest" "$tmp_dl"; then
                echo "ERROR: Checksum verification failed for $bin_dest" >&2
                rm -rf "$tmp_dl"
                return 1
              fi

              cp "$bin_dest" "$out_bin"
              chmod +x "$out_bin"
              rm -rf "$tmp_dl"
              return 0
            }

            DL_OK=true
            if ! download_single_tool_s3 "release_helper_go" "$RH_VER" "$RH_PATH"; then
              DL_OK=false
            fi
            if [[ "$DL_OK" == "true" ]] && ! download_single_tool_s3 "app-registry" "$AR_VER" "$AR_PATH"; then
              DL_OK=false
            fi

            if [[ "$DL_OK" == "true" ]]; then
              echo "✓ Successfully acquired and verified prebuilt release tools from the App Registry (S3)."
              SOURCE_USED="published"
            else
              echo "Notice: Prebuilt release tools download from the App Registry (S3) did not succeed."
              # Attempt to download workflow artifact if available (e.g. from build-release-tools job)
              if command -v gh >/dev/null 2>&1 && [[ -n "${GITHUB_RUN_ID:-}" ]]; then
                echo "Attempting to retrieve 'release-tools' artifact from current workflow run..."
                if gh run download "$GITHUB_RUN_ID" -n "release-tools" --dir "$DEST_DIR" 2>/dev/null; then
                  if [[ -f "$RH_PATH" ]]; then
                    chmod +x "$RH_PATH"
                  fi
                  if [[ -f "$AR_PATH" ]]; then
                    chmod +x "$AR_PATH"
                  fi
                  if [[ -x "$RH_PATH" || -x "$AR_PATH" ]]; then
                    echo "✓ Successfully retrieved release tools from workflow artifact."
                    SOURCE_USED="artifact"
                  fi
                fi
              fi

              if [[ -z "$SOURCE_USED" ]]; then
                if [[ "$FALLBACK_TO_SOURCE" == "true" ]]; then
                  echo "::warning title=Prebuilt release tools download failed::Could not download prebuilt release tools or workflow artifact. Falling back to source build via Bazel."
                  SOURCE_MODE="source"
                else
                  echo "::error title=Prebuilt release tools download failed::Failed to acquire prebuilt release tools. Fallback to inline source compilation is disabled. Please re-run the pipeline with build tools (e.g. 'use_source_tools: true' or 'source: source') to build release tools from source."
                  exit 1
                fi
              fi
            fi
          fi
        fi

        if [[ "$SOURCE_MODE" == "source" ]]; then
          echo "Building release tools from source using Bazel..."
          if ! bazel build --config=ci-images \
            //tools/release_helper_go:release_helper_go \
            //tools/app_registry/cli:app-registry; then
            echo "Building without --config=ci-images fallback..."
            bazel build \
              //tools/release_helper_go:release_helper_go \
              //tools/app_registry/cli:app-registry
          fi

          BAZEL_BIN="$(bazel info bazel-bin --config=ci-images 2>/dev/null || bazel info bazel-bin 2>/dev/null || echo "bazel-bin")"

          SRC_RH=""
          for cand in \
            "$BAZEL_BIN/tools/release_helper_go/release_helper_go_/release_helper_go" \
            "$BAZEL_BIN/tools/release_helper_go/release_helper_go"; do
            if [[ -f "$cand" ]]; then
              SRC_RH="$cand"
              break
            fi
          done

          SRC_AR=""
          for cand in \
            "$BAZEL_BIN/tools/app_registry/cli/app-registry_/app-registry" \
            "$BAZEL_BIN/tools/app_registry/cli/app-registry"; do
            if [[ -f "$cand" ]]; then
              SRC_AR="$cand"
              break
            fi
          done

          if [[ -z "$SRC_RH" || -z "$SRC_AR" ]]; then
            echo "::error::Failed to find built binaries in $BAZEL_BIN"
            exit 1
          fi

          cp "$SRC_RH" "$RH_PATH"
          cp "$SRC_AR" "$AR_PATH"
          chmod +x "$RH_PATH" "$AR_PATH"
          SOURCE_USED="source"
        fi

        # Export paths to GITHUB_ENV and GITHUB_OUTPUT
        if [[ -f "$RH_PATH" ]]; then
          echo "RELEASE_HELPER=$RH_PATH" >> "$GITHUB_ENV"
          echo "release_helper=$RH_PATH" >> "$GITHUB_OUTPUT"
          echo "Exported RELEASE_HELPER=$RH_PATH"
        fi
        if [[ -f "$AR_PATH" ]]; then
          echo "APP_REGISTRY_CLI=$AR_PATH" >> "$GITHUB_ENV"
          echo "app_registry_cli=$AR_PATH" >> "$GITHUB_OUTPUT"
          echo "Exported APP_REGISTRY_CLI=$AR_PATH"
        fi
        echo "source_used=$SOURCE_USED" >> "$GITHUB_OUTPUT"
        echo "Source used: $SOURCE_USED"
