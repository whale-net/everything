name: 'App Registry: Begin Publish'
description: >-
  Transitions an artifact to "publishing" via `app-registry artifacts
  begin-publish`, immediately before the image/chart it names is pushed --
  AR-7b (issue #558), see tools/app_registry/ARCHITECTURE.md "Artifact
  lifecycle: allocated -> publishing -> published". ∅|allocated|failed ->
  publishing: works whether or not a prior AllocateVersion call reserved
  this version (it does not, at every domain today -- see PLAN.md's AR-5a
  status), which is what lets this step run unconditionally ahead of every
  push regardless of a domain's adoption stage.

  AR-7d (issue #558) added a second, equally load-bearing purpose: when
  release.yml's plan-time app-registry-begin-publish-batch step has
  already put this target in "publishing", this call is a
  publishing -> publishing heartbeat -- it re-arms state_changed_at right
  before this leg's own push (so the stale-row reaper's timeout bounds one
  leg, not the whole run) and revives (failed -> publishing) a row the
  reaper already expired while this leg was still queued. See
  tools/app_registry/ARCHITECTURE.md "The run log" -> "As built (AR-7d)"
  and repository.ArtifactRepository.BeginPublish's doc comment. This only
  works because this step's idempotency key deliberately does NOT collide
  with the batch call's key for the same target (the batch call appends
  "-intent" server-side) -- otherwise this call would replay the batch's
  cached response instead of re-executing.

  Requires APP_REGISTRY_CLI env var already set (see
  .github/actions/download-release-tools).

  Best-effort by default: like app-registry-record-build/-image, this step
  still fails its own exit status on error (matching the calling step's
  `continue-on-error: true`), so a caller can branch on
  `steps.<id>.outcome` to decide whether to attempt FailPublish later.

  Version skew (issue #570): the CLI exits 4 (exitVersionSkew, see
  cli/cmd/root.go) when the deployed server doesn't implement BeginPublish at
  all -- that gets an `::error::` annotation instead of the `::warning::` a
  plain outage gets, since it will not clear on retry.

inputs:
  address:
    required: true
  token-url:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  kind:
    description: 'image | chart'
    required: true
  owner-full-name:
    description: '<domain>-<name>, e.g. manmanv2-host-manager'
    required: true
  version:
    description: 'Semver tag, e.g. v1.2.3'
    required: true
  build-id:
    required: true
  idempotency-key:
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ inputs.address }}
        token-url: ${{ inputs.token-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Begin publish
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        OWNER: ${{ inputs.owner-full-name }}
        VERSION: ${{ inputs.version }}
        BUILD_ID: ${{ inputs.build-id }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
      run: |
        set +e
        BEGIN_OUTPUT=$("$APP_REGISTRY_CLI" artifacts begin-publish \
          --kind "$KIND" \
          --owner "$OWNER" \
          --version "$VERSION" \
          --build-id "$BUILD_ID" \
          --idempotency-key "$IDEMPOTENCY_KEY" 2>&1)
        BEGIN_EXIT=$?
        set -e

        if [[ $BEGIN_EXIT -eq 4 ]]; then
          echo "$BEGIN_OUTPUT"
          echo "::error title=App Registry: version skew (begin-publish not implemented)::The deployed app-registry-api does not implement BeginPublish. This is a CI/server version skew (issue #570), not an outage -- it will NOT clear on retry. Roll app-registry-api forward, or set APP_REGISTRY_CICD_OPT_IN to false until it is deployed. The push still proceeds."
          exit 1
        elif [[ $BEGIN_EXIT -ne 0 ]]; then
          echo "$BEGIN_OUTPUT"
          echo "::warning title=App Registry: begin-publish skipped (registry error)::Could not transition ${OWNER} ${VERSION} to 'publishing' in the App Registry -- a registry outage, auth failure, or other transient error. Recording is best-effort; the push still proceeds."
          exit 1
        fi

        echo "✅ ${OWNER} ${VERSION} is now 'publishing' in App Registry"
