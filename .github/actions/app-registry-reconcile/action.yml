name: 'App Registry: Reconcile Apps/Charts'
description: >-
  Discovers every release_app/helm_chart manifest via `release_helper_go
  manifest-set` and reconciles it into the App Registry via
  `app-registry apps reconcile`, registering any app/chart the registry
  doesn't know about yet. Must run before any RecordBuild/RecordArtifact
  call that resolves an owner by full name -- see
  tools/app_registry/README.md's recording sequence diagram. Skipping this
  makes RecordArtifact's owner lookup fail with an InvalidArgument naming
  the never-reconciled app/chart (see issue #539, its follow-up #542, and
  the error-message fix in #548).

  Requires RELEASE_HELPER and APP_REGISTRY_CLI env vars already set (see
  .github/actions/download-release-tools).

inputs:
  address:
    required: true
  token-url:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  git-sha:
    description: 'Commit SHA to record on the manifest set -- typically github.sha'
    required: true
  idempotency-key:
    required: true
  fast-mode:
    description: >-
      When 'true', passes --fast to `release_helper_go manifest-set`, which
      statically parses BUILD.bazel files instead of shelling out to bazel
      query/cquery -- see docs/RELEASE_HELPER_FAST_MODE.md. Callers should
      pass ${{ vars.RELEASE_HELPER_FAST_MODE }} through here rather than
      hardcoding 'true'/'false', so the toggle stays a single repo variable.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ inputs.address }}
        token-url: ${{ inputs.token-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Reconcile apps/charts
      shell: bash
      env:
        GIT_SHA: ${{ inputs.git-sha }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
        FAST_MODE: ${{ inputs.fast-mode }}
      # `manifest-set` resolves AppManifestSet.source_committed_at itself
      # via `git log -1 --format=%ct "$GIT_SHA"` -- no new flag needed here,
      # it flows through automatically once release_helper_go supports it
      # (see tools/app_registry/ARCHITECTURE.md "Reconcile watermark",
      # issue #545). This resolves fine even though ci.yml's checkout step
      # for this job uses the default fetch-depth (1): a fetch-depth: 1
      # checkout of a push event still fetches the full commit object for
      # github.sha (verified locally -- `git log -1 --format=%ct <sha>`
      # succeeds against a --depth 1 clone of that sha's tip), just not any
      # ancestor history, which this call doesn't need. If GIT_SHA is ever
      # something OTHER than the checked-out tip (e.g. this action is
      # reused against an arbitrary historical ref), `git log` fails and
      # manifest-set falls back to source_committed_at = 0 -- see
      # resolveSourceCommittedAt's doc comment -- rather than failing the
      # step.
      run: |
        # FAST_MODE (from inputs.fast-mode, normally the RELEASE_HELPER_FAST_MODE
        # repo variable) is empty when the variable is unset -- normalize to a
        # real "true"/"false" so --fast= never gets an empty value.
        FAST="false"
        if [[ "$FAST_MODE" == "true" ]]; then
          FAST="true"
        fi
        "$RELEASE_HELPER" manifest-set --fast="$FAST" --git-sha "$GIT_SHA" > "$RUNNER_TEMP/manifest-set.json"
        "$APP_REGISTRY_CLI" apps reconcile \
          --from-plan "$RUNNER_TEMP/manifest-set.json" \
          --idempotency-key "$IDEMPOTENCY_KEY"
