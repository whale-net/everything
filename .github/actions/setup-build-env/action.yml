name: 'Setup Build Environment'
description: 'Sets up Bazel, Python, Go, and Docker for CI/CD workflows'
branding:
  icon: 'settings'
  color: 'green'

inputs:
  setup-docker:
    description: 'Whether to setup Docker Buildx'
    required: false
    default: 'false'
  cache-suffix:
    description: 'Suffix to add to cache keys for isolation'
    required: false
    default: ''
  bazel-remote-cache-url:
    description: 'HTTP URL for Bazel remote cache from secrets'
    required: false
    default: ''
  bazel-remote-cache-user:
    description: 'Username for remote cache basic auth from secrets'
    required: false
    default: ''
  bazel-remote-cache-password:
    description: 'Password for remote cache basic auth from secrets'
    required: false
    default: ''
  bazel-remote-downloader-url:
    description: 'gRPC URL for Bazel remote asset downloader from secrets/vars (e.g. grpc://host:9092 or grpcs://host:443)'
    required: false
    default: ''

outputs:
  bazel-cache-hit:
    description: 'Whether Bazel cache was hit'
    value: ${{ steps.setup-bazel.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Report disk space
      shell: bash
      run: df -h /

    - name: Cache Bazel External Repositories (all sizes)
      uses: actions/cache@v6
      with:
        # Cache the entire external/ directory — this complements setup-bazel's
        # per-repo external-cache (which only caches repos >=10MB) by also
        # capturing all the small Go module repos that fall below that threshold.
        # Key includes MODULE.bazel so the cache is invalidated on any dep change.
        #
        # v2: bumped from v1 because a run that was cancelled/failed mid-fetch
        # saved an incomplete external/ dir (missing rules_go's extracted Go
        # SDK binary) under a v1 key, and every subsequent run restored that
        # same broken cache -- exact-key hits never get overwritten by a
        # later successful run, only a cache-key change forces a clean save.
        # See CI run 33572384271 (bin/go: No such file or directory).
        path: ~/.bazel/external
        key: bazel-external-v2-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'WORKSPACE.bazel', 'WORKSPACE.bzlmod', 'WORKSPACE') }}
        restore-keys: |
          bazel-external-v2-${{ runner.os }}-

    - name: Setup Remote Cache Environment
      shell: bash
      env:
        # Passed via env (not templated into the script body) so the raw
        # secret values never appear in the rendered/logged step command,
        # and so a value containing shell metacharacters (', ", $(...))
        # can't inject into the script.
        CACHE_URL: ${{ inputs.bazel-remote-cache-url }}
        CACHE_USER: ${{ inputs.bazel-remote-cache-user }}
        CACHE_PASSWORD: ${{ inputs.bazel-remote-cache-password }}
        DOWNLOADER_URL: ${{ inputs.bazel-remote-downloader-url }}
      run: |
        # Configure remote cache and/or remote asset downloader if provided
        HAS_REMOTE_CACHE=false
        HAS_REMOTE_DOWNLOADER=false

        if [[ -n "$CACHE_URL" ]]; then
          HAS_REMOTE_CACHE=true
        fi

        if [[ -n "$DOWNLOADER_URL" ]]; then
          HAS_REMOTE_DOWNLOADER=true
        fi

        if [[ "$HAS_REMOTE_CACHE" = "true" || "$HAS_REMOTE_DOWNLOADER" = "true" ]]; then
          # Initialize .bazelrc.remote
          cat > .bazelrc.remote << 'EOF'
        # Remote cache & downloader configuration (auto-generated)
        EOF

          if [[ "$HAS_REMOTE_CACHE" = "true" ]]; then
            echo "Setting up Bazel remote cache..."

            # Check if CACHE_URL is gRPC (grpc:// or grpcs://) vs HTTP (http:// or https://)
            if [[ "$CACHE_URL" =~ ^grpcs?:// ]]; then
              echo "build --remote_cache=${CACHE_URL}" >> .bazelrc.remote
              echo "build --remote_upload_local_results=true" >> .bazelrc.remote
              if [[ -n "$CACHE_USER" && -n "$CACHE_PASSWORD" ]]; then
                AUTH_BASE64=$(printf '%s' "${CACHE_USER}:${CACHE_PASSWORD}" | base64 -w 0)
                # Mask the encoded credential in logs too: it's trivially
                # reversible (plain base64, not a hash), so anywhere Bazel
                # or Actions might echo the resolved --remote_header flag
                # (e.g. --announce_rc's "Inherited 'build' options" banner)
                # would otherwise leak it verbatim.
                echo "::add-mask::${AUTH_BASE64}"
                echo "build --remote_header=Authorization=\"Basic ${AUTH_BASE64}\"" >> .bazelrc.remote
              fi
            else
              # HTTP-based remote cache: embed credentials in URL
              if [[ -n "$CACHE_USER" && -n "$CACHE_PASSWORD" ]]; then
                PROTOCOL=$(echo "$CACHE_URL" | sed -n 's#^\([^:]*\)://.*#\1#p')
                HOST_PATH=$(echo "$CACHE_URL" | sed -n 's#^[^:]*://\(.*\)#\1#p')
                CACHE_URL="${PROTOCOL}://${CACHE_USER}:${CACHE_PASSWORD}@${HOST_PATH}"
                echo "::add-mask::${CACHE_URL}"
              fi
              echo "build --remote_cache=${CACHE_URL}" >> .bazelrc.remote
              echo "build --remote_upload_local_results=true" >> .bazelrc.remote
            fi

            echo "✅ Remote cache configured at: ${{ inputs.bazel-remote-cache-url }}"
          fi

          if [[ "$HAS_REMOTE_DOWNLOADER" = "true" ]]; then
            echo "Setting up Bazel remote asset downloader..."

            echo "build --experimental_remote_downloader=${DOWNLOADER_URL}" >> .bazelrc.remote

            if [[ -n "$CACHE_USER" && -n "$CACHE_PASSWORD" ]]; then
              AUTH_BASE64=$(printf '%s' "${CACHE_USER}:${CACHE_PASSWORD}" | base64 -w 0)
              echo "::add-mask::${AUTH_BASE64}"
              echo "build --remote_downloader_header=Authorization=\"Basic ${AUTH_BASE64}\"" >> .bazelrc.remote
            fi

            echo "✅ Remote asset downloader configured at: ${{ inputs.bazel-remote-downloader-url }}"
          fi
        else
          echo "No remote cache or downloader URL provided, using local caching only"
          # Remove any existing .bazelrc.remote file to ensure clean state
          rm -f .bazelrc.remote
        fi

    - name: Setup Bazel with Optimized Caching
      id: setup-bazel
      uses: bazel-contrib/setup-bazel@0.19.0
      with:
        # Enable bazelisk binary caching (minimal overhead)
        bazelisk-cache: true
        # Enable repository cache for all external dependencies (single consolidated cache)
        repository-cache: true
        # Enable external-cache to avoid re-running all repository rules on every CI run.
        # Without this, Bazel re-evaluates ~200+ repo rules (Go gazelle, pigweed, Python
        # toolchain, OCI image manifests) from scratch each run, costing ~125s of analysis
        # time before any build actions run. With this enabled, the external/ output-base
        # directories are cached; combined with --noexperimental_check_external_repository_files
        # in .bazelrc:ci, Bazel skips all repo-rule re-evaluation on cache hits.
        external-cache: true
        # Disk cache - disabled to avoid duplicating the Bazel remote cache into GHA's 10GB cache limit
        disk-cache: false

    - name: Warm up Go SDK
      shell: bash
      run: |
        # Works around a race in Bazel/Gazelle's bzlmod repository-rule
        # resolution: gazelle's go_repository_tools repo can start executing
        # before rules_go's go_sdk download+extract has fully materialized,
        # failing with "env: '.../go_sdk+main___download_0/bin/go': No such
        # file or directory" (or, seen once, a truncated stdlib extraction --
        # "cannot find package 'os'/'fmt'/'runtime'"). Two parallel CI jobs
        # from the same clean commit have been observed to split on this --
        # one green, one red -- ruling out cache corruption.
        #
        # An earlier version of this warm-up built a small go_library target
        # instead of fetching this repo directly. That didn't help: gazelle's
        # go_deps extension resolves its *entire* dependency graph as one
        # unit regardless of target scope, so even a "narrow" go target still
        # triggered the same wide parallel fetch this step exists to avoid.
        #
        # Fetching the go_sdk repo by its canonical label bypasses go_deps
        # entirely -- nothing else fetches in parallel -- so go_sdk finishes
        # and gets memoized in this output_base before anything that could
        # race it starts. The canonical name is derived from MODULE.bazel's
        # rules_go bazel_dep + go_sdk.download() call and is stable as long
        # as those aren't changed; if a rules_go upgrade renames it, this
        # step will fail loudly (unknown repository) rather than silently
        # no-op.
        bazel fetch --config=ci @@rules_go++go_sdk+main___download_0//...

    - name: Set up Docker Buildx
      if: ${{ inputs.setup-docker == 'true' }}
      uses: docker/setup-buildx-action@v3