name: 'App Registry: Record Build'
description: >-
  Records (or idempotently replays) the Build row for one CI run via
  `app-registry builds record`. One Build row represents one workflow run,
  not one app -- callers that pass the same idempotency-key (workflow run
  id + attempt) safely collapse onto the same row and get the same
  build-id back, which is how release.yml's per-app matrix jobs all attach
  their artifacts to a single build.

  Requires APP_REGISTRY_CLI env var already set (see
  .github/actions/download-release-tools).

  Best-effort: a failure here can only be a registry error (RecordBuild
  never resolves an owner, so it cannot hit issue #547's "app not
  registered yet" case -- see server/handlers/artifact.go) -- this step
  still fails its own exit status (matching release.yml's
  `continue-on-error: true` on the calling step) with an annotation naming
  that, and downstream steps that depend on `build-id` are already
  conditioned on it being non-empty so they skip cleanly.

  Version skew (issue #570) is called out separately from a plain outage:
  the CLI exits 4 (exitVersionSkew, see cli/cmd/root.go) when the deployed
  app-registry-api doesn't implement RecordBuild at all (codes.Unimplemented)
  -- a deployment defect that will not clear on retry -- so that case gets
  an `::error::` annotation instead of the `::warning::` an outage gets.

inputs:
  address:
    required: true
  token-url:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  git-sha:
    required: true
  git-ref:
    required: true
  workflow-run-id:
    required: true
  workflow-attempt:
    required: true
  actor:
    required: true
  idempotency-key:
    required: true

outputs:
  build-id:
    description: 'The recorded (or replayed) build_id'
    value: ${{ steps.record.outputs.build-id }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ inputs.address }}
        token-url: ${{ inputs.token-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Record build
      id: record
      shell: bash
      env:
        GIT_SHA: ${{ inputs.git-sha }}
        GIT_REF: ${{ inputs.git-ref }}
        WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
        WORKFLOW_ATTEMPT: ${{ inputs.workflow-attempt }}
        ACTOR: ${{ inputs.actor }}
        IDEMPOTENCY_KEY: ${{ inputs.idempotency-key }}
      run: |
        # issue #547 -- see the "Best-effort" note above: RecordBuild cannot
        # hit the owner-not-reconciled case (exit 3, see cli/cmd/root.go),
        # so any nonzero exit here is a genuine registry error (outage,
        # auth failure, timeout). Classified the same way as
        # app-registry-record-image so the two actions read as one story
        # rather than one having annotations and the other not.
        set +e
        BUILD_JSON=$("$APP_REGISTRY_CLI" builds record \
          --git-sha "$GIT_SHA" \
          --git-ref "$GIT_REF" \
          --workflow-run-id "$WORKFLOW_RUN_ID" \
          --workflow-attempt "$WORKFLOW_ATTEMPT" \
          --actor "$ACTOR" \
          --idempotency-key "$IDEMPOTENCY_KEY" 2>&1)
        RECORD_EXIT=$?
        set -e

        if [[ $RECORD_EXIT -eq 4 ]]; then
          echo "$BUILD_JSON"
          echo "::error title=App Registry: version skew (RecordBuild not implemented)::The deployed app-registry-api does not implement RecordBuild. This is a CI/server version skew (issue #570), not an outage -- it will NOT clear on retry. Roll app-registry-api forward, or set APP_REGISTRY_CICD_OPT_IN to false until it is deployed. Downstream App Registry steps for this job will skip, since no build-id was returned."
          {
            echo "### ❌ App Registry: version skew"
            echo ""
            echo "RecordBuild failed for workflow run \`${WORKFLOW_RUN_ID}\` (attempt \`${WORKFLOW_ATTEMPT}\`) -- the deployed server does not implement this RPC. This will not clear on retry. See tools/app_registry/ARCHITECTURE.md#availability-and-bootstrap and OPERATIONS.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        elif [[ $RECORD_EXIT -ne 0 ]]; then
          echo "$BUILD_JSON"
          echo "::warning title=App Registry: build recording skipped (registry error)::Could not record this workflow run's build in the App Registry -- a registry outage, auth failure, or other transient error. Recording is best-effort; the release still succeeded. Downstream App Registry steps for this job will skip, since no build-id was returned."
          {
            echo "### ⚠️ App Registry: build recording skipped"
            echo ""
            echo "RecordBuild failed for workflow run \`${WORKFLOW_RUN_ID}\` (attempt \`${WORKFLOW_ATTEMPT}\`) -- registry error, not a missing-owner case. See tools/app_registry/OPERATIONS.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.build.buildId')
        echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
        echo "✅ Recorded build ${BUILD_ID} in App Registry"
