name: 'App Registry: Begin Publish Batch'
description: >-
  Transitions EVERY target of a release run to "publishing" via
  `app-registry artifacts begin-publish-batch`, called ONCE from the
  release plan step before the release matrix fans out -- AR-7d (issue
  #558), closing the gap AR-7b's own scope note left open: a matrix leg
  that never starts at all previously left no row of any kind, so
  `app-registry builds status`/GetReleaseRun could not distinguish "never
  started" from "not part of this run". See
  tools/app_registry/ARCHITECTURE.md "The run log" -> "As built (AR-7d)".

  Requires APP_REGISTRY_CLI env var already set (see
  .github/actions/download-release-tools).

  Best-effort by default, like every other App Registry recording step:
  still fails its own exit status on error (matching the calling step's
  `continue-on-error: true`) so a registry outage warns rather than
  blocking the release. A per-target failure (e.g. an owner not yet
  reconciled) is reported as a `::warning::` per target by the CLI and
  does NOT block the other targets in the same batch -- see
  cli/cmd/artifacts.go's newArtifactsBeginPublishBatchCmd.

inputs:
  address:
    required: true
  token-url:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  build-id:
    required: true
  targets-file:
    description: 'Path to a JSON array of {"kind","owner","version"} targets'
    required: true
  idempotency-key-prefix:
    description: '<workflow_run_id>-<attempt> -- each target''s own key is derived as <prefix>-<owner>-<kind>-intent. The "-intent" suffix is deliberate: it keeps this batch call''s key distinct from the per-leg app-registry-begin-publish step''s key for the same target, so the per-leg call actually re-executes (a heartbeat/revive) instead of replaying this call''s cached response.'
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ inputs.address }}
        token-url: ${{ inputs.token-url }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}

    - name: Begin publish batch
      shell: bash
      env:
        BUILD_ID: ${{ inputs.build-id }}
        TARGETS_FILE: ${{ inputs.targets-file }}
        IDEMPOTENCY_KEY_PREFIX: ${{ inputs.idempotency-key-prefix }}
      run: |
        set +e
        BATCH_OUTPUT=$("$APP_REGISTRY_CLI" artifacts begin-publish-batch \
          --build-id "$BUILD_ID" \
          --targets "$TARGETS_FILE" \
          --idempotency-key-prefix "$IDEMPOTENCY_KEY_PREFIX" 2>&1)
        BATCH_EXIT=$?
        set -e

        echo "$BATCH_OUTPUT"
        if [[ $BATCH_EXIT -ne 0 ]]; then
          echo "::warning title=App Registry: begin-publish-batch skipped or partial (registry error)::Could not transition every release target to 'publishing' up front -- a registry outage, auth failure, or a target whose owner isn't reconciled yet. Recording is best-effort; the release still proceeds. Targets left un-declared fall back to being recorded per-leg as before, and won't show up as 'incomplete' in \`app-registry builds status\` if their own leg never runs -- see OPERATIONS.md."
          exit 1
        fi

        echo "✅ begin-publish-batch declared intent for every release target up front"
