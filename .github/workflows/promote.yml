name: Promote (Deprecated)

# DEPRECATED / DISABLED: The promote workflow is disabled for now.
# Keycloak promoter clients and promotion GitHub Environments (dev/stage/prod)
# are not active.
#
# Human-triggered promotion / rollback against the App Registry. See
# tools/app_registry/PLAN.md -> "AR-3 -> Credential model (decided)" and
# ARCHITECTURE.md -> "Authorization": the `environment:` declaration on the
# `promote` job below is the entire security model for this workflow, not a
# formality. It is what scopes the job to the target GitHub Environment's
# secrets (so only that environment's `APP_REGISTRY_PROMOTER_CLIENT_SECRET`
# is readable) and what triggers that environment's required reviewers. A
# builder credential is never in scope here -- it lives in a repository
# secret and carries no promoter role regardless.
#
# `environment` (the GitHub Environment) and `registry_environment` (the
# Keycloak app-registry-promoter-<key> suffix / App Registry --env) are two
# separate inputs on purpose: the GitHub Environment name is whatever this
# repo's Environments happen to be called (e.g. promotion-dev), which need
# not equal the App Registry's environment key (dev/stage/prod). A caller who
# mismatches them just fails Keycloak auth -- the wrong client id paired with
# the right environment's secret does not authenticate -- so decoupling the
# two does not weaken the security scoping above.
#
# Unlike the best-effort AR-2c recording steps in release.yml, the promote
# step below is NOT continue-on-error: a promotion that silently fails while
# the workflow shows green is exactly the failure mode this system exists to
# prevent.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment this job runs under (controls which APP_REGISTRY_PROMOTER_CLIENT_SECRET and required reviewers apply). May be named anything (e.g. promotion-dev) -- it does not have to match registry_environment.'
        required: true
      registry_environment:
        description: 'App Registry environment key / Keycloak app-registry-promoter-<key> client suffix. Must match a real app-registry-promoter-<key> client regardless of what the GitHub Environment above is named.'
        type: choice
        options:
          - dev
          - stage
          - prod
        required: true
      action:
        description: 'promote a specific version, or roll back to whatever was previously current'
        type: choice
        options:
          - promote
          - rollback
        default: promote
      owner_full_name:
        description: 'App, chart, or tool binary identity, as <domain>-<name> (e.g. manmanv2-host-manager, or tools-release_helper_go for a tool binary)'
        required: true
      kind:
        description: 'Which artifact kind owner_full_name refers to. Charts, images, and binaries can share a name, so this is what disambiguates them.'
        type: choice
        options:
          - image
          - chart
          - binary
        default: image
      version:
        description: 'Version to promote, e.g. v1.4.0. Required for action=promote; ignored for action=rollback.'
        required: false
      reason:
        description: 'Why -- required above dev rank, recorded in the audit log'
        required: false
      allow_override:
        description: 'Acknowledge promoting a VIA_CHART image directly, bypassing its chart (promote only)'
        type: boolean
        default: false
      dry_run:
        description: 'Compute the resulting state without writing'
        type: boolean
        default: false
      use_source_tools:
        description: 'Build release tools from source instead of downloading pinned prebuilt binaries (safety valve)'
        required: false
        default: false
        type: boolean

jobs:
  promote:
    name: ${{ inputs.action }} ${{ inputs.owner_full_name }} -> ${{ inputs.registry_environment }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: false
    # This is the security-critical line -- see the header comment above.
    # It scopes the job to the named GitHub Environment's secrets and
    # required reviewers. Deliberately the GitHub Environment name, NOT
    # registry_environment -- the two are allowed to differ (e.g. GitHub
    # Environment "promotion-dev" vs registry key "dev").
    environment: ${{ inputs.environment }}
    steps:
    # Every `run:` block in this workflow reads inputs through `env:` rather
    # than interpolating `${{ inputs.* }}` directly into the script. Direct
    # interpolation splices attacker-controlled text into bash before the
    # shell ever sees it, so a crafted owner_full_name or reason would run as
    # code in a job that holds a promoter client secret. Via `env:` the value
    # is only ever a shell variable. Keep it that way when editing.
    - name: Validate inputs
      env:
        ACTION: ${{ inputs.action }}
        VERSION: ${{ inputs.version }}
      run: |
        if [[ "$ACTION" == "promote" && -z "$VERSION" ]]; then
          echo "::error::version is required when action=promote"
          exit 1
        fi
        echo "✅ inputs validated"

    - name: Checkout code
      uses: actions/checkout@v7

    # Read from *this job's* Environment secrets (scoped by `environment:`
    # above), never from repository secrets. See DEPLOY.md "Where each
    # secret goes" -- each GitHub Environment holds the promoter client
    # secret matching whatever registry_environment its operators pass.
    - name: App Registry Auth
      uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ vars.APP_REGISTRY_ADDRESS }}
        token-url: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
        client-id: app-registry-promoter-${{ inputs.registry_environment }}
        client-secret: ${{ secrets.APP_REGISTRY_PROMOTER_CLIENT_SECRET }}

    - name: Download release tools
      id: download_tools
      uses: ./.github/actions/download-release-tools
      with:
        source: ${{ (inputs.use_source_tools == true || inputs.use_source_tools == 'true') && 'source' || 'published' }}
        target_env: ${{ inputs.registry_environment }}

    - name: Promote
      if: inputs.action == 'promote'
      env:
        ENVIRONMENT: ${{ inputs.registry_environment }}
        OWNER_FULL_NAME: ${{ inputs.owner_full_name }}
        KIND: ${{ inputs.kind }}
        VERSION: ${{ inputs.version }}
        REASON: ${{ inputs.reason }}
        ALLOW_OVERRIDE: ${{ inputs.allow_override }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        ARGS=(promote "$OWNER_FULL_NAME" "$VERSION" --env "$ENVIRONMENT" --kind "$KIND")
        if [[ -n "$REASON" ]]; then
          ARGS+=(--reason "$REASON")
        fi
        if [[ "$ALLOW_OVERRIDE" == "true" ]]; then
          ARGS+=(--allow-override)
        fi
        if [[ "$DRY_RUN" == "true" ]]; then
          ARGS+=(--dry-run)
        fi

        "$APP_REGISTRY_CLI" "${ARGS[@]}"

    - name: Rollback
      if: inputs.action == 'rollback'
      env:
        ENVIRONMENT: ${{ inputs.registry_environment }}
        OWNER_FULL_NAME: ${{ inputs.owner_full_name }}
        KIND: ${{ inputs.kind }}
        REASON: ${{ inputs.reason }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        ARGS=(rollback "$OWNER_FULL_NAME" --env "$ENVIRONMENT" --kind "$KIND")
        if [[ -n "$REASON" ]]; then
          ARGS+=(--reason "$REASON")
        fi
        if [[ "$DRY_RUN" == "true" ]]; then
          ARGS+=(--dry-run)
        fi

        "$APP_REGISTRY_CLI" "${ARGS[@]}"

    # No continue-on-error anywhere above: a failed promotion must fail the
    # job loudly, unlike the best-effort recording steps in release.yml.
