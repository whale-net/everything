name: CI

on:
  # No branches filter here: stacked PRs target other feature branches, not
  # just main, and still need CI to run.
  pull_request:
  push:
    branches: [ main ]

jobs:
  # Registers/updates every release_app and helm_chart manifest as an
  # app/chart row in the App Registry. Runs on every push to main only
  # (never on pull_request, never from release.yml) so it always reconciles
  # against the current, complete tree -- see ARCHITECTURE.md "Rejected
  # alternatives" and DEPLOY.md "CI wiring (AR-3d)" for why this can't
  # safely live in release.yml, which may be dispatched against an
  # arbitrary, possibly older ref.
  #
  # AR-7a (PLAN.md): NOT continue-on-error. See ARCHITECTURE.md "Availability,
  # restated per adoption stage" -- the main-push sweep fails red on any
  # error, deliberately: a rejected sweep means our manifests are wrong, an
  # unreachable registry is worth knowing about immediately, and this job
  # gates nothing downstream, so a red here costs attention and nothing else.
  # Accepted consequence: once APP_REGISTRY_CICD_OPT_IN is 'true', a registry
  # outage reds this job -- and therefore `main` CI -- until it recovers.
  # APP_REGISTRY_CICD_OPT_IN=false is the only lever that stops that; it was
  # previously masked by continue-on-error, which is exactly how the
  # repo-wide identity-registration wedge (issue #558, ordering 4) stayed
  # invisible inside a green job.
  reconcile-app-registry:
    name: Reconcile apps/charts in App Registry
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serializes reconcile runs so an older main push's ReconcileApps call
    # gets cancelled instead of racing a newer one. This job only runs on
    # push-to-main (see `if:` above), so a constant group -- not one keyed
    # on ref/workflow -- is what serializes across runs, matching intent.
    # Partial mitigation only: a manually re-run older workflow run gets
    # fresh queue timing (not the original push's chronological position),
    # and an RPC already in flight when cancellation lands still completes.
    # The real fix is a server-side monotonic ordering guard -- see #545.
    concurrency:
      group: app-registry-reconcile
      cancel-in-progress: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: App Registry Auth
      if: ${{ vars.APP_REGISTRY_CICD_OPT_IN == 'true' }}
      uses: ./.github/actions/app-registry-auth
      with:
        address: ${{ vars.APP_REGISTRY_ADDRESS }}
        token-url: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
        client-id: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
        client-secret: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

    - name: Download release tools
      uses: ./.github/actions/download-release-tools
      with:
        source: published
        target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}

    - name: Reconcile apps/charts in App Registry
      if: ${{ vars.APP_REGISTRY_CICD_OPT_IN == 'true' }}
      timeout-minutes: 5
      uses: ./.github/actions/app-registry-reconcile
      with:
        address: ${{ vars.APP_REGISTRY_ADDRESS }}
        token-url: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
        client-id: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
        client-secret: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        git-sha: ${{ github.sha }}
        idempotency-key: ${{ github.run_id }}-${{ github.run_attempt }}-reconcile
        fast-mode: ${{ vars.RELEASE_HELPER_FAST_MODE }}

    # FR8 (issue #923): unconditional per-app/chart build log, one row per
    # discovered app/chart, EVERY push -- no digest-diff or content gating
    # (that is `apps reconcile`'s job above, not this one). This is what
    # lets a v2 release-trigger-time GitHubDispatcher.Dispatch resolve a
    # commit ci.yml has actually reconciled for a target, instead of the
    # literal `main` branch pointer (see buildref.go's resolveBuildRef and
    # migration 019's doc comment).
    - name: Record build (App Registry, watermark for release ref resolution)
      if: ${{ vars.APP_REGISTRY_CICD_OPT_IN == 'true' }}
      id: record-build
      shell: bash
      run: |
        set -euo pipefail
        RESP="$("$APP_REGISTRY_CLI" builds record \
          --git-sha "${{ github.sha }}" \
          --git-ref "${{ github.ref }}" \
          --workflow-run-id "${{ github.run_id }}" \
          --workflow-attempt "${{ github.run_attempt }}" \
          --actor "${{ github.actor }}" \
          --idempotency-key "${{ github.run_id }}-${{ github.run_attempt }}-buildlog")"
        BUILD_ID="$(echo "$RESP" | jq -r '.build.buildId // .build.build_id')"
        if [[ -z "$BUILD_ID" || "$BUILD_ID" == "null" ]]; then
          echo "::error::builds record did not return a build_id: $RESP"
          exit 1
        fi
        echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

    - name: Record app_build_log for every discovered app/chart (App Registry, FR8)
      if: ${{ vars.APP_REGISTRY_CICD_OPT_IN == 'true' }}
      timeout-minutes: 5
      shell: bash
      run: |
        "$APP_REGISTRY_CLI" apps record-build-log \
          --from-plan "$RUNNER_TEMP/manifest-set.json" \
          --build-id "${{ steps.record-build.outputs.build_id }}" \
          --idempotency-key "${{ github.run_id }}-${{ github.run_attempt }}-buildlog"

  # # Build job - commented out in favor of merged build+test job below
  # # Uncomment and remove build step from test job to restore separate build/test parallelism
  # build:
  #   name: Build
  #   runs-on: ubuntu-latest
  #
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v7
  #     with:
  #       fetch-depth: 0
  #
  #   - name: Setup Build Environment
  #     uses: ./.github/actions/setup-build-env
  #     with:
  #       cache-suffix: 'ci'
  #       bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
  #       bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER }}
  #       bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}
  #
  #   - name: Build all targets
  #     run: |
  #       bazel build --config=ci //...
  #       bazel shutdown

  # Combined build + test job - reuses warm Bazel server to avoid duplicate analysis
  test:
    name: Test
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-env
      with:
        cache-suffix: 'ci'
        bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
        bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
        bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
        bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}
        
    - name: Build and test all targets
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        # On PRs we only build and run tests actually affected by the diff
        # against main's own current tip, via release_helper's
        # `changed-targets` (same mechanism as the test-database job below --
        # see docs/RELEASE.md "Reusing Change Detection for Non-Release
        # Target Pools"). We diff straight against main, never this PR's
        # declared base or a merge-base: a stacked PR's base is another
        # feature branch, not main, and a stacked branch carries every
        # earlier level's commits too, so a direct two-dot diff against main
        # captures this PR's full cumulative effect.
        #
        # On main we keep the full //... scope so any untested target whose
        # build breaks still gets caught before release, and so any test a
        # sequence of narrowly-scoped PRs didn't individually trigger still
        # runs eventually.
        if [ "$EVENT_NAME" = "pull_request" ]; then
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          echo "::group::Filtering to targets affected since main ($MAIN_SHA)"
          TARGETS=$(bazel run --config=ci //tools:release -- changed-targets \
            --base-commit="$MAIN_SHA" \
            --candidates='tests(//...)' \
            | tr '\n' ' ')
          echo "Affected targets: ${TARGETS:-<none>}"
          echo "::endgroup::"
          if [ -z "${TARGETS// /}" ]; then
            echo "No targets affected by this change; skipping."
          else
            bazel coverage --config=ci $TARGETS
          fi
        else
          bazel coverage --config=ci //...
        fi
        # Shutdown Bazel server to prevent hanging
        bazel shutdown

    - name: Manifest schema contract check
      run: |
        # //tools/appmeta:manifest_contract_test is tagged `manual`, so the
        # wildcard `bazel test //...` above does NOT run it. Its rule->proto
        # direction needs a real bazel query/cquery against the checkout,
        # which only works under `bazel run` (BUILD_WORKSPACE_DIRECTORY is
        # unset for test actions). Without this step, a release_app attribute
        # added without a matching field in //tools/appmeta/proto would drift
        # silently — the exact failure the contract test exists to prevent.
        bazel run --config=ci //tools/appmeta:manifest_contract_test
        bazel shutdown

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: bazel-out/_coverage/_coverage_report.dat
        fail_ci_if_error: false
        flags: unittests

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: bazel-testlogs/
        retention-days: 7

  # Bazel Cache Image (POC) -- DISABLED. Measured negative result: pulling
  # the baked image on a fresh GH-hosted runner (3m26s for a 5.45GB image,
  # one 5.14GB layer) costs more than it saves versus the existing `test`
  # job's baseline (~2m50s), since GH-hosted runners have no persistent
  # Docker layer cache across jobs to amortize that pull against. See
  # docs/BAZEL_CACHE_IMAGE.md "Result" for the full numbers. Commented out
  # rather than deleted so the approach (and what would need to change --
  # self-hosted/persistent runners, or a much smaller baked image -- for it
  # to win) stays reviewable. `BAZEL_CACHE_IMAGE_ENABLED` is also set back
  # to `false` at the repo-variable level; both gates would need to be
  # reverted to re-enable this.
  #
  # test-bazel-cache-image:
  #   name: Test (Bazel Cache Image POC)
  #   runs-on: ubuntu-latest
  #   if: ${{ vars.BAZEL_CACHE_IMAGE_ENABLED == 'true' }}
  #   container:
  #     image: ghcr.io/${{ github.repository_owner }}/bazel-cache-devcontainer:latest
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v7
  #     with:
  #       fetch-depth: 0
  #
  #   - name: Setup Bazel Remote Cache Config
  #     uses: ./.github/actions/setup-bazel-remote-cache-config
  #     with:
  #       cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
  #       cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
  #       cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
  #       downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}
  #
  #   - name: Build all targets from the pre-warmed cache + remote cache
  #     run: |
  #       bazel --output_base=/var/cache/bazel/ob build --config=ci //...

  # Container architecture test - verify cross-compilation works correctly
  # Runs in parallel with test job for faster CI
  # Only runs on main branch to reduce CI overhead on feature branches
  test-container-arch:
    name: Test Container Architecture
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-env
      with:
        cache-suffix: 'ci'
        setup-docker: 'true'
        bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
        bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
        bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
        bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}
        
    - name: Verify Cross-Compilation (Critical)
      run: |
        # CRITICAL TEST: Verify cross-platform builds work correctly
        # This ensures ARM64 containers get aarch64 wheels (not x86_64)
        # Uses oci_image_index with platform transitions for true multiarch images
        # If this fails, ARM64 deployments will crash at runtime!
        echo "::group::Cross-Compilation Verification"
        bazel test --config=ci //tools/scripts:test_cross_compilation --test_output=streamed
        echo "::endgroup::"
        # Shutdown Bazel server to prevent hanging
        bazel shutdown

  # Container-backed database tests - real Postgres via libs/go/dbtest
  #
  # These targets are tagged `manual`, so `bazel test //...` (the Test job above)
  # deliberately skips them and stays green on a machine with no Docker daemon.
  # That means nothing runs them unless a job like this one names them explicitly.
  # See libs/go/dbtest/README.md.
  #
  # Targets are discovered by querying for tests that depend on //libs/go/dbtest,
  # rather than hardcoding a list, so a new dbtest-backed test is covered the
  # moment it is written. Runs in parallel with the test jobs above.
  #
  # On pull_request, this is further narrowed to only the targets affected by
  # the diff against main (release_helper's `changed-targets`), since this
  # suite is slow and most PRs never touch database code. Every push here is
  # to main (see this workflow's `push.branches` filter above), and always
  # runs the full discovered set.
  test-database:
    name: Test Database Integration
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-env
      with:
        cache-suffix: 'ci'
        setup-docker: 'true'
        bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
        bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
        bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
        bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

    - name: Run container-backed database tests
      run: |
        set -euo pipefail

        echo "::group::Discovering dbtest-backed targets"
        # Scoped to the subtrees that can contain them; a bare //... fails to
        # load unrelated external repositories in this workspace.
        #
        # Uses --config=ci (defined in .bazelrc with --noimplicit_deps) and
        # --universe_scope to accelerate target discovery.
        SCOPE='//libs/... + //tools/... + //manmanv2/... + //audience_score_system/...'
        CANDIDATES="tests($SCOPE) intersect rdeps($SCOPE, //libs/go/dbtest:dbtest)"
        ALL_TARGETS=$(bazel query \
          --config=ci \
          --universe_scope=//... \
          "$CANDIDATES" \
          | tr '\n' ' ')
        echo "All dbtest-backed targets: ${ALL_TARGETS:-<none>}"
        echo "::endgroup::"

        # An empty result means the query broke, not that there is no work:
        # //libs/go/dbtest:postgres_constraints_test always matches. Failing
        # here is the point — a silently-empty run would report this job green
        # while testing nothing.
        if [ -z "${ALL_TARGETS// /}" ]; then
          echo "::error::No dbtest-backed test targets found. The discovery query is broken - it should always match at least //libs/go/dbtest:postgres_constraints_test."
          exit 1
        fi

        TARGETS="$ALL_TARGETS"

        # This suite is slow, so PRs only re-run targets actually affected by
        # the diff; main always runs the full suite (every push here is to
        # main -- see this workflow's top-level `push.branches` filter).
        #
        # Always diffs straight against main's own current tip via the
        # release tool's changed-targets command (same underlying git-diff
        # machinery release_helper already uses for release-app change
        # detection -- see docs/RELEASE.md "Reusing Change Detection for
        # Non-Release Target Pools"), never the PR's declared base branch and
        # never a merge-base: a stacked PR's base is another feature branch,
        # not main, and a stacked branch carries every earlier level's
        # commits too, so a direct two-dot diff against main is what captures
        # this PR's full cumulative effect.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "::group::Filtering to targets affected since main"
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          echo "Diffing against main's tip ($MAIN_SHA)"
          TARGETS=$(bazel run --config=ci //tools:release -- changed-targets \
            --base-commit="$MAIN_SHA" \
            --candidates="$CANDIDATES" \
            | tr '\n' ' ')
          echo "Affected targets: ${TARGETS:-<none>}"
          echo "::endgroup::"
        fi

        if [ -z "${TARGETS// /}" ]; then
          echo "No dbtest-backed targets affected by this change; skipping."
          exit 0
        fi

        echo "::group::Database Integration Tests"
        # No --test_tag_filters: combining it with explicit labels makes Bazel
        # report "No test targets were found" (see libs/go/dbtest/README.md).
        bazel coverage --config=ci $TARGETS --test_output=streamed
        echo "::endgroup::"
        bazel shutdown

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: bazel-out/_coverage/_coverage_report.dat
        fail_ci_if_error: false
        flags: integration

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-database
        path: bazel-testlogs/
        retention-days: 7

  # Plan Docker builds - determine which apps need building
  #
  # Disabled: nothing consumes the images this produces right now, and the
  # change-detection this job's plan relies on ("$RELEASE_HELPER" plan) isn't
  # trusted yet. Disabling here also skips the downstream `docker` job, since
  # its `if:` depends on this job's outputs and Actions treats a skipped need
  # as not-success. Re-enable only after the auto change-detection has been
  # hardened, or drop this job and lean on release-time builds instead -- see
  # the tracking issues linked in this PR.
  plan-docker:
    name: Plan Docker Builds
    runs-on: self-hosted
    if: false
    needs: [test, test-container-arch]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      apps: ${{ steps.plan.outputs.apps }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-env
      with:
        cache-suffix: 'ci'
        bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
        bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
        bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
        bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

    - name: Download release tools
      uses: ./.github/actions/download-release-tools
      with:
        source: published
        target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}

    - name: Plan Docker builds using release tool
      id: plan
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        FAST_MODE: ${{ vars.RELEASE_HELPER_FAST_MODE }}
      run: |
        # Determine what to build based on changes
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # For PRs, compare against the base branch
          BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
          echo "PR detected: comparing against base commit $BASE_COMMIT"
          EVENT_TYPE="pull_request"
        elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
          # For pushes, compare against the previous commit
          BASE_COMMIT="${{ github.event.before }}"
          echo "Push detected: comparing against previous commit $BASE_COMMIT"
          EVENT_TYPE="push"
        else
          # Fallback: build all apps
          echo "Cannot determine base commit, building all apps"
          BASE_COMMIT=""
          EVENT_TYPE="fallback"
        fi
        
        # Use release helper to plan the Docker builds
        # FAST_MODE is empty when RELEASE_HELPER_FAST_MODE is unset -- normalize
        # to a real "true"/"false" so --fast= never gets an empty value.
        FAST="false"
        if [[ "$FAST_MODE" == "true" ]]; then
          FAST="true"
        fi
        echo "Planning Docker builds using release tool..."
        PLAN_OUTPUT=$("$RELEASE_HELPER" plan \
          --fast="$FAST" \
          --event-type "$EVENT_TYPE" \
          --base-commit="$BASE_COMMIT" \
          --format github)
        
        # Parse output from release helper and set GitHub outputs
        # Use process substitution to avoid subshell issues with pipes
        while IFS= read -r line; do
          if [[ "$line" == matrix=* ]]; then
            echo "${line}" >> $GITHUB_OUTPUT
          elif [[ "$line" == apps=* ]]; then
            echo "${line}" >> $GITHUB_OUTPUT
            APPS_LIST="${line#apps=}"
            if [[ -n "$APPS_LIST" ]]; then
              echo "Apps to build: $APPS_LIST"
            else
              echo "No apps to build"
            fi
          fi
        done <<< "$PLAN_OUTPUT"

  # Docker job - builds container images using the release tool (main branch only)
  # Note: Images are built but not pushed to registry. Use the Release workflow for publishing.
  docker:
    name: Build Docker Images
    runs-on: self-hosted
    needs: plan-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-docker.outputs.apps && needs.plan-docker.outputs.apps != 'null'
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-env
      with:
        setup-docker: 'true'
        cache-suffix: 'ci'
        bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
        bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
        bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
        bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

    - name: Download release tools
      uses: ./.github/actions/download-release-tools
      with:
        source: published
        target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}

    - name: Build Docker images
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        APPS_TO_BUILD: ${{ needs.plan-docker.outputs.apps }}
      run: |
        echo "Building Docker images for: $APPS_TO_BUILD"
        for app in $APPS_TO_BUILD; do
          echo "Building Docker image for $app using release tool..."
          "$RELEASE_HELPER" build "$app"
        done

        # Show built Docker images
        echo "Built Docker images:"
        docker images | head -20

        # Shutdown Bazel server to prevent hanging
        bazel shutdown

  # Build summary - collects status of all jobs for branch protection
  build-summary:
    name: Build Summary
    runs-on: self-hosted
    needs: [test, plan-docker, test-container-arch, docker]
    if: always()
    steps:
    - name: Collect build results and generate summary
      run: |
        echo "=== CI Build Summary ===" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check the status of all jobs
        TEST_RESULT="${{ needs.test.result }}"
        CONTAINER_ARCH_RESULT="${{ needs.test-container-arch.result }}"
        PLAN_JOB_RESULT="${{ needs.plan-docker.result }}"
        DOCKER_RESULT="${{ needs.docker.result }}"
        
        echo "**Job Results:**" >> $GITHUB_STEP_SUMMARY
        echo "- Build & Test: $TEST_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "- Container Architecture Test: $CONTAINER_ARCH_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "- Planning: $PLAN_JOB_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "- Docker: $DOCKER_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if any apps were planned for building
        PLANNED_APPS="${{ needs.plan-docker.outputs.apps }}"
        if [[ -n "$PLANNED_APPS" && "$PLANNED_APPS" != "null" ]]; then
          echo "**Apps processed:** $PLANNED_APPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Determine overall status
        # Test job (includes build) must always pass
        if [[ "$TEST_RESULT" != "success" ]]; then
          echo "❌ **Overall Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "Build & Test job failed!" >> $GITHUB_STEP_SUMMARY
          echo "::error::Build & Test job failed"
          exit 1
        fi
        
        # Container arch test must pass on main, but is skipped on PRs
        if [[ "$CONTAINER_ARCH_RESULT" != "success" && "$CONTAINER_ARCH_RESULT" != "skipped" ]]; then
          echo "❌ **Overall Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "Container architecture test failed - cross-compilation is broken!" >> $GITHUB_STEP_SUMMARY
          echo "::error::Container architecture test failed"
          exit 1
        fi

        # On main branch, container arch test should have run and succeeded
        if [[ "${{ github.event_name }}" == "push" && "$CONTAINER_ARCH_RESULT" == "skipped" ]]; then
          echo "❌ **Overall Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "Container architecture test was skipped on main branch but should have run!" >> $GITHUB_STEP_SUMMARY
          echo "::error::Container architecture test was unexpectedly skipped"
          exit 1
        fi
        
        # For PRs, docker job is skipped (only runs on main)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "✅ **Overall Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "All required checks passed for PR (Docker builds only run on main branch)" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        # For main branch, check docker builds if apps were planned
        if [[ -z "$PLANNED_APPS" || "$PLANNED_APPS" == "null" ]]; then
          echo "✅ **Overall Status: PASSED** (no builds needed)" >> $GITHUB_STEP_SUMMARY
          echo "No apps needed building - all changes were in non-app areas" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        
        # If we have apps to build on main, check docker job status
        # Docker job runs when: github.event_name == 'push' && github.ref == 'refs/heads/main' && apps exist
        if [[ "$DOCKER_RESULT" == "success" ]]; then
          echo "✅ **Overall Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "All jobs including Docker builds completed successfully!" >> $GITHUB_STEP_SUMMARY
          exit 0
        elif [[ "$DOCKER_RESULT" == "skipped" ]]; then
          # Docker was skipped - this is expected behavior when conditions aren't met
          echo "✅ **Overall Status: PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "All required jobs passed (Docker builds were skipped)" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          # Docker job failed or was cancelled
          echo "❌ **Overall Status: FAILED**" >> $GITHUB_STEP_SUMMARY
          echo "Docker builds failed for one or more apps!" >> $GITHUB_STEP_SUMMARY
          echo "::error::Docker job failed with status: $DOCKER_RESULT"
          exit 1
        fi

        
