name: Release

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated list of apps to release (e.g., hello_python,hello_go) or "all" for all apps, or domain name (e.g., "demo") to release all apps in a domain. Leave empty to skip app release.'
        required: false
        default: ''
      version:
        description: 'Release version (e.g., v1.0.0) - leave empty when using increment options'
        required: false
      increment_minor:
        description: 'Auto-increment minor version (resets patch to 0) - applies to both apps and helm charts'
        type: boolean
        default: false
      increment_patch:
        description: 'Auto-increment patch version - applies to both apps and helm charts'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - build but do not publish'
        type: boolean
        default: false
      helm_charts:
        description: 'Helm charts to release (e.g., hello-fastapi,demo-workers) or "all" or domain name (e.g., "demo"). Leave empty to skip helm chart release.'
        required: false
        default: ''
      include_demo:
        description: 'Include demo domain when using "all" for apps or helm charts'
        type: boolean
        default: false
      use_source_tools:
        description: 'Build release tools from source instead of downloading pinned prebuilt binaries (safety valve)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Probe for prebuilt release tools or build from source if missing / requested.
  # When prebuilt releases exist and use_source_tools is false, this job completes in seconds.
  # If prebuilt releases do not exist or use_source_tools is true, this builds the tools ONCE
  # via Bazel and uploads them as a workflow artifact for all downstream jobs to reuse.
  build-release-tools:
    name: Build Release Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check prebuilt tool availability
        id: probe
        env:
          USE_SOURCE: ${{ inputs.use_source_tools == true || github.event.inputs.use_source_tools == 'true' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$USE_SOURCE" == "true" ]]; then
            echo "Explicit use_source_tools requested. Building from source."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read pinned versions
          RH_VER=$(grep -E '^\s*release_helper_go:' .release-tools-version 2>/dev/null | sed -E 's/^\s*release_helper_go:\s*//' | tr -d '"\x27\r\n ' || true)
          AR_VER=$(grep -E '^\s*(app_registry_cli|app_registry|app-registry):' .release-tools-version 2>/dev/null | sed -E 's/^\s*(app_registry_cli|app_registry|app-registry):\s*//' | tr -d '"\x27\r\n ' || true)

          RH_EXISTS=false
          AR_EXISTS=false
          if [[ -n "$RH_VER" ]] && gh release view "tools-release_helper_go.${RH_VER}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            RH_EXISTS=true
          fi
          if [[ -n "$AR_VER" ]] && gh release view "tools-app_registry_cli.${AR_VER}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            AR_EXISTS=true
          fi

          if [[ "$RH_EXISTS" == "true" && "$AR_EXISTS" == "true" ]]; then
            echo "Prebuilt release tools exist on GitHub Releases. Downstream jobs will download prebuilt binaries directly."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt release tools not found on GitHub Releases. Building once as workflow artifact for this run."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Build Environment
        if: steps.probe.outputs.needs_build == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}

      - name: Build release helper & app registry
        if: steps.probe.outputs.needs_build == 'true'
        run: |
          bazel build --config=ci-images \
            //tools/release_helper_go:release_helper_go \
            //tools/app_registry/cli:app-registry
          BAZEL_BIN="$(bazel info bazel-bin --config=ci-images)"
          mkdir -p /tmp/release-tools
          cp "$BAZEL_BIN/tools/release_helper_go/release_helper_go_/release_helper_go" /tmp/release-tools/release_helper_go
          cp "$BAZEL_BIN/tools/app_registry/cli/app-registry_/app-registry" /tmp/release-tools/app-registry

      - name: Upload release tools artifact
        if: steps.probe.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tools
          path: /tmp/release-tools/
          retention-days: 1

  plan-release:
    name: Plan Release
    runs-on: ubuntu-latest
    needs: [build-release-tools]
    outputs:
      release-matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      apps: ${{ steps.plan.outputs.apps }}
      chart-matrix: ${{ steps.plan.outputs.chart_matrix }}
      charts: ${{ steps.plan.outputs.charts }}
      openapi-matrix: ${{ steps.plan.outputs.openapi_matrix }}
      has-specs: ${{ steps.plan.outputs.has_specs }}
      build-id: ${{ steps.plan.outputs.build_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ (inputs.use_source_tools || github.event.inputs.use_source_tools == 'true') && 'source' || 'published' }}

      - name: Plan release
        id: plan
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_MODE: oidc
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        run: |
          ARGS=(plan --format github --event-type workflow_dispatch)
          [[ -n "${{ github.event.inputs.apps }}" ]] && ARGS+=(--apps "${{ github.event.inputs.apps }}")
          [[ -n "${{ github.event.inputs.helm_charts }}" ]] && ARGS+=(--charts "${{ github.event.inputs.helm_charts }}")
          [[ -n "${{ github.event.inputs.version }}" ]] && ARGS+=(--version "${{ github.event.inputs.version }}")
          [[ "${{ github.event.inputs.increment_minor }}" == "true" ]] && ARGS+=(--increment-minor)
          [[ "${{ github.event.inputs.increment_patch }}" == "true" ]] && ARGS+=(--increment-patch)
          [[ "${{ github.event.inputs.include_demo }}" == "true" ]] && ARGS+=(--include-demo)
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          [[ "${{ vars.APP_REGISTRY_CICD_OPT_IN }}" != "true" ]] && ARGS+=(--skip-registry)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_OUTPUT"

  plan-openapi-builds:
    name: Plan OpenAPI Builds
    runs-on: ubuntu-latest
    needs: [plan-release, build-release-tools]
    if: needs.plan-release.outputs.apps != ''
    outputs:
      openapi-matrix: ${{ steps.plan-openapi.outputs.matrix }}
      has-specs: ${{ steps.plan-openapi.outputs.has-specs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release tools
        uses: ./.github/actions/download-release-tools

      - name: Plan OpenAPI spec builds
        id: plan-openapi
        run: |
          "$RELEASE_HELPER" plan-openapi-builds --apps "${{ needs.plan-release.outputs.apps }}" --format github >> "$GITHUB_OUTPUT"
          if grep -q "matrix={}" "$GITHUB_OUTPUT"; then
            echo "has-specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-specs=true" >> "$GITHUB_OUTPUT"
          fi

  build-openapi-specs:
    name: Build OpenAPI Spec for ${{ matrix.domain }}-${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [plan-release, plan-openapi-builds]
    if: needs.plan-openapi-builds.outputs.has-specs == 'true' && github.event.inputs.dry_run == 'false'
    strategy:
      matrix: ${{ fromJson(needs.plan-openapi-builds.outputs.openapi-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}

      - name: Build OpenAPI spec
        run: |
          bazel build --config=ci-images "${{ matrix.openapi_target }}"
          TARGET_PATH="${{ matrix.openapi_target }}"
          TARGET_PATH="${TARGET_PATH#@@//}"
          TARGET_PATH="${TARGET_PATH#//}"
          BAZEL_BIN=$(bazel info bazel-bin --config=ci-images)
          TARGET_DIR=$(echo "$TARGET_PATH" | sed 's#:#/#' | sed 's#/[^/]*$##')
          SPEC_FILE="${BAZEL_BIN}/${TARGET_DIR}/${{ matrix.domain }}-${{ matrix.app }}_openapi_spec.json"
          [[ ! -f "$SPEC_FILE" ]] && SPEC_FILE="${BAZEL_BIN}/$(echo "$TARGET_PATH" | sed 's#:#/#').json"
          mkdir -p /tmp/openapi-specs
          cp "$SPEC_FILE" "/tmp/openapi-specs/${{ matrix.domain }}-${{ matrix.app }}_openapi_spec.json"

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ matrix.domain }}-${{ matrix.app }}
          path: /tmp/openapi-specs/${{ matrix.domain }}-${{ matrix.app }}_openapi_spec.json

  release:
    name: Release ${{ matrix.domain }}-${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [plan-release, build-release-tools]
    if: needs.plan-release.outputs.release-matrix != '' && fromJson(needs.plan-release.outputs.release-matrix).include[0] != null
    permissions:
      contents: write
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.plan-release.outputs.release-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-docker: 'true'
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ (inputs.use_source_tools || github.event.inputs.use_source_tools == 'true') && 'source' || 'published' }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Release application
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_MODE: oidc
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        run: |
          ARGS=(release-app --domain "${{ matrix.domain }}" --app "${{ matrix.app }}" --version "${{ matrix.version || needs.plan-release.outputs.version }}" --create-git-tag)
          [[ -n "${{ needs.plan-release.outputs.build-id }}" ]] && ARGS+=(--build-id "${{ needs.plan-release.outputs.build-id }}")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          [[ "${{ vars.APP_REGISTRY_CICD_OPT_IN }}" != "true" ]] && ARGS+=(--skip-registry)
          "$RELEASE_HELPER" "${ARGS[@]}"

      - name: Generate release notes
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          TAG_NAME="${{ matrix.domain }}-${{ matrix.app }}.${{ matrix.version || needs.plan-release.outputs.version }}"
          mkdir -p /tmp/release-notes
          "$RELEASE_HELPER" release-notes "${{ matrix.domain }}-${{ matrix.app }}" --current-tag "$TAG_NAME" --format markdown > "/tmp/release-notes/${{ matrix.domain }}-${{ matrix.app }}.md" || true

      - name: Upload release notes artifact
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ matrix.domain }}-${{ matrix.app }}
          path: /tmp/release-notes/${{ matrix.domain }}-${{ matrix.app }}.md
          if-no-files-found: ignore

      - name: Upload digest-check artifact
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-check-${{ matrix.domain }}-${{ matrix.app }}
          path: /tmp/digest-check/${{ matrix.domain }}-${{ matrix.app }}.json
          if-no-files-found: ignore

  create-github-releases:
    name: Create GitHub Releases
    runs-on: ubuntu-latest
    needs: [plan-release, release, build-openapi-specs, build-release-tools]
    if: always() && !cancelled() && needs.plan-release.outputs.release-matrix != '' && fromJson(needs.plan-release.outputs.release-matrix).include[0] != null && github.event.inputs.dry_run == 'false' && needs.release.result == 'success' && (needs.build-openapi-specs.result == 'success' || needs.build-openapi-specs.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ (inputs.use_source_tools || github.event.inputs.use_source_tools == 'true') && 'source' || 'published' }}

      - name: Download release notes artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-notes-*
          path: /tmp/release-notes
          merge-multiple: true

      - name: Download OpenAPI spec artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openapi-spec-*
          path: /tmp/openapi-specs
          merge-multiple: true
        continue-on-error: true

      - name: Download digest-check artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: digest-check-*
          path: /tmp/digest-check
          merge-multiple: true
        continue-on-error: true

      - name: Apply digest-check overrides to release matrix
        id: matrix-override
        env:
          MATRIX: ${{ needs.plan-release.outputs.release-matrix }}
        run: |
          OVERRIDDEN_MATRIX="$MATRIX"
          if compgen -G "/tmp/digest-check/*.json" > /dev/null; then
            for f in /tmp/digest-check/*.json; do
              DOMAIN=$(jq -r '.domain' "$f")
              APP=$(jq -r '.app' "$f")
              UNCHANGED=$(jq -r '.digest_unchanged' "$f")
              EFF_VERSION=$(jq -r '.effective_version' "$f")
              if [[ "$UNCHANGED" == "true" ]]; then
                echo "Overriding ${DOMAIN}-${APP} to reused version $EFF_VERSION (no-op rebuild)"
                OVERRIDDEN_MATRIX=$(echo "$OVERRIDDEN_MATRIX" | jq -c \
                  --arg domain "$DOMAIN" --arg app "$APP" --arg version "$EFF_VERSION" \
                  '.include |= map(if .domain == $domain and .app == $app then .version = $version else . end)')
              fi
            done
          fi
          echo "matrix=$OVERRIDDEN_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Create GitHub releases for all apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ steps.matrix-override.outputs.matrix }}
        run: |
          APPS=$(echo '${{ steps.matrix-override.outputs.matrix }}' | jq -r '.include[] | "\(.domain)-\(.app)"' | paste -sd, -)
          if [[ -n "$APPS" ]]; then
            "$RELEASE_HELPER" create-combined-github-release-with-notes "${{ needs.plan-release.outputs.version }}" \
              --owner "${{ github.repository_owner }}" \
              --repo "${{ github.event.repository.name }}" \
              --commit "${{ github.sha }}" \
              --apps "$APPS" \
              --release-notes-dir "/tmp/release-notes" \
              --openapi-specs-dir "/tmp/openapi-specs"
          fi

  release-helm-charts:
    name: Release Helm Charts
    needs: [plan-release, release, create-github-releases, build-release-tools]
    if: github.event.inputs.helm_charts != '' && (always() && !cancelled())
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHART_REPO_URL: ${{ vars.CHART_REPO_URL || 'https://charts.whalenet.dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-docker: 'true'
          cache-suffix: 'helm'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD }}

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ (inputs.use_source_tools || github.event.inputs.use_source_tools == 'true') && 'source' || 'published' }}

      - name: Configure Git
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run == 'false' && vars.APP_REGISTRY_CICD_OPT_IN == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Release Helm charts
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_MODE: oidc
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
          CHART_REPO_USER: ${{ secrets.CHART_REPO_USER }}
          CHART_REPO_PASS: ${{ secrets.CHART_REPO_PASS }}
        run: |
          ARGS=(release-charts --charts "${{ github.event.inputs.helm_charts }}" --chart-repo-url "$CHART_REPO_URL" --create-git-tag)
          [[ -n "${{ needs.plan-release.outputs.version }}" ]] && ARGS+=(--version "${{ needs.plan-release.outputs.version }}")
          [[ -n "${{ needs.plan-release.outputs.build-id }}" ]] && ARGS+=(--build-id "${{ needs.plan-release.outputs.build-id }}")
          [[ "${{ github.event.inputs.include_demo }}" == "true" ]] && ARGS+=(--include-demo)
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          [[ "${{ vars.APP_REGISTRY_CICD_OPT_IN }}" != "true" ]] && ARGS+=(--skip-registry)
          "$RELEASE_HELPER" "${ARGS[@]}"

      - name: Upload helm chart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: /tmp/helm-charts/*.tgz
          if-no-files-found: ignore

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [plan-release, release, create-github-releases, release-helm-charts, build-release-tools]
    if: always()
    env:
      CHART_REPO_URL: ${{ vars.CHART_REPO_URL || 'https://charts.whalenet.dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release tools
        id: download-tools
        continue-on-error: true
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ (inputs.use_source_tools || github.event.inputs.use_source_tools == 'true') && 'source' || 'published' }}

      - name: Generate summary
        if: steps.download-tools.outcome == 'success'
        run: |
          ARGS=(summary --matrix '${{ needs.plan-release.outputs.release-matrix }}' --version "${{ needs.plan-release.outputs.version }}" --event-type workflow_dispatch --repository-owner "${{ github.repository_owner }}")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_STEP_SUMMARY"
