name: Bazel Cache Image (POC)

# Builds and pushes the bazel-cache-warmed devcontainer image described in
# docs/BAZEL_CACHE_IMAGE.md. This is additive infrastructure: nothing in
# release.yml/release-v2.yml or ci.yml's required jobs consumes this image
# by default. Consumption is opt-in behind the `BAZEL_CACHE_IMAGE_ENABLED`
# repo variable -- see ci.yml's `test-bazel-cache-image` job -- so merging
# this workflow changes no existing pipeline's behavior.
#
# Manual-only for now (workflow_dispatch). A `bazel build //...` warm build
# includes the ESP32/Pigweed cross toolchains and every language toolchain
# in the repo, so expect this to run considerably longer than a normal CI
# job; once the cadence is proven out, add a `schedule:` trigger (e.g.
# weekly) here.
on:
  workflow_dispatch:
    inputs:
      warm_targets:
        description: 'Bazel target pattern to warm into the image (default: everything)'
        required: false
        default: '//...'

jobs:
  build-and-push:
    name: Build & Push Bazel Cache Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ vars.BAZEL_CACHE_IMAGE_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # Renders to $RUNNER_TEMP (outside the git checkout, so it can never
      # be picked up by COPY . . in the Dockerfile) and is fed to the build
      # below via a BuildKit secret mount, not a build-arg -- see
      # .devcontainer/Dockerfile and docs/BAZEL_CACHE_IMAGE.md "Remote
      # cache during the warm build" for why. Most of what `bazel build
      # //...` would otherwise recompile from scratch here is already in
      # the remote cache from ci.yml's own `test` job runs on this same
      # `main`, so this is mainly a speedup for the warm build itself, not
      # a correctness requirement -- the step above still works with no
      # cache configured.
      - name: Setup Bazel Remote Cache Config
        uses: ./.github/actions/setup-bazel-remote-cache-config
        with:
          cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}
          output-path: ${{ runner.temp }}/.bazelrc.remote

      # Builds unconditionally (validates the Dockerfile on every manual
      # dispatch) but only pushes once a human has opted in, matching this
      # repo's other opt-in-via-repo-variable gates (e.g.
      # APP_REGISTRY_CICD_OPT_IN) -- see docs/CI_CD.md.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            WARM_TARGETS=${{ github.event.inputs.warm_targets || '//...' }}
          secret-files: |
            bazelrc_remote=${{ runner.temp }}/.bazelrc.remote
          push: ${{ vars.BAZEL_CACHE_IMAGE_ENABLED == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bazel-cache-devcontainer:latest
            ghcr.io/${{ github.repository_owner }}/bazel-cache-devcontainer:${{ github.sha }}
