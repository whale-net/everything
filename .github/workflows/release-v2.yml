name: Release v2

# App Registry v2 release job (Plan #912, issue #914): this workflow is
# the independently-evolvable v2 home for Temporal-dispatched release/
# build logic (FR1). It was forked from release.yml's job skeleton --
# job names, `needs` chains, and outputs mirror release.yml's -- so this
# plan's other task issues (build_artifact digest lookup, DispatchBuild
# digest-override consumption, chart resolution) can land their real
# logic straight into these jobs without a second structural rewrite.
# Job bodies below are ported from release.yml (Implementation phase of
# #914); shared composite actions (./.github/actions/*) are referenced
# unchanged, not forked (FR4). See the v1->v2 migration checklist in
# tools/app_registry/PLAN.md ("App Registry v2 release job -- migration
# checklist") for which domains dispatch through v1 vs v2 at any point
# in time.
#
# Isolation from v1 (release.yml), enforced by this file:
#   - `concurrency.group` is `release-v2`, distinct from release.yml's
#     `release` (FR2, C2) -- a v1 run and a v2 run for the same commit
#     never cancel or block each other.
#   - Triggers: `workflow_dispatch` here is a *machine-only* dispatch
#     endpoint for Temporal's GitHubDispatcher.Dispatch
#     (tools/app_registry/worker/release/github.go, which POSTs to
#     `.../actions/workflows/<WorkflowFile>/dispatches` -- WorkflowFile
#     is configurable and will point at `release-v2.yml` once a domain
#     cuts over per the migration checklist). It is not a human entry
#     point -- authorize-trigger below enforces that identically to
#     release.yml's `authorize-trigger` job (bot-identity check on
#     `github.triggering_actor`). This workflow declares no other
#     trigger, so it never fires on any event release.yml itself
#     responds to (FR3).

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated list of apps to release (e.g., hello_python,hello_go) or "all" for all apps, or domain name (e.g., "demo") to release all apps in a domain. Leave empty to skip app release.'
        required: false
        default: ''
      version:
        description: 'Release version (e.g., v1.0.0) - leave empty when using increment options'
        required: false
        default: ''
      increment_minor:
        description: 'Auto-increment minor version (resets patch to 0) - applies to both apps and helm charts'
        type: boolean
        default: false
      increment_patch:
        description: 'Auto-increment patch version - applies to both apps and helm charts'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - build but do not publish'
        type: boolean
        default: false
      helm_charts:
        description: 'Helm charts to release (e.g., hello-fastapi,demo-workers) or "all" or domain name (e.g., "demo"). Leave empty to skip helm chart release.'
        required: false
        default: ''
      include_demo:
        description: 'Include demo domain when using "all" for apps or helm charts'
        type: boolean
        default: false
      use_source_tools:
        description: 'Build release tools from source instead of downloading pinned prebuilt binaries (safety valve)'
        type: boolean
        default: false
      app_versions:
        description: 'JSON object of resolved app versions from this release batch''s plan, keyed by "<domain>-<name>" (e.g. {"manmanv2-control-api":"v1.2.3"}). Superseded by resolved_plan below (issue #927) for App Registry''s Temporal-orchestrated DispatchBuild, which no longer sets this -- kept as a manual-dispatch override: release-helm-charts prefers this when set, else falls back to plan-release''s versions output (itself either parsed from resolved_plan or freshly resolved).'
        required: false
        default: ''
      resolved_plan:
        description: 'JSON-encoded fully-expanded release plan (release_helper_go plan --format=json''s output shape: matrix, chart_matrix, openapi_matrix, has_specs, descriptor_set_matrix, has_descriptor_sets, apps, charts, version, versions, build_id) computed once by App Registry''s Temporal ResolvePlan activity and forwarded verbatim by DispatchBuild (issue #927). When set, plan-release parses and passes it through as-is -- no checkout, no bazel setup, no `release-helper plan` re-invocation. Leave empty for a dispatcher that has not pre-computed a plan -- plan-release falls back to its own full `release-helper plan` derivation from the apps/helm_charts/version/increment_* inputs above.'
        required: false
        default: ''
      build_ref:
        description: 'Git commit SHA (or branch/tag) this run should check out and build, overriding the branch tip at dispatch time. FR9-FR11 (issue #923): App Registry''s Temporal DispatchBuild resolves app_build_log''s current-pointer row to pin a release to the exact commit ci.yml''s reconcile job last processed, and passes it here -- GitHub''s workflow_dispatch `ref` field itself must stay a branch/tag (it 422s on a raw commit SHA, even one that is genuinely a branch''s tip), so this workflow always dispatches against the branch and checks out build_ref explicitly instead. Leave empty to build the branch tip at dispatch time (falls back to github.sha).'
        required: false
        default: ''

concurrency:
  group: release-v2
  cancel-in-progress: false

env:
  APP_REGISTRY_CICD_OPT_IN: ${{ vars.APP_REGISTRY_CICD_OPT_IN }}

jobs:
  # Job skeleton mirrors release.yml's (FR1). Machine-only dispatch is
  # enforced identically to release.yml's authorize-trigger job (bot-
  # identity check on github.triggering_actor) -- release-v2.yml never
  # exposes a human-usable workflow_dispatch entry point either.
  authorize-trigger:
    name: Authorize Trigger (machine-only)
    runs-on: ubuntu-latest
    steps:
      - name: Require App-Registry-driven (machine) dispatch
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$TRIGGERING_ACTOR" != *"[bot]" ]]; then
            echo "::error::release-v2.yml's workflow_dispatch is not a human entry point (App Registry v2 cutover). Trigger releases from the App Registry UI instead. (triggering_actor=$TRIGGERING_ACTOR)"
            exit 1
          fi
          echo "Authorized machine-triggered dispatch (triggering_actor=$TRIGGERING_ACTOR)"

  # Probe for prebuilt release tools or build from source if missing / requested.
  # When prebuilt releases exist and use_source_tools is false, this job completes in seconds.
  # If prebuilt releases do not exist or use_source_tools is true, this builds the tools ONCE
  # via Bazel and uploads them as a workflow artifact for all downstream jobs to reuse.
  build-release-tools:
    name: Build Release Tools
    runs-on: ubuntu-latest
    needs: [authorize-trigger]
    if: needs.authorize-trigger.result == 'success'
    outputs:
      # Deliberately a literal, not a step output: this job either acquires
      # both binaries (via the shared download-release-tools action, S3 or
      # source-build fallback) and uploads them as the 'release-tools'
      # workflow artifact, or it fails outright. On success, downstream
      # jobs should always consume that artifact rather than re-resolving
      # versions and re-hitting S3/gRPC themselves in 4 separate places. On
      # job failure this output is unavailable (resolves empty), and every
      # downstream call site's `|| 'published'` fallback (see plan-release,
      # build-release-artifacts, release-summary below) takes over as the
      # existing operator escape hatch (RELEASE_TOOLS_FALLBACK_TO_SOURCE).
      source: 'artifact'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: App Registry Auth
        if: inputs.use_source_tools != true && github.event.inputs.use_source_tools != 'true'
        continue-on-error: true
        uses: ./.github/actions/app-registry-auth
        with:
          address: ${{ vars.APP_REGISTRY_ADDRESS }}
          token-url: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          client-id: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          client-secret: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      # Consolidated onto the shared download-release-tools action (previously
      # a hand-rolled fork of its version-resolution/S3-download logic, which
      # had drifted to probe availability with a HEAD request against a
      # GetObject-signed presigned URL -- always a 403, since SigV4 binds the
      # HTTP method into the signature; see run 32684790873 and PR #1110). Two
      # steps instead of one: try the fast published path without its own
      # fallback first (continue-on-error), and only pay for Bazel setup +
      # a source build when that didn't succeed -- preserving this job's
      # original fast-path-by-default behavior.
      - name: Acquire release tools (published)
        id: acquire-published
        if: inputs.use_source_tools != true && github.event.inputs.use_source_tools != 'true'
        continue-on-error: true
        uses: ./.github/actions/download-release-tools
        with:
          source: published
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          fallback_to_source: 'false'
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Setup Build Environment
        if: steps.acquire-published.outcome != 'success'
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Acquire release tools (source build)
        id: acquire-source
        if: steps.acquire-published.outcome != 'success'
        uses: ./.github/actions/download-release-tools
        with:
          source: source

      - name: Release Tools Acquisition Summary
        if: always() && (steps.acquire-published.outcome == 'success' || steps.acquire-source.outcome == 'success')
        env:
          SOURCE_USED: ${{ steps.acquire-published.outputs.source_used || steps.acquire-source.outputs.source_used }}
        run: |
          {
            echo "### Release Tools Acquisition"
            if [[ "$SOURCE_USED" == "published" ]]; then
              echo "**Acquisition Mode:** ⚡ Prebuilt Binaries (Downloaded from App Registry S3)"
            else
              echo "**Acquisition Mode:** 🛠️ Source Build (\`$SOURCE_USED\`, artifact uploaded for downstream jobs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release tools artifact
        if: steps.acquire-published.outcome == 'success' || steps.acquire-source.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-tools
          path: ${{ runner.temp }}/release-tools/
          retention-days: 1

  # Issue #986 (FR21/FR22 of #979): reviewed this job (both the
  # --from-resolved-plan path above and the fallback `release-helper plan`
  # path below) for hidden versioned side effects. Findings:
  #   - --from-resolved-plan path: release-helper plan --from-resolved-plan
  #     unmarshals the caller-supplied JSON directly (see plan.go's
  #     fromResolvedPlan handling) -- no bazel/registry/git calls at all.
  #     Clean.
  #   - Fallback path (resolved_plan unset -- a bot-credentialed
  #     manual/test dispatch, not the normal Temporal-orchestrated case):
  #     `release-helper plan`'s planRelease() DOES call App Registry RPCs
  #     with real write side effects when opted in (registryOptedIn(),
  #     i.e. APP_REGISTRY_CICD_OPT_IN=true, not --dry-run, not
  #     --skip-registry) -- AssertApps, RecordBuild, BeginPublishBatch,
  #     and (via assignVersions/assignChartVersions -> resolveVersion)
  #     AllocateVersion. This is NOT new or hidden: it is the AR-5
  #     version-resolution/two-phase-reservation machinery (issues
  #     #779/#829/#831, all merged well before #979), it is extensively
  #     documented in tools/release_helper_go/cmd/plan.go and
  #     registry_version.go, and #979's own "Out of scope" section
  #     explicitly excludes retiring this AR-5 series from this plan.
  #     BeginPublishBatch/AllocateVersion are the reservation ("Begin")
  #     half of the two-phase commit protocol build-release-artifacts'
  #     header comment describes -- not a final version stamp, promotion,
  #     tag, or Release creation (FinalizePublish's RecordArtifact, via
  #     finalize-app/finalize-chart, remains the sole confirmation/
  #     commit point). Reviewed and confirmed pre-existing/already-
  #     tracked, not a new #979 violation -- documented here per FR22
  #     rather than left silent.
  #   - The "Apply digest-check overrides to release matrix" step this
  #     plan's Out-of-Scope section refers to as "preserved as-is in
  #     plan-release" lived in the now-deleted create-github-releases job
  #     (removed by #980, per that issue's own explicit scope), not in
  #     this job -- confirmed via `git log -S` that it was deleted
  #     outright, not moved, and grep of the current file confirms no
  #     "digest-check"/"digest_unchanged" reference remains anywhere in
  #     release-v2.yml. It was already dead code pre-#980 in v2 (v2 never
  #     produced the digest-check artifact this step consumed -- only
  #     v1's release.yml does), so its removal has no behavioral effect.
  plan-release:
    name: Plan Release
    runs-on: ubuntu-latest
    needs: [authorize-trigger, build-release-tools]
    if: needs.authorize-trigger.result == 'success'
    outputs:
      release-matrix: ${{ steps.plan.outputs.matrix || steps.resolved-plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version || steps.resolved-plan.outputs.version }}
      apps: ${{ steps.plan.outputs.apps || steps.resolved-plan.outputs.apps }}
      chart-matrix: ${{ steps.plan.outputs.chart_matrix || steps.resolved-plan.outputs.chart_matrix }}
      charts: ${{ steps.plan.outputs.charts || steps.resolved-plan.outputs.charts }}
      openapi-matrix: ${{ steps.plan.outputs.openapi_matrix || steps.resolved-plan.outputs.openapi_matrix }}
      has-specs: ${{ steps.plan.outputs.has_specs || steps.resolved-plan.outputs.has_specs }}
      # FR81 contract half / NFR11 (issue #1166/#1333): descriptor-set
      # analogue of openapi-matrix/has-specs above.
      descriptor-set-matrix: ${{ steps.plan.outputs.descriptor_set_matrix || steps.resolved-plan.outputs.descriptor_set_matrix }}
      has-descriptor-sets: ${{ steps.plan.outputs.has_descriptor_sets || steps.resolved-plan.outputs.has_descriptor_sets }}
      build-id: ${{ steps.plan.outputs.build_id || steps.resolved-plan.outputs.build_id }}
      versions: ${{ steps.plan.outputs.versions || steps.resolved-plan.outputs.versions }}
      # Issue #1024/#1055: the same PlanResult JSON as the individual
      # outputs above, in one blob -- lets build-release-artifacts forward
      # the whole plan to `release-helper build-release --from-resolved-plan`
      # verbatim instead of reconstructing it field-by-field in YAML.
      resolved-plan: ${{ steps.plan.outputs.resolved_plan || steps.resolved-plan.outputs.resolved_plan }}
    steps:
      # Issue #927/#929: when App Registry's Temporal DispatchBuild has
      # already computed the full release plan (the normal case for this
      # workflow's machine-only dispatch -- see authorize-trigger above), it
      # forwards it verbatim as the resolved_plan input. Rather than hand-
      # parsing that JSON into this job's outputs field-by-field with jq (a
      # second, hand-maintained mirror of the exact field mapping
      # `release-helper plan --format github` already implements -- see
      # tools/release_helper_go/cmd/plan.go), delegate to that same CLI via
      # its --from-resolved-plan flag: it unmarshals resolved_plan directly
      # into the same PlanResult struct `--format json` produces and falls
      # through to the identical --format github emission code, so there is
      # exactly one place (plan.go) that knows PlanResult's field mapping.
      #
      # This still needs a checkout -- `download-release-tools` is a local
      # composite action, and GitHub Actions can only resolve `uses: ./...`
      # against a checked-out repository -- but a plain shallow one (no
      # fetch-depth:0, no fetch-tags: those are only needed by the
      # `release-helper plan` re-derivation in the fallback path below), and
      # no Bazel toolchain setup (setup-build-env): download-release-tools
      # in its default 'published' source mode only downloads a prebuilt
      # binary (see release-summary job below for the same shallow-checkout
      # + download-release-tools pattern with no bazel setup). The
      # RELEASE_TOOLS_FALLBACK_TO_SOURCE safety valve below is the one thing
      # that needs Bazel here despite that -- see the step ahead of the
      # download for why.
      - name: Checkout code (resolved plan)
        if: github.event.inputs.resolved_plan != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      # Only runs when the safety valve (below) is armed -- see its comment.
      # Skipped by default so this fast path stays fast.
      - name: Setup Build Environment (fallback safety valve)
        if: github.event.inputs.resolved_plan != '' && vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools (resolved plan)
        if: github.event.inputs.resolved_plan != ''
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          # Safety valve (issue surfaced by run 32615125644): repo variable
          # RELEASE_TOOLS_FALLBACK_TO_SOURCE, unset/false by default,
          # preserves today's behavior exactly -- a failed prebuilt/artifact
          # acquisition fails the job with the existing clear error message.
          # Set it to 'true' (`gh variable set RELEASE_TOOLS_FALLBACK_TO_SOURCE
          # --body true`) to make download-release-tools build release tools
          # from source via Bazel instead of failing, when neither the S3
          # download nor the release-tools workflow artifact are available.
          # Meant as a temporary operator escape hatch (e.g. while an App
          # Registry/S3 publish-path issue like #1036 is being fixed) --
          # flip it back to false/unset once the underlying acquisition path
          # is healthy again, since source builds are slower and skip the
          # checksum-verified prebuilt-binary supply chain.
          fallback_to_source: ${{ vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE || 'false' }}
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Parse resolved plan
        id: resolved-plan
        if: github.event.inputs.resolved_plan != ''
        env:
          RESOLVED_PLAN: ${{ github.event.inputs.resolved_plan }}
        run: |
          "$RELEASE_HELPER" plan --format github --from-resolved-plan "$RESOLVED_PLAN" >> "$GITHUB_OUTPUT"

      # Fallback path (resolved_plan not set): a dispatcher that hasn't
      # pre-computed a plan -- e.g. a bot-credentialed manual/test dispatch
      # (release-v2.yml's workflow_dispatch is machine-only per
      # authorize-trigger above, so this is not a human fallback). Full
      # `release-helper plan` derivation, unchanged from pre-#927 behavior.
      - name: Checkout code
        if: github.event.inputs.resolved_plan == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        if: github.event.inputs.resolved_plan == ''
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        if: github.event.inputs.resolved_plan == ''
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          # Safety valve -- see the "Download release tools (resolved plan)"
          # step above for the full explanation. Bazel is already set up
          # unconditionally in this path, so no extra wiring is needed here.
          fallback_to_source: ${{ vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE || 'false' }}
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Plan release
        id: plan
        if: github.event.inputs.resolved_plan == ''
        env:
          APP_REGISTRY_CICD_OPT_IN: ${{ vars.APP_REGISTRY_CICD_OPT_IN }}
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_MODE: oidc
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        run: |
          ARGS=(plan --format github --event-type workflow_dispatch)
          [[ -n "${{ github.event.inputs.apps }}" ]] && ARGS+=(--apps "${{ github.event.inputs.apps }}")
          [[ -n "${{ github.event.inputs.helm_charts }}" ]] && ARGS+=(--charts "${{ github.event.inputs.helm_charts }}")
          [[ -n "${{ github.event.inputs.version }}" ]] && ARGS+=(--version "${{ github.event.inputs.version }}")
          [[ "${{ github.event.inputs.increment_minor }}" == "true" ]] && ARGS+=(--increment-minor)
          [[ "${{ github.event.inputs.increment_patch }}" == "true" ]] && ARGS+=(--increment-patch)
          [[ "${{ github.event.inputs.include_demo }}" == "true" ]] && ARGS+=(--include-demo)
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          [[ "${{ vars.APP_REGISTRY_CICD_OPT_IN }}" != "true" ]] && ARGS+=(--skip-registry)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_OUTPUT"

  # Issue #928: merges the old `release` (apps) and `release-helm-charts`
  # (charts) jobs into one -- a single checkout/setup-build-env/bazel
  # session amortized across both app images and chart packages for the
  # whole batch (FR1 of #928), mirroring the amortization reasoning the
  # now-superseded FR10 used for push-time compose (closed #917), applied
  # here at release-trigger time instead. Issue #1024 folded the formerly
  # separate build-openapi-specs and build-cli-binaries jobs into this one
  # too, for the same reason (#991/FR7 had reintroduced the per-job
  # checkout+setup-build-env+Bazel-server-startup cost #928 eliminated) --
  # each artifact type's steps below are guarded by that type's own
  # `if:` condition (mirroring how apps vs. charts already coexist in this
  # job), and the job-level `if:` is the union of all three former jobs'
  # conditions.
  #
  # This job's responsibility deliberately SHRANK relative to the two jobs
  # it replaces: it builds and pushes every app image (tagged only with
  # the build-scoped git SHA -- no version, no "latest") and composes
  # every chart's source tree, but assigns no final version, uploads
  # nothing to ChartMuseum, creates no git tag, and holds no ChartMuseum
  # credential. Those steps -- all safety-sensitive version-minting/
  # publish work -- moved to Temporal's new FinalizePublish activity
  # (tools/app_registry/worker/release/finalize.go), which runs after this
  # job's GHA run completes and reuses BeginPublish/FailPublish's existing
  # two-phase reservation + RecordArtifact's compare-and-swap machinery
  # unchanged (issue #928's explicit ask: do not reinvent this). See that
  # file's package doc comment for the full design, including how build
  # outputs (image digests, chart source trees) get from this job back to
  # Temporal: the `actions/upload-artifact` steps below, downloaded by
  # FinalizePublish via the GitHub Actions API after PollBuild reports
  # this run terminal -- the same workflow-artifact mechanism this
  # workflow already used for release-notes/digest-check/helm-charts
  # before this task, just consumed by Temporal instead of a later GHA
  # job.
  #
  # GitHub Release creation, release notes, and the implicit git-tag side
  # effect it produced have been removed entirely from this workflow (see
  # issue #979) -- not relocated or deferred, just gone. This job's build
  # outputs (image digests, chart source trees, OpenAPI specs, descriptor
  # sets, CLI binaries) are consumed solely by FinalizePublish via the
  # `actions/upload-artifact` steps below.
  #
  # Issue #986 (FR21/FR22 of #979): reviewed step-by-step -- build-app
  # pushes by digest only (--tag is the build-scoped git SHA; see its own
  # `Short`/`Long` help text), build-chart composes a source tree only (no
  # `helm package`, no ChartMuseum upload, no version resolution), and
  # neither step calls any App Registry RPC. Matches this header comment's
  # design. Clean. The folded-in OpenAPI (bazel build + upload only) and
  # CLI-binaries (package-assets + upload only) steps were reviewed the
  # same way when they were still separate jobs -- see their original
  # header comments, preserved below on each step group -- and neither
  # gained any new side effect by moving here.
  build-release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-tools]
    if: |
      needs.authorize-trigger.result == 'success' &&
      (
        (needs.plan-release.outputs.release-matrix != '' && fromJson(needs.plan-release.outputs.release-matrix).include[0] != null) ||
        github.event.inputs.helm_charts != '' ||
        (needs.plan-release.outputs.has-specs == 'true' && github.event.inputs.dry_run == 'false') ||
        (needs.plan-release.outputs.has-descriptor-sets == 'true' && github.event.inputs.dry_run == 'false') ||
        (github.event.inputs.dry_run == 'false' && needs.plan-release.outputs.release-matrix != '' &&
         (contains(needs.plan-release.outputs.release-matrix, '"app":"release_helper_go"') ||
          contains(needs.plan-release.outputs.release-matrix, '"app":"app-registry"')))
      )
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-docker: 'true'
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          # Safety valve -- see "Download release tools (resolved plan)" in
          # plan-release above for the full explanation. Bazel is already
          # set up unconditionally in this job, so no extra wiring is needed.
          fallback_to_source: ${{ vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE || 'false' }}
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Install Helm
        if: ${{ github.event.inputs.helm_charts != '' }}
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # Issue #1024/#1055: replaces four separate steps (build-app looped
      # per app in bash, build-chart, an OpenAPI bazel-build/jq loop, and
      # package-assets looped per CLI app in bash) with one call into
      # `release-helper build-release`, which does that looping/dispatch in
      # Go instead -- see tools/release_helper_go/cmd/build_release.go's
      # ExecuteBuildReleaseArtifacts. Each artifact type's own "should I
      # build this" gating (dry-run, has-specs, app-presence, an empty
      # charts list) now lives in that Go code, driven off the resolved
      # plan below, rather than as per-step YAML `if:` conditions -- this
      # job's own `if:` above still gates whether the job runs at all. This
      # CLI stays behind the same push-by-digest-only / no-final-version /
      # no-ChartMuseum-upload boundary described in this job's header
      # comment; ExecuteBuildReleaseArtifacts calls the exact same
      # ExecuteBuildApp/ExecuteBuildCharts/PackageAppAssets primitives the
      # former per-type steps did.
      - name: Build release artifacts
        env:
          RESOLVED_PLAN: ${{ needs.plan-release.outputs.resolved-plan }}
          BUILD_SHA: ${{ github.event.inputs.build_ref || github.sha }}
        run: |
          ARGS=(build-release --from-resolved-plan "$RESOLVED_PLAN" --git-sha "$BUILD_SHA")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          "$RELEASE_HELPER" "${ARGS[@]}"

      - name: Upload build manifest artifact
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest
          path: /tmp/build-manifest/apps/*.json
          if-no-files-found: ignore

      - name: Upload chart sources artifact
        if: ${{ github.event.inputs.helm_charts != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: chart-sources
          path: /tmp/build-manifest/charts/
          if-no-files-found: ignore

      - name: Upload OpenAPI spec artifact
        if: ${{ needs.plan-release.outputs.has-specs == 'true' && github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: openapi-specs
          path: /tmp/openapi-specs/*.json
          if-no-files-found: ignore

      # FR81 (contract half) / NFR11 (issue #1166/#1333): publishes the
      # gRPC descriptor set (e.g. leaflab-api's) through the release path,
      # not only as a build output -- mirrors the OpenAPI spec upload step
      # immediately above, via ExecuteBuildReleaseArtifacts' BuildDescriptorSets
      # (tools/release_helper_go/cmd/build_release.go).
      - name: Upload descriptor set artifact
        if: ${{ needs.plan-release.outputs.has-descriptor-sets == 'true' && github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v7
        with:
          name: descriptor-sets
          path: /tmp/descriptor-sets/*.pb
          if-no-files-found: ignore

      - name: Upload CLI binaries artifact
        if: |
          github.event.inputs.dry_run == 'false' &&
          needs.plan-release.outputs.release-matrix != '' &&
          (contains(needs.plan-release.outputs.release-matrix, '"app":"release_helper_go"') ||
           contains(needs.plan-release.outputs.release-matrix, '"app":"app-registry"'))
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: /tmp/cli-binaries/
          if-no-files-found: ignore

  # Issue #986 (FR21/FR22 of #979): reviewed -- `release-helper summary`
  # (tools/release_helper_go/cmd/summary.go) makes no client/registry
  # calls at all; it only formats plan-release's own outputs into a
  # string, appended to $GITHUB_STEP_SUMMARY. Read-only. Clean.
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-artifacts, build-release-tools]
    if: needs.authorize-trigger.result == 'success' && always()
    env:
      CHART_REPO_URL: ${{ vars.CHART_REPO_URL || 'https://charts.whalenet.dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      # Only runs when the safety valve (below) is armed -- see the
      # "Download release tools (resolved plan)" step in plan-release above
      # for the full explanation. Skipped by default so this job's normal
      # shallow-checkout, no-bazel path stays fast.
      - name: Setup Build Environment (fallback safety valve)
        if: vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        id: download-tools
        continue-on-error: true
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          # Safety valve -- see "Download release tools (resolved plan)" in
          # plan-release above for the full explanation.
          fallback_to_source: ${{ vars.RELEASE_TOOLS_FALLBACK_TO_SOURCE || 'false' }}
        env:
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Generate summary
        if: steps.download-tools.outcome == 'success'
        run: |
          ARGS=(summary --matrix '${{ needs.plan-release.outputs.release-matrix }}' --version "${{ needs.plan-release.outputs.version }}" --event-type workflow_dispatch --repository-owner "${{ github.repository_owner }}")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_STEP_SUMMARY"
