name: Release v2

# App Registry v2 release job (Plan #912, issue #914): this workflow is
# the independently-evolvable v2 home for Temporal-dispatched release/
# build logic (FR1). It was forked from release.yml's job skeleton --
# job names, `needs` chains, and outputs mirror release.yml's -- so this
# plan's other task issues (build_artifact digest lookup, DispatchBuild
# digest-override consumption, chart resolution) can land their real
# logic straight into these jobs without a second structural rewrite.
# Job bodies below are ported from release.yml (Implementation phase of
# #914); shared composite actions (./.github/actions/*) are referenced
# unchanged, not forked (FR4). See the v1->v2 migration checklist in
# tools/app_registry/PLAN.md ("App Registry v2 release job -- migration
# checklist") for which domains dispatch through v1 vs v2 at any point
# in time.
#
# Isolation from v1 (release.yml), enforced by this file:
#   - `concurrency.group` is `release-v2`, distinct from release.yml's
#     `release` (FR2, C2) -- a v1 run and a v2 run for the same commit
#     never cancel or block each other.
#   - Triggers: `workflow_dispatch` here is a *machine-only* dispatch
#     endpoint for Temporal's GitHubDispatcher.Dispatch
#     (tools/app_registry/worker/release/github.go, which POSTs to
#     `.../actions/workflows/<WorkflowFile>/dispatches` -- WorkflowFile
#     is configurable and will point at `release-v2.yml` once a domain
#     cuts over per the migration checklist). It is not a human entry
#     point -- authorize-trigger below enforces that identically to
#     release.yml's `authorize-trigger` job (bot-identity check on
#     `github.triggering_actor`). This workflow declares no other
#     trigger, so it never fires on any event release.yml itself
#     responds to (FR3).

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated list of apps to release (e.g., hello_python,hello_go) or "all" for all apps, or domain name (e.g., "demo") to release all apps in a domain. Leave empty to skip app release.'
        required: false
        default: ''
      version:
        description: 'Release version (e.g., v1.0.0) - leave empty when using increment options'
        required: false
        default: ''
      increment_minor:
        description: 'Auto-increment minor version (resets patch to 0) - applies to both apps and helm charts'
        type: boolean
        default: false
      increment_patch:
        description: 'Auto-increment patch version - applies to both apps and helm charts'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run - build but do not publish'
        type: boolean
        default: false
      helm_charts:
        description: 'Helm charts to release (e.g., hello-fastapi,demo-workers) or "all" or domain name (e.g., "demo"). Leave empty to skip helm chart release.'
        required: false
        default: ''
      include_demo:
        description: 'Include demo domain when using "all" for apps or helm charts'
        type: boolean
        default: false
      use_source_tools:
        description: 'Build release tools from source instead of downloading pinned prebuilt binaries (safety valve)'
        type: boolean
        default: false
      app_versions:
        description: 'JSON object of resolved app versions from this release batch''s plan, keyed by "<domain>-<name>" (e.g. {"manmanv2-control-api":"v1.2.3"}). Superseded by resolved_plan below (issue #927) for App Registry''s Temporal-orchestrated DispatchBuild, which no longer sets this -- kept as a manual-dispatch override: release-helm-charts prefers this when set, else falls back to plan-release''s versions output (itself either parsed from resolved_plan or freshly resolved).'
        required: false
        default: ''
      resolved_plan:
        description: 'JSON-encoded fully-expanded release plan (release_helper_go plan --format=json''s output shape: matrix, chart_matrix, openapi_matrix, has_specs, apps, charts, version, versions, build_id) computed once by App Registry''s Temporal ResolvePlan activity and forwarded verbatim by DispatchBuild (issue #927). When set, plan-release parses and passes it through as-is -- no checkout, no bazel setup, no `release-helper plan` re-invocation. Leave empty for a dispatcher that has not pre-computed a plan -- plan-release falls back to its own full `release-helper plan` derivation from the apps/helm_charts/version/increment_* inputs above.'
        required: false
        default: ''
      build_ref:
        description: 'Git commit SHA (or branch/tag) this run should check out and build, overriding the branch tip at dispatch time. FR9-FR11 (issue #923): App Registry''s Temporal DispatchBuild resolves app_build_log''s current-pointer row to pin a release to the exact commit ci.yml''s reconcile job last processed, and passes it here -- GitHub''s workflow_dispatch `ref` field itself must stay a branch/tag (it 422s on a raw commit SHA, even one that is genuinely a branch''s tip), so this workflow always dispatches against the branch and checks out build_ref explicitly instead. Leave empty to build the branch tip at dispatch time (falls back to github.sha).'
        required: false
        default: ''

concurrency:
  group: release-v2
  cancel-in-progress: false

env:
  APP_REGISTRY_CICD_OPT_IN: ${{ vars.APP_REGISTRY_CICD_OPT_IN }}

jobs:
  # Job skeleton mirrors release.yml's (FR1). Machine-only dispatch is
  # enforced identically to release.yml's authorize-trigger job (bot-
  # identity check on github.triggering_actor) -- release-v2.yml never
  # exposes a human-usable workflow_dispatch entry point either.
  authorize-trigger:
    name: Authorize Trigger (machine-only)
    runs-on: ubuntu-latest
    steps:
      - name: Require App-Registry-driven (machine) dispatch
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$TRIGGERING_ACTOR" != *"[bot]" ]]; then
            echo "::error::release-v2.yml's workflow_dispatch is not a human entry point (App Registry v2 cutover). Trigger releases from the App Registry UI instead. (triggering_actor=$TRIGGERING_ACTOR)"
            exit 1
          fi
          echo "Authorized machine-triggered dispatch (triggering_actor=$TRIGGERING_ACTOR)"

  # Probe for prebuilt release tools or build from source if missing / requested.
  # When prebuilt releases exist and use_source_tools is false, this job completes in seconds.
  # If prebuilt releases do not exist or use_source_tools is true, this builds the tools ONCE
  # via Bazel and uploads them as a workflow artifact for all downstream jobs to reuse.
  build-release-tools:
    name: Build Release Tools
    runs-on: ubuntu-latest
    needs: [authorize-trigger]
    if: needs.authorize-trigger.result == 'success'
    outputs:
      needs_build: ${{ steps.probe.outputs.needs_build }}
      source: ${{ steps.probe.outputs.source }}
      release_helper_version: ${{ steps.probe.outputs.release_helper_version }}
      app_registry_version: ${{ steps.probe.outputs.app_registry_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: App Registry Auth
        if: inputs.use_source_tools != true && github.event.inputs.use_source_tools != 'true'
        continue-on-error: true
        uses: ./.github/actions/app-registry-auth
        with:
          address: ${{ vars.APP_REGISTRY_ADDRESS }}
          token-url: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          client-id: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          client-secret: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}

      - name: Check prebuilt tool availability
        id: probe
        env:
          USE_SOURCE: ${{ inputs.use_source_tools == true || github.event.inputs.use_source_tools == 'true' }}
          GH_TOKEN: ${{ github.token }}
          TARGET_ENV: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        run: |
          if [[ "$USE_SOURCE" == "true" ]]; then
            echo "Explicit use_source_tools requested. Building from source."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "source=artifact" >> "$GITHUB_OUTPUT"
            {
              echo "### Release Tools Acquisition"
              echo "**Acquisition Mode:** 🛠️ Source Build (\`use_source_tools: true\` requested)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Resolving release tooling versions from App Registry (env=$TARGET_ENV)..."

          GRPCURL_VERSION="1.9.3"
          grpcurl_checksum() {
            case "$1" in
              linux_x86_64) echo "a926b62a85787ccf73ef8736b3ae554f1242e39d92bb8767a79d6dd23b11d1d5" ;;
              linux_arm64)  echo "b20a00c1cb82ab81ec32696766d4076e99b4cb5ca0823a71767ba64dbea0f263" ;;
              osx_x86_64)   echo "246a6669e58c282dcaf0e9dcb06dd1c8681833d59df24eb83d3123ec64c2d2e5" ;;
              osx_arm64)    echo "d8391485e99a728a3a4e82af3fd621f9fdea0c417a74e5122803ad20b207b623" ;;
              *) return 1 ;;
            esac
          }

          install_grpcurl() {
            if command -v grpcurl >/dev/null 2>&1; then
              GRPCURL_BIN="$(command -v grpcurl)"
              return 0
            fi
            local cache_root="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/grpcurl/${GRPCURL_VERSION}"
            local cached_bin="$cache_root/grpcurl"
            if [[ -x "$cached_bin" ]]; then
              GRPCURL_BIN="$cached_bin"
              return 0
            fi
            local host_os host_arch key
            host_os="$(uname -s)"
            host_arch="$(uname -m)"
            [[ "$host_os" == "Linux" ]] && host_os="linux" || host_os="osx"
            [[ "$host_arch" == "x86_64" || "$host_arch" == "amd64" ]] && host_arch="x86_64" || host_arch="arm64"
            key="${host_os}_${host_arch}"
            if ! expected_sha="$(grpcurl_checksum "$key")"; then
              return 1
            fi
            local tmp_dl
            tmp_dl="$(mktemp -d)"
            local url="https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_${key}.tar.gz"
            if ! curl -sSL -m 30 -o "$tmp_dl/grpcurl.tar.gz" "$url"; then
              rm -rf "$tmp_dl"
              return 1
            fi
            local actual_sha
            actual_sha="$(sha256sum "$tmp_dl/grpcurl.tar.gz" | awk '{print $1}')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              rm -rf "$tmp_dl"
              return 1
            fi
            if ! tar -xzf "$tmp_dl/grpcurl.tar.gz" -C "$tmp_dl" grpcurl; then
              rm -rf "$tmp_dl"
              return 1
            fi
            mkdir -p "$cache_root"
            cp "$tmp_dl/grpcurl" "$cached_bin"
            chmod +x "$cached_bin"
            rm -rf "$tmp_dl"
            GRPCURL_BIN="$cached_bin"
            return 0
          }

          resolve_registry_version() {
            local app_full_name="$1"
            local grpc_target="$APP_REGISTRY_ADDRESS"
            grpc_target="${grpc_target#https://}"
            grpc_target="${grpc_target#http://}"

            local use_tls=false
            if [[ "$APP_REGISTRY_ADDRESS" == https://* || "$APP_REGISTRY_ADDRESS" == *:443* ]]; then
              use_tls=true
            fi
            if [[ -n "${GRPC_USE_TLS:-}" ]]; then
              [[ "$GRPC_USE_TLS" == "true" ]] && use_tls=true || use_tls=false
            fi
            local -a tls_opt=()
            [[ "$use_tls" == "false" ]] && tls_opt=(-plaintext)

            local -a auth_opt=()
            if [[ -n "$REGISTRY_TOKEN" ]]; then
              auth_opt=(-H "authorization: Bearer $REGISTRY_TOKEN")
            fi

            local get_app_json app_id
            get_app_json="$("$GRPCURL_BIN" "${tls_opt[@]}" "${auth_opt[@]}" -max-time 15 \
              -d "{\"full_name\":\"${app_full_name}\"}" \
              "$grpc_target" appregistry.v1.AppRegistry/GetApp 2>/dev/null)" || true
            app_id="$(echo "$get_app_json" | jq -r '.app.appId // .app.app_id // empty' 2>/dev/null)" || true
            if [[ -z "$app_id" ]]; then
              return 1
            fi

            local env_state_json version
            env_state_json="$("$GRPCURL_BIN" "${tls_opt[@]}" "${auth_opt[@]}" -max-time 15 \
              -d "{\"environment_key\":\"${TARGET_ENV}\"}" \
              "$grpc_target" appregistry.v1.PromotionRegistry/GetEnvironmentState 2>/dev/null)" || true
            if [[ -z "$env_state_json" ]]; then
              return 1
            fi

            version="$(echo "$env_state_json" | jq -r --arg app_id "$app_id" '
              [.entries[]?
                | select((.artifact.appId // .artifact.app_id) == $app_id)
                | select((.artifact.kind // "") == "ARTIFACT_KIND_BINARY")
              ][0].artifact.version // empty
            ' 2>/dev/null)" || true
            if [[ -z "$version" || "$version" == "null" ]]; then
              return 1
            fi

            echo "$version"
            return 0
          }

          REGISTRY_TOKEN=""
          if [[ -n "${GRPC_AUTH_TOKEN_URL:-}" && -n "${GRPC_AUTH_CLIENT_ID:-}" && -n "${GRPC_AUTH_CLIENT_SECRET:-}" ]]; then
            if token_json=$(curl -sS -m 15 -X POST "$GRPC_AUTH_TOKEN_URL" \
                  -d grant_type=client_credentials \
                  -d client_id="$GRPC_AUTH_CLIENT_ID" \
                  -d client_secret="$GRPC_AUTH_CLIENT_SECRET" 2>/dev/null); then
              REGISTRY_TOKEN="$(echo "$token_json" | jq -r '.access_token // empty' 2>/dev/null)" || REGISTRY_TOKEN=""
            fi
          fi

          RH_VER=""
          AR_VER=""
          if [[ -n "${APP_REGISTRY_ADDRESS:-}" ]] && install_grpcurl; then
            RH_VER="$(resolve_registry_version "tools-release_helper_go" || true)"
            AR_VER="$(resolve_registry_version "tools-app-registry" || resolve_registry_version "tools-app_registry_cli" || true)"
          fi

          echo "Resolved release tooling versions from App Registry (env=$TARGET_ENV):"
          echo "  release_helper_go: ${RH_VER:-<not resolved>}"
          echo "  app_registry_cli:  ${AR_VER:-<not resolved>}"
          echo "release_helper_version=$RH_VER" >> "$GITHUB_OUTPUT"
          echo "app_registry_version=$AR_VER" >> "$GITHUB_OUTPUT"

          RH_EXISTS=false
          AR_EXISTS=false
          if [[ -n "$RH_VER" ]] && (gh release view "tools-release_helper_go.${RH_VER}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release view "release_helper_go.${RH_VER}" -R "${{ github.repository }}" >/dev/null 2>&1); then
            RH_EXISTS=true
            echo "✓ Found prebuilt release_helper_go (${RH_VER}) on GitHub Releases"
          else
            echo "✗ Prebuilt release_helper_go (${RH_VER:-<unset>}) not found on GitHub Releases"
          fi
          if [[ -n "$AR_VER" ]] && (gh release view "tools-app-registry.${AR_VER}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release view "tools-app_registry_cli.${AR_VER}" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release view "app-registry.${AR_VER}" -R "${{ github.repository }}" >/dev/null 2>&1); then
            AR_EXISTS=true
            echo "✓ Found prebuilt app_registry_cli (${AR_VER}) on GitHub Releases"
          else
            echo "✗ Prebuilt app_registry_cli (${AR_VER:-<unset>}) not found on GitHub Releases"
          fi

          if [[ "$RH_EXISTS" == "true" && "$AR_EXISTS" == "true" ]]; then
            echo "Prebuilt release tools exist on GitHub Releases (release_helper_go: $RH_VER, app_registry_cli: $AR_VER). Downstream jobs will download prebuilt binaries directly."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "source=published" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt release tools not found on GitHub Releases (release_helper_go: ${RH_VER:-<unset>} [exists=$RH_EXISTS], app_registry_cli: ${AR_VER:-<unset>} [exists=$AR_EXISTS]). Building once as workflow artifact for this run."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "source=artifact" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### Release Tools Acquisition"
            echo "| Tool | Version | Status |"
            echo "| --- | --- | --- |"
            echo "| \`release_helper_go\` | \`${RH_VER:-<not set>}\` | $([[ "$RH_EXISTS" == "true" ]] && echo "✅ Found on GitHub Releases" || echo "⚠️ Not found (will build)") |"
            echo "| \`app_registry_cli\` | \`${AR_VER:-<not set>}\` | $([[ "$AR_EXISTS" == "true" ]] && echo "✅ Found on GitHub Releases" || echo "⚠️ Not found (will build)") |"
            echo ""
            if [[ "$RH_EXISTS" == "true" && "$AR_EXISTS" == "true" ]]; then
              echo "**Acquisition Mode:** ⚡ Prebuilt Binaries (Downloaded from GitHub Releases)"
            else
              echo "**Acquisition Mode:** 🛠️ Source Build (Artifact uploaded for downstream jobs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Build Environment
        if: steps.probe.outputs.needs_build == 'true'
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Build release helper & app registry
        if: steps.probe.outputs.needs_build == 'true'
        run: |
          bazel build --config=ci-images \
            //tools/release_helper_go:release_helper_go \
            //tools/app_registry/cli:app-registry
          BAZEL_BIN="$(bazel info bazel-bin --config=ci-images)"
          mkdir -p /tmp/release-tools
          cp "$BAZEL_BIN/tools/release_helper_go/release_helper_go_/release_helper_go" /tmp/release-tools/release_helper_go
          cp "$BAZEL_BIN/tools/app_registry/cli/app-registry_/app-registry" /tmp/release-tools/app-registry

      - name: Upload release tools artifact
        if: steps.probe.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tools
          path: /tmp/release-tools/
          retention-days: 1

  plan-release:
    name: Plan Release
    runs-on: ubuntu-latest
    needs: [authorize-trigger, build-release-tools]
    if: needs.authorize-trigger.result == 'success'
    outputs:
      release-matrix: ${{ steps.plan.outputs.matrix || steps.resolved-plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version || steps.resolved-plan.outputs.version }}
      apps: ${{ steps.plan.outputs.apps || steps.resolved-plan.outputs.apps }}
      chart-matrix: ${{ steps.plan.outputs.chart_matrix || steps.resolved-plan.outputs.chart_matrix }}
      charts: ${{ steps.plan.outputs.charts || steps.resolved-plan.outputs.charts }}
      openapi-matrix: ${{ steps.plan.outputs.openapi_matrix || steps.resolved-plan.outputs.openapi_matrix }}
      has-specs: ${{ steps.plan.outputs.has_specs || steps.resolved-plan.outputs.has_specs }}
      build-id: ${{ steps.plan.outputs.build_id || steps.resolved-plan.outputs.build_id }}
      versions: ${{ steps.plan.outputs.versions || steps.resolved-plan.outputs.versions }}
    steps:
      # Issue #927/#929: when App Registry's Temporal DispatchBuild has
      # already computed the full release plan (the normal case for this
      # workflow's machine-only dispatch -- see authorize-trigger above), it
      # forwards it verbatim as the resolved_plan input. Rather than hand-
      # parsing that JSON into this job's outputs field-by-field with jq (a
      # second, hand-maintained mirror of the exact field mapping
      # `release-helper plan --format github` already implements -- see
      # tools/release_helper_go/cmd/plan.go), delegate to that same CLI via
      # its --from-resolved-plan flag: it unmarshals resolved_plan directly
      # into the same PlanResult struct `--format json` produces and falls
      # through to the identical --format github emission code, so there is
      # exactly one place (plan.go) that knows PlanResult's field mapping.
      #
      # This still needs a checkout -- `download-release-tools` is a local
      # composite action, and GitHub Actions can only resolve `uses: ./...`
      # against a checked-out repository -- but a plain shallow one (no
      # fetch-depth:0, no fetch-tags: those are only needed by the
      # `release-helper plan` re-derivation in the fallback path below), and
      # no Bazel toolchain setup (setup-build-env): download-release-tools
      # in its default 'published' source mode only downloads a prebuilt
      # binary (see release-summary job below for the same shallow-checkout
      # + download-release-tools pattern with no bazel setup).
      - name: Checkout code (resolved plan)
        if: github.event.inputs.resolved_plan != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: Download release tools (resolved plan)
        if: github.event.inputs.resolved_plan != ''
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          release_helper_version: ${{ needs.build-release-tools.outputs.release_helper_version }}
          app_registry_version: ${{ needs.build-release-tools.outputs.app_registry_version }}

      - name: Parse resolved plan
        id: resolved-plan
        if: github.event.inputs.resolved_plan != ''
        env:
          RESOLVED_PLAN: ${{ github.event.inputs.resolved_plan }}
        run: |
          "$RELEASE_HELPER" plan --format github --from-resolved-plan "$RESOLVED_PLAN" >> "$GITHUB_OUTPUT"

      # Fallback path (resolved_plan not set): a dispatcher that hasn't
      # pre-computed a plan -- e.g. a bot-credentialed manual/test dispatch
      # (release-v2.yml's workflow_dispatch is machine-only per
      # authorize-trigger above, so this is not a human fallback). Full
      # `release-helper plan` derivation, unchanged from pre-#927 behavior.
      - name: Checkout code
        if: github.event.inputs.resolved_plan == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        if: github.event.inputs.resolved_plan == ''
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'release-tools'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        if: github.event.inputs.resolved_plan == ''
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          release_helper_version: ${{ needs.build-release-tools.outputs.release_helper_version }}
          app_registry_version: ${{ needs.build-release-tools.outputs.app_registry_version }}

      - name: Plan release
        id: plan
        if: github.event.inputs.resolved_plan == ''
        env:
          APP_REGISTRY_CICD_OPT_IN: ${{ vars.APP_REGISTRY_CICD_OPT_IN }}
          APP_REGISTRY_ADDRESS: ${{ vars.APP_REGISTRY_ADDRESS }}
          GRPC_AUTH_MODE: oidc
          GRPC_AUTH_TOKEN_URL: ${{ vars.APP_REGISTRY_AUTH_TOKEN_URL }}
          GRPC_AUTH_CLIENT_ID: app-registry-builder-${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          GRPC_AUTH_CLIENT_SECRET: ${{ secrets.APP_REGISTRY_BUILDER_CLIENT_SECRET }}
        run: |
          ARGS=(plan --format github --event-type workflow_dispatch)
          [[ -n "${{ github.event.inputs.apps }}" ]] && ARGS+=(--apps "${{ github.event.inputs.apps }}")
          [[ -n "${{ github.event.inputs.helm_charts }}" ]] && ARGS+=(--charts "${{ github.event.inputs.helm_charts }}")
          [[ -n "${{ github.event.inputs.version }}" ]] && ARGS+=(--version "${{ github.event.inputs.version }}")
          [[ "${{ github.event.inputs.increment_minor }}" == "true" ]] && ARGS+=(--increment-minor)
          [[ "${{ github.event.inputs.increment_patch }}" == "true" ]] && ARGS+=(--increment-patch)
          [[ "${{ github.event.inputs.include_demo }}" == "true" ]] && ARGS+=(--include-demo)
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          [[ "${{ vars.APP_REGISTRY_CICD_OPT_IN }}" != "true" ]] && ARGS+=(--skip-registry)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_OUTPUT"

  build-openapi-specs:
    name: Build OpenAPI Specs
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-tools]
    if: needs.authorize-trigger.result == 'success' && needs.plan-release.outputs.has-specs == 'true' && github.event.inputs.dry_run == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Build OpenAPI specs
        env:
          OPENAPI_MATRIX: ${{ needs.plan-release.outputs.openapi-matrix }}
        run: |
          mkdir -p /tmp/openapi-specs
          BAZEL_BIN=$(bazel info bazel-bin --config=ci-images)

          echo "$OPENAPI_MATRIX" | jq -c '.include[]' | while read -r item; do
            TARGET=$(echo "$item" | jq -r '.openapi_target')
            DOMAIN=$(echo "$item" | jq -r '.domain')
            APP=$(echo "$item" | jq -r '.app')

            echo "Building OpenAPI spec for ${DOMAIN}-${APP} (target: $TARGET)..."
            bazel build --config=ci-images "$TARGET"

            TARGET_PATH="${TARGET#@@//}"
            TARGET_PATH="${TARGET_PATH#//}"
            TARGET_DIR=$(echo "$TARGET_PATH" | sed 's#:#/#' | sed 's#/[^/]*$##')
            SPEC_FILE="${BAZEL_BIN}/${TARGET_DIR}/${DOMAIN}-${APP}_openapi_spec.json"
            [[ ! -f "$SPEC_FILE" ]] && SPEC_FILE="${BAZEL_BIN}/$(echo "$TARGET_PATH" | sed 's#:#/#').json"

            cp "$SPEC_FILE" "/tmp/openapi-specs/${DOMAIN}-${APP}_openapi_spec.json"
          done

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specs
          path: /tmp/openapi-specs/*.json

  # Issue #928: merges the old `release` (apps) and `release-helm-charts`
  # (charts) jobs into one -- a single checkout/setup-build-env/bazel
  # session amortized across both app images and chart packages for the
  # whole batch (FR1 of #928), mirroring the amortization reasoning the
  # now-superseded FR10 used for push-time compose (closed #917), applied
  # here at release-trigger time instead.
  #
  # This job's responsibility deliberately SHRANK relative to the two jobs
  # it replaces: it builds and pushes every app image (tagged only with
  # the build-scoped git SHA -- no version, no "latest") and composes
  # every chart's source tree, but assigns no final version, uploads
  # nothing to ChartMuseum, creates no git tag, and holds no ChartMuseum
  # credential. Those steps -- all safety-sensitive version-minting/
  # publish work -- moved to Temporal's new FinalizePublish activity
  # (tools/app_registry/worker/release/finalize.go), which runs after this
  # job's GHA run completes and reuses BeginPublish/FailPublish's existing
  # two-phase reservation + RecordArtifact's compare-and-swap machinery
  # unchanged (issue #928's explicit ask: do not reinvent this). See that
  # file's package doc comment for the full design, including how build
  # outputs (image digests, chart source trees) get from this job back to
  # Temporal: the two `actions/upload-artifact` steps below, downloaded by
  # FinalizePublish via the GitHub Actions API after PollBuild reports
  # this run terminal -- the same workflow-artifact mechanism this
  # workflow already used for release-notes/digest-check/helm-charts
  # before this task, just consumed by Temporal instead of a later GHA
  # job.
  #
  # GitHub Release creation, release notes, and the implicit git-tag side
  # effect it produced have been removed entirely from this workflow (see
  # issue #979) -- not relocated or deferred, just gone. This job's build
  # outputs (image digests, chart source trees) are consumed solely by
  # FinalizePublish via the two `actions/upload-artifact` steps below.
  build-release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-tools]
    if: |
      needs.authorize-trigger.result == 'success' &&
      ((needs.plan-release.outputs.release-matrix != '' && fromJson(needs.plan-release.outputs.release-matrix).include[0] != null) ||
       github.event.inputs.helm_charts != '')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-docker: 'true'
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          release_helper_version: ${{ needs.build-release-tools.outputs.release_helper_version }}
          app_registry_version: ${{ needs.build-release-tools.outputs.app_registry_version }}

      - name: Install Helm
        if: ${{ github.event.inputs.helm_charts != '' }}
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # Push-by-digest only -- no version tag, no "latest", no App
      # Registry mutation, no git tag. See this job's header comment.
      - name: Build app images (push by digest)
        if: ${{ github.event.inputs.dry_run == 'false' && needs.plan-release.outputs.release-matrix != '' }}
        env:
          RELEASE_MATRIX: ${{ needs.plan-release.outputs.release-matrix }}
          BUILD_SHA: ${{ github.event.inputs.build_ref || github.sha }}
        run: |
          mkdir -p /tmp/build-manifest/apps

          echo "$RELEASE_MATRIX" | jq -c '.include[]' | while read -r item; do
            DOMAIN=$(echo "$item" | jq -r '.domain')
            APP=$(echo "$item" | jq -r '.app')

            echo "=========================================="
            echo "Building application: ${DOMAIN}-${APP} (build tag: ${BUILD_SHA})"
            echo "=========================================="

            "$RELEASE_HELPER" build-app --domain "$DOMAIN" --app "$APP" --git-sha "$BUILD_SHA" --output-dir /tmp/build-manifest/apps
          done

      # Composes each chart's source tree only -- no `helm package`, no
      # final version, no ChartMuseum upload. See this job's header
      # comment.
      - name: Build chart source trees
        if: ${{ github.event.inputs.helm_charts != '' }}
        run: |
          ARGS=(build-chart --charts "${{ github.event.inputs.helm_charts }}" --output-dir /tmp/build-manifest/charts)
          [[ "${{ github.event.inputs.include_demo }}" == "true" ]] && ARGS+=(--include-demo)
          "$RELEASE_HELPER" "${ARGS[@]}"

      - name: Upload build manifest artifact
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: /tmp/build-manifest/apps/*.json
          if-no-files-found: ignore

      - name: Upload chart sources artifact
        if: ${{ github.event.inputs.helm_charts != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chart-sources
          path: /tmp/build-manifest/charts/
          if-no-files-found: ignore

  # FR7 of #979: cross-compiles release_helper_go/app-registry (only, not
  # every cli app) for all four supported CLI platforms and stages them as
  # a build-scoped `cli-binaries` workflow artifact, distinct from the
  # `release-tools` artifact build-release-tools produces above (that one
  # is this-run's-host-platform only, meant for downstream jobs in *this*
  # run to exec; this one is multi-platform and meant for Temporal's
  # FinalizePublish to later download and publish to S3 once a version is
  # confirmed -- see issue #981). This job assigns no final version and
  # performs no S3 upload itself (FR9/FR10's job, done later once
  # FinalizePublish knows the confirmed EffectiveVersion).
  build-cli-binaries:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-tools]
    if: |
      needs.authorize-trigger.result == 'success' &&
      github.event.inputs.dry_run == 'false' &&
      needs.plan-release.outputs.release-matrix != '' &&
      (contains(needs.plan-release.outputs.release-matrix, '"app":"release_helper_go"') ||
       contains(needs.plan-release.outputs.release-matrix, '"app":"app-registry"'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-suffix: 'docker'
          bazel-remote-cache-url: ${{ secrets.BAZEL_REMOTE_CACHE_URL || vars.BAZEL_REMOTE_CACHE_URL }}
          bazel-remote-cache-user: ${{ secrets.BAZEL_REMOTE_CACHE_USER || vars.BAZEL_REMOTE_CACHE_USER }}
          bazel-remote-cache-password: ${{ secrets.BAZEL_REMOTE_CACHE_PASSWORD || vars.BAZEL_REMOTE_CACHE_PASSWORD }}
          bazel-remote-downloader-url: ${{ secrets.BAZEL_REMOTE_DOWNLOADER_URL || vars.BAZEL_REMOTE_DOWNLOADER_URL }}

      - name: Download release tools
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          release_helper_version: ${{ needs.build-release-tools.outputs.release_helper_version }}
          app_registry_version: ${{ needs.build-release-tools.outputs.app_registry_version }}

      # Only package whichever of the two apps is actually present in this
      # run's release matrix -- the job-level `if:` above only guarantees
      # at least one of them is; a run releasing just one must not fail
      # trying to package-assets the other (resolveApps would error on an
      # app name absent from this run's plan).
      - name: Package CLI binaries (multi-platform)
        env:
          RELEASE_MATRIX: ${{ needs.plan-release.outputs.release-matrix }}
        run: |
          mkdir -p /tmp/cli-binaries
          for APP_NAME in release_helper_go app-registry; do
            if echo "$RELEASE_MATRIX" | jq -e --arg app "$APP_NAME" '.include[] | select(.app == $app)' >/dev/null; then
              echo "Packaging CLI binaries for ${APP_NAME} (linux_amd64, linux_arm64, darwin_arm64, darwin_amd64)..."
              "$RELEASE_HELPER" package-assets "$APP_NAME" \
                --platforms linux_amd64,linux_arm64,darwin_arm64,darwin_amd64 \
                --output-dir "/tmp/cli-binaries/${APP_NAME}"
            else
              echo "${APP_NAME} not in this run's release matrix, skipping."
            fi
          done

      - name: Upload CLI binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: /tmp/cli-binaries/
          if-no-files-found: ignore

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [authorize-trigger, plan-release, build-release-artifacts, build-release-tools]
    if: needs.authorize-trigger.result == 'success' && always()
    env:
      CHART_REPO_URL: ${{ vars.CHART_REPO_URL || 'https://charts.whalenet.dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.sha }}

      - name: Download release tools
        id: download-tools
        continue-on-error: true
        uses: ./.github/actions/download-release-tools
        with:
          source: ${{ needs.build-release-tools.outputs.source || 'published' }}
          target_env: ${{ vars.APP_REGISTRY_BUILDER_ENV || 'dev' }}
          release_helper_version: ${{ needs.build-release-tools.outputs.release_helper_version }}
          app_registry_version: ${{ needs.build-release-tools.outputs.app_registry_version }}

      - name: Generate summary
        if: steps.download-tools.outcome == 'success'
        run: |
          ARGS=(summary --matrix '${{ needs.plan-release.outputs.release-matrix }}' --version "${{ needs.plan-release.outputs.version }}" --event-type workflow_dispatch --repository-owner "${{ github.repository_owner }}")
          [[ "${{ github.event.inputs.dry_run }}" == "true" ]] && ARGS+=(--dry-run)
          "$RELEASE_HELPER" "${ARGS[@]}" >> "$GITHUB_STEP_SUMMARY"
