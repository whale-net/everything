<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Black and White Page</title>
  <style>
    html, body {
      background: #ffffff;
      margin: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    document.body.addEventListener('click', function () {
      var current = window.getComputedStyle(document.body).backgroundColor;
      if (current === 'rgb(0, 0, 0)') {
        document.body.style.background = '#ffffff';
      } else {
        document.body.style.background = '#000000';
      }
    });
  </script>
</body>
</html>
