{{define "index.html"}}
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pi console</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  ul.hosts { list-style: none; padding: 0; }
  ul.hosts li { margin-bottom: 0.5rem; }
  ul.hosts form { display: flex; align-items: center; gap: 0.75rem; }
  button { font: inherit; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
  button:hover { background: #ebebeb; }
  .url { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>pi console</h1>
<p>Pick a host to start a new pi agent session on it.</p>
<ul class="hosts">
{{range .Hosts}}
  <li>
    <form method="post" action="/hosts/{{.Name}}/sessions">
      <button type="submit">{{.Name}}</button>
      <span class="url">{{.BaseURL}}</span>
    </form>
  </li>
{{end}}
</ul>
</body>
</html>
{{end}}
