syntax = "proto3";

package appregistry.v1;

option go_package = "github.com/whale-net/everything/tools/app_registry/protos;appregistrypb";

import "tools/app_registry/protos/messages.proto";

// ============================================================================
// Recording builds and artifacts (the CI write path)
// ============================================================================

message RecordBuildRequest {
  string git_sha = 1;
  string git_ref = 2;
  string workflow_run_id = 3;
  int32 workflow_attempt = 4;
  string actor = 5;
  int64 started_at = 6;

  // Required. "<workflow_run_id>-<attempt>".
  string idempotency_key = 7;
}

message RecordBuildResponse {
  Build build = 1;

  // True when this build was already recorded and the existing row was
  // returned unchanged.
  bool already_recorded = 2;
}

// ============================================================================
// app_build_log — FR8-FR12/FR14 (issue #923). Unconditional per-app/chart
// build log, one row per owner per push, so v2 release-trigger-time
// GitHubDispatcher.Dispatch (worker/release/github.go) can resolve a
// release target's build ref against a commit ci.yml's reconcile job has
// actually processed, instead of the literal "main" branch pointer. See
// migration 019's doc comment and server/repository.AppBuildLogRepository
// for the storage-layer contract this RPC writes through.
// ============================================================================

// RecordBuildLogRequest writes one app_build_log row, unconditionally --
// deliberately no content-gating (FR8). Called once per discovered
// app/chart for a push, all sharing the same build_id (one RecordBuild
// call per push/workflow-run -- see migration 019's doc comment).
message RecordBuildLogRequest {
  // Full name ("<domain>-<name>") of the app or chart this build log entry
  // is for -- resolved the same way RecordArtifact's owner_full_name is
  // (ArtifactServer.resolveOwner), so the owner must already be reconciled
  // (ReconcileApps/AssertApps) before this call, exactly like
  // RecordArtifact.
  string owner_full_name = 1;

  // Must be ARTIFACT_KIND_IMAGE or ARTIFACT_KIND_CHART -- app_build_log has
  // no binary/firmware rows (migration 019's CHECK constraint).
  ArtifactKind kind = 2;

  string git_sha = 3;

  // build_id returned by a prior RecordBuild call for this push -- see
  // migration 019's doc comment: one RecordBuild call per push, shared by
  // every app_build_log row written for that push.
  string build_id = 4;

  // Required. Recommended shape:
  // "<workflow_run_id>-<attempt>-buildlog-<kind>-<owner_full_name>" so a
  // retried CI step replays rather than double-writing new rows -- this is
  // about retry-safety, not content-gating (FR8's "unconditional" is about
  // NOT skipping the write when content is unchanged; it says nothing about
  // exact-request replay, which idempotency_key still protects against, the
  // same as every other write RPC in this file).
  string idempotency_key = 5;
}

message AppBuildLog {
  string app_build_log_id = 1;
  string owner_full_name = 2;
  ArtifactKind kind = 3;
  string git_sha = 4;
  string build_id = 5;
  int64 valid_from = 6;

  // 0 means still current (valid_to IS NULL).
  int64 valid_to = 7;
}

message RecordBuildLogResponse {
  AppBuildLog app_build_log = 1;
}

// ContainedImage is one image a chart pins, as resolved by tools/helm at
// compose time. Charts must be recorded with digests, not floating tags —
// this is what makes environment state auditable.
message ContainedImage {
  // App this image belongs to, as "<domain>-<name>".
  string app_full_name = 1;
  string repository = 2;
  string version = 3;
  string digest = 4;
}

message RecordArtifactRequest {
  string build_id = 1;
  ArtifactKind kind = 2;

  // For kind == IMAGE: the app's "<domain>-<name>".
  // For kind == CHART: the chart's "<domain>-<name>".
  string owner_full_name = 3;

  string repository = 4;
  string version = 5;  // semver tag, validated as v<major>.<minor>.<patch>
  string digest = 6;   // "sha256:..." — required

  // FR-13/FR-14: identity_digest computed over uncompressed content,
  // invariant to compression, file ordering, archive metadata, and manifest
  // formatting. Required for no-op detection (FR-17).
  string identity_digest = 10;

  // Only valid for kind == CHART. Every referenced image must already be
  // recorded, or the call fails — a chart may not pin an unknown digest.
  repeated ContainedImage contains = 7;

  int64 published_at = 8;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 9;
}

message RecordArtifactResponse {
  Artifact artifact = 1;
  bool already_recorded = 2;
}

// ============================================================================
// Artifact lifecycle (phase AR-7b, issue #558)
//
// See ARCHITECTURE.md "Artifact lifecycle: allocated -> publishing ->
// published". RecordArtifact above becomes the publishing -> published
// transition once these are wired into release.yml; it keeps its
// create-directly-as-published path for owners whose domain is still at
// adoption stage "observe".
// ============================================================================

// BeginPublishRequest is the ∅|allocated|failed -> publishing transition,
// called immediately before a release run pushes an image or chart.
message BeginPublishRequest {
  ArtifactKind kind = 1;

  // For kind == IMAGE: the app's "<domain>-<name>".
  // For kind == CHART: the chart's "<domain>-<name>".
  string owner_full_name = 2;

  string version = 3;  // semver tag, validated as v<major>.<minor>.<patch>
  string build_id = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 5;

  // Where the artifact is about to be pushed, e.g.
  // "ghcr.io/whale-net/app-registry-api" or
  // "https://charts.whalenet.dev/app-registry-app-registry". Consulted ONLY
  // on the ∅ -> publishing branch (no prior AllocateVersion row for this
  // version), which has to create the artifact row from nothing and so needs
  // a value for the NOT NULL artifact.repository column -- an existing
  // allocated/failed/publishing row keeps the repository it already has.
  //
  // Optional, and normally omitted: the server prefers this field but falls
  // back to the owning app's stored image_repository. That fallback does not
  // exist for charts -- chart.chart_repository has never been populated by
  // any write path and migration 008 hardcodes it to '' in v_current_chart
  // (a chart's ChartMuseum URL is deployment config the registry has no way
  // to derive) -- so chart callers MUST set this. See RecordArtifactRequest.
  // repository, which carries the same value for the same reason.
  string repository = 6;
}

message BeginPublishResponse {
  Artifact artifact = 1;
}

// FailPublishRequest is the publishing -> failed transition, called on
// release.yml's error path immediately after a BeginPublish for the same
// target (or by the stale-row reaper, server-side, with reason "stale" --
// not through this RPC).
message FailPublishRequest {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;

  // Required -- why the publish failed.
  string reason = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 5;
}

message FailPublishResponse {
  Artifact artifact = 1;
}

// BeginPublishBatchTarget is one (kind, owner, version) BeginPublishBatch
// should transition to "publishing" (or "allocated -> publishing" /
// "failed -> publishing", per BeginPublish's own legal-transition table --
// each target goes through the exact same transition BeginPublish would
// apply to it alone).
message BeginPublishBatchTarget {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;  // semver tag, validated as v<major>.<minor>.<patch>
}

// BeginPublishBatchRequest is AR-7d's (issue #558) closing of the gap AR-7b
// deliberately left open: the release plan step calls this ONCE, before the
// release matrix fans out, so every intended target has a "publishing" row
// -- and therefore shows up in GetReleaseRun -- even if its own matrix leg
// never starts. See ARCHITECTURE.md "The run log" -> "As built (AR-7d)".
//
// Each target is processed independently and partially: one bad target
// (unknown owner, malformed version) does not block the rest, matching
// AR-7a's ReconcileApps partial-apply precedent -- see
// BeginPublishBatchResponse.results.
message BeginPublishBatchRequest {
  string build_id = 1;
  repeated BeginPublishBatchTarget targets = 2;

  // Required. Prefix used to derive each target's own idempotency key as
  // "<prefix>-<owner_full_name>-<kind>-intent" -- the "-intent" suffix is
  // deliberately DIFFERENT from the key release.yml's per-leg BeginPublish
  // call uses for the same target ("<prefix>-<owner_full_name>-<kind>", no
  // suffix). The two calls must NOT collide: BeginPublishBatch declares
  // the intent set once, up front; the per-leg call runs again later, on
  // purpose, to refresh state_changed_at (a heartbeat, keeping the
  // stale-row reaper's timeout scoped to one leg rather than the whole
  // run) or to revive a row the reaper already expired to "failed" -- see
  // ArtifactRepository.BeginPublish's doc comment and ARCHITECTURE.md's
  // as-built note under "The run log". If the two calls shared a key, the
  // per-leg call would replay BeginPublishBatch's cached response via
  // idempotency instead of actually re-executing, defeating the heartbeat.
  string idempotency_key_prefix = 3;
}

// BeginPublishBatchResult is one target's outcome. artifact is set on
// success; error is set (and artifact left unset) on a per-target failure
// -- the request-level call still succeeds as long as it was well-formed,
// per the partial-apply note above.
message BeginPublishBatchResult {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;
  Artifact artifact = 4;
  string error = 5;
}

message BeginPublishBatchResponse {
  repeated BeginPublishBatchResult results = 1;
}

// ============================================================================
// The run log (AR-7d, issue #558)
// ============================================================================

// GetReleaseRunRequest identifies one CI run. workflow_attempt == 0 means
// "the latest attempt recorded for this run id" -- the common case, since a
// caller checking on a run's status usually doesn't know in advance whether
// it has been re-run.
message GetReleaseRunRequest {
  string workflow_run_id = 1;
  int32 workflow_attempt = 2;
}

// GetReleaseRunResponse is the run log: the build aggregate plus every
// artifact row hanging off it, in whatever state it's in. "What is
// incomplete?" = artifacts here with state != ARTIFACT_STATE_PUBLISHED --
// see ARCHITECTURE.md "The run log". Every artifact in this list already
// carries build_id == build.build_id; there is no separate "not started"
// bucket because BeginPublishBatch above ensures every intended target has
// a row (in "publishing", carrying this build_id) before the run's matrix
// even fans out.
message GetReleaseRunResponse {
  Build build = 1;
  repeated Artifact artifacts = 2;
}

// GetBuildRequest resolves one build by its build_id -- the id a
// ReleaseRunTarget carries (api_messages_release.proto), for callers that
// have a build_id in hand but not the workflow_run_id GetReleaseRun requires
// and don't want ListBuilds' unfiltered, recency-paginated scan.
message GetBuildRequest {
  string build_id = 1;
}

message GetBuildResponse {
  Build build = 1;
}

message ListBuildsRequest {
  // Optional: only return builds with recorded_at >= since (Unix timestamp).
  int64 since = 1;
  PageRequest page = 2;
}

message ListBuildsResponse {
  // Ordered most-recent-first by recorded_at, tie-broken by build_id.
  repeated Build builds = 1;
  PageResponse page = 2;
}

// ============================================================================
// Adoption and disaster recovery (AR-7e, issue #558)
// ============================================================================

// AdoptArtifactRequest is the ∅|failed -> published(provenance=ADOPTED)
// admin path: records a pre-existing GHCR image or chart -- one that predates
// the registry, or was pushed while the opt-in was off -- as published,
// without ever having observed a BeginPublish/RecordArtifact for it. See
// ARCHITECTURE.md "Adoption and disaster recovery". Lazy and per-artifact,
// used when a chart release fails on an unknown pin -- NOT a bulk backfill
// ("Resolved questions" #3 still rejects that), and NOT a live GHCR
// existence check: this records what an operator asserts, with a required
// reason, exactly as RecordArtifact records what CI observed.
message AdoptArtifactRequest {
  ArtifactKind kind = 1;

  // For kind == IMAGE: the app's "<domain>-<name>".
  // For kind == CHART: the chart's "<domain>-<name>".
  string owner_full_name = 2;

  string repository = 3;
  string version = 4;  // semver tag, validated as v<major>.<minor>.<patch>
  string digest = 5;    // "sha256:..." — required

  // Only valid for kind == CHART, same shape and validation as
  // RecordArtifactRequest.contains: every referenced image must already be
  // a PUBLISHED artifact (adopted or observed), or the call fails.
  repeated ContainedImage contains = 6;

  // Best-known actual publish time, if known; defaults to now if unset.
  int64 published_at = 7;

  // Required. Why this artifact is being recorded after the fact instead of
  // observed at publish time -- the audit trail for a deliberately rare,
  // human-triggered operation. Never supplied by CI.
  string reason = 8;

  // Required. Client-generated (e.g. a UUID) -- this is a human action, not
  // a CI run, so there is no natural <workflow_run_id>-based key.
  string idempotency_key = 9;
}

message AdoptArtifactResponse {
  Artifact artifact = 1;

  // True when an artifact with this exact digest was already published
  // (observed or previously adopted) and this call was a no-op replay.
  bool already_recorded = 2;
}

// ============================================================================
// Reads
// ============================================================================

message ListArtifactsRequest {
  // Filter by owner; "<domain>-<name>" of an app or chart.
  string owner_full_name = 1;
  ArtifactKind kind = 2;

  // When set, return only artifacts a caller could legally promote. This is
  // the filter the CLI uses to answer "what can I promote?".
  bool promotable_only = 3;

  PageRequest page = 4;

  // When set, return only artifacts with this provenance -- AR-7e (issue
  // #558): "which rows did we take on faith?" as a query. Unset (the
  // default, ARTIFACT_PROVENANCE_UNSPECIFIED) returns every provenance.
  ArtifactProvenance provenance = 5;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  PageResponse page = 2;
}

message GetArtifactRequest {
  // Identify by artifact_id, by digest (globally unique), or by the
  // (owner_full_name, kind, version) triple.
  string artifact_id = 1;
  string digest = 2;
  string owner_full_name = 3;
  ArtifactKind kind = 4;
  string version = 5;

  // When true, resolves the latest published artifact for owner_full_name + kind
  // ordered numerically by (version_major, version_minor, version_patch) DESC.
  // When before_version is also set, resolves the latest published version
  // strictly preceding before_version.
  bool latest_published = 6;
  string before_version = 7;
}

message GetArtifactResponse {
  Artifact artifact = 1;
  Build build = 2;
}

// ResolveArtifactRequest walks a chart artifact down to the concrete image
// digests it pins. This is the incident-time query: given what is in prod,
// what code is actually running.
message ResolveArtifactRequest {
  string artifact_id = 1;
  string digest = 2;
}

message ResolveArtifactResponse {
  Artifact artifact = 1;

  // Flattened image artifacts, each with its originating build so a digest
  // maps straight back to a commit.
  repeated Artifact images = 2;
  repeated Build builds = 3;
}

message ListArtifactPinsRequest {
  string artifact_id = 1;
  string digest = 2;
}

message ListArtifactPinsResponse {
  // The chart artifacts that pin the requested image artifact. Empty (not
  // an error) when the image artifact exists but nothing pins it -- see
  // the Implementation issue for the not-found-vs-empty distinction.
  // Deliberately unpaginated: artifact_link_image_artifact_id_idx already
  // exists (migration 001), and fan-in per image is bounded by distinct
  // pinning chart-versions, not by total repo history.
  repeated Artifact chart_artifacts = 1;
}

// ============================================================================
// CLI binary URL resolution (issue #979/#983)
// ============================================================================

// ResolveBinaryURLRequest resolves a CLI binary + version + platform to its
// public S3 download URL (FR12-FR14, FR16 of issue #979). Unlike
// GetArtifactRequest, callers name the binary/os/arch directly rather than
// owner_full_name -- ArtifactServer.ResolveBinaryURL maps binary to its App
// Registry owner full name internally ("tools-release_helper_go" /
// "tools-app-registry"), the same mapping release-v2.yml's
// build-release-tools probe and download-release-tools/action.yml already
// use.
message ResolveBinaryURLRequest {
  // "release_helper_go" or "app-registry".
  string binary = 1;

  string version = 2;  // semver tag, e.g. "v1.2.3"
  string os = 3;        // "linux" | "darwin"
  string arch = 4;       // "amd64" | "arm64"
}

// ResolveBinaryURLResponse carries unsigned, public-read download URLs (see
// libs/go/s3's Client.PublicURL) matching the S3 key convention:
// "<binary>/<version>/<binary>-<os>-<arch>" for download_url and
// "<binary>/<version>/checksums.txt" for checksum_manifest_url -- the same
// convention FinalizePublish's S3-publish task writes to.
//
// An unknown/unpublished binary+version returns a NotFound gRPC error
// instead of this response -- never a fabricated URL (FR13).
message ResolveBinaryURLResponse {
  string download_url = 1;

  // checksums.txt for this binary+version, covering all its platform
  // variants (FR16).
  string checksum_manifest_url = 2;
}

// ============================================================================
// Version allocation (phase AR-5)
// ============================================================================

// AllocateVersionRequest replaces the `git tag --sort=-version:refname` scan
// in release_helper_go. Allocation is a transactional insert against a unique
// (owner, version) constraint, so concurrent CI runs cannot collide.
message AllocateVersionRequest {
  string owner_full_name = 1;
  ArtifactKind kind = 2;

  // "major" | "minor" | "patch". Ignored when explicit_version is set.
  string increment = 3;

  // Bypass auto-increment and reserve this exact version. Fails if taken.
  string explicit_version = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>".
  string idempotency_key = 5;
}

message AllocateVersionResponse {
  string version = 1;

  // Version this was incremented from; empty for a first release.
  string previous_version = 2;

  bool already_allocated = 3;
}

// ============================================================================
// Compose-time chart hermeticity (phase AR-7f, issue #558)
//
// "A chart may only pin images the registry has published," enforced before
// the chart is packaged or pushed -- not after, the way the ordering-3 reject
// in RecordArtifact's `contains` validation already does. See
// ARCHITECTURE.md's "Compose-time chart hermeticity" subsection.
// ============================================================================

// ChartPin is one member app's resolved image pin, as release_helper_go's
// build-helm-chart bakes into the chart's values.yaml imageTag -- the
// release-resolved version (from git tags today, AllocateVersion after the
// AR-5 cutover), not the "latest" placeholder composer.go's hermetic Bazel
// action writes to the compose-time image lockfile.
message ChartPin {
  string app_full_name = 1;  // "<domain>-<name>"
  string version = 2;        // semver tag, e.g. "v1.2.3"
}

message CheckChartHermeticityRequest {
  // The chart's own domain. domain_adoption.stage is read for THIS domain,
  // not each pinned app's domain -- "a domain meets the strict rule after it
  // has been releasing through the registry" means the chart's own release
  // history, not an incidentally cross-domain-referenced app's.
  string chart_domain = 1;
  repeated ChartPin pins = 2;
}

// ChartPinViolation is one pin that failed the check: not recorded at all,
// or recorded but not yet in ARTIFACT_STATE_PUBLISHED.
message ChartPinViolation {
  string app_full_name = 1;
  string version = 2;
  string reason = 3;
}

message CheckChartHermeticityResponse {
  // False when chart_domain's adoption stage is not "allocate" -- the
  // per-domain gate every other AR-7 tightening uses (see ARCHITECTURE.md
  // "Rejected alternatives (issue #558)"). violations is always empty when
  // this is false; the caller must not fail the chart build in that case.
  bool enforced = 1;
  repeated ChartPinViolation violations = 2;
}
