syntax = "proto3";

package appregistry.v1;

option go_package = "github.com/whale-net/everything/tools/app_registry/protos;appregistrypb";

import "tools/app_registry/protos/messages.proto";

// ============================================================================
// Recording builds and artifacts (the CI write path)
// ============================================================================

message RecordBuildRequest {
  string git_sha = 1;
  string git_ref = 2;
  string workflow_run_id = 3;
  int32 workflow_attempt = 4;
  string actor = 5;
  int64 started_at = 6;

  // Required. "<workflow_run_id>-<attempt>".
  string idempotency_key = 7;
}

message RecordBuildResponse {
  Build build = 1;

  // True when this build was already recorded and the existing row was
  // returned unchanged.
  bool already_recorded = 2;
}

// ContainedImage is one image a chart pins, as resolved by tools/helm at
// compose time. Charts must be recorded with digests, not floating tags —
// this is what makes environment state auditable.
message ContainedImage {
  // App this image belongs to, as "<domain>-<name>".
  string app_full_name = 1;
  string repository = 2;
  string version = 3;
  string digest = 4;
}

message RecordArtifactRequest {
  string build_id = 1;
  ArtifactKind kind = 2;

  // For kind == IMAGE: the app's "<domain>-<name>".
  // For kind == CHART: the chart's "<domain>-<name>".
  string owner_full_name = 3;

  string repository = 4;
  string version = 5;  // semver tag, validated as v<major>.<minor>.<patch>
  string digest = 6;   // "sha256:..." — required

  // Only valid for kind == CHART. Every referenced image must already be
  // recorded, or the call fails — a chart may not pin an unknown digest.
  repeated ContainedImage contains = 7;

  int64 published_at = 8;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 9;
}

message RecordArtifactResponse {
  Artifact artifact = 1;
  bool already_recorded = 2;
}

// ============================================================================
// Artifact lifecycle (phase AR-7b, issue #558)
//
// See ARCHITECTURE.md "Artifact lifecycle: allocated -> publishing ->
// published". RecordArtifact above becomes the publishing -> published
// transition once these are wired into release.yml; it keeps its
// create-directly-as-published path for owners whose domain is still at
// adoption stage "observe".
// ============================================================================

// BeginPublishRequest is the ∅|allocated|failed -> publishing transition,
// called immediately before a release run pushes an image or chart.
message BeginPublishRequest {
  ArtifactKind kind = 1;

  // For kind == IMAGE: the app's "<domain>-<name>".
  // For kind == CHART: the chart's "<domain>-<name>".
  string owner_full_name = 2;

  string version = 3;  // semver tag, validated as v<major>.<minor>.<patch>
  string build_id = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 5;
}

message BeginPublishResponse {
  Artifact artifact = 1;
}

// FailPublishRequest is the publishing -> failed transition, called on
// release.yml's error path immediately after a BeginPublish for the same
// target (or by the stale-row reaper, server-side, with reason "stale" --
// not through this RPC).
message FailPublishRequest {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;

  // Required -- why the publish failed.
  string reason = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>-<kind>".
  string idempotency_key = 5;
}

message FailPublishResponse {
  Artifact artifact = 1;
}

// BeginPublishBatchTarget is one (kind, owner, version) BeginPublishBatch
// should transition to "publishing" (or "allocated -> publishing" /
// "failed -> publishing", per BeginPublish's own legal-transition table --
// each target goes through the exact same transition BeginPublish would
// apply to it alone).
message BeginPublishBatchTarget {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;  // semver tag, validated as v<major>.<minor>.<patch>
}

// BeginPublishBatchRequest is AR-7d's (issue #558) closing of the gap AR-7b
// deliberately left open: the release plan step calls this ONCE, before the
// release matrix fans out, so every intended target has a "publishing" row
// -- and therefore shows up in GetReleaseRun -- even if its own matrix leg
// never starts. See ARCHITECTURE.md "The run log" -> "As built (AR-7d)".
//
// Each target is processed independently and partially: one bad target
// (unknown owner, malformed version) does not block the rest, matching
// AR-7a's ReconcileApps partial-apply precedent -- see
// BeginPublishBatchResponse.results.
message BeginPublishBatchRequest {
  string build_id = 1;
  repeated BeginPublishBatchTarget targets = 2;

  // Required. Prefix used to derive each target's own idempotency key as
  // "<prefix>-<owner_full_name>-<kind>-intent" -- the "-intent" suffix is
  // deliberately DIFFERENT from the key release.yml's per-leg BeginPublish
  // call uses for the same target ("<prefix>-<owner_full_name>-<kind>", no
  // suffix). The two calls must NOT collide: BeginPublishBatch declares
  // the intent set once, up front; the per-leg call runs again later, on
  // purpose, to refresh state_changed_at (a heartbeat, keeping the
  // stale-row reaper's timeout scoped to one leg rather than the whole
  // run) or to revive a row the reaper already expired to "failed" -- see
  // ArtifactRepository.BeginPublish's doc comment and ARCHITECTURE.md's
  // as-built note under "The run log". If the two calls shared a key, the
  // per-leg call would replay BeginPublishBatch's cached response via
  // idempotency instead of actually re-executing, defeating the heartbeat.
  string idempotency_key_prefix = 3;
}

// BeginPublishBatchResult is one target's outcome. artifact is set on
// success; error is set (and artifact left unset) on a per-target failure
// -- the request-level call still succeeds as long as it was well-formed,
// per the partial-apply note above.
message BeginPublishBatchResult {
  ArtifactKind kind = 1;
  string owner_full_name = 2;
  string version = 3;
  Artifact artifact = 4;
  string error = 5;
}

message BeginPublishBatchResponse {
  repeated BeginPublishBatchResult results = 1;
}

// ============================================================================
// The run log (AR-7d, issue #558)
// ============================================================================

// GetReleaseRunRequest identifies one CI run. workflow_attempt == 0 means
// "the latest attempt recorded for this run id" -- the common case, since a
// caller checking on a run's status usually doesn't know in advance whether
// it has been re-run.
message GetReleaseRunRequest {
  string workflow_run_id = 1;
  int32 workflow_attempt = 2;
}

// GetReleaseRunResponse is the run log: the build aggregate plus every
// artifact row hanging off it, in whatever state it's in. "What is
// incomplete?" = artifacts here with state != ARTIFACT_STATE_PUBLISHED --
// see ARCHITECTURE.md "The run log". Every artifact in this list already
// carries build_id == build.build_id; there is no separate "not started"
// bucket because BeginPublishBatch above ensures every intended target has
// a row (in "publishing", carrying this build_id) before the run's matrix
// even fans out.
message GetReleaseRunResponse {
  Build build = 1;
  repeated Artifact artifacts = 2;
}

// ============================================================================
// Reads
// ============================================================================

message ListArtifactsRequest {
  // Filter by owner; "<domain>-<name>" of an app or chart.
  string owner_full_name = 1;
  ArtifactKind kind = 2;

  // When set, return only artifacts a caller could legally promote. This is
  // the filter the CLI uses to answer "what can I promote?".
  bool promotable_only = 3;

  PageRequest page = 4;
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
  PageResponse page = 2;
}

message GetArtifactRequest {
  // Identify by artifact_id, by digest (globally unique), or by the
  // (owner_full_name, kind, version) triple.
  string artifact_id = 1;
  string digest = 2;
  string owner_full_name = 3;
  ArtifactKind kind = 4;
  string version = 5;
}

message GetArtifactResponse {
  Artifact artifact = 1;
  Build build = 2;
}

// ResolveArtifactRequest walks a chart artifact down to the concrete image
// digests it pins. This is the incident-time query: given what is in prod,
// what code is actually running.
message ResolveArtifactRequest {
  string artifact_id = 1;
  string digest = 2;
}

message ResolveArtifactResponse {
  Artifact artifact = 1;

  // Flattened image artifacts, each with its originating build so a digest
  // maps straight back to a commit.
  repeated Artifact images = 2;
  repeated Build builds = 3;
}

// ============================================================================
// Version allocation (phase AR-5)
// ============================================================================

// AllocateVersionRequest replaces the `git tag --sort=-version:refname` scan
// in release_helper_go. Allocation is a transactional insert against a unique
// (owner, version) constraint, so concurrent CI runs cannot collide.
message AllocateVersionRequest {
  string owner_full_name = 1;
  ArtifactKind kind = 2;

  // "major" | "minor" | "patch". Ignored when explicit_version is set.
  string increment = 3;

  // Bypass auto-increment and reserve this exact version. Fails if taken.
  string explicit_version = 4;

  // Required. "<workflow_run_id>-<attempt>-<owner_full_name>".
  string idempotency_key = 5;
}

message AllocateVersionResponse {
  string version = 1;

  // Version this was incremented from; empty for a first release.
  string previous_version = 2;

  bool already_allocated = 3;
}
