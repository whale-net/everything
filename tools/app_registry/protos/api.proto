syntax = "proto3";

package appregistry.v1;

option go_package = "github.com/whale-net/everything/tools/app_registry/protos;appregistrypb";

import "tools/app_registry/protos/api_messages_app.proto";
import "tools/app_registry/protos/api_messages_artifact.proto";
import "tools/app_registry/protos/api_messages_environment.proto";
import "tools/app_registry/protos/api_messages_promotion.proto";
import "tools/app_registry/protos/api_messages_release.proto";

// The registry is split into four services along its authorization boundary,
// not along its data model. `builder` (the CI service account) may call
// AppRegistry and ArtifactRegistry. `promoter` (a human, or a
// human-triggered workflow using an environment-scoped credential) may call
// PromotionRegistry. `admin` may call EnvironmentRegistry. A credential that
// can record a build must never be able to promote it.

// ============================================================================
// AppRegistry — app and chart identity. Role: builder (writes), any (reads).
// ============================================================================
service AppRegistry {
  // Full reconcile from the release_app manifests discovered by bazel query.
  // Apps absent from the request are marked MISSING, never deleted.
  rpc ReconcileApps(ReconcileAppsRequest) returns (ReconcileAppsResponse);

  // AR-7c (issue #558): additive identity + manifest-snapshot write, safe to
  // call from ANY ref -- the released ref, not just main. Never marks
  // anything MISSING; rejects (per item) assertion against an ARCHIVED
  // app/chart. Called as the first step of a release run, closing the
  // release-vs-reconcile gap (issue #547) without depending on main's
  // ReconcileApps having gone first. See ARCHITECTURE.md "AssertApps
  // (additive) vs. ReconcileApps (absence sweep)".
  rpc AssertApps(AssertAppsRequest) returns (AssertAppsResponse);

  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetApp(GetAppRequest) returns (GetAppResponse);
  rpc ListCharts(ListChartsRequest) returns (ListChartsResponse);

  // Human triage of a MISSING app: archive it or restore it. Role: admin.
  rpc SetAppStatus(SetAppStatusRequest) returns (SetAppStatusResponse);

  rpc ListReconcileRuns(ListReconcileRunsRequest) returns (ListReconcileRunsResponse);
}

// ============================================================================
// ArtifactRegistry — published builds and artifacts.
// Role: builder (writes), any (reads).
// ============================================================================
service ArtifactRegistry {
  rpc RecordBuild(RecordBuildRequest) returns (RecordBuildResponse);
  rpc RecordArtifact(RecordArtifactRequest) returns (RecordArtifactResponse);

  // FR8 (issue #923): writes one app_build_log row, unconditionally, for a
  // single owner (app or chart) -- ci.yml's reconcile-app-registry job
  // calls this once per discovered app/chart after RecordBuild and after
  // ReconcileApps/AssertApps have run. See
  // api_messages_artifact.proto's RecordBuildLogRequest doc comment.
  rpc RecordBuildLog(RecordBuildLogRequest) returns (RecordBuildLogResponse);

  // Phase AR-7b (issue #558): artifact lifecycle, allocated -> publishing ->
  // published. Called immediately before/after an image or chart push;
  // RecordArtifact above completes publishing -> published.
  rpc BeginPublish(BeginPublishRequest) returns (BeginPublishResponse);
  rpc FailPublish(FailPublishRequest) returns (FailPublishResponse);

  // Phase AR-7d (issue #558): the bulk, up-front form of BeginPublish --
  // called once from the release plan step, before the release matrix fans
  // out, so every intended target has a "publishing" row from the start.
  // Closes the gap AR-7b's own scope note left open (a matrix leg that
  // never starts has no row of any kind) -- see ARCHITECTURE.md "The run
  // log" -> "As built (AR-7d)".
  rpc BeginPublishBatch(BeginPublishBatchRequest) returns (BeginPublishBatchResponse);

  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);

  // Phase AR-7d (issue #558): the run log CI resumes against -- the build
  // aggregate plus every child artifact and its state. See
  // ARCHITECTURE.md "The run log".
  rpc GetReleaseRun(GetReleaseRunRequest) returns (GetReleaseRunResponse);

  // Walk a chart artifact down to the image digests it pins.
  rpc ResolveArtifact(ResolveArtifactRequest) returns (ResolveArtifactResponse);

  rpc ListBuilds(ListBuildsRequest) returns (ListBuildsResponse);
  rpc ListArtifactPins(ListArtifactPinsRequest) returns (ListArtifactPinsResponse);

  // Phase AR-5: transactional version allocation, replacing git-tag scanning.
  rpc AllocateVersion(AllocateVersionRequest) returns (AllocateVersionResponse);

  // Phase AR-7e (issue #558): the admin-only adoption / disaster-recovery
  // path -- records a pre-existing GHCR image or chart as published with
  // provenance ADOPTED and a required reason, for when there is no CI run to
  // resume (a chart pinning an image published before the registry existed,
  // or a registry restored behind/lost). Role: admin ONLY -- never the
  // builder credential a CI job holds; see ARCHITECTURE.md "Authorization"
  // and "Adoption and disaster recovery".
  rpc AdoptArtifact(AdoptArtifactRequest) returns (AdoptArtifactResponse);

  // Phase AR-7f (issue #558): compose-time chart hermeticity, gated per
  // domain. Called from the release path (tools/release_helper_go's
  // build-helm-chart, never a Bazel action -- see ARCHITECTURE.md "Chart ->
  // image lockfile") right after a chart's member app versions are resolved
  // and before the chart is packaged or anything is pushed. Read-only: it
  // never writes, so it needs no idempotency_key.
  rpc CheckChartHermeticity(CheckChartHermeticityRequest) returns (CheckChartHermeticityResponse);
}

// ============================================================================
// PromotionRegistry — what is deployed where.
// Role: promoter (writes, environment-scoped), any (reads).
// ============================================================================
service PromotionRegistry {
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);

  // Current state, or state at any past instant via the SCD2 window. This is
  // the query the writeback worker and deploy tooling use.
  rpc GetEnvironmentState(GetEnvironmentStateRequest) returns (GetEnvironmentStateResponse);

  rpc ListPromotions(ListPromotionsRequest) returns (ListPromotionsResponse);
  rpc ListPromotionEvents(ListPromotionEventsRequest) returns (ListPromotionEventsResponse);
}

// ============================================================================
// ReleaseRegistry — triggering and observing releases (FR1-5, FR10, NFR4,
// NFR5; issue #888). A clean seam separate from PromotionRegistry even
// though it reuses the same permission (see server/auth.RequirePromoter):
// triggering a release builds/publishes artifacts, it does not deploy to an
// environment, so it does not belong on PromotionRegistry's environment-
// scoped surface.
// Role: promoter (writes -- same check Promote already requires, FR4/NFR5,
// no new role), any (reads).
// ============================================================================
service ReleaseRegistry {
  // Dedup-checks the batch against any already-non-terminal release
  // covering the same targets (FR5 -- a UX-quality fast-fail; the
  // authoritative NFR2 guarantee is Temporal's workflow-id dedup), persists
  // the release_run/release_run_target rows, and starts the
  // ReleaseWorkflow.
  rpc TriggerRelease(TriggerReleaseRequest) returns (TriggerReleaseResponse);

  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
}

// ============================================================================
// EnvironmentRegistry — environment definitions. Role: admin.
// ============================================================================
service EnvironmentRegistry {
  rpc UpsertEnvironment(UpsertEnvironmentRequest) returns (UpsertEnvironmentResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc ArchiveEnvironment(ArchiveEnvironmentRequest) returns (ArchiveEnvironmentResponse);
}
