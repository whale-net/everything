syntax = "proto3";

package appregistry.v1;

option go_package = "github.com/whale-net/everything/tools/app_registry/protos;appregistrypb";

import "tools/app_registry/protos/messages.proto";
import "tools/appmeta/proto/appmeta.proto";

// ============================================================================
// Reconciliation
// ============================================================================

// ReconcileAppsRequest is a FULL replace, not an incremental upsert. The
// caller sends every manifest in the monorepo; anything the registry knows
// about that is absent from this set is marked APP_STATUS_MISSING for human
// triage. Nothing is ever hard-deleted.
//
// The payload is the manifest set exactly as `release_helper_go` discovered it
// from `bazel query` — the registry does not define its own manifest shape, so
// there is nothing to keep in sync. Adding a field to release_app makes it
// available here automatically.
message ReconcileAppsRequest {
  whalenet.appmeta.v1.AppManifestSet manifests = 1;

  // When true, compute and return the diff without writing anything.
  bool dry_run = 2;

  // Required. Repeated calls with the same key are a no-op returning the
  // original result. Use "<workflow_run_id>-<attempt>".
  string idempotency_key = 3;
}

message ReconcileAppsResponse {
  repeated App created_apps = 1;
  repeated App updated_apps = 2;

  // Apps that fell out of the manifest set and were flagged for triage.
  repeated App newly_missing_apps = 3;

  // Apps previously MISSING that reappeared; automatically returned to ACTIVE.
  repeated App recovered_apps = 4;

  repeated Chart created_charts = 5;
  repeated Chart updated_charts = 6;
  repeated Chart newly_missing_charts = 7;
  repeated Chart recovered_charts = 8;

  bool dry_run = 9;

  // True when this call was rejected by the reconcile watermark as older
  // (in commit order) than the most recently applied call, and was
  // therefore a no-op success -- nothing above was written, every list is
  // empty. This is deliberately NOT an error: a re-run of an older CI
  // workflow doing the right thing (declining to revert newer state) must
  // not turn the workflow red. See ARCHITECTURE.md "Reconcile watermark"
  // and issue #545. Never set when dry_run is true -- a dry run never
  // consults or advances the watermark.
  bool skipped_stale = 10;

  // The git_sha this call lost to, populated only when skipped_stale is
  // true -- so a caller/log line can say exactly which commit is currently
  // recorded instead of just "something newer already applied."
  string current_watermark_git_sha = 11;

  // Charts from this call's manifest set whose apps references did not all
  // resolve to known apps -- AR-7a. Each is SKIPPED, not fatal: every other
  // app/chart above still applied, and the watermark still advanced. A
  // skipped chart is never included in newly_missing_charts either -- a
  // chart present in the manifest set but unresolvable is treated as
  // present, not absent. See
  // tools/app_registry/ARCHITECTURE.md "AssertApps (additive) vs.
  // ReconcileApps (absence sweep)" and PLAN.md's AR-7a. Populated on a
  // dry_run call too -- a dry run computes the same resolution and reports
  // it the same way, it just writes nothing.
  repeated UnresolvedChart unresolved_charts = 12;
}

// UnresolvedChart names one chart manifest that ReconcileApps could not
// fully resolve and therefore skipped -- see
// ReconcileAppsResponse.unresolved_charts.
message UnresolvedChart {
  string domain = 1;
  string name = 2;

  // Every app reference from the chart manifest that failed to resolve,
  // exactly as it appeared in the manifest (a bare name via the deprecated
  // ChartManifest.apps, or a "<domain>/<name>" string via
  // ChartManifest.app_refs).
  repeated string app_refs = 3;

  // Human-readable explanation (unknown app, ambiguous bare name across
  // domains, malformed app_ref). Not machine-parsed.
  string reason = 4;
}

// ============================================================================
// AssertApps (AR-7c, issue #558)
// ============================================================================

// AssertAppsRequest carries the SAME AppManifestSet shape ReconcileApps
// does, but is safe from any ref: AssertApps only ever creates or recovers
// identity + records a manifest snapshot, and never treats an app/chart
// absent from this set as gone (contrast ReconcileAppsRequest's doc
// comment). manifests.git_sha/source_committed_at are stored on the
// snapshot rows this call writes, but -- unlike ReconcileApps -- are never
// compared against the reconcile watermark.
message AssertAppsRequest {
  whalenet.appmeta.v1.AppManifestSet manifests = 1;

  // Required. Repeated calls with the same key are a no-op returning the
  // original result. Use "<workflow_run_id>-<attempt>-<domain>-<app>" (one
  // release-job matrix leg's worth), matching the convention
  // RecordBuild/RecordArtifact already use for CI.
  string idempotency_key = 2;
}

message AssertAppsResponse {
  repeated App created_apps = 1;
  // Already ACTIVE; only the manifest snapshot changed (or this call was a
  // no-op replay of an already-recorded (owner, git_sha) pair).
  repeated App updated_apps = 2;
  // Previously MISSING, automatically returned to ACTIVE -- same automatic
  // recovery ReconcileApps's absence sweep triggers.
  repeated App recovered_apps = 3;

  repeated Chart created_charts = 4;
  repeated Chart updated_charts = 5;
  repeated Chart recovered_charts = 6;

  // Apps/charts this call declined to touch because they are ARCHIVED --
  // see AppRegistry.AssertApps's doc comment. Each entry is SKIPPED, not
  // fatal: every other app/chart in this call still applied.
  repeated RejectedOwner rejected_apps = 7;
  repeated RejectedOwner rejected_charts = 8;
}

// RejectedOwner names one app or chart AssertApps declined to assert
// because it is ARCHIVED -- see AssertAppsResponse.rejected_apps/
// rejected_charts.
message RejectedOwner {
  string domain = 1;
  string name = 2;
  // Human-readable explanation. Not machine-parsed.
  string reason = 3;
}

// ============================================================================
// Reads
// ============================================================================

message ListAppsRequest {
  string domain = 1;  // optional filter

  // Defaults to [ACTIVE, MISSING] when empty — archived apps are hidden
  // unless explicitly asked for.
  repeated AppStatus statuses = 2;

  whalenet.appmeta.v1.DeployUnit deploy_unit = 3;  // optional filter
  PageRequest page = 4;
}

message ListAppsResponse {
  repeated App apps = 1;
  PageResponse page = 2;
}

message GetAppRequest {
  // Either app_id, or full_name ("<domain>-<name>").
  string app_id = 1;
  string full_name = 2;
}

message GetAppResponse {
  App app = 1;

  // Charts that compose this app, so a caller can see what it would actually
  // need to promote.
  repeated Chart charts = 2;
}

message ListChartsRequest {
  string domain = 1;
  repeated AppStatus statuses = 2;
  PageRequest page = 3;
}

message ListChartsResponse {
  repeated Chart charts = 1;
  PageResponse page = 2;
}

// ============================================================================
// Manual triage of MISSING rows
// ============================================================================

// SetAppStatusRequest lets a human resolve a MISSING app: archive it if the
// removal was intentional, or reactivate it if the reconcile was wrong.
// Transitioning to ACTIVE is only accepted if the app is present in the most
// recent reconcile.
message SetAppStatusRequest {
  string app_id = 1;
  AppStatus status = 2;
  string reason = 3;  // required — recorded in the audit log
}

message SetAppStatusResponse {
  App app = 1;
}
