syntax = "proto3";

package appregistry.v1;

option go_package = "github.com/whale-net/everything/tools/app_registry/protos;appregistrypb";

import "tools/app_registry/protos/messages.proto";

// ============================================================================
// Promotion (the human write path)
// ============================================================================

message PromoteRequest {
  string environment_key = 1;

  // The artifact being promoted. Identify by artifact_id, by digest, or by
  // the (owner_full_name, kind, version) triple — the CLI uses the triple.
  string artifact_id = 2;
  string digest = 3;
  string owner_full_name = 4;
  ArtifactKind kind = 5;
  string version = 6;

  // Required for environments with rank above dev. Recorded on the audit log.
  string reason = 7;

  // Acknowledge that this promotes an image belonging to a DEPLOY_UNIT_CHART
  // app, bypassing its chart. Without this flag such a request is rejected;
  // with it, the promotion is stored with is_override = true and reported as
  // drift.
  bool allow_override = 8;

  // Compute and return the resulting state transition without writing.
  bool dry_run = 9;

  // Required. Client-generated; makes retries safe.
  string idempotency_key = 10;
}

message PromoteResponse {
  // The newly current promotion.
  Promotion promotion = 1;

  // The promotion this superseded, with valid_to now set. Empty on a first
  // promotion. This is what a rollback would target.
  Promotion superseded = 2;

  PromotionEvent event = 3;

  // Writeback workflow started for this promotion. Empty on dry_run.
  string temporal_workflow_id = 4;

  bool dry_run = 5;
  bool already_promoted = 6;
}

// RollbackRequest is sugar over Promote: it re-promotes whatever was
// previously current for this target in this environment. Kept as its own RPC
// because it records PROMOTION_ACTION_ROLLBACK and needs no artifact lookup.
message RollbackRequest {
  string environment_key = 1;
  string owner_full_name = 2;
  ArtifactKind kind = 3;
  string reason = 4;
  bool dry_run = 5;
  string idempotency_key = 6;
}

message RollbackResponse {
  Promotion promotion = 1;
  Promotion superseded = 2;
  PromotionEvent event = 3;
  string temporal_workflow_id = 4;
  bool dry_run = 5;
}

// ============================================================================
// Environment state — the deploy-tooling read path
// ============================================================================

message GetEnvironmentStateRequest {
  string environment_key = 1;

  // Optional Unix timestamp. When 0, returns current state. When set, returns
  // the state as of that instant, via the SCD2 valid_from/valid_to window.
  int64 at = 2;

  string domain = 3;  // optional filter
}

// EnvironmentStateEntry is one deployed thing in one environment.
message EnvironmentStateEntry {
  Promotion promotion = 1;
  Artifact artifact = 2;

  // For chart promotions: the image digests the chart pins.
  repeated ArtifactLink images = 3;

  // Set when an image belonging to this chart was separately promoted with
  // allow_override, so the running digest differs from the chart's pin.
  repeated DriftEntry drift = 4;
}

// DriftEntry reports a divergence between what a chart pins and what is
// actually promoted.
message DriftEntry {
  string app_id = 1;
  string app_full_name = 2;
  string chart_pinned_digest = 3;
  string promoted_digest = 4;
  string promotion_id = 5;
}

message GetEnvironmentStateResponse {
  Environment environment = 1;
  repeated EnvironmentStateEntry entries = 2;

  // Timestamp the state is valid as of — echoes `at`, or now.
  int64 as_of = 3;

  // Stable content hash of this state document. The writeback worker uses it
  // to skip no-op gitops commits.
  string state_hash = 4;
}

// ============================================================================
// History and audit
// ============================================================================

message ListPromotionsRequest {
  string environment_key = 1;   // optional filter
  string owner_full_name = 2;   // optional filter

  // When true, include superseded rows (the full history). Default false
  // returns only current promotions.
  bool include_history = 3;

  PageRequest page = 4;
}

message ListPromotionsResponse {
  repeated Promotion promotions = 1;
  PageResponse page = 2;
}

message ListPromotionEventsRequest {
  string promotion_id = 1;      // optional filter
  string environment_key = 2;   // optional filter
  string owner_full_name = 3;   // optional filter
  string actor = 4;             // optional filter
  int64 since = 5;              // optional Unix timestamp
  PageRequest page = 6;
}

message ListPromotionEventsResponse {
  repeated PromotionEvent events = 1;
  PageResponse page = 2;
}

// ============================================================================
// Promotion Details — the full per-promotion lifecycle (FR7-FR9, issue
// #1031), assembled for the Promotion Details page a later task renders:
// requester/request time, from/to version, writeback outcome, and the full
// ArgoCD sync/health observation history (#1028/#1030).
// ============================================================================

message GetPromotionDetailsRequest {
  string promotion_id = 1;
}

// PromotionSyncEvent mirrors repository.PromotionSyncEvent (migration 020,
// issue #1028) -- one observed ArgoCD sync/health transition.
// occurred_at is a Unix timestamp (seconds), matching this service's
// existing int64-timestamp convention (see Promotion.valid_from/
// PromotionEvent.occurred_at above), not google.protobuf.Timestamp.
message PromotionSyncEvent {
  string sync_event_id = 1;
  string promotion_id = 2;
  string source = 3;         // 'refresh_triggered' | 'poll_observed' | 'retry_triggered' | 'retry_observed'
  string sync_status = 4;    // ArgoCD sync status, '' if not applicable
  string health_status = 5;  // ArgoCD health status, '' if not applicable
  int64 occurred_at = 6;
}

// PromotionSyncOutcome is FR8's visibly-distinct-not-conflated summary of
// PromotionDetails.sync_events, derived server-side so every consumer
// (UI, CLI) agrees on the same classification instead of re-deriving it
// from the raw event list.
enum PromotionSyncOutcome {
  PROMOTION_SYNC_OUTCOME_UNSPECIFIED = 0;
  // No sync_events rows yet, or none has reached a terminal
  // (Synced+Healthy or Degraded) observation yet.
  PROMOTION_SYNC_OUTCOME_PENDING = 1;
  // Most recent terminal observation was Synced + Healthy.
  PROMOTION_SYNC_OUTCOME_SYNCED_HEALTHY = 2;
  // Most recent terminal observation was Degraded/a sync-error state --
  // current_sync_status/current_health_status carry the raw ArgoCD strings
  // the UI renders as the failure reason (no separate free-text field).
  PROMOTION_SYNC_OUTCOME_SYNC_FAILED = 3;
}

message PromotionDetails {
  Promotion promotion = 1;
  // The promote/rollback event that created this promotion row --
  // requester (event.actor) + request time (event.occurred_at).
  PromotionEvent request_event = 2;
  // "" if this is the target's first-ever promotion (no prior row to
  // supersede).
  string from_version = 3;
  // This promotion's own artifact.version.
  string to_version = 4;

  // "" if not yet published.
  string writeback_location = 5;
  // "" per FR7a when no real commit was made (stub path, or a Skipped
  // no-op) -- never a stand-in/synthetic value.
  string writeback_commit_sha = 6;

  // Full chronological history (#1028), oldest first.
  repeated PromotionSyncEvent sync_events = 7;
  // Most recent sync_events entry's sync_status, "" if none yet.
  string current_sync_status = 8;
  // Most recent sync_events entry's health_status, "" if none yet.
  string current_health_status = 9;
  PromotionSyncOutcome outcome = 10;
}

message GetPromotionDetailsResponse {
  PromotionDetails details = 1;
}

// ============================================================================
// Manual retry — admin-gated "retry refresh/sync" (FR10-FR13, issue #1033).
// Starts a fresh RetryArgoSyncWorkflow execution against the same
// Domain/ApplicationName as the original promotion; never resumes the
// original (by-then-terminal) WritebackWorkflow. Role: app-registry-admin
// only (FR10) -- see server/auth.RoleAdmin, the same global role
// SetAppStatus already requires, not a new one.
// ============================================================================

message RetryArgoSyncRequest {
  string promotion_id = 1;
}

message RetryArgoSyncResponse {
  // The new RetryArgoSyncWorkflow execution's workflow id -- always
  // distinct from the promotion's own (by-then-terminal) WritebackWorkflow
  // id, and distinct across repeated retries of the same promotion_id (see
  // worker/writeback/argosync.go's RetryArgoSyncWorkflowID).
  string temporal_workflow_id = 1;
}
