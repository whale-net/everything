syntax = "proto3";

package manman.v1;

option go_package = "github.com/whale-net/everything/manmanv2/protos;manmanpb";

import "manmanv2/protos/messages.proto";

// ============================================================================
// Server RPCs
// ============================================================================

message ListServersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListServersResponse {
  repeated Server servers = 1;
  string next_page_token = 2;
}

message GetServerRequest {
  int64 server_id = 1;
}

message GetServerResponse {
  Server server = 1;
}

message CreateServerRequest {
  string name = 1;
}

message CreateServerResponse {
  Server server = 1;
}

message UpdateServerRequest {
  int64 server_id = 1;
  string name = 2;
  string status = 3;
  bool is_default = 4;
  repeated string update_paths = 5;  // Field paths to update (empty = update all)
  string host_public_address = 6;
}

message UpdateServerResponse {
  Server server = 1;
}

message DeleteServerRequest {
  int64 server_id = 1;
}

message DeleteServerResponse {}

// UpdateServerAllowedPortRanges replaces the server's full set of allowed
// host-port ranges (FR12, task #2095). Replace-all keeps the API simple and
// matches the UI's read-modify-write flow; an empty set is first-class and
// means unconstrained (SB-1.2). Save-time validation (overlap checks etc.)
// is deliberately out of scope per root-plan Decision 7.
message UpdateServerAllowedPortRangesRequest {
  int64 server_id = 1;
  repeated PortRange ranges = 2;
}

message UpdateServerAllowedPortRangesResponse {
  repeated PortRange ranges = 1;
}

// DrainServer transitions a host to "draining" (#2360, manmanv2 M6, C29
// groundwork). Inert in this task: sets drain_state and
// drain_requested_at only -- no cordon enforcement, no eviction (those
// land in dependent tasks). Idempotent: draining an already-draining or
// already-drained host is a successful no-op change. No reason field
// and no audit trail beyond the existing slog.Info (FR3).
message DrainServerRequest {
  int64 server_id = 1;
}

message DrainServerResponse {
  Server server = 1;
}

// UndrainServer returns a host to "schedulable" and clears
// drain_requested_at. Never restarts anything (FR4). Idempotent:
// undraining an already-schedulable host is a successful no-op change.
message UndrainServerRequest {
  int64 server_id = 1;
}

message UndrainServerResponse {
  Server server = 1;
}

// AllocatedPort is one server_ports allocation row (FR13/FR14, task
// #2098): a host port currently or previously allocated to a session on
// a server. Read-only projection -- allocation happens only inside
// session start (FR12 enforcement), so no write RPC exists for it.
message AllocatedPort {
  int64 server_id = 1;
  int32 port = 2;
  string protocol = 3;
  int64 session_id = 4;  // 0 when the allocation has no session
}

// ListAllocatedPorts lists a server's port allocations (additive, task
// #2098): the UI's ports editor uses it to warn about in-use host ports
// and to avoid them when generating a random in-range port. Guidance
// only -- session-start allocation remains the correctness backstop
// (Decision 7).
message ListAllocatedPortsRequest {
  int64 server_id = 1;
}

message ListAllocatedPortsResponse {
  repeated AllocatedPort ports = 1;
}
