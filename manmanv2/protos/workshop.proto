syntax = "proto3";

package manman.v1;

option go_package = "github.com/whale-net/everything/manmanv2/protos;manmanpb";

// WorkshopService provides management for workshop addons, installations, and libraries
service WorkshopService {
  // Addon Library Management
  rpc CreateAddon(CreateAddonRequest) returns (CreateAddonResponse);
  rpc GetAddon(GetAddonRequest) returns (GetAddonResponse);
  rpc ListAddons(ListAddonsRequest) returns (ListAddonsResponse);
  rpc UpdateAddon(UpdateAddonRequest) returns (UpdateAddonResponse);
  rpc DeleteAddon(DeleteAddonRequest) returns (DeleteAddonResponse);
  rpc FetchAddonMetadata(FetchAddonMetadataRequest) returns (FetchAddonMetadataResponse);
  
  // Installation Management
  rpc InstallAddon(InstallAddonRequest) returns (InstallAddonResponse);
  rpc GetInstallation(GetInstallationRequest) returns (GetInstallationResponse);
  rpc ListInstallations(ListInstallationsRequest) returns (ListInstallationsResponse);
  rpc RemoveInstallation(RemoveInstallationRequest) returns (RemoveInstallationResponse);
  rpc ResetInstallation(ResetInstallationRequest) returns (ResetInstallationResponse);
  
  // Library Management
  rpc CreateLibrary(CreateLibraryRequest) returns (CreateLibraryResponse);
  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse);
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse);
  rpc UpdateLibrary(UpdateLibraryRequest) returns (UpdateLibraryResponse);
  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse);
  rpc AddAddonToLibrary(AddAddonToLibraryRequest) returns (AddAddonToLibraryResponse);
  rpc RemoveAddonFromLibrary(RemoveAddonFromLibraryRequest) returns (RemoveAddonFromLibraryResponse);
  rpc AddLibraryReference(AddLibraryReferenceRequest) returns (AddLibraryReferenceResponse);
  rpc RemoveLibraryReference(RemoveLibraryReferenceRequest) returns (RemoveLibraryReferenceResponse);
  rpc GetLibraryAddons(GetLibraryAddonsRequest) returns (GetLibraryAddonsResponse);
  rpc GetChildLibraries(GetChildLibrariesRequest) returns (GetChildLibrariesResponse);

  // GameConfig-Library Management (M6 #2365/#2370, plan #2359) -- attach
  // once at GC level, inherited by every deployment (FR8/FR9). The prior
  // SGC-scoped RPCs (AddLibraryToSGC/RemoveLibraryFromSGC/ListSGCLibraries/
  // GetSGCLibraryAttachments) retired with sgc_workshop_libraries (NFR1).
  rpc AddLibraryToGameConfig(AddLibraryToGameConfigRequest) returns (AddLibraryToGameConfigResponse);
  rpc RemoveLibraryFromGameConfig(RemoveLibraryFromGameConfigRequest) returns (RemoveLibraryFromGameConfigResponse);
  rpc ListGameConfigLibraries(ListGameConfigLibrariesRequest) returns (ListGameConfigLibrariesResponse);
  rpc GetGameConfigLibraryAttachments(GetGameConfigLibraryAttachmentsRequest) returns (GetGameConfigLibraryAttachmentsResponse);

  // Workshop Library Migration Conflicts (FR12) -- SGC->GC backfill
  // conflicts surfaced by #2361; union/override are the only resolutions.
  rpc ListLibraryMigrationConflicts(ListLibraryMigrationConflictsRequest) returns (ListLibraryMigrationConflictsResponse);
  rpc ResolveLibraryMigrationConflict(ResolveLibraryMigrationConflictRequest) returns (ResolveLibraryMigrationConflictResponse);

  // Path Preset Management
  rpc CreateAddonPathPreset(CreateAddonPathPresetRequest) returns (CreateAddonPathPresetResponse);
  rpc GetAddonPathPreset(GetAddonPathPresetRequest) returns (GetAddonPathPresetResponse);
  rpc ListAddonPathPresets(ListAddonPathPresetsRequest) returns (ListAddonPathPresetsResponse);
  rpc UpdateAddonPathPreset(UpdateAddonPathPresetRequest) returns (UpdateAddonPathPresetResponse);
  rpc DeleteAddonPathPreset(DeleteAddonPathPresetRequest) returns (DeleteAddonPathPresetResponse);

  // Content Cache — presigned-URL relay (host talks to S3 directly; control-api never proxies bytes)
  rpc GetCacheDownloadURL(GetCacheDownloadURLRequest) returns (GetCacheDownloadURLResponse);
  rpc GetCacheUploadURL(GetCacheUploadURLRequest) returns (GetCacheUploadURLResponse);

  // Batch Job Management
  rpc GetBatchJob(GetBatchJobRequest) returns (GetBatchJobResponse);
  rpc ListBatchJobs(ListBatchJobsRequest) returns (ListBatchJobsResponse);

  // Batch Operations
  rpc BatchCreateAddons(BatchCreateAddonsRequest) returns (BatchCreateAddonsResponse);
  rpc AddCollectionToLibrary(AddCollectionToLibraryRequest) returns (AddCollectionToLibraryResponse);

  // ReportCacheRead records that server_id successfully landed the object for
  // cache_entry_id on disk (FR10's data source). Callers must invoke this only
  // after the transfer completes and lands atomically -- a URL being issued is
  // not the same as a copy landing. Additive RPC: older host-manager binaries
  // that predate it simply never call it, and control-api predating it (or a
  // relay that is otherwise unavailable) surfaces as Unimplemented, which the
  // host-manager caller treats as non-fatal (the cache read itself already
  // succeeded by the time this is called).
  rpc ReportCacheRead(ReportCacheReadRequest) returns (ReportCacheReadResponse);

  // ListAddonCacheEntries gives an Admin fleet-wide visibility into a single
  // addon's cache state -- every content-addressed entry, which hosts hold a
  // copy, and how stale each entry's verification is -- in one call instead
  // of querying hosts one at a time (FR10). Read-only: it must not create,
  // touch, or verify anything.
  rpc ListAddonCacheEntries(ListAddonCacheEntriesRequest) returns (ListAddonCacheEntriesResponse);

  // VerifyCacheEntry triggers an on-demand SteamCMD verify of a specific
  // cache entry against its Workshop source, independent of any install
  // (FR11). Dispatch is asynchronous: the RPC only reports whether a host was
  // found to run the verify; the up-to-date/changed outcome arrives later on
  // the existing status.host.*.workshop.cache key (#2184) and is not part of
  // this response.
  rpc VerifyCacheEntry(VerifyCacheEntryRequest) returns (VerifyCacheEntryResponse);

  // EvictCacheEntry deletes exactly one content-addressed cache entry: its
  // single S3 object and its workshop_cache_entries row (FR12). This is a
  // control-plane action -- control-api holds the S3 credentials and deletes
  // the object directly by exact key. It does not go through the
  // presigned-URL relay and does not publish any host command. Sibling
  // entries for the same addon, and every other addon/installation/library/
  // batch-job row, are untouched.
  rpc EvictCacheEntry(EvictCacheEntryRequest) returns (EvictCacheEntryResponse);
}


// ============================================================================
// Domain Models
// ============================================================================

// WorkshopAddon represents a workshop addon in the library
message WorkshopAddon {
  int64 addon_id = 1;
  int64 game_id = 2;
  string workshop_id = 3;
  string platform_type = 4;
  string name = 5;
  string description = 6;
  int64 file_size_bytes = 7;
  string installation_path = 8;
  int64 preset_id = 15;
  bool is_collection = 9;
  bool is_deprecated = 10;
  string metadata = 11;  // JSON-encoded metadata (deprecated; use typed fields below)
  int64 last_updated = 12;  // Unix timestamp
  int64 created_at = 13;  // Unix timestamp
  int64 updated_at = 14;  // Unix timestamp
  string steam_app_id = 17;  // Steam application ID (e.g. "252490"), extracted from metadata
  // collection_id correlates an addon created as a child of a Steam Workshop collection
  // back to the collection's own addon row. 0 for standalone addons and for the collection row itself.
  int64 collection_id = 16;
  // collection_item_count is only populated on FetchAddonMetadata previews of a collection,
  // before its children have been persisted (e.g. as separate addon_id rows via collection_id).
  int32 collection_item_count = 18;
}

// GameAddonPathPreset represents a reusable installation path template
message GameAddonPathPreset {
  int64 preset_id = 1;
  int64 game_id = 2;
  string name = 3;
  string description = 4;
  string installation_path = 5;
  int64 created_at = 6;  // Unix timestamp
}

// WorkshopInstallation represents an addon installed on a ServerGameConfig
message WorkshopInstallation {
  int64 installation_id = 1;
  int64 sgc_id = 2;
  int64 addon_id = 3;
  string status = 4;
  string installation_path = 5;
  int32 progress_percent = 6;
  string error_message = 7;
  int64 download_started_at = 8;  // Unix timestamp, 0 if not started
  int64 download_completed_at = 9;  // Unix timestamp, 0 if not completed
  int64 created_at = 10;  // Unix timestamp
  int64 updated_at = 11;  // Unix timestamp
}

// WorkshopLibrary represents a collection of workshop addons
message WorkshopLibrary {
  int64 library_id = 1;
  int64 game_id = 2;
  string name = 3;
  string description = 4;
  int64 preset_id = 5;  // Default path preset for this library
  int64 created_at = 6;  // Unix timestamp
  int64 updated_at = 7;  // Unix timestamp
}

// GameConfigWorkshopLibrary represents the attachment of a library to a
// GameConfig with overrides (M6 #2365) -- the sole library-attachment shape
// since the SGC-scoped SGCWorkshopLibrary retired (M6 #2370, NFR1),
// inherited by every deployment of the config (FR8/FR9).
message GameConfigWorkshopLibrary {
  int64 config_id = 1;
  int64 library_id = 2;
  int64 preset_id = 3;  // Optional: override library's default preset
  int64 volume_id = 4;  // Optional: specify which volume to install to
  string installation_path_override = 5;  // Optional: completely custom path
  int64 created_at = 6;  // Unix timestamp
}

// WorkshopLibraryMigrationConflictCandidate is one (library_id, sgc_id) pair
// contributing to a WorkshopLibraryMigrationConflict -- the source SGC and
// the library it attached, so the resolution UI can show exactly which SGCs
// disagreed and on what.
message WorkshopLibraryMigrationConflictCandidate {
  int64 library_id = 1;
  int64 sgc_id = 2;
}

// WorkshopLibraryMigrationConflict records that a GameConfig's SGCs
// disagreed on their attached Workshop library set (or on override columns
// for the same library_id) when the SGC->GC backfill ran (FR12).
message WorkshopLibraryMigrationConflict {
  int64 conflict_id = 1;
  int64 config_id = 2;
  int64 detected_at = 3;  // Unix timestamp
  repeated WorkshopLibraryMigrationConflictCandidate candidates = 4;
}

// ============================================================================
// Addon Library Management RPCs
// ============================================================================

message CreateAddonRequest {
  int64 game_id = 1;
  string workshop_id = 2;
  string platform_type = 3;
  string name = 4;
  string description = 5;
  int64 file_size_bytes = 6;
  string installation_path = 7;
  bool is_collection = 8;
  string metadata = 9;  // JSON-encoded metadata
  int64 preset_id = 10;  // Optional: reference to path preset
}

message CreateAddonResponse {
  WorkshopAddon addon = 1;
}

message GetAddonRequest {
  int64 addon_id = 1;
}

message GetAddonResponse {
  WorkshopAddon addon = 1;
}

message ListAddonsRequest {
  int64 game_id = 1;  // optional filter
  bool include_deprecated = 2;
  int32 limit = 3;
  int32 offset = 4;
  int64 collection_id = 5;  // optional filter: only children of this collection addon
}

message ListAddonsResponse {
  repeated WorkshopAddon addons = 1;
  int32 total_count = 2;
}

message UpdateAddonRequest {
  int64 addon_id = 1;
  string name = 2;
  string description = 3;
  int64 file_size_bytes = 4;
  string installation_path = 5;
  bool is_deprecated = 6;
  string metadata = 7;  // JSON-encoded metadata
  repeated string update_paths = 8;  // Field paths to update (empty = update all)
  int64 preset_id = 9;  // Optional: reference to path preset
}

message UpdateAddonResponse {
  WorkshopAddon addon = 1;
}

message DeleteAddonRequest {
  int64 addon_id = 1;
}

message DeleteAddonResponse {}

message FetchAddonMetadataRequest {
  int64 game_id = 1;
  string workshop_id = 2;
  string platform_type = 3;
}

message FetchAddonMetadataResponse {
  WorkshopAddon addon = 1;
}

// ============================================================================
// Installation Management RPCs
// ============================================================================

message InstallAddonRequest {
  int64 sgc_id = 1;
  int64 addon_id = 2;
  bool force_reinstall = 3;
  // When true, creates/updates the installation record but does NOT publish
  // a download command to RabbitMQ. The caller is responsible for triggering
  // the download directly (e.g. EnsureLibraryAddonsInstalled on the host).
  bool skip_dispatch = 4;
  // Optional: override the addon's configured installation path (absolute path on the volume).
  // Takes precedence over preset_id and installation_path on the addon record.
  string installation_path_override = 5;
  // Optional: use this preset for path resolution when the addon has no preset_id configured.
  // Applies the library's default preset. Takes precedence over addon's own preset_id.
  int64 preset_id_override = 6;
  // Optional: which volume to install into. Takes precedence over the default volume selection.
  int64 volume_id_override = 7;
}

message InstallAddonResponse {
  WorkshopInstallation installation = 1;
}

message GetInstallationRequest {
  int64 installation_id = 1;
}

message GetInstallationResponse {
  WorkshopInstallation installation = 1;
}

message ListInstallationsRequest {
  int64 sgc_id = 1;  // optional filter
  int64 addon_id = 2;  // optional filter
  int32 limit = 3;
  int32 offset = 4;
}

message ListInstallationsResponse {
  repeated WorkshopInstallation installations = 1;
  int32 total_count = 2;
}

message RemoveInstallationRequest {
  int64 installation_id = 1;
}

message RemoveInstallationResponse {}

message ResetInstallationRequest {
  int64 installation_id = 1;
}

message ResetInstallationResponse {
  WorkshopInstallation installation = 1;
}

// ============================================================================
// Library Management RPCs
// ============================================================================

message CreateLibraryRequest {
  int64 game_id = 1;
  string name = 2;
  string description = 3;
  int64 preset_id = 4;  // Optional: default path preset for this library
}

message CreateLibraryResponse {
  WorkshopLibrary library = 1;
}

message GetLibraryRequest {
  int64 library_id = 1;
}

message GetLibraryResponse {
  WorkshopLibrary library = 1;
}

message ListLibrariesRequest {
  int64 game_id = 1;  // optional filter
  int32 limit = 2;
  int32 offset = 3;
}

message ListLibrariesResponse {
  repeated WorkshopLibrary libraries = 1;
  int32 total_count = 2;
}

message UpdateLibraryRequest {
  int64 library_id = 1;
  string name = 2;
  string description = 3;
  int64 preset_id = 4;  // Optional: default path preset for this library
  repeated string update_paths = 5;  // Field paths to update (empty = update all)
}

message UpdateLibraryResponse {
  WorkshopLibrary library = 1;
}

message DeleteLibraryRequest {
  int64 library_id = 1;
}

message DeleteLibraryResponse {}

message AddAddonToLibraryRequest {
  int64 library_id = 1;
  int64 addon_id = 2;
  int32 display_order = 3;
}

message AddAddonToLibraryResponse {}

message RemoveAddonFromLibraryRequest {
  int64 library_id = 1;
  int64 addon_id = 2;
}

message RemoveAddonFromLibraryResponse {}

message AddLibraryReferenceRequest {
  int64 parent_library_id = 1;
  int64 child_library_id = 2;
}

message AddLibraryReferenceResponse {}

message RemoveLibraryReferenceRequest {
  int64 parent_library_id = 1;
  int64 child_library_id = 2;
}

message RemoveLibraryReferenceResponse {}

message GetLibraryAddonsRequest {
  int64 library_id = 1;
}

message GetLibraryAddonsResponse {
  repeated WorkshopAddon addons = 1;
}

message GetChildLibrariesRequest {
  int64 library_id = 1;
}

message GetChildLibrariesResponse {
  repeated WorkshopLibrary libraries = 1;
}

// ============================================================================
// GameConfig-Library Management RPCs (M6 #2365, plan #2359)
// ============================================================================

message AddLibraryToGameConfigRequest {
  int64 config_id = 1;
  int64 library_id = 2;
  int64 preset_id = 3;  // Optional: override library's default preset
  int64 volume_id = 4;  // Optional: specify which volume to install to
  string installation_path_override = 5;  // Optional: completely custom path
}

message AddLibraryToGameConfigResponse {}

message RemoveLibraryFromGameConfigRequest {
  int64 config_id = 1;
  int64 library_id = 2;
}

message RemoveLibraryFromGameConfigResponse {}

message ListGameConfigLibrariesRequest {
  int64 config_id = 1;
}

message ListGameConfigLibrariesResponse {
  repeated WorkshopLibrary libraries = 1;
}

message GetGameConfigLibraryAttachmentsRequest {
  int64 config_id = 1;
}

message GetGameConfigLibraryAttachmentsResponse {
  repeated GameConfigWorkshopLibrary attachments = 1;
}

// ============================================================================
// Workshop Library Migration Conflict RPCs (FR12, M6 #2365)
// ============================================================================

message ListLibraryMigrationConflictsRequest {}

message ListLibraryMigrationConflictsResponse {
  repeated WorkshopLibraryMigrationConflict conflicts = 1;
}

message ResolveLibraryMigrationConflictRequest {
  int64 conflict_id = 1;
  // "union" | "override" -- no other resolution shape exists in M6.
  string resolution = 2;
  // Required when resolution == "override"; must be one of the conflict's
  // candidate library_ids.
  int64 keep_library_id = 3;
}

message ResolveLibraryMigrationConflictResponse {}

// ============================================================================
// Path Preset Management RPCs
// ============================================================================

message CreateAddonPathPresetRequest {
  int64 game_id = 1;
  string name = 2;
  string description = 3;
  string installation_path = 4;
}

message CreateAddonPathPresetResponse {
  GameAddonPathPreset preset = 1;
}

message GetAddonPathPresetRequest {
  int64 preset_id = 1;
}

message GetAddonPathPresetResponse {
  GameAddonPathPreset preset = 1;
}

message ListAddonPathPresetsRequest {
  int64 game_id = 1;
}

message ListAddonPathPresetsResponse {
  repeated GameAddonPathPreset presets = 1;
}

message UpdateAddonPathPresetRequest {
  int64 preset_id = 1;
  string name = 2;
  string description = 3;
  string installation_path = 4;
}

message UpdateAddonPathPresetResponse {
  GameAddonPathPreset preset = 1;
}

message DeleteAddonPathPresetRequest {
  int64 preset_id = 1;
}

message DeleteAddonPathPresetResponse {}

// ============================================================================
// Content Cache RPCs (presigned-URL relay)
// ============================================================================

message GetCacheDownloadURLRequest {
  int64 server_id = 1;
  string workshop_id = 2;
  string content_version = 3;
}

message GetCacheDownloadURLResponse {
  bool cache_hit = 1;
  int64 cache_entry_id = 2;
  string presigned_url = 3;  // empty when cache_hit == false
  int64 expires_at = 4;      // Unix timestamp
  int64 size_bytes = 5;
}

message GetCacheUploadURLRequest {
  int64 server_id = 1;
  string workshop_id = 2;
  string content_version = 3;
}

message GetCacheUploadURLResponse {
  int64 cache_entry_id = 1;
  string presigned_url = 2;
  int64 expires_at = 3;
  string s3_key = 4;
}

// ============================================================================
// Batch Job Management RPCs
// ============================================================================

// WorkshopBatchJob is the header row for a batch operation (collection
// bulk-add or mixed-format batch create) over the workshop_batch_jobs table
// (#2176, plan #2175, FR4).
message WorkshopBatchJob {
  int64 batch_job_id = 1;
  string job_type = 2;          // "collection_add" | "batch_create"
  int64 game_id = 3;
  int64 library_id = 4;
  string source_input = 5;
  string status = 6;
  int32 total_items = 7;
  int32 succeeded_items = 8;
  int32 failed_items = 9;
  int64 created_at = 10;        // Unix timestamp
  int64 updated_at = 11;        // Unix timestamp
}

// BatchItemResult is the per-item outcome shared across the batch-create
// (#2177), collection-add, and batch-status (#2179) RPCs. Defined once here.
message BatchItemResult {
  string raw_input = 1;
  string workshop_id = 2;
  int64 addon_id = 3;
  string status = 4;         // "succeeded" | "failed"
  string error_message = 5;
}

message GetBatchJobRequest {
  int64 batch_job_id = 1;
}

message GetBatchJobResponse {
  WorkshopBatchJob job = 1;
  repeated BatchItemResult items = 2;
}

message ListBatchJobsRequest {
  int64 game_id = 1;
  int32 limit = 2;
}

message ListBatchJobsResponse {
  repeated WorkshopBatchJob jobs = 1;
}

// ============================================================================
// Batch Operation RPCs
// ============================================================================

// BatchCreateAddons takes a pasted block of mixed raw Workshop IDs and
// Workshop URLs and creates an addon per valid entry, committing valid
// entries even when some entries are invalid (FR2, FR3, NFR5).
message BatchCreateAddonsRequest {
  int64 game_id = 1;
  int64 library_id = 2;  // target library; 0 = create addons without library attachment
  string entries = 3;    // raw pasted block, one entry per line, mixed IDs and URLs
  int64 preset_id = 4;   // path preset applied to every created addon
}

message BatchCreateAddonsResponse {
  int64 batch_job_id = 1;
  int32 total_items = 2;
  int32 succeeded_items = 3;
  int32 failed_items = 4;
  repeated BatchItemResult results = 5;
}

// AddCollectionToLibrary resolves a Steam Workshop collection's current
// membership and adds every item in it to a library in one action (FR1). This
// is a one-time snapshot, not a live sync: membership is captured once at
// call time, and items added to the Steam collection afterwards are, by
// design, never picked up by this RPC (see collection.go).
message AddCollectionToLibraryRequest {
  int64 game_id = 1;
  int64 library_id = 2;
  string collection_input = 3;  // raw numeric collection ID or a Workshop collection URL
  int64 preset_id = 4;
}

message AddCollectionToLibraryResponse {
  int64 batch_job_id = 1;
  int64 collection_addon_id = 2;   // the collection's own addon row
  int32 total_items = 3;
  int32 succeeded_items = 4;
  int32 failed_items = 5;
  repeated BatchItemResult results = 6;
}

message ReportCacheReadRequest {
  int64 server_id = 1;
  int64 cache_entry_id = 2;
}

message ReportCacheReadResponse {}

// ============================================================================
// Admin Fleet-Wide Cache Visibility RPCs (FR10)
// ============================================================================

// WorkshopCacheHost is one host's presence record for a WorkshopCacheEntry:
// it has held a copy of the entry's content since first_seen_at, and last
// reported holding it at last_seen_at.
message WorkshopCacheHost {
  int64 server_id = 1;
  string server_name = 2;
  int64 first_seen_at = 3;   // Unix timestamp
  int64 last_seen_at = 4;    // Unix timestamp
}

// WorkshopCacheEntry is one content-addressed cache entry for an addon,
// together with every host known to hold a copy of it.
message WorkshopCacheEntry {
  int64 cache_entry_id = 1;
  string workshop_id = 2;
  string content_version = 3;   // the content address
  string cache_key = 4;
  string s3_key = 5;
  int64 size_bytes = 6;
  int64 last_verified_at = 7;   // Unix timestamp, 0 if never verified
  int64 created_at = 8;
  repeated WorkshopCacheHost hosts = 9;
}

message ListAddonCacheEntriesRequest {
  int64 addon_id = 1;
}

message ListAddonCacheEntriesResponse {
  repeated WorkshopCacheEntry entries = 1;
}

// ============================================================================
// Admin On-Demand Cache-Entry Verify RPC (FR11)
// ============================================================================

message VerifyCacheEntryRequest {
  int64 cache_entry_id = 1;
  int64 server_id = 2;   // host asked to run the verify; 0 = control-api picks a host that holds a copy
}

message VerifyCacheEntryResponse {
  bool dispatched = 1;
  int64 server_id = 2;
  string status = 3;     // "dispatched" | "no_host_available"
}

// ============================================================================
// Admin Manual Cache Eviction RPC (FR12)
// ============================================================================

// EvictCacheEntryRequest identifies exactly one content-addressed cache
// entry to evict. There is no bulk/prefix form: eviction is always scoped to
// a single cache_entry_id.
message EvictCacheEntryRequest {
  int64 cache_entry_id = 1;
}

message EvictCacheEntryResponse {
  bool evicted = 1;
  string s3_key = 2;
}
