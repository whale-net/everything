syntax = "proto3";

package manman.v1;

option go_package = "github.com/whale-net/everything/manmanv2/protos;manmanpb";

import "manmanv2/protos/messages.proto";

// ============================================================================
// Backup RPCs
// ============================================================================

message CreateBackupRequest {
  int64 session_id = 1;  // Session to backup
  string description = 2;  // Optional description
}

message CreateBackupResponse {
  Backup backup = 1;
}

message ListBackupsRequest {
  int64 server_game_config_id = 1;  // Filter by SGC (optional)
  int64 session_id = 2;  // Filter by session (optional)
  int32 page_size = 3;
  string page_token = 4;
  int64 volume_id = 5;         // Optional filter
  int64 backup_config_id = 6;  // Optional filter
  string status = 7;           // Optional filter: pending|running|completed|failed
}

// BackupListItem carries per-row display context so the fleet-wide list
// doesn't require a follow-up RPC per row.
message BackupListItem {
  Backup backup = 1;
  string server_game_config_name = 2;  // deployment/SGC display name
  string game_config_name = 3;
  string volume_name = 4;
  string server_name = 5;
}

message ListBackupsResponse {
  repeated Backup backups = 1;
  string next_page_token = 2;
  repeated BackupListItem items = 3;
}

message GetBackupRequest {
  int64 backup_id = 1;
}

message GetBackupResponse {
  Backup backup = 1;
}

message DeleteBackupRequest {
  int64 backup_id = 1;
}

message DeleteBackupResponse {
  // Empty - success indicated by no error
}

message TriggerBackupRequest {
  int64 server_game_config_id = 1;
  int64 backup_config_id = 2;
}

message TriggerBackupResponse {
  int64 backup_id = 1;
}

// ============================================================================
// BackupConfig RPCs
// ============================================================================

message CreateBackupConfigRequest {
  int64 volume_id = 1;
  int32 cadence_minutes = 2;
  string backup_path = 3;
  bool enabled = 4;
}

message CreateBackupConfigResponse {
  BackupConfig config = 1;
}

message GetBackupConfigRequest {
  int64 backup_config_id = 1;
}

message GetBackupConfigResponse {
  BackupConfig config = 1;
}

message ListBackupConfigsRequest {
  int64 volume_id = 1;  // Optional filter; 0 means no volume filter
  int64 game_config_id = 2;  // Optional filter
  optional bool enabled = 3;  // Optional tri-state filter (explicit presence distinguishes false from unset)
  int32 page_size = 4;
  string page_token = 5;
}

// BackupConfigListItem carries per-row display context so the fleet-wide list
// doesn't require a follow-up RPC per row.
message BackupConfigListItem {
  BackupConfig config = 1;
  string volume_name = 2;
  int64 game_config_id = 3;
  string game_config_name = 4;
  string game_name = 5;
}

message ListBackupConfigsResponse {
  repeated BackupConfig configs = 1;
  repeated BackupConfigListItem items = 2;
  string next_page_token = 3;
}

message UpdateBackupConfigRequest {
  int64 backup_config_id = 1;
  int32 cadence_minutes = 2;
  string backup_path = 3;
  bool enabled = 4;
}

message UpdateBackupConfigResponse {
  BackupConfig config = 1;
}

message DeleteBackupConfigRequest {
  int64 backup_config_id = 1;
}

message DeleteBackupConfigResponse {}

message AddBackupConfigActionRequest {
  int64 backup_config_id = 1;
  int64 action_id = 2;
  int32 display_order = 3;
}

message AddBackupConfigActionResponse {}

message RemoveBackupConfigActionRequest {
  int64 backup_config_id = 1;
  int64 action_id = 2;
}

message RemoveBackupConfigActionResponse {}

message ListBackupConfigActionsRequest {
  int64 backup_config_id = 1;
}

// BackupConfigActionItem is a single row in a pre-backup Action list, carrying
// the Action's name and command template alongside its attachment ordering
// (FR12) so the UI doesn't need a second round trip per Action.
message BackupConfigActionItem {
  int64 action_id = 1;
  int32 display_order = 2;
  string name = 3;              // ActionDefinition name
  string command_template = 4;
}

message ListBackupConfigActionsResponse {
  repeated int64 action_ids = 1;
  repeated int32 display_orders = 2;
  repeated BackupConfigActionItem items = 3;
}

// ReorderBackupConfigActionsRequest carries the full desired execution order
// (FR15) -- it is a pure reorder: action_ids must be exactly the config's
// current attached-action set, just permuted. Adding/removing an attachment
// stays the job of AddBackupConfigAction / RemoveBackupConfigAction.
message ReorderBackupConfigActionsRequest {
  int64 backup_config_id = 1;
  repeated int64 action_ids = 2;  // full desired order, first = runs first
}

message ReorderBackupConfigActionsResponse {}
